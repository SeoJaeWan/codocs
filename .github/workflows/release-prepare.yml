name: Release prepare
on:
  push:
    branches: [develop]
permissions:
  contents: read
concurrency:
  group: codocs-release-state
  cancel-in-progress: false
jobs:
  version:
    if: vars.CODOCS_RELEASE_ENABLED == 'true'
    name: Prepare official release PR
    runs-on: ubuntu-24.04
    steps:
      - name: Require manual activation
        run: test "$CODOCS_RELEASE_ENABLED" = true
        env:
          CODOCS_RELEASE_ENABLED: ${{ vars.CODOCS_RELEASE_ENABLED }}
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0, Node24
        id: app
        with:
          app-id: ${{ vars.CODOCS_RELEASE_APP_ID }}
          private-key: ${{ secrets.CODOCS_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
          permission-checks: read
          permission-administration: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node24
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, Node24
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node24
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --store-dir .workbench/pnpm-store
      - name: Check protection, latest source and synchronization
        id: preflight
        run: node tools/ci/release-flow.mjs prepare
        env:
          CODOCS_RELEASE_ENABLED: ${{ vars.CODOCS_RELEASE_ENABLED }}
          CODOCS_APP_TOKEN: ${{ steps.app.outputs.token }}
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51
        if: steps.preflight.outputs.prepare == 'true'
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: node tools/ci/release-flow.mjs version
          pr-base-branch: main
          pr-draft: create
          push-with-git-cli: false
        env:
          CODOCS_APP_TOKEN: ${{ steps.app.outputs.token }}
      - name: Reject a baseline that moved during the official Action
        if: steps.preflight.outputs.prepare == 'true'
        run: node tools/ci/release-flow.mjs audit-preparation
        env:
          CODOCS_APP_TOKEN: ${{ steps.app.outputs.token }}
