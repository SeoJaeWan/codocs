name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.event.pull_request.number || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  VSCODE_VERSION: 1.139.1
jobs:
  static:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Prettier
        run: pnpm exec prettier . --check
  pack:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Pack the tgz and VSIX
        run: pnpm release:pack
      - id: artifact
        name: Name the release artifact
        run: echo "name=release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, node24
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: .workbench/release/
          if-no-files-found: error
  os:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    needs: pack
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, node24
        with:
          name: ${{ needs.pack.outputs.artifact_name }}
          path: .workbench/release
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test
      - name: Verify the tgz and VSIX
        if: ${{ !cancelled() }}
        run: pnpm release:verify
      - name: Installed VSIX activation and actual UI
        if: ${{ !cancelled() }}
        run: |
          $vsix = @(Get-ChildItem -LiteralPath .workbench/release -Filter *.vsix)
          if ($vsix.Count -ne 1) { throw "expected exactly one .vsix in .workbench/release, found $($vsix.Count)" }
          $output = Join-Path $env:GITHUB_WORKSPACE '.workbench/vscode-ui'
          pnpm test:vscode --version $env:VSCODE_VERSION --vsix $vsix[0].FullName --output $output
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, node24
        if: ${{ failure() || cancelled() }}
        with:
          name: failure-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .workbench/release-verification/**/result.json
            .workbench/vscode-ui/
            .workbench/write-race-*/evidence/
          include-hidden-files: true
          if-no-files-found: warn
  required-ci:
    name: required-ci
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    needs: [static, pack, os]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'length > 0 and all(.[]; .result == "success")' > /dev/null
  comment:
    name: failure-comment
    if: ${{ always() && !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [static, pack, os, required-ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REQUIRED_RESULT: ${{ needs.required-ci.result }}
    steps:
      - name: Create, update or resolve the failure comment
        run: |
          set -euo pipefail
          marker='<!-- codocs-ci-failure -->'
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          body_file="$(mktemp)"
          comment_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            | jq -r --arg marker "$marker" '.[] | select(.user.login == "github-actions[bot]" and (.body | contains($marker))) | .id' \
            | sed -n '1p')"
          if [ "$REQUIRED_RESULT" = "failure" ]; then
            failed="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" --paginate \
              | jq -r '.jobs[]
                  | select(.name != "required-ci" and .name != "failure-comment")
                  | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled")
                  | "- **" + .name + "**: " + (([.steps[]? | select(.conclusion == "failure" or .conclusion == "timed_out") | .name] | join(", ")) | if . == "" then "(실패한 단계 기록 없음)" else . end)')"
            if [ -z "$failed" ]; then
              failed='- (실패한 job 정보를 가져오지 못했습니다)'
            fi
            {
              echo "$marker"
              echo "**CI 실패**"
              echo
              echo "$failed"
              echo
              echo "실행: ${run_url}"
            } > "$body_file"
          elif [ "$REQUIRED_RESULT" = "success" ]; then
            if [ -z "$comment_id" ]; then
              echo "CI passed and no failure comment exists; nothing to do."
              exit 0
            fi
            {
              echo "$marker"
              echo "**해결됨**: 최신 CI 실행이 통과했습니다."
              echo
              echo "실행: ${run_url}"
            } > "$body_file"
          else
            echo "required-ci result is '${REQUIRED_RESULT}'; nothing to do."
            exit 0
          fi
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -F "body=@${body_file}" > /dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F "body=@${body_file}" > /dev/null
          fi
