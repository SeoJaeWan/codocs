name: CI report
on:
  workflow_run:
    workflows: [Tests, Release publish]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  resolve:
    if: >-
      ${{ (github.event.workflow_run.name == 'Tests' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled' && !startsWith(github.event.workflow_run.display_title, 'Cancel PR #')) || (github.event.workflow_run.name == 'Release publish' && github.event.workflow_run.conclusion != 'skipped') }}
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, node24
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - id: resolve
        run: node tools/ci/pr-report.mjs resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
  report:
    needs: resolve
    permissions:
      contents: read
      actions: read
      pull-requests: write
    concurrency:
      group: ci-report-${{ github.repository }}-${{ needs.resolve.outputs.pr_number }}
      cancel-in-progress: false
    if: >-
      ${{ needs.resolve.outputs.pr_number != '' && ((github.event.workflow_run.name == 'Tests' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled' && !startsWith(github.event.workflow_run.display_title, 'Cancel PR #')) || (github.event.workflow_run.name == 'Release publish' && github.event.workflow_run.conclusion != 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, node24
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: node tools/ci/pr-report.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CODOCS_REPORT_PR: ${{ needs.resolve.outputs.pr_number }}
