name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: pwsh
jobs:
  candidate:
    name: Freeze release candidate
    runs-on: windows-2025
    timeout-minutes: 20
    outputs:
      stable: ${{ steps.freeze.outputs.stable }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile --store-dir .workbench/pnpm-store
      - id: freeze
        name: Freeze one version and one candidate for both OSes
        run: node tools/test/runtime/release-ci.mjs prepare
      - uses: actions/upload-artifact@v4
        with:
          name: release-input-${{ github.sha }}
          path: .workbench/release-input/
          include-hidden-files: true
          if-no-files-found: error
  test:
    name: Tests (${{ matrix.os }})
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile --store-dir .workbench/pnpm-store
      - uses: actions/download-artifact@v4
        with:
          name: release-input-${{ github.sha }}
          path: .workbench/release-input
      - id: identity
        name: Verify transferred bytes and source
        run: node tools/test/runtime/release-ci.mjs verify
        env:
          CODOCS_EXPECTED_STABLE: ${{ needs.candidate.outputs.stable }}
      - name: Check source, logic and packages
        run: pnpm check
      - name: Standalone installed MCP and VSIX metadata
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: pnpm release:verify .workbench/release-input/co-documentation-0.0.1.tgz .workbench/release-input/codocs-0.0.1.vsix
      - name: VS Code minimum
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: node packages/vscode/test-runner/run.mjs --vscode-version 1.100.0 --vsix .workbench/release-input/codocs-0.0.1.vsix --mcp-tgz .workbench/release-input/co-documentation-0.0.1.tgz
      - name: VS Code minimum cleanup
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: node packages/vscode/test-runner/lifecycle.mjs --vscode-version 1.100.0 --vsix .workbench/release-input/codocs-0.0.1.vsix
      - name: VS Code fixed latest stable
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: node packages/vscode/test-runner/run.mjs --vscode-version ${{ needs.candidate.outputs.stable }} --vsix .workbench/release-input/codocs-0.0.1.vsix --mcp-tgz .workbench/release-input/co-documentation-0.0.1.tgz
      - name: VS Code fixed latest stable cleanup
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: node packages/vscode/test-runner/lifecycle.mjs --vscode-version ${{ needs.candidate.outputs.stable }} --vsix .workbench/release-input/codocs-0.0.1.vsix
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ github.sha }}
          path: |
            .workbench/release-input/
            .workbench/release-verification/
            .workbench/vscode-tests/
            .workbench/vscode-lifecycle/
            .workbench/write-race-*/evidence/
          include-hidden-files: true
          if-no-files-found: warn
