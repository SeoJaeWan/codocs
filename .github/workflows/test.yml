name: Tests
run-name: >-
  ${{ github.event_name == 'pull_request' && ((github.event.pull_request.state != 'open' || github.event.pull_request.draft) && format('Cancel PR #{0}', github.event.pull_request.number) || format('CI PR #{0}', github.event.pull_request.number)) || format('Tests {0} {1}', github.event_name, github.run_id) }}
on:
  push:
    branches: [main]
  pull_request:
    types:
      [
        opened,
        synchronize,
        reopened,
        ready_for_review,
        converted_to_draft,
        closed,
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}-{2}', github.workflow, github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: pwsh
env:
  CODOCS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  static:
    name: Static checks
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.state == 'open' && !github.event.pull_request.draft) }}
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, node24
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, node24
        with:
          version: 10.34.5
      - run: pnpm install --frozen-lockfile --store-dir .workbench/pnpm-store
      - run: pnpm check:static
  release-management:
    name: Release management tests
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.state == 'open' && !github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, node24
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, node24
        with:
          version: 10.34.5
      - run: pnpm install --frozen-lockfile --store-dir .workbench/pnpm-store
      - run: pnpm test:release-management
  prepare:
    name: Freeze release candidate
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.state == 'open' && !github.event.pull_request.draft) }}
    runs-on: windows-2025
    timeout-minutes: 20
    outputs:
      stable: ${{ steps.freeze.outputs.stable }}
      npm_file: ${{ steps.freeze.outputs.npm_file }}
      vsix_file: ${{ steps.freeze.outputs.vsix_file }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_name: ${{ steps.freeze.outputs.candidate_artifact || format('release-input-{0}-{1}', github.run_id, github.run_attempt) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, node24
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, node24
        with:
          version: 10.34.5
      - run: pnpm install --frozen-lockfile --store-dir .workbench/pnpm-store
      - name: Verify current release preparation baseline
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'changeset-release/main' }}
        run: node tools/ci/release-flow.mjs verify-pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: freeze
        name: Freeze one version and one candidate for both OSes
        run: node tools/test/runtime/release-ci.mjs prepare
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, node24
        with:
          name: ${{ steps.freeze.outputs.candidate_artifact || format('release-input-{0}-{1}', github.run_id, github.run_attempt) }}
          path: .workbench/release-input/
          include-hidden-files: true
          if-no-files-found: error
  windows:
    name: Tests (windows-2025)
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.state == 'open' && !github.event.pull_request.draft) }}
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 50
    env:
      CODOCS_EXPECTED_STABLE: ${{ needs.prepare.outputs.stable }}
      CODOCS_ARTIFACT_ID: ${{ needs.prepare.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, node24
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, node24
        with:
          version: 10.34.5
      - run: pnpm install --frozen-lockfile --store-dir .workbench/pnpm-store
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, node24
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: .workbench/release-input
          merge-multiple: true
      - id: identity
        name: Verify transferred bytes and source
        run: node tools/test/runtime/release-ci.mjs verify
      - id: runtime
        name: Check build, logic, OS tools and package contracts
        run: pnpm check:runtime:os
      - id: installed
        name: Standalone installed MCP and VSIX metadata
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: pnpm release:verify .workbench/release-input/${{ needs.prepare.outputs.npm_file }} .workbench/release-input/${{ needs.prepare.outputs.vsix_file }}
      - id: stable_ui
        name: Installed VSIX activation and actual stable UI
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: |
          $candidate = (Resolve-Path -LiteralPath '.workbench/release-input/${{ needs.prepare.outputs.vsix_file }}').Path
          $output = Join-Path $env:GITHUB_WORKSPACE '.workbench/vscode-ui'
          pnpm test:vscode --version '${{ needs.prepare.outputs.stable }}' --vsix $candidate --output $output
      - id: os_evidence
        name: Verify successful UI and candidate execution identity
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' && steps.installed.outcome == 'success' && steps.stable_ui.outcome == 'success' }}
        run: node tools/test/runtime/release-ci.mjs evidence
        env:
          CODOCS_JOB: windows
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, node24
        if: ${{ !cancelled() && steps.os_evidence.outcome == 'success' }}
        with:
          name: codocs-ui-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: .workbench/os-evidence/windows/evidence.json
          if-no-files-found: error
      - id: evidence
        name: Record candidate and OS verification evidence
        if: ${{ always() && github.event_name == 'pull_request' && steps.identity.outcome == 'success' }}
        run: node tools/ci/pr-ci.mjs evidence
        env:
          CODOCS_JOB: windows
          CODOCS_STEPS: ${{ toJSON(steps) }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, node24
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        with:
          name: codocs-evidence-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: .workbench/pr-evidence/windows/evidence.json
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, node24
        if: ${{ failure() || cancelled() }}
        with:
          name: failure-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .workbench/release-input/test-environment.json
            .workbench/release-verification/**/result.json
            .workbench/vscode-ui/
            .workbench/write-race-*/evidence/
          include-hidden-files: true
          if-no-files-found: warn
  macos:
    name: Tests (macos-15)
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.state == 'open' && !github.event.pull_request.draft) }}
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 50
    env:
      CODOCS_EXPECTED_STABLE: ${{ needs.prepare.outputs.stable }}
      CODOCS_ARTIFACT_ID: ${{ needs.prepare.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, node24
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, node24
        with:
          version: 10.34.5
      - run: pnpm install --frozen-lockfile --store-dir .workbench/pnpm-store
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, node24
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: .workbench/release-input
          merge-multiple: true
      - id: identity
        name: Verify transferred bytes and source
        run: node tools/test/runtime/release-ci.mjs verify
      - id: runtime
        name: Check build, logic, OS tools and package contracts
        run: pnpm check:runtime:os
      - id: installed
        name: Standalone installed MCP and VSIX metadata
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: pnpm release:verify .workbench/release-input/${{ needs.prepare.outputs.npm_file }} .workbench/release-input/${{ needs.prepare.outputs.vsix_file }}
      - id: stable_ui
        name: Installed VSIX activation and actual stable UI
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        run: |
          $candidate = (Resolve-Path -LiteralPath '.workbench/release-input/${{ needs.prepare.outputs.vsix_file }}').Path
          $output = Join-Path $env:GITHUB_WORKSPACE '.workbench/vscode-ui'
          pnpm test:vscode --version '${{ needs.prepare.outputs.stable }}' --vsix $candidate --output $output
      - id: os_evidence
        name: Verify successful UI and candidate execution identity
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' && steps.installed.outcome == 'success' && steps.stable_ui.outcome == 'success' }}
        run: node tools/test/runtime/release-ci.mjs evidence
        env:
          CODOCS_JOB: macos
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, node24
        if: ${{ !cancelled() && steps.os_evidence.outcome == 'success' }}
        with:
          name: codocs-ui-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: .workbench/os-evidence/macos/evidence.json
          if-no-files-found: error
      - id: evidence
        name: Record candidate and OS verification evidence
        if: ${{ always() && github.event_name == 'pull_request' && steps.identity.outcome == 'success' }}
        run: node tools/ci/pr-ci.mjs evidence
        env:
          CODOCS_JOB: macos
          CODOCS_STEPS: ${{ toJSON(steps) }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, node24
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        with:
          name: codocs-evidence-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: .workbench/pr-evidence/macos/evidence.json
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, node24
        if: ${{ failure() || cancelled() }}
        with:
          name: failure-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .workbench/release-input/test-environment.json
            .workbench/release-verification/**/result.json
            .workbench/vscode-ui/
            .workbench/write-race-*/evidence/
          include-hidden-files: true
          if-no-files-found: warn
  required-ci:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && !github.event.pull_request.draft && 'required-ci' || 'PR checks omitted' }}
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && !github.event.pull_request.draft }}
    needs: [static, prepare, release-management, macos, windows]
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, node24
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, node24
        if: needs.prepare.result == 'success'
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: .workbench/release-input
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, node24
        if: ${{ always() && needs.prepare.result == 'success' }}
        with:
          pattern: codocs-evidence-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: .workbench/incoming-evidence
      - id: aggregate
        if: always()
        run: node tools/ci/pr-ci.mjs aggregate
        env:
          CODOCS_NEEDS: ${{ toJSON(needs) }}
          CODOCS_ARTIFACT_ID: ${{ needs.prepare.outputs.artifact_id }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, node24
        if: always()
        with:
          name: codocs-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: .workbench/pr-report/ci-report.json
          if-no-files-found: error
