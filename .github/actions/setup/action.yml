name: Setup Codocs workspace
description: Install the pinned Node and pnpm versions and the locked dependencies.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, node24
      with:
        node-version: 24.21.0
        package-manager-cache: false
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, node24
      with:
        version: 10.34.5
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --store-dir .workbench/pnpm-store
