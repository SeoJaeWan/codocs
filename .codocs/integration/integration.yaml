id: integration
name: '도구 연동'
domains:
  - '도구 연동'
kind: procedure
status: confirmed
definition: |
  도구 연동은 프로젝트 문서를 AI와 코드 편집 환경에서 찾아 사용할 수 있게 연결하는 영역이다.
  문서 사용에 필요한 안내·조회·오류 복구와 코드에서의 접근을 묶는다.

  ## AI가 문서를 읽고 변경할 때

  - [[작성 가이드]]: 형식·참조·변경 방법을 안내하는 주제를 찾는다.
  - [[조회]]: 목록·원문·검증 결과를 요청하고 응답을 해석한다.
  - [[검증 오류가 있는 문서를 조회하고 수정하는 절차]]: 오류 문서를 찾고 복구할 때의 분기를 확인한다.
  - [[이름 일치 후보 안내]]: 저장 후 다른 문서와 이름이 일치하는 결과를 해석한다.

  조회부터 저장까지의 전체 작업은 [[지식을 선택해서 읽고 변경하는 흐름]]에서 확인한다.

  ## 코드에서 문서를 확인할 때

  - [[IDE 지원]]: 코드 식별자 매칭·호버·자동완성과 원문 이동의 계약을 확인한다.

  각 기능의 구현 여부와 아직 제공되지 않는 동작은 해당 문서의 구현 상태에서 확인한다.
