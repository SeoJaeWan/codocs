id: name-similarity
name: '이름 일치 후보 안내'
domains:
  - '도구 연동'
definition: |
  문서 저장 후 다른 문서와 이름이 일치하는 후보를 안내하는 기능이다.

  ## 발생 상황

  새 문서나 바뀐 이름이 기존 문서와 같을 수 있다.
  후보를 안내하되 의미 중복을 자동 판정하거나 합치지 않는다.

  ## 검사 조건과 근거

  생성 또는 문서용 이름·이전 명칭·도메인 변경 시 검사한다.
  본문·예문·상태만 변경하면 생략한다.

  문서용 이름의 원문 일치와 공백·영문 대소문자를 정리한 일치를 사용한다.
  이전 명칭과 영어 단수화의 적용 범위는 아래 단일 형식 전환 항목에서 구분한다.

  본문 의미·ID 철자·같은 도메인만으로 후보를 만들지 않는다.
  자기 자신은 제외하며 의미 유사도를 계산하는 검사는 하지 않는다.

  ## 결과와 실패

  원문 일치 → 정규화 일치 순으로, 같은 수준에서는 같은 도메인 → ID 순으로 안내한다.
  전체 후보 개수와 최대 3개 후보·일치 근거만 반환한다.
  본문은 추가 조회로 읽는다.

  검사 생략과 후보 0개를 구분한다.
  검사 실패는 similarityChecked:false와 경고를 남기고 후보 필드를 생략한다.

  후보나 검사 실패 때문에 저장을 차단하거나 재확인을 강제하지 않는다.
  이미 저장한 파일을 되돌리거나 같은 write 반복을 요구하지 않는다.

  ## 구현 상태

  이 계약은 후속 기능이다.
  코드 Hover의 범위 제한과 후보 표시 순서를 혼동하지 않는다.

  [[IDE 지원]]은 ID를 대상으로 한다.
  저장 후 이름 후보 안내는 문서용 이름을 대상으로 하며 코드 매칭 결과를 대신 사용하지 않는다.

  ## 응답 필드

  검사 완료는 similarityChecked:true, 전체 후보 수 similarCount와 최대 3개의 similarDocuments를 제공한다.
  한 문서에서 여러 값이 일치해도 문서 하나로 세며 후보가 없으면 0과 빈 목록이다.
  생략은 similarityChecked:false이며 두 후보 필드는 제공하지 않는다.
  실패는 같은 필드 생략과 함께 warnings에 similarity_check_failed·severity:warning·설명을 제공한다.

  후보는 ID·문서용 이름·소속과 어떤 속성의 어떤 값이 일치했는지 포함하며 본문은 제공하지 않는다.
  공통 도메인이 하나 이상이면 같은 도메인 순위로 본다.

  후보 없음은 의미 중복 없음의 보장이 아니다.
  검사만 자동 재시도하거나 재검사를 위해 같은 write를 반복하도록 안내하지 않는다.

  ## 단일 형식 전환에서 남은 판단

  [[문서 형식]]의 통일에 따라 과거 종류별 후보 비교도 하나로 정리해야 한다.
  이전 계약은 개념 문서의 이름·이전 명칭에 영어 단수화를 적용하고, 흐름 문서 제목에는 원문·공백·대소문자 비교만 적용했다.

  모든 이름에 단수화를 적용할지, 이전 명칭을 어떤 범위로 비교할지는 후속 구현 전에 확정해야 한다.
  필드 통일만으로 이 비교 정책까지 확정되었다고 해석하지 않는다.
