id: ide-support
name: 'IDE 지원'
domains:
  - '도구 연동'
definition: |
  코드를 읽고 작성하는 위치에서 프로젝트 용어의 뜻과 원문을 안내하는 영역이다.
  코드 식별자 매칭·호버·자동완성·문서 이동을 다룬다.

  ## 사용 상황

  [[문서 형식]]에 선언한 영어 ID가 복합 식별자 안에서 여러 표기로 쓰인다.
  코드의 일부 문자열이 비슷하다는 이유만으로 의미를 추론하지 않고 단어 경계에 근거해 찾는다.

  ## 매칭

  camelCase·PascalCase·snake_case·kebab-case와 공백을 분리하고 비교 시 대소문자를 정리한다.
  HTTPServer는 HTTP/Server, getURLValue는 get/URL/Value로 나눈다.
  숫자 경계는 나누되 숫자를 버리지 않는다.

  연속 단어 묶음만 찾고 중간 단어·숫자를 건너뛰지 않는다.
  현재 문서의 id를 단어 단위로 비교한다. reference-candidate는 referenceCandidate와 대응한다.
  문서용 이름·이전 명칭은 코드 매칭 대상으로 사용하지 않는다.

  표기 일치를 먼저, 마지막 단어를 단수화한 일치를 다음으로 제공한다.
  pluralize는 설계 선택이며 모든 영어 예외나 의미를 보장하지 않는다.

  같은 범위에서는 표기 일치가 우선이고 긴 복합 용어를 먼저 보여주되 짧은 구성 용어도 유지한다.
  ID 중복 문서는 오류로 안내하고 어느 하나를 정상 매칭 대상으로 선택하지 않는다.
  서로 다른 ID의 겹치는 단어 일치는 ID 중복과 구분한다.

  ## IDE 표현

  Hover는 문서용 이름과 정의·소속 도메인 설명으로 가는 링크·관련 지식 링크를 제공한다.
  참조 정의의 본문은 재귀 확장하지 않는다.

  ID가 바뀌면 새 ID를 기준으로 코드와 용어를 맞춘다.
  이전 ID 자동 매칭과 코드 자동 변경은 제공하지 않는다.

  용어 원문 이동은 코드 정의 이동과 구분한다.
  YAML 링크는 원문 편집기 탭을 열거나 이미 열린 탭으로 이동한다.

  ## 자동완성

  현재 문서의 id를 코드 표기로 변환해 추천한다.
  현재 식별자의 대소문자·구분자와 앞 단어를 보존하고 해당 범위만 완성한다.
  단서가 없으면 camelCase다.
  프로젝트 전체에서 표기를 추측하거나 문맥에 따라 단복수를 임의 변경하지 않는다.

  ## 구현 상태

  matcher와 language-server/vscode 기능은 후속 작업이다.
  현재 한글 지식 제목이 영어 코드와 자동 연결되는 것으로 가정하지 않는다.

  ## 코드 위치와 결과 표시

  원래 코드의 시작·끝 위치를 보존하고 연속 대문자 뒤 소문자 경계에서는 마지막 대문자 앞을 나눈다.
  HTTPSServer는 HTTPS/Server, zone2Count는 zone/2/Count로 나누며 약어의 뜻을 추론하지 않는다.

  접두·접미 단어가 있어도 내부의 연속된 ID 단어 묶음을 찾는다.
  양쪽 묶음의 마지막 단어를 단수화해 비교하되 중간 단어의 굴절 등 모든 영어 예외를 보장하지 않는다.

  같은 문서의 중복 표시는 줄이되 근거·위치를 보존한다.
  코드 경로·도메인·폴더로 서로 다른 ID의 매칭 결과를 숨기거나 우선하지 않는다.

  자동완성 후보는 문서용 이름·도메인·설명으로 구별한다.
  삽입은 현재 ID의 단수·복수 형태를 사용하고 약어 표기를 보존한다.

  YAML 링크의 클릭 제스처는 IDE 설정을 따른다.
  진단은 확인된 파일·위치에 표시하며 사용자는 원문을 편집한다.
