id: error-document-access
name: '검증 오류가 있는 문서를 조회하고 수정하는 절차'
domains:
  - '문서 모델'
  - '도구 연동'
  - '작업 공간'
kind: procedure
status: confirmed
definition: |
  [[문서 검증]]의 결과와 [[조회]]·[[저장]]을 결합해 오류 문서를 복구하는 절차다.
  검증 실패가 원문 폐기나 다른 정상 문서의 접근 차단으로 이어지지 않도록 한다.

  ## 오류 문서를 읽는 계약

  해석 가능하고 JSON으로 표현할 수 있으면 원래 속성과 진단을 반환한다.
  비유한 숫자 등 때문에 JSON 표현이 불가능하면 값을 바꾸지 않고 전체 rawYaml을 반환한다.

  파싱 실패로 ID를 알 수 없는 파일은 경로·전체 검증으로 찾는다.

  목록은 유효한 ID·문서용 이름이 있으면 hasErrors와 함께 포함한다.
  잘못된 목록 속성만 생략하고 그 속성 필터에는 일치시키지 않는다.

  중복 ID는 대표 문서를 고르지 않고 모든 충돌 경로를 가진 한 항목으로 집계한다.
  한 파일이 모든 필터를 만족해야 하며 여러 파일이 조건을 나눠 만족해서는 안 된다.

  오류가 남은 수정은 [[저장]]의 전체 후보 검증에서 차단한다.

  ## 오류 조회와 수정의 세부 결과

  rawYaml 응답도 확인 가능한 id·source.path·revision·진단을 유지하고 전체 반환 한계를 적용한다.
  정상 document와 rawYaml을 임의 변환으로 만들어 서로 대체하지 않는다.

  중복 ID 조회는 대표 문서를 선택하지 않고 모든 충돌 경로를 반환한다.
  중복 ID의 update는 차단하며 파일에서 직접 수정하도록 안내한다.

  목록 충돌 항목은 conflict:true·hasErrors:true와 모든 paths를 제공하고 대표 이름·도메인은 만들지 않는다.
  필터를 만족하는 파일이 있으면 모든 충돌 경로를 포함하고 totalCount에는 해당 ID 하나를 센다.

  한 문서의 오류 때문에 다른 정상 문서의 읽기·수정 전체를 차단하지 않는다.
  오류 문서의 원문을 유지하며 전체 수정 후보가 유효해질 때만 저장한다.

  ## 구현 경계

  core의 검증·오류 문서 색인은 구현되어 있다.
  MCP 목록·상세의 오류 문서 응답과 실제 저장은 후속 구현이다.
