id: authoring-guide
name: '작성 가이드'
domains:
  - '도구 연동'
definition: |
  Codocs 문서를 작성하고 갱신할 때 필요한 형식과 사용법을 제공하는 안내다.

  ## 제공하는 주제

  codocs_guide는 아래 주제별 안내를 제공한다.
  주제를 생략하면 overview와 주제 목록을 안내한다.

  일반 사용자 가이드의 원문은 docs/guide에 두고 codocs_guide에서도 같은 원문을 제공한다.
  이 저장소에서 작성 규칙을 관리하고 사용자 가이드에 반영하는 순서는 [[문서 컨벤션]]에서 정의한다.
  별도 Skill 배포를 요구하지 않는다.
  가상 예약·요금 예시는 작성법을 설명하기 위한 것이며 실제 Codocs 업무 정책으로 등록하지 않는다.

  ## 주제별 안내 범위

  topic은 overview·schema·writing·examples·updating·validation 중 하나다.
  overview는 전체 사용 순서, schema는 [[문서]]의 YAML 형식과 허용 값, writing은 [[기본 작성 지침]]에서 연결하는 작성·분리·참조 기준을 안내한다.
  examples는 연결 예시, updating은 [[저장]]의 변경과 폐기, validation은 [[문서 검증]]과 오류 수정 방법을 안내한다.

  kind·status의 의미를 안내하고 내용의 합의·적용 상태를 개발 진행도와 구분한다.
  생성/수정 구분·선택 속성 삭제·revision 충돌 후 재조회와 경고·후보의 선택적 확인을 예시로 제공한다.
  준비 중 상태·저장 성공 후 색인 실패·refresh 복구·대기 시간 초과의 후속 행동도 포함한다.

  YAML 큰따옴표의 백슬래시 처리와 해석된 본문 참조의 escape를 구분해 설명한다.
  실제 예시 YAML은 사용자 가이드와 examples에 두며 가상 업무 문서를 프로젝트 정책으로 등록하지 않는다.

  ## ID 변경 안내와 예시

  ID를 바꿀 때는 [[저장]]의 명시적 변경 기능과 직접 YAML 편집 경로를 구분해 안내한다.
  현재·이전 ID의 항목 형식은 [[문서]], 코드 연결과 변경 안내는 [[IDE 지원]]에서 확인한다.
  이름을 유지한 ID 변경은 문서 간 이름 참조를 바꾸지 않으며, 이름 변경의 참조 영향은 [[이름 변경 시 기존 참조의 의미 보존]]에서 확인한다.

  아래는 이전 ID 항목의 작성 예시다.

  ```yaml
  id: return-zone
  name: 반납 구역
  deprecatedAliases:
    - id: dropoff-zone
      message: return-zone으로 변경되었습니다.
  ```

  이 예시는 ID 관련 필드만 보여준다. 실제 문서는 definition·domains 등 필수 속성도 작성한다.
