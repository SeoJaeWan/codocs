id: codocs-tool
name: 'MCP 도구 호출'
domains:
  - 'MCP'
definition: |
  AI가 호출하는 도구의 정식 이름과 공통 입력 경계를 정의한다.
  도구별 의미와 결과는 각 담당 문서에서 확인한다.

  ## 정식 도구와 공통 입력

  정식 이름은 codocs_list, codocs_get, codocs_validate, codocs_guide, codocs_write, codocs_refresh다.
  도구의 계약 정의와 서버 등록은 구분한다. tools/list에는 해당 서버에서 실제 처리할 수 있는 도구만 제공하며 미구현 도구를 임시 응답으로 등록하지 않는다.
  도구 입력의 알 수 없는 속성은 invalid_input이다. write의 document/set 안에 있는 사용자 필드는 [[문서]]의 형식을 사용한다.
  guide의 주제는 [[사용 가이드]], write의 입력·변경 후보는 [[문서 변경 계획]], 파일 반영·결과는 [[저장]], refresh의 입력·집계는 [[색인 갱신]]에서 확인한다.

  codocs_list·codocs_get의 입력·응답은 [[조회]], codocs_validate의 범위는 [[문서 검증 요청]]에서 정의한다.
  공통 성공·실패와 개별 항목의 상태는 [[도구 결과]]에서 확인한다.
  프로세스와 stdio 전송의 경계는 [[실행 구조]]에서 정의한다.

  ## 전송과 입력 검증

  SDK를 통한 호출과 직접 handler 호출은 같은 JSON 입력에 대해 같은 허용 여부와 제품 진단을 반환한다.
  입력 스키마와 실행 시 검증은 같은 필드·허용 값·의미 규칙을 사용하며, 각 경로에서 별도로 작성한 조건이 서로 다른 요청을 허용하지 않게 한다.
  알 수 없는 요청 속성을 SDK가 조용히 제거하지 않는다. document/set의 사용자 속성도 전송 과정에서 제거하지 않으며 알려진 문서 속성의 자료형 검사는 [[문서 검증]]에 맡긴다.

  [[조회]]의 중복 제거 후 ID 개수처럼 입력 처리 뒤 판단하는 조건은 원본 배열의 길이 제한으로 바꾸지 않는다.
  스키마로 표현할 수 없는 의미 조건은 도구 설명에 안내하고 공통 검증에서 확인한다. SDK가 앞서 검증하더라도 [[도구 결과]]의 입력 오류 표현을 유지한다.
  여섯 도구의 입력 스키마는 [공통 스키마](../../packages/mcp/src/tool-input/index.ts)에서 정의한다. 실제 실행 등록은 list/get/refresh/validate/write/guide 여섯 도구를 [stdio 서버](../../packages/mcp/src/server/index.ts)에 둔다.
  write의 요청 형태 오류는 invalid_input이며 문서 내용 검증 오류는 변경 계획의 상세 진단으로 반환한다. SDK 안내용 write 스키마의 루트는 객체이고 직접 handler도 같은 입력 형태를 검사한다.
