id: codocs-tool
name: 'MCP 도구 호출'
domains:
  - 'MCP'
definition: |
  AI가 호출하는 도구의 정식 이름과 공통 입력 경계를 정의한다.
  도구별 의미와 결과는 각 담당 문서에서 확인한다.

  ## 정식 도구와 공통 입력

  정식 이름은 codocs_list, codocs_get, codocs_validate, codocs_guide, codocs_write, codocs_refresh다.
  도구 입력의 알 수 없는 속성은 invalid_input이다. write의 document/set 안에 있는 사용자 필드는 [[문서]]의 형식을 사용한다.
  guide의 주제는 [[사용 가이드]], write의 입력·변경 후보는 [[문서 변경 계획]], 파일 반영·결과는 [[저장]], refresh의 입력·집계는 [[색인 갱신]]에서 확인한다.

  codocs_list·codocs_get의 입력·응답은 [[조회]], codocs_validate의 범위는 [[문서 검증 요청]]에서 정의한다.
  공통 성공·실패와 개별 항목의 상태는 [[도구 결과]]에서 확인한다.
  프로세스와 stdio 전송의 경계는 [[실행 구조]]에서 정의한다.
