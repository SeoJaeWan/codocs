id: mcp-write-impact
name: '문서 변경의 코드 연결 영향 안내'
domains:
  - 'MCP'
kind: policy
status: confirmed
definition: |
  codocs_write로 문서를 실제 변경했을 때 근거의 내용이나 행 위치가 바뀌어 다시 확인할 [[명시적 코드 참조]]를 저장 결과에 따로 안내하는 계약이다.
  자연어 정책 위반·코드 오류·테스트 실패를 판정하는 결과가 아니며, 영향 안내 자체로 저장을 차단하거나 추가 승인을 요구하지 않는다.
  저장 결과와 복구는 [[저장]]과 [[저장 후 색인 갱신 실패를 복구하는 절차]]에서 정의한다.

  ## 변경 전 연결과 실제 저장 원문

  변경 전에 대상 원문·revision과 그 문서를 참조한 코드 출현을 확보한다.
  변경 후 색인에서 남아 있는 연결만 조회하면 범위 삭제·이름 변경으로 끊어진 기존 연결을 누락할 수 있으므로 변경 전 자료를 유지한다.
  다른 revision의 변경 전 자료를 이번 저장의 근거로 섞지 않으며 실제 반영한 변경 후 원문과 비교한다.

  [[코드 참조 색인]]의 프로젝트·Git 추적·.gitignore·텍스트 검색 범위를 적용한다.
  MCP 자체가 저장된 코드·테스트를 수집하며 VS Code 실행 여부에 의존하지 않는다. 응답에 저장 파일 기준임을 명시하고 IDE의 미저장 코드를 관측했다고 간주하지 않는다.
  저장 실패와 검증된 무변경에는 실제 변경의 영향 안내를 만들지 않는다.

  ## 영향 판단

  행·범위 참조는 참조 구간 원문의 수정·삭제·삽입과 구간 앞부분의 행 증감으로 위치가 달라질 수 있는 경우를 확인 대상으로 삼는다.
  원문 차이에서 해당 내용과 위치에 영향이 없음을 확인한 연결은 제외한다. 참조 구간 뒤쪽의 변경만으로 모든 행 참조를 영향 대상으로 만들지 않는다.
  반복된 내용 등으로 변경 대응을 확정하기 어려우면 영향 가능성으로 구분한다. 원래 문장의 새 위치를 추론해 연결을 확정하지 않는다.
  문서 전체 참조는 문서 원문 변경 시 확인 대상으로 삼는다. 이름·도메인 변경으로 대상 해석이 달라지는 연결도 사유를 구분한다.
  영향 안내를 근거로 표기의 행 번호나 구현·테스트를 자동 수정하지 않는다.

  ## 안내 항목과 확인 상태

  변경 대상 문서, 변경 전의 문서 전체 또는 행·범위, 코드 출현 위치와 확인 사유를 제공한다.
  같은 구간의 구현·테스트와 같은 파일의 다른 출현도 각각 유지하며 동일 출현의 여러 사유만 한 항목으로 묶는다.
  계산에 사용한 전후 원문은 내부 비교 자료이며 저장 결과에 문서 본문 전체를 추가 반환하지 않는다.

  코드 수집 또는 영향 계산이 불완전하면 확인한 항목과 수집·계산 상태 및 확인하지 못한 이유를 함께 안내한다.
  빈 목록만으로 영향 없음이나 전체 확인 완료를 단정하지 않는다. 안내를 계산하지 못해도 실제 saved·changed·revision·indexUpdated를 보존한다.
  [[도구 결과]]의 요청 처리 여부와 저장 여부, 색인 갱신 여부를 영향 계산 성공 하나로 바꾸지 않는다.
