id: mcp-write-impact
name: '문서 변경의 코드 연결 영향 안내'
domains:
  - 'MCP'
kind: policy
status: confirmed
definition: |
  codocs_write로 문서를 실제 변경했을 때 근거의 내용이나 행 위치가 바뀌어 다시 확인할 [[명시적 코드 참조]]를 저장 결과에 따로 안내하는 계약이다.
  자연어 정책 위반·코드 오류·테스트 실패를 판정하는 결과가 아니며, 영향 안내 자체로 저장을 차단하거나 추가 승인을 요구하지 않는다.
  저장 결과와 복구는 [[저장]]과 [[저장 후 색인 갱신 실패를 복구하는 절차]]에서 정의한다.

  ## 변경 전 연결과 실제 저장 원문

  변경 전에 대상 원문·revision과 그 문서를 참조한 코드 출현을 확보한다.
  변경 후 색인에서 남아 있는 연결만 조회하면 범위 삭제·이름 변경으로 끊어진 기존 연결을 누락할 수 있으므로 변경 전 자료를 유지한다.
  다른 revision의 변경 전 자료를 이번 저장의 근거로 섞지 않으며 실제 반영한 변경 후 원문과 비교한다.

  [[코드 참조 색인]]의 프로젝트·Git 추적·.gitignore·텍스트 검색 범위를 적용한다.
  MCP 자체가 저장된 코드·테스트를 수집하며 VS Code 실행 여부에 의존하지 않는다. 응답에 저장 파일 기준임을 명시하고 IDE의 미저장 코드를 관측했다고 간주하지 않는다.
  저장 실패와 검증된 무변경에는 실제 변경의 영향 안내를 만들지 않는다.

  ## 영향 판단

  행·범위 참조는 참조 구간 원문의 수정·삭제·삽입과 구간 앞부분의 행 증감으로 위치가 달라질 수 있는 경우를 확인 대상으로 삼는다.
  원문 차이에서 해당 내용과 위치에 영향이 없음을 확인한 연결은 제외한다. 참조 구간 뒤쪽의 변경만으로 모든 행 참조를 영향 대상으로 만들지 않는다.
  반복된 내용 등으로 변경 대응을 확정하기 어려우면 영향 가능성으로 구분한다. 원래 문장의 새 위치를 추론해 연결을 확정하지 않는다.
  문서 전체 참조는 문서 원문 변경 시 확인 대상으로 삼는다. 이름·도메인 변경으로 대상 해석이 달라지는 연결도 사유를 구분한다.
  영향 안내를 근거로 표기의 행 번호나 구현·테스트를 자동 수정하지 않는다.

  ## 안내 항목과 확인 상태

  변경 대상 문서, 변경 전의 문서 전체 또는 행·범위, 코드 출현 위치와 확인 사유를 제공한다.
  같은 구간의 구현·테스트와 같은 파일의 다른 출현도 각각 유지하며 동일 출현의 여러 사유만 한 항목으로 묶는다.
  계산에 사용한 전후 원문은 내부 비교 자료이며 저장 결과에 문서 본문 전체를 추가 반환하지 않는다.

  코드 수집 또는 영향 계산이 불완전하면 확인한 항목과 수집·계산 상태 및 확인하지 못한 이유를 함께 안내한다.
  빈 목록만으로 영향 없음이나 전체 확인 완료를 단정하지 않는다. 안내를 계산하지 못해도 실제 saved·changed·revision·indexUpdated를 보존한다.
  [[도구 결과]]의 요청 처리 여부와 저장 여부, 색인 갱신 여부를 영향 계산 성공 하나로 바꾸지 않는다.

  ## 외부 응답과 책임 경계

  실제 변경 저장의 writeImpact는 basis:saved_files와 target의 path·beforeRevision·revision, collection, calculation, impacts를 제공한다.
  collection에는 저장 전 코드의 status·confirmedCount·codeGeneration·documentGeneration·failures를 유지한다. calculation은 complete 또는 incomplete와 별도 failures를 전달한다.
  두 상태를 함께 확인해야 하며, collection이 불완전한 빈 impacts는 전체 영향 없음의 증거가 아니다.

  impacts는 출현별 occurrenceId·sourcePath·sourceUri·sourceRevision·range·marker와 변경 전 destination, certainty, reasons를 제공한다.
  range는 코드 표기의 JS/LSP UTF-16 좌표이고 destination의 명시 행은 1부터 시작하며 끝 행을 포함한다. 새 행 번호를 안내하거나 자동 재배치하지 않는다.
  certainty는 confirmed 또는 possible이다. reasons의 region_changed·preceding_line_shift·document_changed·name_changed·domain_changed·ambiguous_correspondence는 같은 출현 안에서 함께 보존한다.
  도메인 사유는 기존 도메인 한정 표기의 해석이 달라지는 경우에 적용한다. 도메인 한정이 없는 참조의 해석을 도메인 변경만으로 바뀌었다고 판단하지 않는다.

  반복 행은 가능한 최장 공통 부분열 대응을 모두 확인하고 임의의 대응을 선택하지 않는다. 행 대응의 계산 크기 한도를 넘으면 calculation:incomplete와 원인을 제공하며 독립적으로 판단한 문서 전체·이름·도메인 사유를 보존한다.
  저장 전 출현의 문서 세대와 비교 자료의 revision이 일치하지 않으면 다른 원문의 영향으로 섞지 않고 계산 불완전으로 안내한다.
  저장·색인 상태와 안내의 실패는 독립적이다. 검증된 무변경과 저장 실패는 writeImpact를 생략한다.

  ## 코드와 검증 위치

  순수 판단은 [Core 영향 계산](../../packages/core/src/change-impact/index.ts)과 [인접 테스트](../../packages/core/src/change-impact/change-impact.test.ts), 디스크 출현·revision 연결과 실패 보존은 [작업 공간 영향 안내](../../packages/workspace/src/write-impact/index.ts)와 [실제 저장 테스트](../../packages/workspace/src/write-impact/write-impact.test.ts)에서 확인한다.
  [실제 stdio 검증](../../packages/mcp/src/server/write-impact.test.ts)은 IDE 없이 저장 코드의 구간·전체·이름·도메인·반복 대응과 응답 보존을 확인한다.
