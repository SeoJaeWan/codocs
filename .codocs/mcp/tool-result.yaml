id: tool-result
name: '도구 결과'
domains:
  - 'MCP'
definition: |
  Codocs 도구 요청의 처리 결과이며 SDK의 MCP 메시지 래퍼와 구분한다.
  최상위 success는 요청 처리 여부다. 문서의 유효성·존재·파일 반영 여부를 모두 대신하지 않는다.

  ## 요청과 개별 항목

  입력·커서·탐색 등의 문제로 요청을 처리할 수 없으면 success:false와 공통 error를 반환한다.
  요청을 처리했다면 빈 목록과 개별 ID의 부재·충돌·문서 오류도 success:true이며 개별 항목에서 문제를 표시한다.
  validate가 문서 오류를 정상 보고하거나 refresh가 오류 문서를 포함해 재구성을 완료한 경우도 요청 처리 성공이다.

  ## MCP 메시지로 전달

  [[진단]]의 공통 결과를 MCP 래퍼에 담으며 결과 본문의 성공·실패·진단을 다시 해석하거나 다른 제품 오류로 바꾸지 않는다.
  structuredContent에는 공통 결과 객체를, content의 text에는 같은 결과를 JSON으로 직렬화해 제공한다.
  isError는 요청 처리 실패인 success:false일 때 true이며, 처리 성공이면 false다. 개별 문서의 문제나 부분 탐색 결과가 있다는 이유로 요청 전체를 실패로 바꾸지 않는다.

  알려진 도구의 잘못된 입력은 공통 invalid_input 결과로 전달한다.
  잘못된 JSON-RPC 메시지나 알 수 없는 도구 등 프로토콜 오류는 제품 결과와 구분한다.

  ## 탐색 상태의 응답

  list/get의 scanStatus는 [[탐색 상태]]의 값을 전달한다.
  complete이고 파일 감시가 정상일 때만 없는 ID를 found:false와 not_found로 확정한다.
  partial이면 success:true로 보유 결과를 반환하되 문서별 confirmation과 미확인 진단을 제공한다.
  색인 밖 ID는 not_found로 확정하지 않고 확인 불가로 반환한다. totalCount는 보유 목록의 필터 결과 수이며 실제 전체 문서 수를 보장하지 않는다.
  전체 탐색이 failed이면 원인과 함께 요청을 실패 처리하고 내부에 보존한 이전 자료를 최신 조회 결과로 노출하지 않는다.
  감시만 끊겼을 때 마지막 완료 색인의 제한적 조회와 write·validate 차단, 부분 완료 refresh의 결과는 [[색인 갱신]]에서 확인한다.

  문서별 confirmation과 원문·revision의 의미는 [[미확인 문서]], 이전 관측의 유지 조건은 [[불완전한 탐색에서 색인과 연결을 유지하는 절차]]에서 확인한다.

  ## 가이드 응답

  [[사용 가이드]]는 색인 상태를 결과에 덧붙이지 않고 선택 주제와 배포 원문을 반환한다.
  입력 또는 원문 접근에 실패하면 공통 success:false·error와 동일한 MCP 포장을 사용한다.

  ## 파일 반영 결과

  저장 도구는 [[저장]]의 saved·changed를 전달한다.
  파일 반영 후 조회 가능 상태는 [[저장 후 색인 갱신 실패를 복구하는 절차]]의 indexUpdated로 구분한다.
  유효 무변경은 저장하지 않고 indexUpdated를 생략한다. 파일 반영 뒤 색인 반영과 추가 복구가 모두 실패해도 saved는 true이며 저장 바이트 revision과 원인 진단·refresh 안내를 유지한다.
  오류 코드나 success 하나로 저장 여부를 추정하지 않는다. 구체 도구의 입력과 결과를 찾는 출발점은 [[MCP 도구 호출]]이다.
  실제 변경 저장의 코드 참조 확인 항목은 [[문서 변경의 코드 연결 영향 안내]]에서 정의한다. 수집·영향 계산 실패는 실제 파일 반영 결과와 별도로 전달한다.

  ## 코드와 검증 위치

  목록·상세 요청의 결과 연결은 [조회 어댑터](../../packages/mcp/src/query/index.ts)와 [조회 테스트](../../packages/mcp/src/query/query.test.ts)에서 확인한다. 공통 실패 분기는 [공통 진단](../../packages/core/src/diagnostics/index.ts), 준비·부분 목록 결과는 [작업 공간 조회](../../packages/workspace/src/query/index.ts), MCP 포장은 [stdio 서버](../../packages/mcp/src/server/index.ts)에서 확인한다.
  이 연결은 목록·상세 결과의 검증 범위이며 모든 도구의 파일 반영·복구 검증을 대신하지 않는다.
  validate의 성공 진단과 경로·상태 실패는 [작업 공간 조회](../../packages/workspace/src/query/index.ts)에서 판단하고 [조회 어댑터](../../packages/mcp/src/query/index.ts)와 [stdio 서버](../../packages/mcp/src/server/index.ts)가 그대로 전달한다.
  write도 같은 세션의 [작업 공간 조회](../../packages/workspace/src/query/index.ts)가 저장과 색인 게시를 연결하고 [조회 어댑터](../../packages/mcp/src/query/index.ts)가 결과를 그대로 전달한다. [실제 stdio 테스트](../../packages/mcp/src/server/server.test.ts)와 [실제 파일 테스트](../../packages/workspace/src/write/write.test.ts)에서 확인한다.
