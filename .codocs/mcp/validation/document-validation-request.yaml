id: codocs-validate
name: '문서 검증 요청'
domains:
  - 'MCP'
definition: |
  codocs_validate로 지정한 파일 또는 프로젝트 전체의 문서 문제를 확인하는 요청이다.
  단일 데이터의 형식 검사인 [[문서 검증]]과 프로젝트 전체의 충돌·참조 검사를 함께 적용한다.

  ## 검증 대상과 결과

  선택 path를 생략하면 전체 .codocs를 검증하고 프로젝트 전체의 진단을 반환한다.
  지정하면 프로젝트 루트 기준 상대 경로의 YAML 파일 하나를 중심으로 진단하며 get의 source.path를 사용할 수 있다.
  .codocs 밖·절대 경로·폴더·와일드카드·복수 경로는 허용하지 않는다.
  절대 경로는 상대 경로로 고치도록 안내하고 없는 파일·읽기 실패는 경로와 원인을 안내한다.

  파일 검증도 전체 색인으로 ID 중복·참조 존재를 확인한다.
  반환 범위는 지정한 파일의 진단과 관련 충돌 파일 경로 등 문제 해결에 필요한 정보로 제한한다.
  지정한 파일과 무관한 다른 파일의 진단은 포함하지 않는다.
  ID 누락·파싱 실패 파일도 경로로 검증한다.

  예를 들어 A와 B의 ID가 중복이고 C에 별개의 YAML 오류가 있을 때, A를 지정하면 A의 중복 ID 진단과 B의 경로를 제공하고 C의 오류는 제외한다.
  path를 생략하면 A·B의 중복 ID 문제와 C의 YAML 오류를 모두 확인한다.
  오류를 수정하는 순서는 [[검증 오류가 있는 문서를 조회하고 수정하는 절차]]에서 확인한다.

  [[탐색 상태]]가 불완전할 때의 차단 조건은 [[색인 갱신]], 요청 처리와 문서 오류의 구분은 [[도구 결과]]에서 확인한다.
