id: duplicate-review-request
name: '본문 중복 검토 요청'
domains:
  - 'MCP'
status: proposed
definition: |
  AI가 프로젝트 전체 또는 작성·수정할 본문의 반복 후보를 확인하고, 담당 원문을 정리할지 판단할 근거를 받는 요청이다.
  [[작업 공간 중복 검사]]를 호출해 검사한 범위와 원문 위치를 전달하며, 비교 규칙과 후보의 의미는 [[본문 중복 탐지]]에서 정의한다.
  정식 도구 이름과 구체 입력 필드는 검토 중이며, 확정된 호출 계약은 [[MCP 도구 호출]]에서 관리한다.

  ## 전체 검토와 초안 검토

  전체 검토는 관측한 프로젝트 문서의 반복을 확인할 때 사용한다. 설명을 분리하거나 담당 문서에 모은 뒤 남은 반복을 점검하는 데도 사용할 수 있다.
  초안 검토는 저장 전 본문을 기존 문서와 비교할 때 사용하며, 기존 문서 수정이면 어떤 원문을 대체하는 후보인지 구분할 정보를 전달한다.
  대상 선택·관측·초안 내부 반복과 저장 전 자기 버전 제외는 [[작업 공간 중복 검사]]의 계약을 적용한다.

  [[문서 검증 요청]]의 형식·충돌·참조 검사와 본문 중복 검토를 구분한다.
  본문 중복 후보가 있다는 이유로 문서 검증 오류를 추가하거나 후보가 없다는 이유로 문서 검증을 생략하지 않는다.
  미저장 본문 검토는 파일 생성·수정을 수행하지 않는다.

  ## 등록·수정 흐름의 연결

  생성·수정 요청의 검토에는 [[문서 변경 계획]]과 [[작업 공간 변경 계획]]이 준비한 최종 후보를 사용한다.
  사용자가 검토 후 본문을 바꾸면 이전 후보의 결과를 새 본문의 결과로 재사용하지 않는다.
  결과가 대상 본문 전체의 후보인지 변경으로 새로 생긴 후보만인지 구분하며, 별도 대조 없이 새 중복만 찾았다고 안내하지 않는다.

  [[도구 결과]]의 요청 처리 여부와 [[저장]]의 파일 반영 결과를 유지하고, 중복 검사 상태는 별도로 제공한다.
  검사 결과가 늦거나 불완전하다는 이유로 저장이 실패했다고 표현하지 않으며, 이미 저장된 요청을 검사 재시도로 다시 쓰게 하지 않는다.
  중복 후보를 이유로 추가 승인이나 저장 차단을 요구하지 않는다. 기존 변경 계획과 저장의 오류·충돌·접근 조건은 그대로 적용한다.

  ## 결과의 안내

  양쪽 원문을 찾아갈 정보와 반복 구절·비교 근거를 함께 제공한다. 원문 위치와 비교 점수의 해석은 [[본문 중복 탐지]]의 계약을 유지한다.
  저장되지 않은 초안의 위치와 파일의 위치를 구분하고, 검사 당시의 원문 버전에 해당하는 결과임을 알린다.
  결과를 이용할 때 원문이 달라졌다면 [[작업 공간 중복 검사]]의 재검사 조건을 적용한다.

  요청한 범위, 실제 검사한 범위, 정책상 제외한 구간과 누락·중단 이유를 구분한다.
  일부 검사나 실패를 전체 중복 없음으로 안내하지 않는다. 검사 완료도 표현이 다른 모든 의미 중복이 없다는 뜻은 아니다.
  준비 중·완료·부분 완료·실패와 결과 페이지의 남은 항목을 구분하고, 같은 관측 기준으로 다음 페이지를 제공한다.
  관측이나 비교 기준이 달라졌으면 이전 페이지의 연속 결과처럼 제공하지 않는다.

  ## 검토와 변경의 책임

  후보를 읽은 뒤 담당 원문을 정리할지는 [[기본 작성 지침]]과 [[설명 분리]]에 따라 판단한다.
  정상적인 참조 안내와 적용 예시도 비슷한 표현을 포함할 수 있으므로 점수만으로 삭제 대상을 정하지 않는다.
  이 요청은 원문 병합·삭제·참조 삽입을 자동으로 수행하지 않는다. 실제 수정은 검토한 최신 원문에 대해 별도의 변경 요청으로 수행한다.
