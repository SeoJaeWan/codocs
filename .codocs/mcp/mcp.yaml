id: mcp
name: 'MCP'
domains:
  - 'MCP'
kind: procedure
definition: |
  AI 도구 요청을 workspace와 core에 연결하는 패키지의 계약이다. 도구 입력·응답·안내를 담당하며 파일 처리와 순수 계산을 중복 정의하지 않는다.

  ## 용어와 계약

  - [[도구 결과]]: 요청 성공·항목 오류·파일 반영 결과를 구분한다.
  - [[사용 가이드]]: codocs_guide의 입력 주제에 따라 반환할 안내와 예시를 확인한다.
  - [[검증 오류가 있는 문서를 조회하고 수정하는 절차]]: 진단에서 수정할 원문을 찾고 저장·재조회하는 순서를 확인한다.
  - [[조회]]: MCP 도구별 입력과 외부 응답 필드를 확인한다.
