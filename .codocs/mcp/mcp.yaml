id: mcp
name: 'MCP'
domains:
  - 'MCP'
kind: procedure
definition: |
  AI 도구 요청을 [[작업 공간]]과 [[Core]]의 계약에 연결하는 책임 영역이다. 도구 입력·응답·안내를 소유하며 파일 처리와 순수 계산의 규칙은 담당 문서를 참조한다.

  ## 호출과 결과

  - [[MCP 도구 호출]]: 정식 도구 이름과 공통 입력 경계를 확인한다.
  - [[도구 결과]]: 요청 처리·항목 오류·관측·파일 반영 상태를 구분한다.
  - [[문서 변경의 코드 연결 영향 안내]]: 실제 변경 저장 뒤 확인할 코드 참조와 사유·확인 상태를 안내한다.
  - [[실행 구조]]: 공식 SDK stdio 연결과 세션·종료 책임을 확인한다.

  ## 조회·검증·작성 안내

  - [[조회]]: 목록·상세의 입력과 외부 응답 필드를 확인한다.
  - [[문서 검증 요청]]: 파일 또는 전체 프로젝트의 검증 범위를 확인한다.
  - [[본문 중복 검토 요청]]: 전체·초안 검사와 등록·수정 흐름에서 검토 정보를 제공하는 계약 제안을 확인한다.
  - [[사용 가이드]]: 작성·갱신 주제에 맞는 설명과 예시의 제공 기준을 확인한다.
  - [[검증 오류가 있는 문서를 조회하고 수정하는 절차]]: 진단에서 수정할 원문을 찾고 저장·재조회한다.

  ## 코드와 검증 위치

  변경 저장의 [조회 어댑터](../../packages/mcp/src/query/index.ts)는 작업 공간의 파일·색인 결과와 코드 연결 안내를 그대로 전달한다. [stdio 서버](../../packages/mcp/src/server/index.ts)와 [독립 저장 안내 검증](../../packages/mcp/src/server/write-impact.test.ts)에서 같은 결과 객체의 전송과 저장 파일 기준 관측을 확인한다.
