definition: |
  우리 프로젝트의 개발·리뷰에 필요한 개념과 계약을 안내하는 전체 진입 문서다.
  각 도메인 소개에서 하위 문서의 전체 구성과 읽는 순서를 확인한다.

  ## 도메인별 문서 묶음

  - [[개발]]: 제품 범위 결정부터 구현·검증·문서 갱신·배포까지 안내한다.
  - [[문서 모델]]: 문서 작성 단위와 원문 해석·검증·진단을 안내한다.
  - [[참조 도메인]]: 참조 표기·후보·색인과 연결 변경을 안내한다.
  - [[작업 공간]]: 프로젝트 탐색·저장·쓰기 조정과 색인 복구를 안내한다.
  - [[도구 연동]]: AI 조회·오류 복구와 IDE에서의 문서 접근을 안내한다.

  ## 공통 흐름

  share 폴더에는 특정 도메인 하나에 귀속하기 어려운 전체 작업 흐름을 둔다.

  - [[지식을 선택해서 읽고 변경하는 흐름]]: 필요한 원문을 찾고 작성·검증·저장을 연결한다.

  ## 읽을 때 확인할 점

  문서의 합의 상태와 실제 구현 여부는 구분한다.
  기능을 변경할 때 담당 문서의 발생 조건·판단 근거·예외와 구현 경계를 확인한다.
  파일 위치와 명명은 [[폴더 컨벤션]], 설명의 표현과 구현 상태 기록은 [[문서 컨벤션]]에서 확인한다.
