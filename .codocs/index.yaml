id: index
name: '프로젝트 지식 읽기 안내'
domains:
  - '개발'
kind: procedure
status: confirmed
definition: |
  Codocs 프로젝트의 작성 기준과 패키지별 용어·계약을 찾는 출발점이다.
  사용자 가이드의 작성 흐름을 이 프로젝트에 직접 적용하고, 개발할 기능을 소유한 패키지에서 필요한 설명을 읽는다.

  ## 작성과 프로젝트 운영

  - [[문서 작성 가이드]]: 기본 작성 지침과 문서·도메인·참조·설명 분리의 의미를 확인한다.
  - [[개발]]: 제품 범위·개발 환경·컨벤션·검증·문서 갱신·배포 기준을 확인한다.

  ## 패키지별 용어와 계약

  - [[Core]]: 원문 해석·검증·참조·색인·조회·매칭과 변경 후보의 담당 문서를 찾는다.
  - [[작업 공간]]: 경로·탐색·색인 연결·조회 세션·버전과 파일 반영의 담당 문서를 찾는다.
  - [[MCP]]: 도구 호출·조회·검증 요청·작성 안내와 오류 문서 복구 흐름을 확인한다.
  - [[Language Server]]: 편집 중 문서의 동기화와 IDE 요청·표현 계약을 확인한다.
  - [[VS Code]]: 확장의 서버 연결과 원문 이동 책임을 확인한다.

  관련 원문을 선택하고 갱신하는 순서는 [[지식을 선택해서 읽고 변경하는 흐름]]에서 확인한다.
  문서의 status는 합의·적용 상태이며 개발 진행도는 작업 관리 기록에서 관리한다.
