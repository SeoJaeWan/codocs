id: writing-guide
name: '문서 작성 가이드'
domains:
  - '문서 작성 가이드'
kind: procedure
definition: |
  사용자가 Codocs 문서를 작성하고 갱신할 때 필요한 설명이다. 기본 작성 지침을 순서대로 읽고 필요한 개념을 별도로 확인한다.

  ## 용어와 계약

  - [[기본 작성 지침]]: 작성 목적·근거·원본 관리·참조·문단·갱신의 일반 원칙을 확인한다.
  - [[문서]]: 저장 속성·허용 값·식별자와 이름의 역할을 확인한다.
  - [[도메인]]: 소속을 분류하는 기준과 도메인 소개의 역할을 확인한다.
  - [[설명 분리]]: 설명을 나누거나 합칠 조건과 기존 본문의 처리 방법을 판단한다.
  - [[참조]]: 이름·도메인 표기와 escape를 작성하고 연결 대상을 확인한다.
