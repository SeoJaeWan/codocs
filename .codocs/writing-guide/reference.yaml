id: reference
name: '참조'
domains:
  - '문서 작성 가이드'
definition: |
  문서 본문에서 다른 문서를 이름으로 가리키는 표기다.
  연결하는 이유와 원문의 역할을 설명하는 작성 원칙은 [[기본 작성 지침]]에서 확인한다.

  ## 이름과 도메인

  문서의 id가 아닌 name을 사용한다. `[[문서]]`는 문서의 형식과 속성을 확인하는 연결이다.
  `[[문서 작성 가이드:문서]]`처럼 도메인을 명시하면 해당 소속 안에서 찾는다.
  도메인을 생략하면 전체 이름 공간에서 찾으며 현재 문서의 소속을 우선하지 않는다.
  공백·대소문자를 정확히 비교하고 trim이나 표기 보정을 하지 않는다.

  참조는 definition과 examples의 문자열 원소에서 사용한다.
  문서 이름·ID·이전 ID 목록·사용자 필드에 같은 표기를 넣어도 연결로 해석하지 않는다.
  자기 문서를 가리키는 참조는 연결하지 않는다. 서로 다른 문서 사이의 상호 참조는 허용한다.

  ## 특수 문자와 문법 오류

  첫 번째 escape되지 않은 콜론이 도메인과 이름의 구분자다.
  이름과 도메인 자체에 들어가는 콜론은 `\:`로 작성한다.
  참조 시작 앞의 연속 백슬래시가 홀수이면 연결하지 않는 글자다.
  빈 이름·도메인, 남은 대괄호·추가 구분자·닫히지 않은 참조는 문법 오류다.

  이 규칙은 YAML 해석 후 문자열에 적용한다.
  작은따옴표와 literal 블록은 백슬래시를 그대로 보존하며 큰따옴표에서는 백슬래시 자체를 한 번 더 escape한다.

  ```yaml
  definition: |
    [[문서]]에서 작성할 속성을 확인한다.
    \[[문서]]는 연결하지 않는 글자다.
  ```

  ## 대상 확인

  이름이 같아도 대상 문서가 없거나 여러 개일 수 있으므로 표기의 유효성과 연결 확정은 구분한다.
  실제 후보 집계·탐색 상태·자기 참조의 처리는 [[참조 후보를 문서 연결로 확정하는 절차]]에서 확인한다.
  문법 오류의 위치와 반복 등장을 찾는 방법은 [[참조 추출]]에서 확인한다.
