id: basic-writing-guidelines
name: '기본 작성 지침'
domains:
  - '문서 작성 가이드'
definition: |
  문서를 작성하고 갱신할 때 설명의 목적·근거·연결을 판단하는 기본 원칙이다.
  프로젝트의 목적과 독자에 맞춰 조정할 수 있는 권장 사항이며, 따르지 않았다는 이유로 검증 오류·경고를 만들거나 저장을 차단하지 않는다.
  형식과 허용 값의 검사는 [[문서 검증]]에서 별도로 다룬다.

  ## 작성할 설명 정하기

  문서 이름이 가리키는 주제와 독자가 해결할 질문을 먼저 정하고 첫 설명에서 그 목적을 드러낸다.
  작업을 설명할 때는 무엇을 받아 어떤 판단을 하고 무엇을 반환하거나 변경하는지 밝힌다.
  예시도 그 질문에 대한 판단과 결과를 보여준다. 이름만 다르게 붙이고 본문은 같은 질문에 답하게 만들지 않는다.
  용어의 의미·동작·정책·조건·예외·판단 근거와 책임을 설명한다.
  상태 코드만 나열하지 않고 어떤 조건에서 발생하며 왜 그렇게 판단하는지 설명한다.
  확인되지 않은 이유는 확정 사실로 기록하지 않는다. 미합의 정책을 확정된 동작처럼 쓰거나 기록을 지워 확정된 것으로 만들지 않는다.

  새 설명을 추가하기 전에 같은 주제를 담당하는 원문을 찾는다.
  기존 설명의 보완인지 독립적인 주제인지는 [[설명 분리]]의 기준으로 판단한다.
  문서의 설명 단위와 저장 속성은 [[문서]], 소속을 정하는 기준은 [[도메인]]에서 확인한다.

  ## 용어와 사용처의 책임

  용어 문서는 의미·구조·고유한 성질을 설명한다.
  그 용어를 사용하는 조건·선택·처리는 해당 작업 문서가 용어를 참조하며 설명한다.
  용어가 등장한다는 이유로 사용처의 모든 판단을 용어 문서에 모으지 않는다.

  대상의 의미·구조·허용 조건은 그 계약을 담당하는 문서에서 정의한다.
  이를 검사하거나 사용하는 처리는 해당 계약을 참조하고, 적용 방법과 결과를 설명한다.

  값이나 결과를 받아 쓰는 문서는 사용할 정보와 그 목적을 밝히고, 생산자가 정의한 정보의 구조나 계산 규칙을 다시 정의하지 않는다.
  별도 담당 문서가 없고 현재 주제를 이해하는 데 필요한 동작이면 같은 문서에서 설명할 수 있다.
  이 구분을 위해 문서 타입이나 고정된 입력·처리·출력 제목을 추가할 필요는 없다.
  독립 문서로 나누는 시점과 기존 설명의 처리는 [[설명 분리]]에서 확인한다.

  ## 설명의 원본과 참조

  하나의 정의·규칙·판단 기준은 담당 문서 한 곳에서 관리한다.
  다른 문서에서는 해당 설명이 필요한 상황과 관계를 적고 담당 문서를 참조한다.
  문장을 바꾸거나 일부만 요약해도 같은 조건·기준·예외를 다시 규정하면 중복 관리가 된다.
  같은 대상을 언급하더라도 각 문서가 소유하는 서로 다른 질문에 답하면 중복 정의가 아니다.
  중복을 제거할 때 현재 문서가 소유하는 조건·결과·예외까지 삭제하지 않는다.

  참조 문장은 대상에서 무엇을 확인할 수 있고 현재 설명에 왜 필요한지 드러낸다.
  무엇을 연결하는지 설명하지 않는 “다른 문서를 따른다” 같은 문장만 남기지 않는다.
  연결 표기와 대상 선택은 [[참조]]에서 확인한다.
  연결이 있다는 사실만으로 모든 관련 문서를 확인한 것으로 간주하지 않고 판단에 필요한 원문을 읽는다.

  짧은 주제 안내와 현재 문맥에 적용하는 예시는 둘 수 있으나 별도의 판단 기준을 만들지 않는다.
  원문과 적용 사례를 구분하고 예시에서 사용한 조건을 일반 규칙으로 확대하지 않는다.
  절차 문서는 담당 규칙을 연결해 적용 순서와 후속 행동을 설명하며 각 규칙의 조건표를 다시 작성하지 않는다.

  ## 문단과 간격

  같은 설명에 속하는 문장은 줄바꿈으로 이어서 작성한다.
  설명의 관점·조건·단계가 바뀔 때 빈 줄로 문단을 나눈다.
  제목·목록·표는 주변 문단과 구분하며 YAML 들여쓰기를 유지한다.
  문장마다 빈 줄을 넣거나 모든 빈 줄을 일괄 제거하지 않는다.

  ## 의미 변경과 갱신

  설명하는 의미·동작·정책이 바뀌면 담당 원문에 합의한 조건·근거·예외를 반영한다.
  개발 진행만 바뀌면 문서를 수정하지 않는다.
  구현 예정·진행·완료 여부, 담당 작업과 PR·이슈 배정은 작업 관리 도구에서 관리하며 이를 담는 별도 지식 문서도 만들지 않는다.
  구현이 계약과 다르면 수정할 작업을 이슈·PR에 기록한다.
  내용의 합의·적용 상태를 표현할 때는 [[문서]]의 status 의미를 사용한다.

  원문을 변경한 뒤 참조하는 문서의 맥락과 적용 사례가 여전히 맞는지 확인한다.
  규칙 하나를 바꾸기 위해 여러 문서의 같은 설명을 함께 고쳐야 한다면 중복 관리 여부를 검토한다.
  문서를 나누거나 합친 뒤에는 남은 중복 설명, 끊어진 참조와 담당 문서 없이 남은 규칙을 확인한다.
