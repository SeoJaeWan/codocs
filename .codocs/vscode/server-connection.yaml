id: server-connection
name: '언어 서버 연결'
domains:
  - 'VS Code'
definition: |
  VS Code 확장이 별도 Node 언어 서버를 실행하고 LSP/Node IPC로 연결하는 계약이다.
  확장은 호스트와 실행 생명주기를 담당하며 core·workspace 함수를 직접 호출하지 않는다.

  ## 책임 경계

  클라이언트 연결은 vscode-languageclient, 서버 요청 처리는 language-server의 vscode-languageserver가 담당한다.
  코드의 최신 내용은 [[문서 동기화]], 호버·진단·원문 링크의 표현 경계는 [[IDE 지원]]에서 정의한다.
  실행·연결 실패는 연결 상태로 안내하며 정상적인 빈 조회나 문서 부재로 해석하지 않는다.
  패키지 번들의 로드 성공과 실제 확장 실행·LSP 연결 성공은 별도로 확인한다.

  ## 프로젝트 연결

  VS Code에서 연 workspace 폴더를 프로젝트 루트로 사용하고 그 아래 .codocs를 지식 폴더로 연결한다.
  여러 workspace 폴더를 열면 폴더별로 별도 언어 서버와 색인을 관리하며 프로젝트 사이의 자료를 섞지 않는다.
  workspace 폴더가 중첩되면 파일을 포함하는 가장 가까운 workspace 폴더에 연결한다.
  폴더 없이 연 파일과 모든 workspace 폴더 밖의 파일은 매칭하지 않는다.
  상위 디렉터리의 .codocs를 자동 탐색하여 프로젝트 루트를 바꾸지 않는다.

  ## 지식 폴더가 없는 경우

  프로젝트에 .codocs가 없으면 자동으로 생성하지 않고 매칭 없이 대기한다.
  사용자가 해당 프로젝트 루트에 .codocs를 만들면 자동 감지하여 색인을 준비하고 매칭을 시작한다.
  지식 폴더의 부재와 서버 연결 실패·파일 접근 실패는 구분한다.

  ## 예기치 않은 종료와 재시작

  언어 서버가 예기치 않게 종료되면 자동 재시작을 시도한다.
  반복해서 실패하면 자동 재시작을 중단하고 오류와 수동 재시작 방법을 안내한다.
  재시작 후에는 연결된 열린 코드 문서의 현재 내용과 버전을 다시 동기화한다.
  저장하지 않은 편집 내용도 포함하며, 재연결을 위해 파일을 자동 저장하지 않는다.

  ## 진단 재검사 상태

  [[IDE 지원]]의 진단 재검사 실패는 상태 표시줄에서 알리고 반복 팝업으로 작업을 방해하지 않는다.
  상태 항목을 선택하면 영향을 받은 작업 공간·파일·실패 사유와 현재 상태를 확인하지 못했다는 설명을 제공한다. 이전 결과가 있으면 과거 관측임을 함께 표시한다.
  여러 작업 공간의 실패를 섞거나 한 작업 공간의 복구로 다른 작업 공간의 실패를 지우지 않는다. 최신 재검사가 성공하면 해당 실패 상태를 해제한다.
  상태 항목의 상세 안내는 codocs.showDiagnosticStatus 명령으로 연결한다. Codocs 출력에 해당 작업 공간의 파일·읽기 오류 코드·과거 진단을 기록하며 출력 패널을 보여도 현재 편집기의 포커스를 유지한다.
  언어 서버의 codocs/diagnosticStatus 알림은 작업 공간 URI와 실패 목록을 전달한다. 실패 목록이 빈 최신 관측만 복구로 취급하며, 이전 서버 세션의 알림은 새 세션의 상태로 적용하지 않는다.
  재검사 실패 안내와 언어 서버 자체의 종료·재시작 안내는 구분한다. 상태 표시를 위해 파일을 자동 저장하거나 포커스를 이동하지 않는다.

  ## 배포 식별자와 내장 서버

  공개 확장 ID는 seojaewan.codocs이며 첫 후보 버전은 0.0.1이다. VSIX에 CommonJS 언어 서버와 의존성·라이선스를 포함하고 VS Code 내장 런타임으로 실행한다. 별도 시스템 Node는 확장 사용의 조건이 아니다. 실제 설치한 ID·버전·경로와 기능 및 종료 검사는 [[배포]] 기준에 따라 확인한다.
