id: open-source
name: '원문 열기'
domains:
  - 'VS Code'
definition: |
  문서 링크가 가리키는 YAML 원문을 편집기에서 열거나 기존 탭으로 이동하는 동작이다.
  코드의 기존 정의 이동과 구분하며 클릭 제스처는 IDE 설정을 따른다.

  복수 후보는 각각의 원문 링크를 제공하고 임의의 대표 문서를 열지 않는다.
  [[IDE 지원]]에서 전달한 확인 가능한 경로와 위치를 사용하며 위치를 모르면 추측하지 않는다.
  이미 열린 원문은 기존 탭을 사용한다. 문서 간 이름 연결의 의미는 [[참조]]에서 확인한다.
