id: open-source
name: '원문 열기'
domains:
  - 'VS Code'
definition: |
  [[문서]] 링크의 YAML 원문과 명시적 참조에 연결된 코드 위치를 편집기에서 열거나 기존 탭으로 이동하는 동작이다.
  코드의 기존 정의 이동과 구분하며 클릭 제스처는 IDE 설정을 따른다.

  ## 확인된 대상 열기

  [[코드 호버]]의 문서 링크와 YAML 본문의 이름 참조 링크는 같은 원문 열기 동작을 사용한다.
  [[명시적 코드 참조]]의 문서·행·범위 이동과 문서에서 코드 출현으로 돌아가는 이동도 확인된 대상만 연다.
  링크를 생성하는 [[IDE 지원]]은 최신 매칭 또는 이름 참조 해석에서 확인한 경로를 전달한다. 원문 열기는 전달된 ID나 이름만으로 다른 대상을 임의 선택하지 않는다.
  화면에 남은 오래된 링크를 클릭한 경우에도 최신 대상 확인을 거친 경로만 연다. 확인되지 않으면 열지 않으며 예전 경로에 생긴 다른 문서를 대신 열지 않는다.
  codocs/confirmSource 요청은 링크의 출처 문서를 소유한 가장 가까운 workspace client로 보낸다. 서버 재시작·출처 닫기·편집으로 무효화한 토큰은 열지 않는다. 대상 URI로 client를 고르지 않는다.
  snapshot 알림에 따른 표시 세대 변경만으로 같은 출처·서버의 최신 확인 성공을 폐기하지 않는다. 응답 뒤에도 출처 버전·닫기·소유권·서버 세션이 유지되는지 확인한다.

  복수 후보는 각각의 원문 링크를 제공하고 임의의 대표 문서를 열지 않는다.
  이동·삭제 자체에 대한 별도 팝업은 표시하지 않는다. 참조 문제의 진단과 링크 갱신은 [[IDE 지원]]의 책임이다.

  ## 탭과 이동 위치

  기본 문서 링크와 행 지정이 없는 명시적 참조는 파일 맨 위로 이동하며 YAML 전체 범위를 선택하지 않는다.
  새 탭과 기존 탭 모두 (0,0)에서 시작하고 끝나는 빈 선택을 적용한다. 확인 이후 파일 접근에 실패해도 이동·삭제 팝업을 표시하지 않으며 내부 오류는 출력 로그에 남긴다.
  이미 열린 원문은 기존 탭을 재사용하되 기본 링크에서는 기존 커서·선택 위치 대신 파일 맨 위로 이동한다.
  미저장 편집 내용은 그대로 보존하고 디스크 내용으로 덮어쓰거나 강제 저장하지 않는다.
  기본 원문 열기는 특정 YAML 필드나 행·범위를 추측해 이동하지 않는다. 문서 간 이름 연결의 의미는 [[참조]]에서 확인한다.

  ## 명시한 위치의 선택

  행·범위 참조는 현재 열린 원문의 명시한 번호를 선택·강조한다. 미저장 변경이 있다는 이유만으로 이동을 차단하거나 저장·되돌리기를 요구하지 않는다.
  닫힌 대상은 현재 디스크 원문을 열고 이미 열린 대상은 기존 미저장 버퍼를 사용한다.
  실제 이동에 사용하는 원문에 시작 행 또는 끝 행이 없으면 이동하지 않는다. 마지막 행으로 범위를 줄이거나 다른 행으로 보정하지 않는다.
  앞부분 편집으로 내용이 밀려도 명시한 번호를 사용하며 원래 문장의 새 위치를 추론하지 않는다.

  역방향 이동은 [[코드 참조 색인]]이 클릭 시 확인한 코드 출현의 현재 위치를 선택·강조한다. 함수 정의나 파일 상단으로 대신 이동하지 않는다.
  코드의 기존 탭과 미저장 내용도 보존하며 임의 대상 선택·강제 저장·디스크 재로드를 하지 않는다.
