id: open-source
name: '원문 열기'
domains:
  - 'VS Code'
definition: |
  [[문서]] 링크가 가리키는 YAML 원문을 편집기에서 열거나 기존 탭으로 이동하는 동작이다.
  코드의 기존 정의 이동과 구분하며 클릭 제스처는 IDE 설정을 따른다.

  ## 확인된 대상 열기

  [[코드 호버]]의 문서 링크와 YAML 본문의 이름 참조 링크는 같은 원문 열기 동작을 사용한다.
  링크를 생성하는 [[IDE 지원]]은 최신 매칭 또는 이름 참조 해석에서 확인한 경로를 전달한다. 원문 열기는 전달된 ID나 이름만으로 다른 대상을 임의 선택하지 않는다.
  화면에 남은 오래된 링크를 클릭한 경우에도 최신 대상 확인을 거친 경로만 연다. 확인되지 않으면 열지 않으며 예전 경로에 생긴 다른 문서를 대신 열지 않는다.
  codocs/confirmSource 요청은 링크의 출처 문서를 소유한 가장 가까운 workspace client로 보낸다. 서버 재시작·출처 닫기·편집으로 무효화한 토큰은 열지 않는다. 대상 URI로 client를 고르지 않는다.

  복수 후보는 각각의 원문 링크를 제공하고 임의의 대표 문서를 열지 않는다.
  이동·삭제 자체에 대한 별도 팝업은 표시하지 않는다. 참조 문제의 진단과 링크 갱신은 [[IDE 지원]]의 책임이다.

  ## 탭과 이동 위치

  링크로 연 원문은 항상 파일 맨 위로 이동하며 YAML 전체 범위를 선택하지 않는다.
  새 탭과 기존 탭 모두 (0,0)에서 시작하고 끝나는 빈 선택을 적용한다. 확인 이후 파일 접근에 실패해도 이동·삭제 팝업을 표시하지 않으며 내부 오류는 출력 로그에 남긴다.
  이미 열린 원문은 기존 탭을 재사용하되 기존 커서·선택 위치 대신 파일 맨 위로 이동한다.
  미저장 편집 내용은 그대로 보존하고 디스크 내용으로 덮어쓰거나 강제 저장하지 않는다.
  기본 원문 열기는 특정 YAML 필드나 행·범위를 추측해 이동하지 않는다. 문서 간 이름 연결의 의미는 [[참조]]에서 확인한다.
