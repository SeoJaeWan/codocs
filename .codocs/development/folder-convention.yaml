id: folder-convention
name: '폴더 컨벤션'
domains:
  - '개발'
deprecatedAliases: []
definition: |
  이 저장소에서 파일과 폴더를 만들 때 따르는 이름과 배치 규칙이다.
  이 규칙은 우리 프로젝트의 관례이며 제품이 다른 사용자의 프로젝트나 .codocs에 강제하는 것은 아니다.

  ## 이름

  파일과 폴더 이름은 kebab-case를 사용한다. 예를 들어 query-cursor.ts, document-attributes.yaml, language-server 폴더로 쓴다.
  .test.ts처럼 중간에 붙는 확장자는 이름 검사에서 제외하며, 외부 도구가 요구하는 파일 이름은 그 도구의 규칙을 따른다.

  ESLint의 eslint-plugin-check-file로 검사한다.

  - 파일 이름: .ts·.js·.mjs·.cjs·.yaml 파일과 .codocs·examples/.codocs의 YAML
  - 폴더 이름: packages/, tools/, .codocs/ 아래 폴더

  ## 기능과 테스트 배치

  기능 구현은 src/기능/index.ts에 두고 테스트는 같은 폴더의 기능.test.ts에 둔다.
  예를 들어 hover는 src/hover/index.ts와 src/hover/hover.test.ts로 구성한다.
  작은 기능은 index.ts에 직접 작성하고 커지면 같은 폴더의 보조 파일로 나눈다. 기능의 도메인 상수는 같은 폴더의 domain-values.ts에 둔다.
  실제 IO·프로세스를 쓰는 테스트도 그 책임을 가진 코드 옆에 둔다.
  여러 테스트가 함께 쓰는 준비 코드와 mock은 그 패키지의 test-support 폴더에 둔다.
  실제 VS Code UI 테스트는 vscode 패키지의 별도 테스트 영역(test-runner)에 둔다.
  빌드·배포·개발 도구는 tools/ 아래에 두고 그 테스트도 구현 옆에 둔다.

  ## 빌드 대상

  배포용 빌드에서는 test 파일과 test-support를 제외한다.
