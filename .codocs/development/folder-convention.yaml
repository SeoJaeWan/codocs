id: folder-convention
name: '폴더 컨벤션'
domains:
  - '개발'
definition: |
  ## 기능과 테스트 배치

  기능 구현은 src/기능/index.ts에 두고 테스트는 같은 폴더의 기능.test.ts에 둔다.
  예를 들어 string-mapping은 src/string-mapping/index.ts와 src/string-mapping/string-mapping.test.ts로 구성한다.
  작은 기능은 index.ts에 직접 작성하고 커지면 같은 폴더의 보조 파일로 분리한다.
  실제 VS Code 기능 테스트는 packages/vscode/src/integration/extension.test.cjs에 모으고 Extension Host에서 실행한다. 테스트용 공통 준비·mock은 소유 패키지의 test-support에 두며 배포 빌드에서 제외한다. 패키지 전용 실행기는 해당 패키지에, 공유 실행 도구는 tools/test/runtime에 둔다.
  공통 테스트 보조 코드는 tools/test/support, 테스트 수집 실행기는 tools/test/run.mjs에 둔다. 빌드와 배포 검사는 tools/build/check, 커밋·스테이징 도구는 tools/git에서 관리한다. 공유 Node·pnpm 확인은 tools/toolchain.mjs가 담당한다. pnpm check의 검사 순서는 package.json에서 조합하며 별도 tools/check 실행기를 두지 않는다.

  ## 프로젝트 문서

  .codocs는 프로젝트의 용어·동작·정책을 설명하는 지식을 보관한다.
  문서 작성 기준은 [[기본 작성 지침]]에서 확인한다.
  writing-guide는 사용자 작성법과 문서·도메인·참조·분리 개념을 담는다.
  core·workspace·mcp·language-server·vscode는 해당 패키지가 의미와 동작을 소유하는 용어·계약을 담는다.
  development는 프로젝트 운영과 공통 개발 규칙을 담는다.
  사용자가 따라야 할 폴더 구조로 강제하지 않으며 문서 소속은 domains에 명시한다.

  이 저장소에서는 독립적인 기능 책임을 가진 패키지와 기능 폴더를 관련 문서를 묶는 기준으로 사용한다.
  예를 들어 core/catalog의 색인·참조 후보·연결 판단 문서는 .codocs/core/catalog 아래에 묶고, core/change-plan과 workspace/change-plan은 각 패키지의 책임 아래에 둔다.
  담당 문서를 둘 기준과 내용은 [[문서 컨벤션]]에서 정의한다. 코드 폴더가 존재한다는 이유만으로 대응 문서 폴더를 만들지는 않는다.
  기능 안의 개념·정책은 필요에 따라 별도 파일로 나누고, development 같은 공통 개발 규칙은 기능별로 복제하지 않는다.

  폴더 이동만으로 기존 문서의 ID·이름·도메인을 변경하지 않는다.
  같은 기능명이라도 문서 ID는 프로젝트 전체에서 유일해야 하며, 도메인은 폴더마다 자동으로 추가하지 않고 [[도메인]]의 책임·정책 경계에 따라 정한다.
  관련 문서를 재배치하면 루트 README와 .codocs 소개 문서에서 담당 원문을 찾는 경로도 갱신한다.

  여러 패키지가 사용하는 규칙의 원본 관리는 [[기본 작성 지침]], README와 사용자 가이드의 역할은 [[문서 컨벤션]]에서 확인한다.

  ## 파일과 폴더 이름

  이 프로젝트의 개발 소스와 .codocs 파일·폴더 이름은 kebab-case를 사용한다.
  예를 들어 query-cursor.yaml, ide-support.yaml, writing-guide 폴더로 작성한다.
  문서 ID는 파일명과 독립적으로 정한다.
  ESLint의 eslint-plugin-check-file로 검사하고 .test.ts 같은 복합 확장자는 허용한다.
  외부 도구가 요구하는 파일명은 해당 도구의 규칙을 유지한다.

  이 배치와 명명은 우리 프로젝트의 관례다.
  제품이 다른 사용자의 .codocs에도 고정 계층이나 파일명 규칙을 강제하는 것은 아니다.

  ## 빌드 대상

  테스트는 구현과 인접하게 두되 배포용 빌드에서 test/spec 파일을 제외한다.
