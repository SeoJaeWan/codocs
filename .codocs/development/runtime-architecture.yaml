id: runtime-architecture
name: '실행 구조'
domains:
  - '개발'
definition: |
  패키지와 실행 프로세스 사이의 책임 및 의존 방향을 정의한다.
  IDE와 AI가 같은 계산 규칙을 사용하면서 호스트·프로토콜·파일 IO를 분리해 재사용하기 위한 구조다.
  코드를 공유한다고 프로세스나 메모리까지 공유하는 것은 아니다.

  ## 패키지 연결

  vscode는 language-server를 실행하고 language-server와 mcp는 workspace를 통해 프로젝트 파일에 접근한다.
  workspace는 [[탐색]]의 관측을 [[문서 색인]]과 저장 요청으로 core의 순수 계산에 연결한다. language-server와 mcp도 core의 공개 계산을 사용할 수 있다.
  다른 패키지의 내부 구현 접근을 제한하는 기준은 [[코드 컨벤션]]에서 확인한다.

  - [[Core]]: 파싱·검증·색인·참조·매칭 계산의 담당 문서를 찾는다.
  - [[작업 공간]]: 실제 경로·파일·관측·저장 상태의 담당 문서를 찾는다.
  - [[MCP]]: AI 도구의 요청과 응답 계약을 찾는다.
  - [[편집기 기능]]·[[VS Code 확장]]: 편집 중 코드와 LSP 기능, 확장의 서버 연결과 원문 탭 동작을 찾는다.

  ## 프로세스와 전송

  MCP 서버의 프로젝트 선택은 [[탐색]]의 프로젝트 루트 규칙을 적용한다.
  공식 MCP TypeScript SDK는 mcp 패키지에서 초기화·도구 등록·요청 응답을 연결하며 실제 계산과 IO는 core·workspace에 전달한다.
  stdio를 사용하고 stdout은 프로토콜 전용, 로그는 stderr다.
  도구 입력 스키마와 문서 스키마를 구분하며 SDK 버전은 Node.js·Zod 조합으로 검증한다.

  MCP 서버는 선택한 프로젝트의 조회 세션([[문서 색인]]) 하나를 생성하고 수명을 소유한다.
  빌드한 `packages/mcp/dist/cli.js`를 Node로 실행하며 `--project`를 생략하면 시작 cwd를 프로젝트로 사용한다. 상대 `--project`도 시작 cwd에 고정한다.
  각 도구는 서버가 전달한 같은 세션을 사용하며 도구별로 별도의 세션이나 색인을 만들지 않는다.
  stdin 종료·종료 신호·시작 중 실패는 같은 종료 절차로 연결과 세션을 정리한다. 정리 요청이 중복되거나 초기화가 일부만 완료된 경우에도 확보한 자원을 안전하게 해제한다.
  세션 종료 뒤에는 진행 중 읽기와 감시 자원을 정리하고 새 결과를 게시하지 않는다.

  VS Code/LSP와 MCP가 공통 처리 결과를 사용하는 책임은 [[진단]]에서 정의한다.

  VS Code와 별도 서버의 연결과 재시작은 [[VS Code 확장]]에서 확인한다.
  각 프로세스의 지식 파일 관측은 [[탐색]]으로 유지한다.
  공유 데몬·Worker Threads·영속 캐시는 초기 필수가 아니며 확인된 필요와 복잡도를 근거로 도입을 판단한다.

  ## 코드에서 지식까지

  언어 서버가 편집 중 코드의 최신 내용과 식별자 위치를 관리하고 [[식별자 참조]]의 매칭에 식별자를 전달한다.
  [[편집기 기능]]은 반환된 후보와 근거를 화면에 표현하고 [[원문 열기]]로 이동한다.
  언어 공통 텍스트 추출·위치 관리와 공통 비교를 분리하며, 언어별 파서를 요구하지 않는다.

  다른 IDE에 계산을 재사용할 수 있어도 실제 연결·배포·시험은 별도로 수행한다.
  모든 내부 패키지를 각각 공개 배포할 필요는 없다.
