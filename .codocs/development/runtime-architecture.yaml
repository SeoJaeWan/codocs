id: runtime-architecture
name: '실행 구조'
domains:
  - '개발'
definition: |
  각 패키지와 실행 프로세스의 책임 및 연결 경계를 정의하는 영역이다.
  순수 계산과 파일 접근, IDE·AI 도구의 요청 처리를 구분한다.

  ## 분리 이유

  IDE와 AI가 같은 도메인 규칙을 사용하되 호스트·프로토콜·파일 IO 때문에 순수 계산을 재사용하기 어려워지지 않게 한다.
  코드를 공유한다고 프로세스와 메모리까지 공유하는 것은 아니다.

  ## 책임

  core는 파싱·검증·참조·색인·매칭·변경안의 순수 계산을 담당한다.

  workspace는 프로젝트 선택·실제 읽기·경로·색인 연결과 감지·저장·revision·잠금·대기열을 담당한다.

  language-server는 IDE 요청을 연결하고 vscode는 서버 실행·명령·탭을 담당한다.

  mcp는 AI 도구 요청을 연결한다.

  패키지 내부 접근과 공개 진입점 사용 규칙은 [[코드 컨벤션]]에서 확인한다.

  ## 실행 계약

  MCP 프로세스 하나는 프로젝트 하나를 담당한다.
  공식 SDK와 stdio를 사용하고 stdout은 프로토콜 전용, 로그는 stderr다.

  VS Code는 별도 Node 언어 서버와 LSP/Node IPC로 연결한다.
  편집 중 코드의 최신 버전·좌표는 문서 동기화로 관리한다.

  저장된 지식 파일 색인은 별도로 갱신한다.

  프로세스별 색인을 유지하며 요청마다 모든 YAML을 다시 해석하지 않는다.
  공유 데몬·Worker Threads·영속 캐시는 초기 필수가 아니며 측정으로 판단한다.

  ## 언어별 어댑터와 매칭 코어

  언어별 어댑터가 코드 전체에서 식별자와 파일 위치를 추출하고, 공통 코어는 식별자 문자열 하나를 받아 문서 후보를 계산한다. Java·TypeScript처럼 언어별 문법을 다루는 책임을 코어에 넣지 않는다. 어댑터를 별도 패키지로 나누는 것은 필수 조건이 아니다.
  코어가 반환하는 매칭 범위는 식별자 내부의 0 기반 UTF-16 상대 범위 [시작, 끝)다. 시작은 포함하고 끝은 제외한다. 어댑터가 추출한 식별자의 원본 위치를 기준으로 실제 파일 좌표로 변환한다.
  저장 전 코드의 최신 내용·버전으로 식별자를 추출하며 이전 버전의 위치 결과를 새 코드에 적용하지 않는다. 공통 결과는 매칭 범위·문서 경로·현재/이전 및 표기/단수화 근거·진단·읽기 상태를 후속 계층이 사용할 수 있어야 한다.
  토큰 경계와 후보 순위·Hover 표현은 [[IDE 지원]]이 소유한다.
  언어별 어댑터는 지원 언어·추출 방식·주석과 문자열의 처리 범위·미지원 언어 동작을 명시한다. 이 책임 분리만으로 특정 언어의 지원을 보장하지 않는다.

  패키지명은 [[도메인]]의 강제값이 아니다.
  실제 파일의 접근 범위는 [[문서 탐색]]의 계약을 따른다.

  ## SDK와 책임 경계

  MCP TypeScript SDK는 mcp 패키지에서 초기화·도구 등록·요청 응답을 연결하고 실제 처리는 workspace/core가 담당한다.
  도구 입력 스키마와 문서 스키마를 구분하며 SDK 버전은 Node.js·Zod 조합으로 검증한다.

  vscode에는 vscode-languageclient, language-server에는 vscode-languageserver·vscode-languageserver-textdocument를 둔다.
  LSP/Node IPC를 사용하며 SDK의 문서 동기화와 textdocument로 편집 중 코드의 버전·위치를 관리한다.

  다른 IDE에 코어를 재사용할 수 있어도 실제 연결·배포·시험은 별도로 수행한다.
  모든 내부 패키지를 각각 공개 배포할 필요는 없다.
