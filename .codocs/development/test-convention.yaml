id: test-convention
name: '테스트 컨벤션'
domains:
  - '개발'
deprecatedAliases: []
definition: |
  이 저장소의 테스트 종류와 실행 위치, 테스트를 작성하는 규칙이다.
  기능 테스트는 .codocs에 정의한 명세를 기준으로 구현이 그 계약을 지키는지 확인하는 것이 기본이다.

  ## 테스트 종류

  - 기능 테스트: 각 패키지의 기능 옆 `*.test.ts`다. .codocs 명세의 조건·결과·예외·보존 규칙을 구현이 지키는지 확인한다. 순수 계산뿐 아니라 실제 파일 IO·감시·프로토콜·프로세스·동시성처럼 그 기능이 책임지는 동작도 여기서 확인한다. Vitest로 실행한다.
  - 도구 테스트: tools/ 아래 빌드·배포 도구, 자체 ESLint 규칙, 테스트 지원 코드의 테스트다. 각 도구 옆에 두며 Vitest와 Node 내장 테스트 러너(.mjs·.cjs)로 실행한다.
  - VS Code UI 테스트: 설치한 VSIX로 실제 VS Code를 띄워 호버·링크·탭 같은 사용자 동작을 확인한다. `pnpm test:vscode`로 실행하며 CI에서만 돈다.
  - 배포 산출물 검증: 최종 tgz·VSIX의 구성·설치·시작을 확인한다. `pnpm release:pack`과 `pnpm release:verify`로 실행하며 기준은 [[배포]]에서 정한다.

  기능의 상세 입력 조합은 기능 테스트에서 확인하고, UI 테스트와 배포 검증은 대표 사례와 연결·설치만 확인한다. 같은 조합을 여러 종류에서 반복하지 않는다.

  ## 로컬과 CI

  로컬과 CI의 기능 테스트는 같은 계약을 확인하며, CI는 OS에 따른 동작 차이를 확인한다. 각 테스트가 커밋 훅과 PR CI 중 어디서 실행되는지는 [[검사와 병합]]에서 정한다. 개발자가 직접 개발용 VS Code 창이나 MCP Inspector를 띄워 확인하는 방법은 [[직접 실행하기]]에서 설명한다.

  ## 명세와 테스트

  구현할 기능의 .codocs 명세에서 조건·결과·예외·보존 규칙을 확인하고 테스트의 입력과 검증문에 대조한다.
  일반 동작을 확인한 테스트 하나로 명세의 다른 조건도 검증됐다고 판단하지 않는다.
  구현이 없는 계약과 구현은 있지만 해당 조건의 테스트가 없는 계약을 구분하고, 이미 구현된 계약의 조건별 검증은 기능 테스트로 보완한다.
  문서의 조건 줄 하나에는 그 조건을 주목적으로 검증하는 테스트 하나를 대응시킨다. 다른 목적의 테스트가 결과적으로 그 조건을 지나가는 것으로 대신하지 않는다.
  한 줄에 테스트가 둘 이상이면 원인을 판정한다. 줄에 조건이 여럿이면 문서 줄을 나누고, 같은 조건의 테스트가 흩어졌으면 it.each로 합친다.
  문서에서 목록으로 나열한 경우는 상위 줄의 테스트에서 it.each의 각 행으로 검증한다.
  테스트는 그 줄을 구현한 함수의 테스트 파일에 둔다.
  테스트가 요구하는 동작도 명세와 대조한다. 명세에 없는 제약·응답·처리 정책은 합의 여부를 확인하며, 현재 코드가 그렇게 동작한다는 이유만으로 기대값을 확정하지 않는다. 확인된 차이와 후속 작업은 이슈·PR로 추적한다.

  ## 작성 규칙

  ### 테스트 그룹과 순서

  최상위 describe는 검증할 함수나 기능을 식별할 수 있는 이름으로 쓴다.
  그 아래에는 가장 단순한 입력으로 근본적인 기능을 확인하는 테스트를 먼저 둔다.
  이후 반복·중복 제거 같은 추가 처리 규칙과 대상 부재·복수 후보·자기 참조 같은 특별한 응답 조건을 의미별 describe로 묶는다.
  오류 처리와 입력·관련 데이터 보존도 해당 조건과 보호할 대상을 알 수 있는 그룹으로 구분한다.
  하위 describe 이름은 검증하는 대상과 처리 목적을 함께 드러낸다.
  “기본 변경 후보” 대신 “문서 생성·수정과 변경 없는 요청 처리”, “요청과 대상 확인” 대신 “변경 요청의 유효성 검사”처럼 무엇을 확인하는지 설명한다.
  서로 다른 목적이 섞이면 그룹을 나누되, 개별 입력 조건과 기대 결과까지 그룹 이름에 나열하지 않는다.

  예를 들어 문서 간 참조는 기본 연결을 먼저 확인하고, 반복 참조 처리·대상을 확정할 수 없는 경우·자기 참조 처리를 각각 묶는다.
  반복 참조 테스트만으로 기본 연결 테스트를 대신하지 않는다.
  정상 동작·경계 조건·예외 처리·부수 효과 방지라는 고정 분류를 모든 기능에 강제하지 않는다.
  “경계 조건”이나 “오류 후보”처럼 무엇을 검증하는지 알 수 없는 이름과 빈 describe는 만들지 않는다.
  후보 없음이나 복수 후보처럼 약속된 반환 결과를 실행 실패와 혼동하지 않는다.
  이 순서는 파일을 읽는 순서다. 각 it는 필요한 상태를 독립적으로 준비하고 앞 테스트의 실행 결과나 순서에 의존하지 않는다.
  공통 준비·정리는 본문의 가독성을 유지하는 범위에서 공유하고, 변경 가능한 상태가 다음 사례에 남지 않게 한다.

  ### 단위 테스트의 의존성 격리

  기능에 인접한 단위 테스트는 해당 모듈이 소유한 함수의 계약을 검증한다.
  대상 함수는 소유 모듈에서 직접 가져와 검증 범위를 드러낸다.
  대상 함수가 받는 입력과 이전 단계의 결과는 그 타입·계약에 맞는 객체로 테스트 본문에서 직접 작성한다.
  예를 들어 catalog 테스트는 parseYaml을 호출해 입력을 만들지 않고, 필요한 파싱 결과 객체를 buildCatalog의 관측에 직접 넣는다.
  공통으로 쓰는 고정 객체는 공유할 수 있지만, 각 사례에서 중요한 값과 차이는 호출 근처에 드러낸다.
  입력을 만드는 보조 함수나 다른 모듈의 실제 처리에 테스트 준비가 의존하지 않게 한다.

  객체로 전달할 수 있는 결과를 숨겨진 mock·stub 설정으로 대신하지 않는다.
  대상 함수 내부에서 다른 모듈을 직접 호출한다면 입력 객체만으로 그 실행이 격리되지는 않는다.
  이때 격리 범위를 정확히 설명하고, 독립적인 판단 검증이 필요하면 함수의 입력 경계를 명확히 할지 검토한다.
  입력만 객체로 바꾼 테스트를 다른 모듈 구현과 완전히 독립적이라고 주장하지 않는다.
  코드 옆 테스트는 순수 함수 검사로 한정하지 않는다. 실제 파일 IO·감시·프로토콜·프로세스·동시성의 고유한 계약도 그 책임을 소유한 구현 옆에서 검증한다.

  ### 테스트 본문과 보조 함수

  각 테스트 본문에서 핵심 입력 조건·대상 함수 호출·관찰 결과를 읽을 수 있어야 한다.
  대상 함수 호출과 핵심 검증문을 보조 함수로 감추지 않는다.
  호출과 결과 필터링을 함께 감추는 함수는 사용하지 않고, 검증에 필요한 결과 선택도 본문에 드러낸다.

  반복되는 동일한 고정 데이터와 자원 정리는 공유할 수 있지만, 중요한 조건을 기본값이나 의미가 불분명한 위치 인자에 숨기지 않는다.
  보조 함수를 따라가야만 어떤 입력이 대상 함수에 전달되는지 알 수 있다면 객체를 본문에 직접 작성한다.
  입력 객체를 만든다는 이유만으로 계산·등록·내부 상태 변경을 수행하는 보조 함수를 두지 않는다.

  해당 사례의 입력 객체는 it 안의 지역 변수로 선언하고 대상 함수에 전달한다.
  입력값을 그대로 반환하거나 보존하는 계약은 검증문에서도 그 객체의 속성을 참조해 같은 이름·경로·문서 데이터를 중복 작성하지 않는다.
  예를 들어 생성 요청의 경로와 문서를 반환하는지 확인할 때 request.path와 request.document를 기대값으로 사용한다.
  한 사례에서만 쓰는 객체를 재사용 목적으로 파일 공통 변수로 올리지 않는다. 여러 사례의 동일한 고정 데이터만 공유한다.

  ### 하나의 테스트가 확인할 계약

  하나의 it는 하나의 조건·행동에 대한 하나의 계약을 확인한다.
  서로 독립적인 정상 동작·실패 원인·보존 계약은 각각의 테스트로 분리한다.
  객체 추가와 속성 삭제, 생성 성공과 경로 충돌 실패처럼 따로 재현할 수 있는 작업을 한 테스트에서 연속으로 검사하지 않는다.

  A일 때도 C가 발생하고 B일 때도 C가 발생하는 독립 사례는 각각 테스트한다.
  예를 들어 ID 누락과 다른 필드 오류는 한 입력에 함께 넣지 않고, 각 사례에서 나머지 조건을 정상으로 준비한다.
  두 문제가 함께 발생할 때만의 별도 계약이나 회귀가 있으면 결합 사례를 추가한다.
  A와 B를 모두 충족해야 C가 발생하는 결합 조건은 그 조합을 하나의 계약으로 검증한다.
  각 조건의 필요성은 나머지 조건을 충족한 채 해당 조건만 불충족으로 바꾼 별도 사례로 확인한다.
  예를 들어 복수 필터의 AND 계약은 전체 일치와 각 필터만 불일치하는 사례를 나눈다.

  같은 행동과 검증 구조를 입력별로 반복할 때는 it.each를 사용해 각 행을 독립된 테스트로 실행한다.
  각 행의 이름은 실제 입력 조건과 기대 결과를 구별할 수 있어야 한다.
  성공 조회·공백 비교·대소문자 비교처럼 의도가 다른 사례를 일반적인 상태 반환 문장으로 묶지 않는다.
  조건 하나의 영향을 검증할 때는 관련 없는 다른 조건을 동일하게 유지한다.
  한 it 안의 반복문으로 독립 사례를 묶지 않는다. 한 결과의 모든 진단이나 항목을 검증하는 반복은 허용한다.

  하나의 계약을 확인하는 데 필요한 expect 개수는 제한하지 않는다.
  오류 하나의 코드·메시지·위치·심각도, 쓰기 실패의 오류 응답과 원본 보존은 함께 확인할 수 있다.
  상태 전이의 사전 상태를 만드는 호출은 허용하되, 독립적인 여러 동작의 검증을 한 테스트에 누적하지 않는다.

  ### 테스트 이름과 검증 대상

  it의 이름은 “[조건/행동]하면 [관찰 가능한 결과]한다” 형태의 한국어로 쓴다.
  어떤 입력으로 무엇을 실행하고 어떤 결과를 관찰하는지 이름만 읽어도 알 수 있어야 한다.
  “유지한다”, “진단한다”처럼 조건이나 대상 행동이 생략된 이름과 다른 테스트 목록을 기억해야 이해할 수 있는 “금지 구문” 같은 이름은 피한다.
  실패를 유발하는 구문이나 행동을 직접 적고 좌표 계산·입력 보충 설명은 주석에 둔다.
  내부 상태 이름을 그대로 옮긴 “모호함을 반환한다” 대신 “모든 후보를 반환하고 대상을 확정하지 않는다”처럼 결과를 설명한다.
  “등장”이나 “확정 직접 연결”처럼 압축한 용어 대신 참조 위치·문서 간 연결처럼 관찰 대상을 구체적으로 쓴다.

  예를 들어 “ID를 유지한다”는 “문서의 이름을 변경하면 기존 ID를 보존한다”로 쓴다.
  이름에 적힌 입력 조건은 테스트 데이터에 실제로 포함하고, 관찰 결과는 검증문으로 확인한다.
  위치 보존을 이름에 적었다면 텍스트 일치뿐 아니라 기대 위치도 검사한다.
  이름에 독립적인 조건이나 결과가 여럿 있으면 테스트 분리 기준을 적용한다.
  문서 조건 줄을 검증하는 테스트의 이름은 그 줄의 조건과 결과를 같은 말로 옮겨 쓴다. 이름으로 문서의 어느 줄을 검증하는지 찾을 수 있게 한다.

  ### 기대값의 기준

  [[코드 컨벤션]]에 따라 관리하는 고정 메시지·오류 코드를 확인할 때는 해당 상수를 참조한다.
  외부에 약속한 코드나 값 자체를 독립적으로 검증하는 계약 테스트는 리터럴을 사용한다.

  상수를 참조해도 기대값의 의미를 결정하는 계산까지 구현에서 가져오지는 않는다.
  구현의 반복문이나 중간 배열을 그대로 복사해 기대값을 만들지 않는다.
  사용자가 관찰할 결과와 지켜야 할 계약을 기준으로 판단한다.
  입력 객체 재사용과 변환 결과의 기대값 계산을 구분한다. 참조 표기 변경·YAML 직렬화처럼 새로 만드는 결과는 기대 배열이나 문자열을 독립적으로 명시한다.
  입력 보존을 검증할 때는 함수가 바꿀 수 있는 동일 객체를 실행 후 기대값으로 삼지 않고 실행 전 복사본과 비교한다.
  목록의 전체 포함과 순서를 확인할 때는 입력 데이터에 대응하는 기대 항목을 독립적으로 정한다.
  실제 반환 목록을 정렬한 값과의 비교만으로 누락·중복까지 검증했다고 판단하지 않는다.
  검증할 처리가 빠졌을 때 결과가 달라지는 입력을 사용한다. 정렬은 순서를 섞은 입력으로 확인하고, 이미 정렬된 입력만으로 정렬 동작을 검증하지 않는다.
  같은 항목이 여러 경로로 묶일 때의 필터는 한 경로가 모든 조건을 만족하는 경우와 서로 다른 경로가 조건을 나누어 만족하는 경우를 구분한다.
  무효화·거부 조건이 여러 개이면 각 조건을 독립적으로 재현하며, 한 조건의 성공을 다른 조건의 검증으로 대신하지 않는다.
  위치 숫자는 대응하는 입력과 좌표 기준이 본문이나 가까운 주석에서 드러나야 한다.
  순서 검증은 기대 항목의 순서를 직접 확인하고, 위치 보존 검증은 명시한 입력 위치가 결과에 유지되는지 확인한다.
  원문에서 위치를 계산하는 책임과 계산된 위치를 전달·보존하는 책임을 구분해 각각의 소유 모듈에서 검증한다.

  ### 오류와 입력 보존

  오류 사례는 실패 여부와 코드뿐 아니라 해당 메시지·위치·경고 여부도 확인한다.
  위치를 제공하지 않는 오류는 위치 필드가 없다는 계약을 확인한다.
  쓰기 실패는 오류 응답과 함께 원본이 변경되지 않았는지 검증한다.
  입력 보존이 계약인 작업은 입력의 관련 값과 구조를 실행 전후로 비교한다.

  ## 실제 IO와 경합

  실제 파일 IO는 실행별 임시 파일로 확인하고 종료 시 정리한다.
  읽기·탐색 중 변경 같은 경합은 실제 처리의 시작과 완료 사이에 제어할 수 있는 동기화 지점을 두어 재현하고, 그 지점에 실제로 도달했는지도 확인한다. 고정 시간 대기로 변경 시점을 추측하지 않는다.
  동시 저장처럼 여러 작업이 겹치는 계약은 실제 쓰기 구간을 겹쳐 검증하며, 연속 호출만으로 경합을 검증했다고 보지 않는다. 프로세스 사이의 동작이 계약이면 실제 프로세스 경계를 사용한다.
  감시 이벤트의 횟수·순서·지연이 계약이 아니면 성공 기준으로 고정하지 않고 최종 관측·내용·진단·버전의 일치를 확인한다.
  자식 프로세스 테스트는 공용 테스트 스크립트를 쓰고, 준비 신호는 완성된 파일을 원자적으로 공개한 뒤 읽는다.
  무한 대기를 막는 테스트 시간 제한은 제품의 초기화 시간 제한과 구분한다.

  ## OS별 동작과 mock

  파일 읽기·경로·감시의 일반 동작은 실제 임시 파일과 현재 OS의 Node로 검사한다. 링크 동작은 Windows 정션처럼 그 OS에서 만들 수 있는 연결로 검사하고, 준비에 실패하면 성공으로 대신하지 않는다.
  여러 OS 형식의 경로 문자열을 다루는 계약은 path.win32·path.posix 입력으로 검사할 수 있지만, OS 전용 API의 동작은 그 OS에서 실행한다.
  오류 응답·링크 판정·경합·이벤트 순서·종료 지연처럼 제어가 필요한 조건만 mock으로 만든다. 공통 mock은 소유 패키지의 test-support에서 관리하고 사례마다 상태를 초기화하며, 로컬과 CI에서 mock 사용을 바꾸지 않는다.
  mock으로 판정을 검증한 테스트를 실제 OS 동작의 검증으로 보고하지 않는다.
  실패를 의도한 하위 명령은 실패 상태와 원본 보존을 상위 테스트에서 확인하고, 전체 실행의 통과·실패·스킵 개수로 최종 결과를 판단한다.

  ## 회귀와 중복 정리

  함수 동작이 달라지면 기능 테스트를 고쳐 바뀐 계약을 확인하고, 버그 재현은 독립된 회귀 테스트로 남긴다.
  여러 모듈이 연결된 검사도 해당 책임의 기능 테스트로 두고 하나의 계약을 확인한다. 실제 파싱부터 색인·참조 연결까지 검증해야 하면 그 결합 조건과 결과를 명시한다.
  MCP 도구의 계산·입력·오류 조합은 담당 코드 옆에서 검증하고, stdio 출력·종료·요청 연결은 실제 전송·프로세스 경계로 확인한다. 함수 반환값만으로 stdout이나 프로세스 종료까지 검증됐다고 보지 않는다.
  검증을 추가하거나 지우기 전에 기존 테스트가 같은 조건과 경계를 확인하는지 대조하고, 같은 입력 조합이나 전체 응답 fixture를 다시 만들지 않는다.
  테스트가 있다는 것과 실제로 실행해 통과했다는 것을 구분한다. 단순 재내보내기에는 형식적인 테스트를 요구하지 않는다.

  ## VS Code UI 테스트

  설치·활성화·언어 서버 연결은 설치된 VSIX의 API 응답으로 확인한다.
  제품 기능은 실제 편집기에 마우스를 올려 표시된 호버와 링크를 확인하고, 링크를 실제로 눌러 대상 문서·선택 위치·탭 상태를 관찰한다. API로 데이터를 조회하거나 명령을 직접 호출한 결과는 화면 표시·클릭의 검증을 대신하지 않는다.
  [[참조 링크]]의 단일·복수 후보, [[편집기 진단]], [[원문 열기]]의 대상·위치·탭 재사용·미저장 내용 보존을 대표 사례로 확인한다. 모든 입력 조합·좌표 계산·경합을 UI에서 반복하지 않는다.
  저장·외부 변경의 반영은 바뀐 내용을 화면에서 다시 조회해 확인한다.

  GitHub Actions의 Windows·macOS에서 workflow에 고정한 같은 VS Code 버전으로 실행하며, 검사 버전은 PR로 바꾼다. 이전 버전의 동작을 검증했다고 보고하지 않으며 지원 하한은 [[배포]]에서 관리한다.
  공식 VS Code 다운로드·실행 도구를 쓰고 job마다 사용자 프로필·확장·작업 공간을 격리한다.
  사례마다 바꾼 상태를 다음 사례 전에 복원하며 복원 실패는 테스트 실패로 처리한다.
  고정 시간 경과로 준비 완료를 판단하지 않고 제한 시간 안에 준비 상태와 기대 결과를 확인한다.
  환경 준비 실패·제품 검증 실패·정리 실패를 구분하고 전체 재시도로 실패를 숨기지 않는다. 실행 버전·실패 단계·로그·필요한 화면 증거를 남기며, 실행하지 않은 OS·버전은 통과로 보지 않는다.
