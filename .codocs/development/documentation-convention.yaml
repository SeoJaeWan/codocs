id: documentation-convention
name: '문서 컨벤션'
domains:
  - '개발'
definition: |
  프로젝트 설명의 표현 방식과 README와 프로젝트 문서의 역할을 정하는 규칙이다.

  ## 설명을 작성할 때

  [[문서]]에서 설명 범위와 참조의 역할을 확인하고, 독립적인 주제로 나눌지는 [[설명 분리]]의 권장 기준으로 검토한다.

  상태 코드만 적지 않고 발생 조건·원인·판단 근거와 예외를 설명한다.
  확인되지 않은 이유는 확정 사실로 기록하지 않는다.

  참조 문장에는 대상 문서에서 무엇을 확인할 수 있고 현재 설명에 왜 필요한지 드러낸다.
  무엇을 연결하는지 설명하지 않는 “다른 문서를 따른다” 같은 문장은 넣지 않는다.

  ## 문단과 간격

  같은 설명에 속하는 문장은 줄바꿈으로 이어서 작성한다.
  설명의 관점·조건·단계가 바뀔 때 빈 줄로 문단을 나눈다.
  제목·목록·표는 주변 문단과 구분하며 YAML 들여쓰기를 유지한다.
  문장마다 빈 줄을 넣거나 모든 빈 줄을 일괄 제거하지 않는다.
  출처 항목은 넣지 않는다.

  ## README와 사용자 안내

  - 루트 README는 전체 구조와 개발 방법을 안내한다.
  - 패키지 README는 책임·사용처와 다른 기능과의 연결을 설명한다.
  - docs/guide는 사용자 작성법을 안내한다.
  - examples는 실행 가능한 사용자 문서를 제공한다.

  공개 책임이나 사용처가 달라지면 관련 README를 갱신한다.
  기능별 README는 만들지 않는다.

  ## 합의와 구현의 구분

  기존 계약과 구현이 다르면 차이를 확인하고 수정 방향을 정한다.
  구현이 있다는 이유만으로 계약을 덮어쓰거나 합의됐다는 이유만으로 구현 완료로 표시하지 않는다.

  아직 구현되지 않은 계약은 담당 문서에 구현 경계를 함께 남긴다.
  상태 필드의 허용 값과 의미는 [[문서 형식]]에서 확인한다.
  갱신할 원문을 찾고 연결을 유지하는 작업은 [[지식 관리]]에서 설명한다.
