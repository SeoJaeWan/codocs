id: documentation-convention
name: '문서 컨벤션'
domains:
  - '개발'
definition: |
  이 저장소의 .codocs 문서를 작성·분리·갱신하는 기준과 원문을 찾아 고치는 흐름이다.
  문서·도메인·참조의 의미와 형식은 [[문서]], [[도메인]], [[참조]]에서 정의하고, 파일 배치는 [[폴더 컨벤션]]을 따른다.
  이 기준은 이 프로젝트의 관례이며 제품의 검증 대상이 아니다. 형식과 허용 값의 검사는 [[문서 검증]]에서 다룬다.

  ## 작성할 설명 정하기

  문서 이름이 가리키는 주제와 독자가 해결할 질문을 먼저 정하고 첫 설명에서 그 목적을 드러낸다.
  작업을 설명할 때는 무엇을 받아 어떤 판단을 하고 무엇을 반환하거나 변경하는지 밝힌다.
  예시도 그 질문에 대한 판단과 결과를 보여준다. 이름만 다르게 붙이고 본문은 같은 질문에 답하게 만들지 않는다.
  용어의 의미·동작·정책·조건·예외·판단 근거와 책임을 설명한다.
  상태 코드만 나열하지 않고 어떤 조건에서 발생하며 왜 그렇게 판단하는지 설명한다.
  확인되지 않은 이유는 확정 사실로 기록하지 않는다. 미합의 정책을 확정된 동작처럼 쓰거나 기록을 지워 확정된 것으로 만들지 않는다.
  출처 항목은 넣지 않는다.

  새 설명을 추가하기 전에 같은 주제를 담당하는 원문을 찾는다.
  기존 설명의 보완인지 독립적인 주제인지는 아래 '설명 분리'의 기준으로 판단한다.

  ## 기능의 담당 문서

  독립적인 책임과 계약을 가진 기능에는 담당 문서를 둔다.
  공개 함수·타입과 인접 테스트는 책임 경계를 찾는 근거로 사용하며, 함수나 폴더의 개수만큼 문서를 만들지는 않는다.
  내부 보조 기능은 독립적으로 설명하고 유지할 설계 결정이 있을 때만 별도 문서로 나눈다.
  기존 문서가 그 책임을 설명하면 보완하거나 재배치하고, 별도 소개 문서를 만들기 위해 같은 설명을 반복하지 않는다.

  담당 문서는 독자가 해결할 질문과 기능의 목적을 먼저 밝힌다.
  필요한 입력의 의미·전제, 판단 기준·결과, 실패·예외, 보존할 사항과 다른 기능에 넘기는 책임을 설명한다.
  모든 문서에 같은 제목을 강제하거나 함수별 매개변수·구현 분기를 그대로 옮기지는 않는다.
  본문은 기능·개념을 주어로 의미와 계약을 설명하며, 현재 함수나 타입이 어떻게 구현되어 있는지를 해설하지 않는다.
  create·update 같은 요청 종류, failed·unchanged·candidate 같은 결과 상태, codocs_list·codocs_get 같은 정식 도구 이름은 계약을 식별하는 용어이므로 필요한 곳에 정확히 표기한다.
  코드에서도 쓰인다는 이유만으로 이런 용어를 생략하지 않으며, 의미를 설명하기 위한 명칭과 구현을 가리키는 함수·타입명을 구분한다.
  예를 들어 문서 변경 계획의 후보 계산·검증과 실제 저장의 디스크 확인·파일 반영은 각각의 담당 문서에서 설명하고 경계를 연결한다.

  여러 기능이 사용한다는 이유만으로 공통 폴더로 옮기지 않고 의미를 소유하는 책임에 둔다.
  담당 위치는 [[폴더 컨벤션]]에서 확인한다.

  ## 용어와 사용처의 책임

  용어 문서는 의미·구조·고유한 성질을 설명한다.
  그 용어를 사용하는 조건·선택·처리는 해당 작업 문서가 용어를 참조하며 설명한다.
  용어가 등장한다는 이유로 사용처의 모든 판단을 용어 문서에 모으지 않는다.

  대상의 의미·구조·허용 조건은 그 계약을 담당하는 문서에서 정의한다.
  이를 검사하거나 사용하는 처리는 해당 계약을 참조하고, 적용 방법과 결과를 설명한다.

  값이나 결과를 받아 쓰는 문서는 사용할 정보와 그 목적을 밝히고, 생산자가 정의한 정보의 구조나 계산 규칙을 다시 정의하지 않는다.
  별도 담당 문서가 없고 현재 주제를 이해하는 데 필요한 동작이면 같은 문서에서 설명할 수 있다.
  이 구분을 위해 문서 타입이나 고정된 입력·처리·출력 제목을 추가할 필요는 없다.

  ## 설명의 원본과 참조

  하나의 정의·규칙·판단 기준은 담당 문서 한 곳에서 관리한다.
  다른 문서에서는 해당 설명이 필요한 상황과 관계를 적고 담당 문서를 참조한다.
  문장을 바꾸거나 일부만 요약해도 같은 조건·기준·예외를 다시 규정하면 중복 관리가 된다.
  같은 대상을 언급하더라도 각 문서가 소유하는 서로 다른 질문에 답하면 중복 정의가 아니다.
  중복을 제거할 때 현재 문서가 소유하는 조건·결과·예외까지 삭제하지 않는다.

  참조는 현재 설명에 필요한 관계와 목적이 드러나는 문장에 둔다.
  그 문장만으로 대상의 역할이 충분히 드러나면, 대상 문서의 세부 내용을 나열하거나 “해당 문서에서 확인한다”는 안내를 덧붙이지 않는다.
  추가 안내는 현재 문맥에서 필요한 조건이나 구분을 보충할 때 둔다.
  무엇을 연결하는지 설명하지 않는 “다른 문서를 따른다” 같은 문장만 남기지 않는다.
  연결이 있다는 사실만으로 모든 관련 문서를 확인한 것으로 간주하지 않고 판단에 필요한 원문을 읽는다.

  짧은 주제 안내와 현재 문맥에 적용하는 예시는 둘 수 있으나 별도의 판단 기준을 만들지 않는다.
  원문과 적용 사례를 구분하고 예시에서 사용한 조건을 일반 규칙으로 확대하지 않는다.
  절차 문서는 담당 규칙을 연결해 적용 순서와 후속 행동을 설명하며 각 규칙의 조건표를 다시 작성하지 않는다.

  ## 설명 분리

  분리 후보가 기존 문서가 답해야 하는 질문과 책임에 포함되는지 먼저 확인한다.
  해당 설명이 아직 없더라도 기존 책임에 포함되면 그 문서를 보완한다.
  함께 설명할 때 서로 다른 질문과 책임이 섞이는 경우 아래 기준으로 독립 문서를 검토한다.

  | 판단 기준 | 처리 |
  | --- | --- |
  | 다른 곳에서도 같은 설명이 필요하다 | 기존 담당 문서를 확인하고 없으면 독립 문서로 분리한다. |
  | 이름을 붙여 따로 찾아볼 만한 주제다 | 분리 후보로 검토하되 이름을 붙일 수 있다는 사실만으로 독립 문서를 만들지는 않는다. |
  | 다른 내용과 독립적으로 변경되는 규칙이다 | 별도 문서로 분리한다. |
  | 현재 설명을 이해하기 위해 먼저 알아야 하는 용어·개념·구분이 독자에게 자명하지 않고, 함께 설명하면 원래 질문의 흐름이 흐려진다 | 독립적인 용어·개념 문서로 분리하는 것을 검토한다. |
  | 현재 주제 안에서만 의미 있는 조건·예외다 | 현재 문서에 유지한다. |
  | 길지만 계속 같은 질문에 답하고 있다 | 우선 제목·문단으로 정리한다. |

  코드 식별자와 연결되거나 여러 문서에서 반복 사용되는 것은 분리의 필수 조건이 아니다.
  반복 사용은 분리를 뒷받침하는 추가 근거로 삼는다.
  일반 프로그래밍·라이브러리 용어라는 이유만으로 모두 별도 문서화하지 않는다.
  현재 프로젝트의 계약을 이해하는 데 별도의 의미·구분이 필요한지를 기준으로 판단한다.
  다른 이름을 언급하거나 여러 도메인에 속한다는 사실만으로 나누지 않는다.
  참조 횟수나 문장 길이만으로 자동 분리하지 않는다.

  용어 설명에서 사용처의 동작을 분리할 때는 위 '용어와 사용처의 책임'의 구분을 적용하고, 동작을 담당하는 문서에 조건·선택·결과를 함께 옮긴다.
  사용처가 있다는 이유만으로 모든 행동을 별도 문서로 만들지는 않는다.
  분리할 때는 정의·조건·예외와 이해에 필요한 맥락을 담당 문서로 옮겨 독립적으로 읽을 수 있게 한다.
  기존 위치에서는 옮긴 설명을 제거하고 해당 설명을 적용할 시점과 목적을 적어 연결한다.

  원래 질문에 답하는 흐름은 유지한다. 단순 링크 목록만 남겨 독자가 무엇을 판단해야 하는지 잃지 않게 한다.
  중복을 제거한 뒤 독립적으로 답할 질문이 남지 않는 문서는 기존 문서로 합치고 참조를 갱신한다.

  ## 도메인 나누기

  세부 기능 이름마다 도메인을 만들지 않는다.
  기존 영역의 문서로 먼저 설명하고 독립적인 책임과 정책 경계가 필요할 때 분리한다.
  다른 영역의 문서를 참조한다는 사실만으로 그 영역에도 소속시키지 않는다.
  패키지는 구현 책임을 나누는 단위이며 도메인과 반드시 일치하지 않는다.

  도메인마다 소개 문서를 두어 해당 영역의 책임과 관련 문서를 읽는 출발점으로 삼는다.
  소개 문서는 도메인 하위 문서 전체를 참조하고 각 문서가 답하는 질문을 짧게 안내한다.
  독자는 소개 문서를 출발점으로 필요한 설명을 찾고 문서 사이의 관계와 읽는 순서를 파악한다.
  개별 규칙을 소개 문서에 반복하지 않는다. 소개 문서도 [[문서]]와 같은 설명 단위이며 별도 타입이 아니다.

  ## 코드에서 담당 문서 찾기

  담당 문서를 작성할 때 해당 책임을 대표하거나 수행하는 주요 함수·타입과 관련 인접 테스트를 확인한다.
  코드 식별자에서 기능의 계약을 찾을 수 있도록 관계를 드러내며, 여러 함수·타입이 하나의 담당 문서를 공유할 수 있다.
  패키지의 .codocs 소개 문서에서 기능의 담당 문서를 연결한다.
  대표 함수·타입과 구현·인접 테스트의 위치는 문서 끝의 코드 안내에 모을 수 있다. 이 안내가 본문의 의미·계약 설명을 대신하지 않게 한다.
  모든 내부 함수의 목록이나 별도의 기능별 README를 만들지는 않는다.

  문서의 id·name·domains는 [[문서]]와 [[도메인]]의 의미에 맞게 정한다.
  문서 ID는 의미를 유지하면서 대표 코드 식별자와 자연스럽게 매칭되는 표현을 우선한다.
  예를 들어 YAML 파싱은 parseYaml에 대응하는 parse-yaml을 사용할 수 있다. 문서 이름과 본문은 개념·책임·계약 중심으로 유지한다.
  단어와 순서가 실제 매칭 규칙에 맞는지, 기존 ID와 충돌하지 않는지 확인한다.
  대표 식별자가 없는 정책·공통 개념은 의미에 맞는 ID를 사용한다. 매칭을 위해 문서의 주제를 바꾸거나 함수마다 문서를 만들지 않는다.
  하나의 ID가 모든 관련 함수와 연결된다고 가정하지 않으며, 문서의 책임 범위와 실제 식별자 매칭 범위를 구분한다.
  기존 ID를 바꿀 때는 [[이전 ID]]와 [[문서 변경 계획]]의 이전 ID 관리 기준을 적용한다.
  실제 식별자 연결 여부는 [[코드 식별자 매칭]]의 규칙으로 확인한다. 본문에 함수명을 적거나 폴더·도메인을 맞추는 것만으로 호버 연결이 생긴다고 간주하지 않는다.
  ID 매칭으로 표현할 수 없는 구현·테스트와 조항의 관계는 코드에 [[참조]]의 코드 참조로 연결하며, 작성 관례만으로 새 연결 필드나 동작을 부여하지 않는다.
  deprecatedAliases는 [[이전 ID]]의 용도로 유지하며 현재 관련 함수 이름을 등록하는 용도로 사용하지 않는다.

  ## 문단과 간격

  같은 설명에 속하는 문장은 줄바꿈으로 이어서 작성한다.
  설명의 관점·조건·단계가 바뀔 때 빈 줄로 문단을 나눈다.
  제목·목록·표는 주변 문단과 구분하며 YAML 들여쓰기를 유지한다.
  문장마다 빈 줄을 넣거나 모든 빈 줄을 일괄 제거하지 않는다.

  ## 원문을 찾아 고치는 흐름

  전체 지식을 매번 읽는 대신 작업에 필요한 계약을 찾고 그 원문에 근거해 판단한다.
  연결된 원문의 자동 확장이 모든 관련 지식의 발견을 보장하지는 않는다.

  1. [[조회]]의 목록과 [[프로젝트 지식 읽기 안내]]에서 필요한 원문을 찾는다. 코드에서 시작할 때는 패키지의 .codocs 소개 문서와 [[폴더 컨벤션]]의 책임별 배치를 함께 확인한다.
  2. 작성할 설명이 답할 질문과 담당 책임을 정하고 기존 담당 문서의 보완·재배치 또는 신규 작성을 판단한다.
  3. 이 문서의 기준에 맞춰 설명을 작성하고 [[참조]]로 필요한 원문을 연결한다. 대표 코드 식별자와 담당 문서의 관계를 확인한다.
  4. 문서용 이름 변경은 [[이름 변경 시 기존 참조의 의미 보존]], ID 변경은 [[이전 ID]]와 [[문서 변경 계획]]에서 연결 의미와 목록 변경을 확인한다.
  5. [[테스트 컨벤션]]으로 담당 계약을 구현·인접 테스트와 대조하고, 확인한 차이는 이슈·PR에 기록한다.
  6. [[문서 검증]]을 적용하고 ID·이름 충돌과 참조 연결을 확인한다. 루트 README에서 .codocs 소개 문서를 거쳐 재배치·분리한 문서에 도달할 수 있는지, 중복되거나 담당 원문 없이 남은 규칙이 없는지 확인한다.

  [[조회]]로 선택한 문서의 최신 원문과 연결을 읽는다. 형식과 작성법 안내가 필요하면 [[사용 가이드]]를 확인한다.
  수정 전 읽은 [[원문 버전]]을 기준으로 변경안을 만든다.
  MCP로 수정할 때는 [[문서 변경 계획]]의 revision·set/unset 계약으로 요청하고 [[저장]]의 파일 반영 절차를 적용한다.
  YAML을 직접 편집할 때도 같은 문서 형식과 참조 규칙을 검증한다.
  상호 참조를 처음 만들 때는 A를 참조 없이 생성하고, A를 참조하는 B를 만든 뒤 A에 B 참조를 추가할 수 있다.
  검증 오류가 있는 문서는 [[검증 오류가 있는 문서를 조회하고 수정하는 절차]]로 고친다.

  ## 의미 변경과 갱신

  설명하는 의미·동작·정책이 바뀌면 담당 원문에 합의한 조건·근거·예외를 반영하고 사용자 안내에 영향이 있는지 확인한다.
  개발 진행만 바뀌면 문서를 수정하지 않는다.
  구현 예정·진행·완료 여부, 담당 작업과 PR·이슈 배정은 이슈와 PR에서 관리하며 이를 담는 별도 지식 문서도 만들지 않는다.
  구현이 계약과 다르면 수정할 작업을 이슈·PR에 기록한다. 현재 구현에 맞추기 위해 합의된 계약을 자동으로 변경하지 않는다.
  내용의 합의·적용 상태를 표현할 때는 [[문서]]의 status 의미를 사용한다.

  변경한 문서의 도입부와 예시가 어떤 질문에 답하는지 확인한다.
  작업을 수행하는 문서에서 입력·판단·결과가 드러나는지, 결과를 소비하는 문서가 생산자의 규칙을 다시 정의하는지 확인한다.
  담당 문서와 대표 코드·인접 테스트를 함께 찾아갈 수 있는지 확인한다.
  원문을 변경한 뒤 참조하는 문서의 맥락과 적용 사례가 여전히 맞는지 확인한다.
  규칙 하나를 바꾸기 위해 여러 문서의 같은 설명을 함께 고쳐야 한다면 중복 관리 여부를 검토한다.
  문서를 나누거나 합친 뒤에는 남은 중복 설명, 끊어진 참조와 담당 문서 없이 남은 규칙을 확인한다.

  ## 루트 README와 내부 문서의 역할

  루트 README는 제품의 목적·사용 시작과 사용자 가이드·예시·개발 진입점을 안내한다.
  패키지별 .codocs 소개 문서로 연결하여 필요한 책임과 계약을 찾게 한다.
  실행 가능한 기능과 사용 제한을 정확히 안내하며 세부 계약이나 작업별 변경·시험 보고를 누적하지 않는다.
  실제 서버가 제공하는 MCP 도구 목록과 각 역할을 안내하고, 도구 등록이 바뀌면 목록도 함께 갱신한다.
  공개 루트 README는 영어를 기본으로 하고 한국어 README를 별도로 제공해 서로 연결한다. npm·Marketplace의 공개 소개도 영어를 기본으로 한다.
  두 언어의 설치·설정·지원 범위·제한 안내는 같은 배포 계약을 설명해야 하며, 한 언어의 안내만 오래된 상태로 남기지 않는다.
  내부 패키지와 기능에는 별도 README를 두지 않는다.

  .codocs는 프로젝트의 용어·동작·정책과 판단 근거를 관리한다.
  이 저장소의 내부 .codocs는 한국어로 유지한다. 이는 프로젝트 운영 언어이며, 제품이 사용자의 문서 언어를 제한하는 규칙은 아니다.
  현재 계약의 기준 원문은 로컬 .codocs다. Wiki는 현재 계약을 소유하지 않으며 과거 Wiki revision은 당시 결정과 계획을 확인하는 참고 근거로만 사용한다.
  패키지의 .codocs 소개 문서는 책임·경계와 기능별 담당 문서를 안내하고, 기능의 상세 계약과 판단 근거는 담당 문서에서 관리한다.

  JSDoc과 타입은 개별 함수·타입의 구체적인 입력·출력과 사용법을 설명하고, 구현은 그 동작을 수행한다.
  구체적인 입력·출력과 분기는 인접 테스트에서 검증하며 테스트의 구현을 문서에 복제하지 않는다.
  examples는 실행 가능한 가상 사용자 문서를 제공한다. 가이드 예시와 함께 형식·연결·실제 동작을 확인한다.

  ## 사용자 가이드

  docs/guide/README.md는 Codocs 사용자가 내부 .codocs의 구조나 관리 절차를 몰라도 작성법을 이해하고 적용할 수 있도록 설명한다.
  필요한 개념을 사용 흐름 안에서 풀어 설명하고 예시를 제공하며, 독자에 맞게 순서·문장·예시·상세도를 구성할 수 있다.
  공개 안내를 위한 재설명은 가능하지만 담당 원문과 다른 규칙이나 예외를 만들지 않는다.
  이 역할이 내부 문서끼리 같은 규칙을 중복 정의해도 된다는 뜻은 아니다.
  의미·조건·예외·예시가 같은 기준을 전달하는지 검토하며 문장 동일성을 검사하지 않는다.
  사용자에게 제공할 예시와 기능 안내의 정확성은 해당 구현·배포 검증에서 확인한다.
