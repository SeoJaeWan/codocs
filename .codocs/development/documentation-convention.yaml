id: documentation-convention
name: '문서 컨벤션'
domains:
  - '개발'
definition: |
  이 저장소의 문서 역할과 프로젝트에만 적용할 유지 규칙이다.
  일반 작성 원칙은 [[기본 작성 지침]], 파일 배치는 [[폴더 컨벤션]]에서 확인한다.

  ## 프로젝트 작성 규칙

  출처 항목은 넣지 않는다.
  이 규칙은 이 프로젝트의 관례이며 제품의 기본 작성 지침이나 사용자 가이드에 추가하지 않는다.

  ## README와 내부 문서의 역할

  루트 README는 제품의 목적·사용 시작과 사용자 가이드·예시·개발 진입점을 안내한다.
  패키지 README는 해당 패키지의 책임·공개 진입점·사용 방법을 설명한다.
  내부 폴더 운영 방식이나 이번 작업에서 무엇을 변경했는지는 사용자 안내에 넣지 않는다.
  기능별 README는 만들지 않는다.

  .codocs는 프로젝트의 용어·동작·정책과 판단 근거를 관리한다.
  README가 세부 조건표와 예외 목록을 별도로 관리하지 않게 하고, 개발 독자에게 필요한 계약은 담당 문서로 연결한다.
  구체적인 입력·출력과 분기는 인접 테스트에서 검증하며 테스트의 구현을 문서에 복제하지 않는다.

  ## 사용자 가이드와 기본 작성 지침

  docs/guide/README.md는 Codocs 사용자가 내부 .codocs의 구조나 관리 절차를 몰라도 작성법을 이해하고 적용할 수 있도록 설명한다.
  [[기본 작성 지침]]과 같은 개념과 원칙을 전달하되 독자에 맞게 순서·문장·예시·상세도를 다르게 구성할 수 있다.
  두 문서의 본문·제목·표를 동일하게 맞추거나 서로를 소개하도록 요구하지 않는다.

  기본 작성 지침은 일반 작성 원칙을 설명하고 세부 정의·조건·판단 기준은 담당 문서로 연결한다.
  사용자 가이드는 필요한 개념을 사용 흐름 안에서 풀어 설명하고 예시를 제공한다.
  공개 안내를 위한 재설명은 가능하지만 담당 원문과 다른 규칙이나 예외를 만들지 않는다.
  이 역할이 내부 문서끼리 같은 규칙을 중복 정의해도 된다는 뜻은 아니다.

  ## 변경 시 확인

  문서의 도입부와 예시가 어떤 질문에 답하는지 확인한다.
  [[기본 작성 지침]]의 용어·사용처 책임 구분으로 정의와 처리 규칙의 위치를 검토한다.
  작업을 수행하는 문서에서 입력·판단·결과가 드러나는지, 결과를 소비하는 문서가 생산자의 규칙을 다시 정의하는지 확인한다.

  개념이나 규칙이 바뀌면 담당 원문을 수정하고 사용자 안내에 영향이 있는지 확인한다.
  의미·조건·예외·예시가 같은 기준을 전달하는지 검토하며 문장 동일성을 검사하지 않는다.
  사용자 가이드의 문체나 순서만 바꾼 경우 기본 작성 지침을 기계적으로 다시 작성하지 않는다.

  examples는 실행 가능한 가상 사용자 문서를 제공한다. 가이드 예시와 함께 형식·연결·실제 동작을 확인한다.
  합의한 계약과 구현의 차이·개발 진행은 담당 이슈와 PR에서 추적한다.
  사용자에게 제공할 예시와 기능 안내의 정확성은 해당 구현·배포 검증에서 확인하며 README에 임시 작업 보고를 누적하지 않는다.
