id: documentation-convention
name: '문서 컨벤션'
domains:
  - '개발'
definition: |
  이 저장소의 .codocs 문서를 작성하고 고치는 규칙이다.
  문서·속성·참조가 무엇인지는 [[문서]]와 [[참조]]에서 정의하며, 이 문서는 그 개념을 이 프로젝트에서 어떻게 쓸지만 정한다.
  이 규칙은 이 프로젝트의 관례이며 제품의 검증 대상이 아니다. 형식과 허용 값의 검사는 [[문서 검증]]이 맡는다.

  ## .codocs 구성

  .codocs는 두 영역과 진입점으로 구성한다. 패키지별 폴더는 두지 않는다.

  - concepts(도메인 '제품 개념'): 사용자와 개발자가 함께 알아야 하는 제품 개념과 동작을 정의한다.
  - development(도메인 '개발'): 이 프로젝트의 개발 규칙을 담는다.
  - index.yaml: 두 영역을 안내하는 진입점이다.

  concepts는 주제별 폴더로 묶는다. 목차 문서는 주제의 출발점이 되는 문서만 참조하고 각 문서가 답하는 질문을 짧게 안내하며, 세부 문서는 그 상위 문서에서 참조한다.
  모든 문서는 index.yaml에서 참조를 따라 도달할 수 있어야 한다. 개별 규칙을 목차 문서에 반복하지 않는다.
  세부 기능마다 도메인을 만들지 않고, 다른 영역의 문서를 참조한다는 이유로 그 도메인에 소속시키지 않는다.

  ## 작성할 설명 정하기

  문서 이름이 가리키는 주제와 독자가 해결할 질문을 먼저 정하고 첫 설명에서 그 목적을 드러낸다.
  작업을 설명할 때는 무엇을 받아 어떤 판단을 하고 무엇을 돌려주거나 바꾸는지 밝힌다. 예시도 그 질문에 대한 판단과 결과를 보여준다.
  상태 값만 나열하지 않고 어떤 조건에서 생기며 왜 그렇게 판단하는지 설명한다.
  확인되지 않은 이유를 확정 사실로 쓰지 않고, 합의하지 않은 정책을 확정된 동작처럼 쓰지 않는다. 출처 항목은 넣지 않는다.
  새 설명을 쓰기 전에 같은 주제를 담당하는 문서를 찾는다. 기존 설명의 보완인지 독립된 주제인지는 아래 '설명 분리'로 판단한다.

  ## concepts 문서 작성

  concepts 문서는 개념이 무엇인지와 사용자가 보는 동작을 설명한다.
  함수·타입 이름, 내부 계산 단계, 좌표 체계나 해시 방식 같은 구현 설명은 쓰지 않고 사용자가 확인하는 결과로 풀어 쓴다.
  표기를 설명할 때는 처리 절차 대신 사용자가 쓰는 표기와 그 결과를 쓴다. 예를 들어 '첫 번째 escape되지 않은 콜론이 구분자다' 대신 '도메인은 이름 앞에 콜론으로 구분해 적는다'로 쓴다.
  지금의 동작만 쓰고 이전 동작과의 대비('id가 아닌 name')는 쓰지 않는다. 공개 전이라 가능한 규칙이며, 공개 뒤에 바뀌는 동작은 [[배포]]의 변경 기록으로 남긴다.
  요청 종류(create·update), 결과 상태, 응답 필드, 오류 코드, 도구 이름처럼 사용자가 직접 보는 값은 정확히 쓴다.
  문서에 코드 파일 링크나 '코드와 검증 위치' 같은 구현 안내를 두지 않는다. 구현과 테스트는 코드에서 문서를 가리킨다(아래 '코드 링크 관리').
  아직 구현되지 않은 기능은 문서에 넣지 않고 이슈로 관리하며, 구현할 때 문서를 추가한다.
  공개 함수·타입과 테스트는 책임의 경계를 찾는 근거로 쓰되, 함수나 폴더 수만큼 문서를 만들지 않는다.

  ## 용어와 사용처의 책임

  용어 문서는 의미·구조·고유한 성질을 설명하고, 그 용어를 쓰는 조건·선택·처리는 사용하는 쪽 문서가 용어를 참조하며 설명한다.
  용어가 등장한다는 이유로 사용처의 판단을 용어 문서에 모으지 않는다.
  대상의 의미·구조·허용 조건은 그 계약을 담당하는 문서에서 정의하고, 이를 검사하거나 쓰는 쪽은 그 계약을 참조해 적용 방법과 결과를 설명한다.
  결과를 받아 쓰는 문서는 쓸 정보와 목적만 밝히고, 결과를 만드는 문서가 정의한 구조나 계산 규칙을 다시 정의하지 않는다.
  별도 담당 문서가 없고 현재 주제를 이해하는 데 필요한 동작이면 같은 문서에서 설명할 수 있다.

  ## 설명의 원본과 참조

  하나의 정의·규칙·판단 기준은 담당 문서 한 곳에서 관리하고, 다른 문서는 그 설명이 필요한 상황과 관계를 적어 참조한다.
  문장을 바꾸거나 일부만 요약해도 같은 조건·기준·예외를 다시 규정하면 중복이다. 같은 대상을 언급하더라도 각 문서가 서로 다른 질문에 답하면 중복이 아니다.
  중복을 지울 때 현재 문서가 소유하는 조건·결과·예외까지 지우지 않는다.

  참조는 관계와 목적이 드러나는 문장 안에 둔다. 그 문장만으로 대상의 역할이 드러나면 대상의 세부 내용을 나열하거나 "해당 문서에서 확인한다"는 안내를 덧붙이지 않는다.
  무엇을 연결하는지 설명하지 않는 "다른 문서를 따른다" 같은 문장만 남기지 않는다.
  다른 문서와의 관계는 '다른 문서와의 관계' 같은 별도 절로 두지 않고, 필요하면 도입부에 한두 문장으로 쓴다.
  예시는 현재 문맥에 적용한 사례로 두고 별도의 판단 기준을 만들지 않으며, 예시의 조건을 일반 규칙으로 넓히지 않는다.

  ## 설명 분리

  나누려는 설명이 기존 문서가 답해야 할 질문과 책임에 속하면, 아직 쓰지 않았더라도 그 문서를 보완한다.
  함께 설명하면 서로 다른 질문과 책임이 섞일 때 아래 기준으로 독립 문서를 검토한다.

  - 다른 곳에서도 같은 설명이 필요하다: 기존 담당 문서를 확인하고 없으면 독립 문서로 나눈다.
  - 이름을 붙여 따로 찾아볼 만한 주제다: 나눌 후보로 검토하되 이름을 붙일 수 있다는 사실만으로 나누지는 않는다.
  - 다른 내용과 따로 바뀌는 규칙이다: 별도 문서로 나눈다.
  - 먼저 알아야 하는 용어·구분이 자명하지 않고 함께 설명하면 원래 흐름이 흐려진다: 독립 개념 문서로 나누는 것을 검토한다.
  - 현재 주제 안에서만 의미 있는 조건·예외다: 현재 문서에 둔다.
  - 길지만 계속 같은 질문에 답한다: 먼저 제목과 문단으로 정리한다.

  일반 프로그래밍·라이브러리 용어라는 이유만으로 문서를 만들지 않으며, 참조 횟수나 길이만으로 나누지 않는다.
  나눌 때는 정의·조건·예외와 이해에 필요한 맥락을 새 문서로 옮겨 따로 읽을 수 있게 하고, 원래 위치에서는 옮긴 설명을 지운 뒤 적용할 시점과 목적을 적어 참조한다.
  중복을 지운 뒤 따로 답할 질문이 남지 않는 문서는 기존 문서로 합치고 참조를 고친다.

  ## ID 정하기

  ID는 의미를 유지하면서 대표 코드 식별자와 자연스럽게 매칭되는 표현을 우선한다. 예를 들어 코드의 scanStatus와 연결할 문서는 scan-status로 짓는다.
  대표 식별자가 없는 정책·공통 개념은 의미에 맞는 ID를 쓰며, 매칭을 위해 문서 주제를 바꾸거나 함수마다 문서를 만들지 않는다.
  ID 형식과 매칭이 실제로 생기는 조건은 [[문서 속성]]과 [[식별자 참조]]에서 확인한다.
  deprecatedAliases는 이미 쓰이던 ID를 실제로 바꿨을 때만 남긴다. 문서를 합치거나 옮기면서 옛 ID를 모아 두거나 관련 함수 이름을 등록하는 용도로 쓰지 않는다.

  ## 코드 링크 관리

  구현과 테스트는 근거가 되는 문서를 [[코드 참조]]로 가리킨다. ID 매칭으로 드러나지 않는 조건·제약도 이 방식으로 연결한다.

  구현은 다음 단위로 연결한다.
  - 기능의 시작점 함수: 문서 전체(`@codocs \[[문서]]`)
  - 섹션의 조건들을 조합하는 함수: 섹션 제목 줄
  - 조건 하나를 구현한 함수: 그 조건 줄
  한 함수에 여러 조건이 섞여 있으면 동작을 바꾸지 않고 조건별 함수로 나눈다.
  별도 로직 없이 구조상 성립하는 조건은 구현을 연결하지 않고 테스트만 연결한다.
  테스트를 연결하는 기준은 [[테스트 컨벤션]]의 '명세와 테스트'를 따른다.

  링크는 여러 줄 JSDoc에 쓴다. 첫 줄에는 연결된 문서 줄의 말로 함수가 하는 일을 쓰고, 호출하는 쪽이 알아야 할 구현 제약이 있을 때만 다음 줄에 쓴다.
  `@codocs`는 설명 아래에 한 줄에 하나씩 둔다.
  테스트는 `it(` 바로 위의 JSDoc에 링크를 둔다. 테스트 이름이 검증 내용을 말하므로 설명은 덧붙일 사정이 있을 때만 쓴다.

  코드 참조는 행 번호로 연결되므로 문서를 고쳐 행이 밀리거나 내용이 바뀌면 그 문서를 가리키는 코드 링크도 함께 확인하고 고친다.
  문서를 옮기거나 이름·도메인을 바꾸면 도메인을 지정한 형식(`@codocs \[[도메인:이름]]`)을 포함해 코드 링크를 함께 찾아 고친다.

  ## 문단과 형식

  같은 설명에 속하는 문장은 줄바꿈으로 이어 쓰고, 관점·조건·단계가 바뀔 때 빈 줄로 문단을 나눈다.
  제목과 목록은 주변 문단과 구분하며 YAML 들여쓰기를 유지한다. 문장마다 빈 줄을 넣거나 모든 빈 줄을 일괄 제거하지 않는다.
  concepts 문서는 한 줄에 조건 하나를 쓴다. 한 문장에 조건이 여럿이면 줄을 나누고, 경우를 나열할 때는 상위 줄 아래 목록으로 쓴다. 이유나 요약 문장은 조건 줄과 따로 둔다.
  본문에는 Markdown 표를 쓰지 않고 목록으로 쓴다. 문서는 주로 에디터에서 YAML 원문으로 읽히므로 표가 정렬되지 않아 읽기 어렵다.

  ## 고치는 순서

  1. 필요한 문서를 찾는다. index.yaml과 목차 문서에서 시작하거나, 코드에서 시작할 때는 [[식별자 참조]]나 [[코드 참조]]로 연결된 문서를 찾는다.
  2. 쓸 설명이 답할 질문과 담당 책임을 정하고 기존 문서를 보완할지, 옮길지, 새로 쓸지 판단한다.
  3. 이 문서의 규칙에 맞춰 쓰고 필요한 문서를 [[참조]]로 연결한다. 이름을 바꾸면 그 이름을 가리키는 참조도 함께 고친다.
  4. [[테스트 컨벤션]]에 따라 명세와 구현·테스트를 대조하고, 확인한 차이는 이슈·PR에 기록한다.
  5. [[문서 검증]]과 프로젝트 전체 검사로 ID·이름 충돌과 참조를 확인하고, 옮기거나 나눈 문서에 index.yaml에서 도달할 수 있는지와 담당 문서 없이 남은 규칙이 없는지 확인한다.

  도구로 고치는 방법은 [[MCP 도구]]에서, 오류가 있는 문서를 고치는 방법은 [[진단]]에서 설명한다.

  ## 의미 변경과 갱신

  설명하는 의미·동작·정책이 바뀌면 담당 문서에 합의한 조건·근거·예외를 반영하고 사용자 안내에 영향이 있는지 확인한다.
  개발 진행만 바뀌면 문서를 고치지 않는다. 구현 예정·진행·완료 여부와 작업 배정은 이슈와 PR에서 관리한다.
  구현이 계약과 다르면 고칠 작업을 이슈·PR에 기록하며, 현재 구현에 맞추려고 합의한 계약을 바꾸지 않는다.
  문서를 고친 뒤에는 참조하는 문서의 맥락이 여전히 맞는지 확인한다. 규칙 하나를 바꾸려고 여러 문서를 함께 고쳐야 한다면 중복을 의심한다.
  나누거나 합친 뒤에는 남은 중복 설명, 끊어진 참조, 담당 문서 없이 남은 규칙을 확인한다.

  ## README와 내부 문서의 역할

  루트 README는 제품의 목적·사용 시작과 사용자 가이드·예시·개발 진입점을 안내한다. 실행 가능한 기능과 사용 제한을 정확히 안내하며 세부 계약이나 작업별 변경 기록을 쌓지 않는다.
  실제 서버가 제공하는 MCP 도구 목록과 역할을 안내하고, 도구가 바뀌면 목록도 함께 고친다.
  공개 README는 영어를 기본으로 하고 한국어 README를 따로 두어 서로 연결한다. npm·Marketplace의 공개 소개도 영어를 기본으로 하며, 두 언어의 설치·설정·지원 범위·제한 안내는 같은 내용을 유지한다.
  내부 패키지와 기능에는 별도 README를 두지 않는다.

  .codocs는 프로젝트의 개념·동작·정책과 판단 근거를 관리하며 현재 계약의 기준 원문이다. 이 저장소의 .codocs는 한국어로 쓴다. 이는 프로젝트 운영 언어이며 제품이 사용자의 문서 언어를 제한하는 것은 아니다.
  개념과 기능은 index.yaml과 [[제품 개념]] 목차에서 찾아갈 수 있게 하고, 상세 계약과 판단 근거는 각 담당 문서에서 관리한다.
  JSDoc과 타입은 개별 함수의 입력·출력과 사용법을 설명하고, 구체적인 입력·출력과 분기는 테스트에서 검증하며 테스트 내용을 문서에 복제하지 않는다.
  examples는 실행 가능한 가상 사용자 문서를 제공하며 가이드 예시와 함께 형식·연결·실제 동작을 확인한다.

  ## 사용자 가이드

  docs/guide/README.md는 Codocs 사용자가 내부 .codocs의 구조나 관리 절차를 몰라도 작성법을 이해하고 적용할 수 있도록 설명한다.
  필요한 개념을 사용 흐름 안에서 풀어 설명하고 예시를 제공하며, 독자에 맞게 순서·문장·예시·상세도를 구성할 수 있다.
  공개 안내를 위한 재설명은 가능하지만 담당 원문과 다른 규칙이나 예외를 만들지 않는다.
  이 역할이 내부 문서끼리 같은 규칙을 중복 정의해도 된다는 뜻은 아니다.
  의미·조건·예외·예시가 같은 기준을 전달하는지 검토하며 문장 동일성을 검사하지 않는다.
  사용자에게 제공할 예시와 기능 안내의 정확성은 해당 구현·배포 검증에서 확인한다.
