id: memory-update
name: '프로젝트 지식 갱신'
domains:
  - '개발'
kind: procedure
status: confirmed
definition: |
  memory update 요청으로 합의한 프로젝트 지식을 로컬 .codocs의 담당 원문에 반영하는 절차다.
  현재 프로젝트 지식은 .codocs에서만 관리하며 Wiki 조회·갱신이나 다른 저장소와의 동기화를 요구하지 않는다.

  ## 갱신 순서

  1. 사용자가 선택한 프로젝트와 변경 범위를 확인하고 현재 .codocs 원문과 작업 트리의 기존 변경을 읽는다.
  2. [[지식을 선택해서 읽고 변경하는 흐름]]으로 담당 원문을 선택해 합의한 내용을 반영한다. 이미 같은 의미이면 변경하지 않는다.
  3. 담당 원문을 저장·확인한 뒤 필요한 목차와 참조를 갱신한다. 이름을 바꾸면 [[이름 변경 시 기존 참조의 의미 보존]]을 적용한다.
  4. 프로젝트의 파서·검증기·색인으로 문서 형식, ID·이름 충돌, 참조 연결과 목차 도달성을 확인한다.
  5. 문서별 변경·변경 없음·미완료와 실제 로컬 경로, 검증 결과를 보고한다.

  기존 사용자 변경을 보존하고, 수정 직전 원문이 달라졌으면 최신 내용과 조정한다.
  저장 결과가 불확실하면 해당 원문에 의존하는 수정을 멈추고 현재 상태를 확인한다.
  일부 문서를 처리하지 못했다면 그 범위와 원인을 남기며 전체 갱신 완료로 보고하지 않는다.

  ## 작업 기록과의 구분

  분석·실행 계획·검증 결과와 PR별 작업 배정은 [[문서 컨벤션]]에 따라 작업 기록으로 관리한다.
  사용자가 요청한 Gateway MCP Artifact 저장은 작업 결과를 보관하는 별도 동작이며, 프로젝트 지식을 Wiki에 복제하거나 .codocs 갱신을 대신하는 절차가 아니다.
