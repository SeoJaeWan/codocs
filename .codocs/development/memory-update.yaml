id: memory-update
name: '메모리 동시 갱신'
domains:
  - '개발'
kind: procedure
status: confirmed
definition: |
  ## 갱신 순서

  이 프로젝트에서 memory update를 수행하면 변경한 지식에 대응하는 .codocs도 같은 작업에서 확인·갱신한다.
  [[문서]]의 설명 범위와 [[폴더 컨벤션]]의 배치 기준을 적용한다.

  1. 현재 Wiki와 대응하는 .codocs 원문, 작업 트리의 기존 변경을 읽는다.
  2. 각 저장소에서 내용을 소유할 문서를 찾고 같은 개념의 중복 문서를 만들지 않는다.
  3. 합의한 내용으로 Wiki를 갱신하고 저장 결과를 확인한다.
  4. 대응하는 문서와 필요한 목차·참조를 갱신한다. 이미 같으면 변경 없이 확인한다.
  5. 문서 형식·ID와 이름 충돌·참조 연결·목차 도달성을 검증한다.
  6. 양쪽의 반영 또는 변경 없음, 남은 불일치와 검증 결과를 각각 보고한다.

  인증·저장 충돌·접근 문제로 한쪽이 완료되지 않으면 남은 작업을 명시하고 양쪽 완료를 주장하지 않는다.
  기존 사용자 변경을 보존하고 오래된 규칙으로 최신 합의를 덮어쓰지 않는다.

  사용자가 특정 저장소만 수정하도록 범위를 제한하면 그 지시를 따른다.
  이 규칙은 Codocs 프로젝트에 적용하며 전역 스킬이나 다른 프로젝트의 작업 범위를 바꾸지 않는다.

  ## 두 저장소의 역할

  Local Work Memory와 .codocs에 같은 지식을 보관할 수 있다.
  각 저장소의 문서 역할에 맞춰 반영하며 .codocs에는 [[문서 컨벤션]]에 따라 개발 진행 기록을 옮기지 않는다.

  함께 갱신하는 작업 절차이며 백그라운드 자동 동기화나 두 저장소의 원자적 갱신 기능은 아니다.
