_codocs:
  id: check-and-merge
  name: 검사와 병합
  parent:
    - 개발
개요: |
  커밋부터 main 병합까지 어떤 검사가 언제·어디서 실행되고 병합을 어떻게 막는지 정한다.
  각 테스트가 무엇을 검증하는지는 [[테스트 컨벤션]], 병합 뒤 Version PR과 게시는 [[배포]]에서 정한다.
커밋 검사: |
  커밋 훅은 lint-staged로 스테이징한 파일의 lint·서식을 처리한 뒤 pnpm typecheck와 pnpm test를 실행한다. lint-staged만으로 타입 검사와 테스트를 대신하지 않는다.
  부분 스테이징·추적하지 않는 파일·기존 작업을 보존하며 typecheck와 test는 현재 작업 트리에서 실행한다. 이를 Git 인덱스만 검증한 것으로 표현하지 않으며, 확정된 커밋의 전체 검증은 PR CI가 맡는다.
  UI 테스트와 배포 파일 검증은 커밋 훅에 넣지 않는다.
  커밋 훅이나 필수 검사가 실패하면 커밋·병합·푸시를 완료로 처리하지 않는다. HUSKY=0, --no-verify, hooksPath 변경 등으로 훅을 우회하거나 따로 통과한 검사로 실패한 훅을 대신하지 않고, 원인을 고친 뒤 같은 스테이징 내용으로 훅 전체를 통과시킨다.
PR 검사: |
  기능·수정 PR은 main을 대상으로 하며 별도 통합 브랜치를 두지 않는다. 출시 시점은 [[배포]]의 Version PR 병합으로 정하며 Version PR에도 같은 검사와 병합 기준을 적용한다.
  PR CI는 PR 열기·추가 push·다시 열기·리뷰 준비 전환에서 시작하며 수동 실행도 지원한다. 같은 PR에 추가 push하면 진행 중인 이전 실행을 취소하고 최신 변경을 검사한다. 리뷰 준비 PR의 추가 push와 Version PR 갱신도 검사하도록 추가 push에서도 시작한다.
  리뷰 준비 PR은 문서만 바꿨어도 변경 경로와 관계없이 같은 전체 CI를 실행한다. 제목·본문·라벨만 바뀌면 다시 실행하지 않는다.
  커밋 훅을 통과했다고 PR CI를 생략하지 않는다. 커밋 훅은 우회될 수 있고 스테이징 파일과 현재 OS만 검사하기 때문이다.

  검사는 다음처럼 나눠 실행한다.

  - Ubuntu: typecheck·lint·Prettier 검사를 단계별로 한 번 실행하고, 배포 파일(tgz·VSIX)을 한 번 조립해 다음 job에 넘긴다.
  - Windows·macOS: build·test, 배포 파일 검증, 넘겨받은 VSIX를 설치한 UI 테스트를 각각 실행한다. 경로·파일 교체·링크·프로세스처럼 OS마다 결과가 다른 계약이 있어 두 OS 모두에서 실행한다.

  Draft PR에서는 제품 검사 job을 실행하지 않아 러너를 쓰지 않는다. 필수 검사 required-ci만 짧게 실행해 실패로 끝낸다. main 병합을 받아 Draft Version PR을 갱신하는 Action의 작업도 제품 검사와 구분한다.
  GitHub Actions는 Draft 여부로 실행 생성을 막지 못하므로 Draft에서 생긴 실행도 만들어지지만, 제품 검사를 생략하고 required-ci를 실패로 끝낸다. 이 실행은 PR의 취소 범위에서 분리해 늦게 도착해도 진행 중인 리뷰 준비 실행을 취소하지 않는다. Draft에서 push한 변경은 이후 리뷰 준비 전환의 실행이 검사한다.
  취소 범위는 workflow와 PR 기준으로 나눠 다른 PR·배포·수동 실행에 영향을 주지 않는다.
main 병합 규칙: |
  main 변경은 PR로만 반영하며 Rulesets로 최신 main 반영과 required-ci 통과를 병합 조건으로 요구한다. 직접 push와 PR·필수 검사 우회는 관리자와 GitHub App에게도 허용하지 않으며 사람의 리뷰 승인 횟수는 필수 조건으로 두지 않는다. Rulesets가 없으면 필수 검사가 병합을 막지 못하므로 적용 여부를 실제로 확인한다.
  병합 방식은 PR 브랜치와 작업별 커밋 이력을 보존하는 merge commit만 허용한다.
  PR CI를 통과한 뒤 main이 바뀌면 PR을 업데이트하고 같은 CI를 다시 통과해야 한다.

  required-ci는 필요한 job의 실패·취소·예상 밖 생략을 통과로 처리하지 않는다. 조건으로 생략된 job은 필수 검사에서 성공으로 처리되고 같은 커밋의 실행이 여러 개면 가장 나중에 만든 실행의 결과로 병합 여부가 정해지기 때문에, Draft에서 생략하지 않고 실패로 끝낸다.
  Draft 이벤트의 실행이 리뷰 준비 실행보다 늦게 만들어지면 리뷰 준비 실행이 성공했어도 병합이 막힌다. 이때는 리뷰 준비 전환을 다시 하거나 새 커밋을 push해 다시 검사하며, 임의의 수동 실행은 필수 검사를 대신하지 않는다.
  main 병합 뒤에는 PR CI를 다시 실행하지 않는다. 최신 main 반영을 병합 조건으로 요구하므로 병합 결과가 PR에서 검사한 내용과 같기 때문이다. main push에서는 [[배포]]의 Version PR 갱신과 게시만 실행한다.
CI 흐름과 결과 보고: |
  CI와 배포의 실행 시점·job 의존·산출물 전달·병합 차단·결과 표시는 GitHub Actions·Rulesets·공식 Changesets Action의 기능으로 처리한다. 자체 스크립트는 빌드·패키징·배포 파일 검증처럼 제품에 대한 작업만 맡는다.
  GitHub API로 실행·job·artifact·check·브랜치 보호를 조회해 공식 기능의 판단을 다시 만드는 도구를 두지 않고, 공식 기능이 보장하는 동작을 스크립트나 mock 테스트로 다시 검사하지 않는다.
  required-ci는 다른 job의 결과를 needs로 모으는 workflow job이며, UI 테스트의 성공은 실행기의 결과로 판단한다. 여러 job의 Node·pnpm 설정과 의존성 설치는 저장소의 composite action으로 공유한다.

  성공한 실행의 결과는 PR의 검사 목록과 Actions 실행에서 확인하며 PR 댓글을 남기지 않는다. 실패하면 같은 workflow의 마지막 job이 실패한 job·단계와 실행 링크를 PR 댓글 하나로 남기고, 이후 실행이 성공하면 그 댓글을 해결됨으로 고친다. 취소되거나 늦게 끝난 이전 실행이 최신 결과를 덮어쓰지 않게 한다.
  성공한 실행의 상세 진단 파일은 따로 올리지 않으며 실패한 실행은 원인 분석에 필요한 최소 자료만 보관한다.
  JavaScript Action은 지원되는 Node 24 실행 기반을 쓰고 검증한 commit revision으로 고정한다. 로컬 테스트 통과를 실제 Rulesets 적용의 근거로 쓰지 않는다.
