id: release
name: '배포'
domains:
  - '개발'
definition: |
  사용자가 실행할 패키지를 제공하고 지원 환경에서 동작을 검증하는 영역이다.
  배포 파일의 구성·실행 가능성과 지원 환경에서 확인한 기능 범위를 명시한다.

  ## 판단 기준

  [[개발 환경]]의 빌드와 [[테스트 컨벤션]]의 코드 옆 검증을 바탕으로 최종 MCP·VSIX의 구성·설치·시작과 실제 VS Code UI 동작을 확인한다.
  실행한 환경·버전·검사 범위를 남기고 다른 플랫폼이나 이전 버전까지 일반화하지 않는다.

  ## 공개 배포와 게시 주체

  공개 소스와 배포 패키지에는 MIT 라이선스를 적용한다. 저장소 루트 LICENSE와 배포 메타데이터·산출물의 라이선스 표기를 일치시킨다.
  첫 공개 배포 버전은 0.0.1이다. 초기 실험 버전이며 호환성 검토 범위와 알려진 제한을 공개 안내에 명시한다. 낮은 버전 번호가 설치·핵심 기능 검증을 면제하지 않는다.

  [[제품]]의 co-documentation MCP 패키지는 npm으로, Codocs VS Code 확장은 Marketplace로 각각 배포한다.
  사용자는 필요한 연동만 설치하거나 둘 다 사용할 수 있다. 독립 MCP의 Node 24.x와 VS Code 내장 런타임 사용 기준은 [[개발 환경]]을 따른다.
  npm 게시 계정과 Marketplace publisher ID는 모두 seojaewan이며, VS Code 확장 식별자는 seojaewan.codocs다.
  이름·계정의 결정과 실제 게시 권한 확인은 구분한다. npm 패키지 이름의 사용 가능 여부와 두 게시처의 권한·설정을 공개 게시 전에 확인한다.

  배포 준비는 재현 가능한 패키징·설치 검증·게시 메타데이터와 릴리스 안내를 포함한다.
  Version PR이 main에 병합되면 npm·Marketplace 각 대상 중 아직 게시되지 않은 manifest 버전만 하나의 자동 배포 흐름에서 게시한다. 기능 PR이 main에 병합된 것만으로 게시하지 않는다. Version PR 병합을 출시 승인으로 보며 별도 수동 게시 지시나 추가 승인 단계를 두지 않는다.

  ## 흐름 제어와 자체 도구의 경계

  CI·배포의 실행 시점·job 의존·산출물 전달·병합 차단·결과 표시는 GitHub Actions·Rulesets·공식 Changesets Action의 기능으로 처리한다. 자체 스크립트는 빌드·패키징·배포 파일 검증처럼 제품에 대한 작업만 담당하며, 도구가 이미 제공하는 기능으로 충분한 게시 같은 단계는 workflow step에서 그 도구를 직접 사용한다.
  GitHub API로 workflow 실행·job·artifact·check·브랜치 보호를 조회해 공식 기능의 판단을 다시 구성하는 자체 도구를 두지 않는다. 공식 기능이 보장하는 동작을 스크립트나 mock 테스트로 다시 검사하지 않으며, workflow·job 표시 이름을 스크립트에 복제하지 않는다.

  ## 변경 기록 누적과 Version PR

  배포에 반영할 기능·수정 PR은 해당 코드와 함께 개별 Changesets 파일을 main에 반영한다. 각 기록은 npm·확장 중 영향받는 대상, patch·minor·major 변경 수준과 설명을 담으며 확정된 다음 버전 번호를 적는 용도가 아니다.
  작업별 기록을 독립 파일로 누적하고 기능 PR 병합마다 실제 버전을 올리지 않는다. 배포가 필요하지 않은 변경에 제품 버전 증가를 요구하지 않으며, 배포 파일을 바꾸지 않는 CI·개발 도구 변경에는 Changesets를 추가하지 않는다.
  Changesets 본문은 제품별 CHANGELOG와 GitHub Release 본문에 그대로 실려 사용자에게 보이므로 영어 문단, 빈 줄, 같은 내용의 한국어 문단 순서로 쓴다. 두 언어의 내용이 어긋나지 않게 하며 한 언어로만 쓴 기록을 남기지 않는다.

  변경 기록 작성은 pnpm changeset을 사용한다. 버전 계산·changelog·기록 소비에는 고정한 공식 Changesets CLI를, Version PR의 생성·갱신에는 공식 Changesets version Action을 사용한다. 자체 버전 계산기나 PR 관리자를 두지 않는다.
  Action은 main에 쌓인 미출시 Changesets를 취합하여 릴리스 브랜치에서 버전·changelog를 갱신하고 소비한 기록을 정리한 뒤, main을 대상으로 Draft Version PR 하나를 생성한다. main에 기능이 추가로 병합되면 같은 PR을 갱신한다.
  매 갱신은 기준 소스의 미출시 기록 전체로 계산한다. 이전에 Action이 생성한 다음 버전을 다시 증가시키지 않으며, 같은 제품의 여러 patch 기록은 한 번의 patch 릴리스로 모은다. 더 높은 변경 수준이 포함되면 그 수준을 반영한다.
  준비 중인 버전과 changelog 변경은 릴리스 브랜치에만 존재하며 Action은 main에 직접 쓰지 않는다.

  Version PR은 GitHub App 토큰으로 생성·갱신하여 그 PR의 CI가 실제로 시작되게 한다. 기본 GITHUB_TOKEN으로 만든 PR에서는 workflow가 시작되지 않는다. App 토큰은 App의 Client ID와 private key로 발급한다. App은 PR만 만들고 main에 직접 쓰거나 병합 조건을 우회하지 않는다.
  Action이 Version PR을 만들거나 갱신한 사실은 출시 승인이 아니다. Draft Version PR에서는 제품 검사를 실행하지 않으며 required-ci는 [[개발 환경]]에 따라 실패로 표시된다. 출시할 작업이 준비되면 Version PR을 리뷰 준비로 전환하여 포함 작업·제품별 버전·changelog를 확인하고, [[개발 환경]]의 기능 PR과 같은 전체 CI와 병합 조건을 적용한다.
  리뷰 준비 후 main이 바뀌어 Action이 같은 PR을 갱신하면 최신 내용으로 다시 검사한다. 공식 Action의 갱신을 막거나 자동으로 Draft로 되돌리지 않는다.

  ## 버전 변경과 자동 게시

  npm 패키지와 VS Code 확장의 버전은 독립적으로 관리한다. 각 대상의 manifest 버전이 해당 게시처에 아직 없으면 게시하고 이미 있으면 건너뛴다. 두 제품의 버전 일치는 요구하지 않는다.
  배포할 버전은 Version PR의 CI 전에 확정하고 공통 코드 변경의 배포 대상도 Changesets에 명시한다. 코드 경로만으로 배포 대상이나 변경 수준을 결정하지 않는다.

  Version PR 병합으로 main이 바뀌면 배포 workflow가 main 소스로 배포 파일을 다시 만들고 pnpm release:verify로 방금 만든 파일을 확인한 뒤 게시한다. 파일 검증에 실패하면 게시하지 않는다.
  같은 소스가 Version PR의 전체 CI에서 Windows·macOS 검사를 통과했으므로 배포 시 OS별 테스트와 UI 검사를 반복하지 않는다. PR 실행에서 만든 파일을 추적해 게시하거나 소스·실행·파일 해시의 연결 기록을 배포용으로 보관하지 않는다.
  게시는 별도 스크립트 없이 배포 workflow의 step에서 도구 기능으로 처리한다. npm은 npm view로 해당 버전의 게시 여부를 확인한 뒤 없을 때만 npm publish하고, Marketplace는 vsce publish --skip-duplicate로 이미 있는 버전을 건너뛴다. 게시 단계는 package.json 스크립트로 두지 않아 로컬의 실수 게시를 막고, 게시 토큰은 배포 job에만 제공한다.
  배포 workflow는 main push에서만 실행하며 수동 실행을 두지 않는다. 실제 게시는 Version PR 병합으로 바뀐 main push에서만 일어나고, 게시 대상 계획은 매 실행의 로그와 요약에 남긴다.

  게시에 성공한 대상마다 co-documentation@버전, codocs@버전 형식의 제품별 태그와 GitHub Release를 gh release로 만들고, 이미 있으면 건너뛴다. Release 본문에는 해당 제품 CHANGELOG의 그 버전 항목과 설치 안내 한 줄(npm 설치 명령 또는 Marketplace 링크)을 넣는다. Release에는 해당 제품의 배포 파일과 SHA-256만 첨부하고 CI 내부 기록 파일은 첨부하지 않는다.
  대상별 게시 결과를 구분한다. 일부 대상만 실패하면 Actions의 실패 job 재실행으로 재시도하며, 이미 게시된 버전과 이미 있는 태그·Release를 건너뛰므로 성공한 대상을 중복 게시하지 않는다. 게시 결과는 Actions 실행과 알림, 태그·Release로 확인하며 별도 PR 댓글을 두지 않는다.

  ## 배포 계약

  최종 MCP tarball과 VSIX의 manifest·실행 진입점·필수 자산·번들 구성을 확인한다. 빌드 성공과 파일 목록 확인만으로 설치·시작·연결까지 성공했다고 판단하지 않는다.
  MCP는 저장소 밖에 설치하여 서버 시작·SDK 연결·listTools 응답의 도구 등록을 확인한다. 도구별 결과·stdout·EOF·종료·쓰기·감시의 세부 계약은 코드 옆 테스트에서 확인하며 설치 검사에서 반복하지 않는다.
  VSIX는 설치 후 확장 활성화·언어 서버 연결을 API 응답으로 확인하고, 별도 UI 기능 검사에서 실제 Hover와 링크 클릭·편집 결과를 확인한다. 설치 확인에 첫 Hover 시나리오를 중복하지 않는다.

  현재 로컬 디스크 지원·검증 대상은 Windows·macOS로 한정하고, 검증된 OS·CPU·런타임부터 명시한다.
  Linux는 현재 구현 고려 대상과 지원 검증 범위에 포함하지 않는다. CI의 정적 검사와 배포 workflow가 Ubuntu에서 실행되는 것은 Linux 지원 검증이 아니다.
  WSL·컨테이너·SSH는 별도 시험이며 네트워크 공유 폴더는 초기 보장 밖이다.

  배포는 같은 소스의 Windows·macOS 검증이 모두 통과한 뒤 진행한다. 한 OS만 통과한 소스를 두 OS 지원 배포물로 공개하지 않는다.
  [[개발 환경]]의 공통·OS별 검사 배치에 따라 실제 VSIX 설치·기능·종료 및 정리까지 확인한다.
  기능 CI는 한 job에서 공개 tgz·VSIX를 한 번 조립하여 artifact로 전달하고, 양 OS job은 같은 파일로 설치 확인과 UI 검사를 수행한다. 파일 전달의 무결성은 artifact 전달 기능에 맡기며 소스 blob 목록·해시·실행 식별자를 자체 도구로 대조하지 않는다. OS별로 다시 만든 파일로 다른 OS의 검사를 대신하지 않는다.
  CI의 테스트·실행 도구 실패와 실제 제품 실패를 구분해 원인을 해결하고 영향받은 검사를 다시 실행한다. 실행 환경 준비 실패나 미실행·취소 결과는 통과 근거가 아니다.
  macOS 검증에서 드러나는 문제의 조사·수정·재검증도 배포 준비에 포함한다. CI 실행 성공만으로 실제 Mac에서의 제품 동작을 검증했다고 판단하지 않는다.

  VS Code manifest의 지원 하한과 CI 검사 버전을 구분한다. 기존 engines.vscode 하한 1.100.0은 CI 검사 버전 변경만으로 올리지 않는다. API·번들 의존성·내장 런타임 요구가 달라질 때 근거를 확인하여 조정한다. 고정한 검사 버전의 양 OS 결과만으로 이전 모든 버전의 검증을 주장하지 않는다.
  npm·Marketplace 게시에는 이름 사용 가능 여부와 게시 설정을 확인한다.

  ## 저장소 운영 설정과 검증 경계

  자동 배포에 필요한 저장소 설정은 소스 구현과 별도로 적용하고 실제 동작으로 확인한다.

  1. main에 Rulesets로 PR 의무·required-ci 통과·최신 main 반영을 요구하고 허용 병합 방식은 merge commit만 둔다. 관리자와 App을 포함한 우회를 허용하지 않는다. 세부 병합 조건은 [[개발 환경]]을 따른다.
  2. GitHub App의 Client ID(CODOCS_RELEASE_APP_CLIENT_ID)와 CODOCS_RELEASE_APP_PRIVATE_KEY를 준비하고, App이 만든 Version PR에서 리뷰 준비 전환과 추가 갱신의 CI가 실제로 시작되는지 확인한다.
  3. 배포 job에 CODOCS_NPM_TOKEN·CODOCS_MARKETPLACE_TOKEN을 연결하고 각 제품의 실제 권한·이름을 확인한다.
  4. 태그 Rulesets로 co-documentation@*·codocs@*·v* 태그의 수정과 삭제를 막는다. 배포 job이 태그를 만들 수 있도록 생성은 허용한다.

  배포 workflow는 main에서만 실행되므로 게시 경로 자체는 병합 전에 실행할 수 없다. 병합 전에는 Version PR의 전체 CI로 확인하고, 실제 게시 결과는 병합 후 Actions 실행·태그·Release로 확인한다.
  로컬 테스트는 실제 GitHub 이벤트·Rulesets 적용·App 권한·공개 게시 또는 Windows 실행의 성공을 대신하지 않는다. macOS의 실제 설치·기능·종료 결과도 실행한 OS와 정확한 버전에 한해 기록한다.

  ## 검증 의존 관계

  공통 계산·IO·프로토콜의 코드 옆 검증을 바탕으로 최종 패키지의 최소 실행 확인과 IDE UI 검사를 수행한다.
  SDK·watcher 설정·응답 한계·OS 파일 연산은 실제 지원 환경에서 검증한다.
  지원 환경 검증에는 [[실행 구조]]의 프로세스 경계와 [[쓰기 조정]]의 실패 조건을 포함한다.

  ## 지원 환경과 회귀 검증

  workflow에 고정한 VS Code 버전에서 같은 실제 VSIX를 Windows·macOS 모두 시험한다.
  의존성이 더 높은 런타임을 요구하면 검증 근거에 따라 하한을 조정한다.

  공백·한글 경로와 OS별 줄바꿈, 파일 생성의 비덮어쓰기·권한·교체·동기화를 확인한다.
  언어 독립 입력·기대 결과와 TypeScript 회귀 테스트를 보관한다.

  쓰기 검증·revision·변경 계획 계산에는 문서 형식·예시를 함께 대조한다.
  실제 VS Code UI 동작과 MCP의 설치·시작·도구 등록, 배포 자산의 완전성을 함께 확인한다.

  가이드와 예시는 실제 배포 패키지의 전체 파일 목록과 바이트를 원본과 비교한다. 프로젝트 소유 Markdown·YAML은 최종 staging에서 UTF-8 LF로 고정하고 검증도 원본의 동일한 LF 예상 바이트와 제품의 실제 바이트를 대조한다. 로고·그 밖의 바이너리·의존성 라이선스 원문은 바이트를 보존하며, 일부 예시의 고정 목록만 검사해 배포 검증을 대신하지 않는다.
  실제 VSIX에도 같은 자산과 상대 링크 대상이 포함되는지 확인한다. 예시의 참조·역참조 기대 관계는 실제 결과에서 역산하지 않는다.
  [[사용 가이드]]의 자산 경로·주제 읽기와 예시의 파서·스키마·참조 유효성은 담당 코드 옆에서 검증하고, 최종 패키지는 검증한 자산의 포함 여부와 바이트를 대조한다. 저장소 밖 설치 검사에서 모든 가이드·쓰기·복구 기능을 다시 호출하지 않는다.
  가이드가 안내하는 수정·선택 속성 삭제·상호 참조·[[저장 후 색인 갱신 실패를 복구하는 절차]]는 각각의 기능 테스트에서 실제 계약과 대조한다.

  구체적인 SDK 스키마·응답 한계·watcher 설정과 파일 연산은 구현·시험으로 정한다.
  확정한 기능 범위를 다시 미결정으로 돌리는 것은 아니다.

  ## 배포 파일 조립과 검증

  pnpm release:pack은 현재 소스를 빌드한 뒤 실행별 고유 staging에서 각 대상 manifest 버전의 co-documentation tarball과 seojaewan.codocs VSIX를 조립하고 고정된 출력 위치에 둔다. 출력 위치는 실행마다 비워 그 실행의 두 파일만 남기며 이전 실행의 파일을 보관하지 않는다. 파일명과 검증 기대값도 대상별 버전을 따른다. 내부 workspace 패키지는 비공개로 유지한다. 공개 MCP는 의존성을 포함한 ESM codocs bin이며 Node 24.x에서 실행하고 별도 공개 JS API를 약속하지 않는다.
  배포 목록은 실행 코드·가이드·예시·양언어 README·MIT LICENSE·원본 logo.png·번들 의존성 라이선스 원문으로 제한한다. 원본 로고를 변형하지 않으며 프롬프트·소스·테스트·개발용 map/선언 파일을 포함하지 않는다. npm README의 가이드·예시 상대 링크는 staging의 실제 dist 경로로 조정하고 Marketplace README는 저장소의 공개 원문 링크를 사용한다.
  자체 README·한국어 README·MIT LICENSE는 체크아웃 줄바꿈과 무관하게 UTF-8 LF로 패키징한다. 상대 링크는 배포 위치에 맞춰 한 번 변환하고 VSCE의 추가 링크·issue 변환을 끈다. 검증은 같은 규칙의 예상 바이트와 압축 파일을 정확히 비교하며 실제 산출물을 관대하게 정규화하지 않는다. 제3자 라이선스 원문과 PNG 바이트는 정규화 대상이 아니다.

  pnpm release:verify는 재빌드 없이 pnpm release:pack의 출력 파일 또는 명시한 tgz·VSIX를 검사한다. 저장소 밖 새 소비자에 tarball 하나를 offline 설치하여 codocs bin의 시작·SDK 연결·SDK listTools 응답의 도구 등록을 확인하고, VSIX의 manifest·진입점·자산을 확인한 뒤 시험 프로세스를 정리한다. 내부 패키지 overrides나 저장소 의존성으로 실행 누락을 보충하지 않는다.
  같은 배포 파일 검사를 다른 테스트 설정에서 반복하지 않는다. 빌드 결과의 구성 확인이 필요하면 pnpm release:verify의 책임으로 둔다.
  CI의 VS Code 기능 검사는 패키징 job이 만든 같은 VSIX를 실제 설치하며 시험 도중 다시 빌드하지 않는다. UI 검사 실행기는 대표 사례가 하나라도 실패하거나 정리에 실패하면 실패로 종료하며, CI는 그 결과로 성공 여부를 판단한다.
  비공개 내부 workspace 패키지의 개별 포장·설치·외부 JS 및 타입 선언 소비 검사는 두지 않는다. 성능 측정 기능과 전용 검사의 제거 범위는 [[테스트 컨벤션]]을 따른다.
