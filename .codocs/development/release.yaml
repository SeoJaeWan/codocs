id: release
name: '배포'
domains:
  - '개발'
definition: |
  사용자가 실행할 패키지를 제공하고 지원 환경에서 동작을 검증하는 영역이다.
  배포 가능성과 성능을 확인한 범위를 명시한다.

  ## 판단 기준

  [[개발 환경]]의 빌드와 [[테스트 컨벤션]]의 동작 검증을 통과한 뒤 실제 IDE·MCP 설치와 응답성도 확인한다.
  실행한 환경·데이터·측정 범위를 남기고 다른 플랫폼까지 일반화하지 않는다.

  ## 공개 배포와 게시 주체

  공개 소스와 배포 패키지에는 MIT 라이선스를 적용한다. 저장소 루트 LICENSE와 배포 메타데이터·산출물의 라이선스 표기를 일치시킨다.
  첫 공개 배포 버전은 0.0.1이다. 초기 실험 버전이며 성능·호환성의 추가 검토 범위와 알려진 제한을 공개 안내에 명시한다. 낮은 버전 번호가 설치·핵심 기능 검증을 면제하지 않는다.

  [[제품]]의 co-documentation MCP 패키지는 npm으로, Codocs VS Code 확장은 Marketplace로 각각 배포한다.
  사용자는 필요한 연동만 설치하거나 둘 다 사용할 수 있다. 독립 MCP의 Node 24.x와 VS Code 내장 런타임 사용 기준은 [[개발 환경]]을 따른다.
  npm 게시 계정과 Marketplace publisher ID는 모두 seojaewan이며, VS Code 확장 식별자는 seojaewan.codocs다.
  이름·계정의 결정과 실제 게시 권한 확인은 구분한다. npm 패키지 이름의 사용 가능 여부와 두 게시처의 권한·설정을 공개 게시 전에 확인한다.

  배포 준비는 재현 가능한 패키징·설치 검증·게시 메타데이터와 릴리스 안내를 포함한다.
  릴리스 PR의 main 병합 시 npm·Marketplace 각 대상의 manifest 버전 증가를 판정하여 변경된 대상만 하나의 자동 배포 흐름에서 게시한다. develop에 기능 PR이 병합된 것만으로 게시하지 않는다. 별도 수동 게시 지시나 전체 재검증을 정상 배포 절차에 요구하지 않는다.

  ## 변경 기록 누적과 릴리스 PR

  배포에 반영할 기능·수정 PR은 해당 코드와 함께 개별 Changesets 파일을 develop에 반영한다. 각 기록은 npm·확장 중 영향받는 대상, patch·minor·major 변경 수준과 설명을 담으며 확정된 다음 버전 번호를 적는 용도가 아니다.
  작업별 기록을 독립 파일로 누적하고 기능 PR 병합마다 실제 버전을 올리지 않는다. 배포가 필요하지 않은 변경에 제품 버전 증가를 요구하지 않는다.

  버전 계산·changelog·기록 소비에는 고정한 공식 Changesets CLI를 사용한다. 릴리스 브랜치와 단일 PR의 생성·갱신에는 공식 Changesets version Action의 script·pr-base-branch·pr-draft 기능을 우선 사용한다. 자체 버전 계산기나 PR 관리자를 추가하지 않으며, 프로젝트 연결 도구는 소스 최신성·보호·동기화·검증 후보의 소비 경계를 확인한다.

  봇은 develop에 쌓인 미출시 Changesets를 취합하여 임시 릴리스 브랜치에서 버전·changelog를 갱신하고 소비한 기록을 정리한다. main을 대상으로 Draft 릴리스 PR 하나를 생성하고 추가 작업이 반영되면 같은 PR을 갱신한다.
  매 갱신은 기준 소스의 미출시 기록 전체로 계산한다. 이전에 봇이 생성한 다음 버전을 다시 증가시키지 않으며, 같은 제품의 여러 patch 기록은 한 번의 patch 릴리스로 모은다. 더 높은 변경 수준이 포함되면 그 수준을 반영한다.
  준비 중인 버전과 changelog 변경은 릴리스 브랜치에만 존재한다. 봇의 준비 작업은 develop·main에 직접 쓰지 않으며 별도 버전 준비 PR을 develop에 먼저 병합하는 단계를 요구하지 않는다.

  봇이 릴리스 PR을 만들거나 갱신한 사실은 출시 승인이 아니다. 출시할 작업이 준비되면 릴리스 PR을 리뷰 준비로 전환하여 포함 작업·제품별 버전·changelog를 확인하고 [[개발 환경]]의 전체 CI와 병합 조건을 적용한다.
  최종 버전이 들어간 소스에서 배포 파일을 만들고 검사한다. 리뷰 준비 이후 코드·버전이 바뀌면 최신 결과로 다시 검사하며 이전 실행의 파일을 게시 근거로 사용하지 않는다.
  공식 Action은 리뷰 준비 후에도 같은 PR을 갱신한다. 갱신을 막거나 자동으로 Draft로 되돌리지 않는다. 최종 CI는 릴리스 head의 원래 부모가 현재 develop인지, main 결과가 develop에 동기화됐는지 확인하여 오래된 준비 결과를 거부한다.

  릴리스 PR을 main에 병합한 뒤 main의 버전·changelog·소비된 Changesets 결과를 PR로 develop에 동기화한다. 그 사이 develop에 추가된 다음 릴리스용 코드와 기록은 보존한다.
  봇은 동기화 전 develop에 남은 이미 소비된 기록으로 같은 릴리스를 다시 준비하지 않는다. 릴리스 반영·동기화와 다음 릴리스 준비의 순서를 조정하여 동일 기록의 재소비와 버전 중복 증가를 막는다.

  ## 버전 변경과 자동 게시

  npm 패키지와 VS Code 확장의 버전은 독립적으로 관리한다. 병합 전후 npm 버전만 증가하면 npm만, 확장 버전만 증가하면 Marketplace만, 둘 다 증가하면 두 곳 모두 게시한다. 두 버전이 모두 그대로면 게시하지 않는다.
  대상별 유효한 버전 증가와 기존 게시 버전의 충돌을 확인하며 두 제품의 버전 일치는 요구하지 않는다. 배포할 버전은 릴리스 PR의 최종 CI 전에 확정하고 공통 코드 변경의 배포 대상도 Changesets에 명시한다. 코드 경로만으로 배포 대상이나 변경 수준을 결정하지 않는다.

  [[개발 환경]]의 병합 조건을 통과한 최종 릴리스 PR 실행에서 검증한 tgz·VSIX 중 필요한 파일을 그대로 게시한다. develop에 반영한 개별 기능 PR의 파일로 대신하지 않는다. 정상 배포를 위해 다시 빌드하거나 전체 테스트를 반복하지 않는다.
  실제 병합 소스와 최종 통과 실행, 후보의 파일 해시를 자동으로 연결한다. Squash·rebase로 commit 번호가 달라져도 같은 소스인지 확인하며, 다른 실행의 후보나 연결 근거가 없는 파일은 게시하지 않는다.
  검증 후보와 소스·해시·검증 실행 연결 정보는 배포를 위해 보관한다. 후보가 없거나 만료됐으면 임의 재빌드한 파일을 기존 검증 결과로 게시하지 않는다.

  대상별 게시 결과를 구분하고 일부만 실패하면 실패한 대상만 재시도한다. 이미 성공한 대상의 같은 버전을 중복 게시하지 않는다.
  재시도는 현재 main의 동일 릴리스와 보관된 최종 CI 후보를 사용한다. 공개된 정확한 버전의 파일 해시를 대조하여 기록 저장 중 중단에도 중복 게시를 막는다. 현재 main·최종 CI 실행이 이동하거나 후보가 만료·누락됐으면 재시도를 차단하고 원인을 확인한다.
  PR 결과 댓글에는 대상별 버전·성공·실패를 표시하며 버전이 바뀌지 않아 게시하지 않은 대상을 배포 성공으로 표시하지 않는다. 댓글 유지와 일반 검사 결과의 표시는 [[개발 환경]]을 따른다.

  ## 배포 계약

  개발 VSIX 설치와 별도 MCP 패키지를 시험한다.
  언어 서버 시작·빌드된 stdio 연결·기능·외부 파일 변화·원문 보존·충돌 차단·대기 취소를 확인한다.

  현재 로컬 디스크 지원·검증 대상은 Windows·macOS로 한정하고, 검증된 OS·CPU·런타임부터 명시한다.
  Linux는 현재 구현 고려 대상과 지원 검증 범위에 포함하지 않는다.
  WSL·컨테이너·SSH는 별도 시험이며 네트워크 공유 폴더는 초기 보장 밖이다.

  첫 공개 배포는 같은 최종 후보의 Windows·macOS 검증이 모두 통과한 뒤 진행한다. 한 OS만 통과한 후보를 두 OS 지원 배포물로 공개하지 않는다.
  [[개발 환경]]의 공통·OS별 검사 배치에 따라 실제 VSIX 설치·기능·종료 및 정리까지 확인하고, 소스·산출물 식별자와 실행 결과를 각각 연결한다.
  기능 CI는 한 작업에서 최신 stable을 정확한 버전으로 고정하고 공개 tgz·VSIX를 한 번 조립한다. 양 OS 작업은 동일 파일을 전달받아 소스 commit·전체 Git blob 목록·SHA-256을 확인한 뒤 최소 버전과 고정 최신 버전에서 검사한다. OS별 재빌드 파일을 같은 검증 후보로 취급하지 않으며 실행기 오류·준비 실패도 증거에 남긴다.
  CI의 테스트·실행 도구 실패와 실제 제품 실패를 구분해 원인을 해결하고 영향받은 검사를 다시 실행한다. 실행 환경 준비 실패나 미실행·취소 결과는 통과 근거가 아니다.
  macOS 검증에서 드러나는 문제의 조사·수정·재검증도 배포 준비에 포함한다. CI 실행 성공만으로 실제 Mac에서의 제품 동작을 검증했다고 판단하지 않는다.

  VS Code manifest와 로컬 Extension Host 검사 기준은 1.100.0이다. 번들 의존성 chokidar 5의 Node >=20.19 요구와 VS Code 1.100.0 내장 Node 20.19.0의 실제 실행을 근거로 한다. Windows의 공식 Extension Host 기능 검증과 VSIX 설치·macOS 지원 검증을 구분한다. 동일 후보의 Windows·macOS 기능·정리 결과를 각각 확인한 뒤 지원 검증 완료를 선언한다.
  npm·Marketplace 게시에는 이름 사용 가능 여부와 게시 설정을 확인한다.

  ## 운영 활성화와 검증 경계

  자동 준비·동기화·게시의 활성화는 소스 구현과 별도로 수행한다. 운영자는 아래 순서를 완료한 뒤 저장소의 CODOCS_RELEASE_ENABLED를 true로 설정한다. main의 병합 후 Tests 실행 제거는 [[개발 환경]]의 보호 적용 확인 이후 별도로 반영한다.

  1. develop을 생성하고 main·develop에 [[개발 환경]]의 strict required-ci·PR 의무·관리자 적용·우회 차단을 실제로 설정한다. 현재 연결 도구는 classic branch protection 응답을 확인하며 ruleset만 있는 설정은 통과로 인정하지 않는다.
  2. 저장소에 설치한 GitHub App의 contents·pull requests 권한과 PR을 통한 변경 경로를 확인하고 CODOCS_RELEASE_APP_ID·CODOCS_RELEASE_APP_PRIVATE_KEY를 준비한다. App 커밋에서도 ready·추가 push의 Tests가 실제 시작돼야 한다. 게시용 release environment에는 CODOCS_NPM_TOKEN·CODOCS_MARKETPLACE_TOKEN을 연결하고 각 제품의 실제 권한·이름을 확인한다.
  3. 실제 GitHub에서 Draft·ready·추가 수정·Draft 복귀·닫기·재개와 실행 취소 격리, 실패·취소·생략된 required-ci의 병합 차단을 확인한다. 동일 tgz·VSIX의 Windows·macOS 최소·고정 stable 설치·전체 기능·네 종류 종료 정리를 완료한다.
  4. 검증한 최종 릴리스 PR 파일이 실제 게시에서 재사용되는지, 한 제품 실패 시 성공한 제품을 보존하는지 확인한다. main→develop 동기화 중 새 코드·Changesets를 보존하고 다음 공식 계산에서 소비한 기록을 다시 사용하지 않는지도 확인한다.

  로컬 Git·REST·GraphQL fixture와 로컬 게시 adapter는 연결 계약을 확인하는 시험이다. 실제 GitHub 이벤트·보호·App 권한·공개 게시 또는 Windows 실행의 성공을 대신하지 않는다. macOS의 실제 설치·기능·종료 결과도 실행한 OS와 정확한 버전에 한해 기록한다.

  ## 연결 도구와 통합 검사의 진입점

  공식 CLI의 진입점은 pnpm changeset·pnpm release:version이다. tools/ci/release-flow.mjs와 인접 테스트는 공식 준비의 소스·활성화 guard를, release-sync.mjs와 인접 테스트는 신규 기록을 보존하는 동기화를, release-publish.mjs와 인접 테스트는 최종 CI archive 소비와 제품별 재시도를 확인한다.
  tools/ci/ci-release.integration.test.mjs는 공식 CLI로 최종 버전을 만든 독립 fixture의 실제 tgz·VSIX를 CI 입력 검증·집계·게시 adapter에 연결한다. 실제 official Action fixture의 ready 갱신·preflight·동기화·다음 릴리스도 결합한다. 기본 pnpm test에 포함되며 GUI는 CODOCS_VERIFY_GUI=1로 명시한 실행에서만 같은 후보의 최소·고정 stable 기능과 종료·정리를 수행한다.

  ## 성능 목표

  문서 1,000개에서 초기 준비 2초, Hover 및 MCP 목록·상세 처리의 95%가 100ms, 한 문서 저장 후 반영 500ms 이내를 초기 목표로 삼는다.
  [[코드 자동완성]]의 제공 범위 결정에 따라 자동완성은 현재 성능 판정 대상에서 제외한다.

  시간 목표와 실측값의 비교는 문서 1,000개에서만 참고 정보로 표시한다. 목표 초과만으로 측정이나 기능 검증을 실패 처리하지 않는다.
  100·5,000·10,000개와 긴 본문·많은 참조는 확장성과 병목을 관찰하는 비교 대상이며 같은 시간 목표를 합격 기준으로 적용하지 않는다.
  AI 추론 시간은 MCP 처리 측정에서 제외한다.
  목표는 실측 성과나 모든 장비 보장이 아니다.
  목표를 넘으면 실제 값과 후속 분석 과제를 기록한다. 성능 관찰에서는 제품 알고리즘 최적화나 시간 목표 충족을 완료 조건으로 삼지 않는다.
  측정 결과는 병목 분석과 구현 대안 검토의 근거로 사용한다.

  ## 코어 성능의 측정 경계

  초기 준비는 새 프로세스 실행 직전부터 최초 색인과 파일 감시 준비가 모두 끝날 때까지 측정한다.
  시험 문서 생성 시간은 제외하며 영속 색인 캐시 없이 실행한다. OS 파일 캐시는 강제로 비우지 않고 측정 당시 상태를 기록한다.

  조회는 공개 조회 API 호출부터 결과 반환까지 측정한다.
  목록 첫 페이지·필터 목록·커서 다음 페이지·복수 상세 조회는 서로 다른 유형으로 구분한다. 현재 코어 측정기는 복수 상세 조회만 구현했으며 나머지는 미측정으로 명시한다. 서로 다른 유형의 표본을 합치지 않는다.
  복수 상세 조회는 1·10·20개 요청을 각각 독립 유형으로 측정한다. 21개 이상은 입력 상한 회귀 검사이며 성능 표본에 섞지 않는다.
  각 측정은 실제로 완료되고 예상 결과와 일치한 요청만 성공 지연 표본으로 인정한다. 느리지만 정확한 완료는 실제 시간을 보존한다. 잘못된 완료 응답의 시간·오류·중단·미완료 요청은 별도로 남기고 정확성, 측정 완결성, 시간 목표 비교를 분리한다.
  코어 조회 결과만으로 MCP 통신이나 IDE 응답을 포함한 종단 성능을 검증했다고 판단하지 않는다. 그 경계는 실제 연동 단계에서 별도로 측정한다.

  외부 변경 반영은 시험이 외부 편집을 대신해 실제 파일 쓰기를 완료한 직후부터 공개 조회 API에서 새 내용이 확인될 때까지 측정한다.
  watcher 이벤트나 색인 갱신 신호만 받은 상태는 완료로 보지 않으며, 해당 변경에서 쓴 내용과 공개 조회 결과가 일치해야 한다.
  감지·이벤트 병합·색인 갱신을 포함하며 측정 중 강제 refresh를 호출하지 않는다.
  제품의 저장 기능을 대신 구현하거나 그 동작을 검증하는 시험이 아니며, 실제 write 전체는 저장 연동 단계에서 측정한다.
  [[작업 공간 변경 계획]]의 계산 시간은 외부 변경 반영 시간과 구분한다. 현재 측정기는 변경 계획 계산을 측정하지 않는다.

  ## 반복 측정과 결과 판정

  코어 측정의 기본 반복 횟수는 초기 준비를 새 프로세스로 10회, 조회를 유형별 워밍업 100회 후 1,000회, 외부 변경 반영을 100회로 한다. IDE 측정에는 아래 별도 기준을 적용한다.
  외부 변경은 이전 변경이 반영된 것을 확인한 뒤 다음 변경을 수행한다.
  반복 횟수는 실행 옵션으로 바꿀 수 있게 하고 실제 설정을 결과에 기록한다.

  문서 1,000개에서 초기 준비 2초와 변경 반영 500ms는 정보성 비교만 한다.
  중앙값·p95·최댓값과 실제 반복 횟수를 기록한다. 미완료 요청에 완료 시간을 만들어 넣지 않고, 반영 실패를 성공으로 간주하지 않는다. 다음 외부 쓰기는 이전 반영이 확인되거나 안전하게 격리된 뒤 수행한다.
  메모리 사용량과 이벤트 루프 지연은 측정값 및 문서 수에 따른 증가 추세를 기록한다. 별도 합격·불합격 기준은 두지 않으며 후속 기준은 실측 결과를 바탕으로 정한다.
  메모리 표본 수집과 JSON·Markdown 보고서 직렬화는 개별 조회의 시간 측정 구간 밖에서 수행한다. 이벤트 루프 지연은 준비·워밍업·측정 단계를 관찰하고 단계 경계를 기록한다.

  ## IDE 성능의 측정 경계

  IDE 성능은 실제 설치된 VSIX에서 관측한다. Hover API 응답, 실제 팝업의 DOM 완료 상태, 초기 준비, 변경 반영, 편집 처리와 다중 창 메모리는 서로 다른 지표다. API 반환이나 색인 이벤트만으로 UI 완료를 판정하지 않으며 코어 초기 준비 목표를 IDE 실행을 포함한 시간에 자동 적용하지 않는다.

  IDE 초기 준비는 VS Code 실행 직전부터 초기 색인과 파일 감시 준비가 모두 끝날 때까지다. 다운로드·빌드·패키징·설치·시험 데이터 생성은 구간 밖에서 마친다. 명시적인 측정 모드에서만 확장 활성화·서버 시작·색인 시작과 완료·파일 감시 준비의 최소 이벤트를 기록한다. 작업 공간·세션·프로세스와 발생 시각을 구분하고 프로세스 간 시간 대응 방법을 남긴다. 수신 시각을 발생 시각으로 보거나 서버 연결만으로 색인 완료를 판단하지 않는다. 관측을 위해 초기화 순서를 바꾸거나 인위적으로 지연시키지 않는다.

  Hover API는 vscode.executeHoverProvider 호출 직전부터 응답 완료까지 측정하고 문서 ID·본문·원문 링크 확인과 직렬화는 구간 밖에서 수행한다. 준비 확인·워밍업·본 측정을 구분하고 정상·오류·중복 ID의 기대 결과별로 정확성과 지연을 집계한다. 기대한 오류 안내와 요청 자체의 실패는 다르다.

  실제 Hover UI는 열린 대상 팝업의 DOM에 기대 본문이 있고 Loading 표시가 없는 상태를 완료로 판정한다. Loading만 사라진 상태·팝업 닫힘·빈 응답·기대와 다른 본문은 완료가 아니다. Loading 없이 기대 본문이 바로 나타나면 그때 완료하며 Loading 미관측 여부를 별도로 남긴다. 포인터 진입부터 완료까지와 Loading이 관측된 경우 그 시작부터 완료까지를 구분한다. 새 세션의 최초 Hover는 사전 Hover·준비 sentinel 조회·색인 완료 대기로 예열하지 않는다. 창 시작부터 요청까지의 경과 시간과 관측 가능한 준비 상태를 남긴다. 재진입은 해당 시나리오에서 팝업을 표시한 뒤 닫힘을 확인하고 같은 대상에 다시 진입한다.
  포인터 조작·시간 기록·DOM 완료 판정은 고정된 코드로 자동화하고 대상 팝업의 본문·Loading 상태 변화와 타임스탬프를 남긴다. 이미지·영상·OCR은 완료 판정에 사용하지 않으며 스크린샷은 확인·오류 분석을 위한 보조 증거로만 사용한다. 자동 판정 실패를 사람이나 에이전트의 수동 조작·녹화 판독 표본으로 보충하지 않는다. Hover 설정·관측 방법·시간 해상도를 기록하고 UI 완료 시간의 기준이 DOM임을 명시한다. API와 UI가 같은 요청이라는 근거 없이 두 시간을 빼서 렌더링 비용으로 해석하지 않는다.

  변경 반영은 IDE 저장과 외부 파일 쓰기를 각각 측정한다. 저장·쓰기 완료부터 해당 변경의 고유한 새 내용이 Hover로 확인될 때까지다. 미저장 편집이 이미 반영된 경우를 구분하고 저장 유발 색인 시간으로 단정하지 않는다. 첫 조회는 저장·쓰기 완료 직후 시작하고, 새 내용을 확인하지 못한 다음 조회는 이전 조회 완료 후 50ms 대기를 초기 설정으로 적용한다. 요청은 겹치지 않으며 각 조회의 시작·종료·반환 내용과 오류를 기록한다. 이는 정확한 내부 갱신 시각이나 고정 50ms 관측 오차를 보장하는 값이 아니다. 간격을 조정하면 근거와 실제 설정을 남기고 다른 설정의 표본을 같은 조건으로 합치지 않는다. 다음 변경은 이전 반영을 확인하거나 실패한 상태를 안전하게 격리한 뒤 수행하며 강제 refresh·서버 재시작으로 감지를 대신하지 않는다.

  편집 처리는 명령 실행 직전부터 대상 문서·버전·기대 내용의 변경 이벤트까지 측정한다. 이벤트 관측은 명령 전에 준비한다. 색인 시작·완료 기록과 편집 시점을 대조해 진행 중 표본을 구분하고 완료 후 같은 편집 작업과 비교한다. 표본 확보를 위해 색인을 느리게 만들지 않으며 부족한 표본은 수와 원인을 남긴다. 실제 키보드 입력부터 화면에 그려지는 시간으로 표현하지 않는다.

  다중 창은 실제 창 1개와 2개에서 같은 단계의 Extension Host·언어 서버 메모리와 증가분을 비교한다. 같은 프로젝트의 저장 변경이 양쪽 조회에 반영되는 경우와 서로 다른 프로젝트의 내용·변경이 섞이지 않는 경우를 구분한다. 한 창의 다중 workspace로 대체하지 않는다. 프로세스별 역할·창 연결을 확인해 중복 합산을 막으며 Extension Host만의 수치를 전체 사용량으로 표시하지 않는다.

  ## IDE 시험 데이터와 반복 조건

  프로젝트별 기본 문서는 1,000개이며 일반 정상 800개·긴 본문 정상 100개·다수 참조 정상 50개·오류 30개·중복 ID 20개로 구성한다. 각 문서는 하나의 유형에만 집계한다. 중복 ID는 다른 유형과 충돌하지 않는 서로 다른 10개 ID를 각 2개 문서가 공유한다. 같은 프로젝트 두 창은 같은 1,000개를, 다른 프로젝트 두 창은 각 1,000개를 사용하며 격리 확인용 기대 내용을 구분한다. 실제 프로젝트 분포를 재현한다고 주장하지 않는다.
  seed·본문 길이·참조 수·오류 조건·문서별 기대 결과·요청 대상과 순서를 실행 전에 고정한다. 동일한 설정은 동일한 내용을 생성하고 실제 입력 구성과 해시를 결과에 연결한다.

  환경별로 IDE 초기 준비는 새 세션 10회, 최초 Hover UI는 새 세션 10회, 재진입 UI는 30회다. Hover API는 워밍업 100회·본 측정 1,000회를 출발점으로 실제 설정과 변경 근거를 기록한다. IDE 저장·외부 변경 반영은 각각 30회, 색인 중·완료 후 편집도 각각 30회로 한다. 색인 중 표본은 여러 새 세션에서 확보할 수 있지만 종료 후 표본으로 대체하지 않는다. 서로 다른 OS·버전의 표본을 합쳐 반복 횟수를 충족하지 않는다.
  전체 시도 수·성공 표본 수·실패·취소·미완료·부족한 표본을 구분한다. API 지연은 중앙값·p95·최댓값을, UI는 최초·재진입별 중앙값·최댓값·실패 횟수·완료 표본 수를 남긴다.

  ## 재현 가능한 데이터와 실행 환경

  고정 seed와 동일한 생성 설정으로 정상 문서·긴 본문·복수 참조·충돌·오류를 포함한 시험 데이터를 만든다.
  seed·생성 설정·문서 수·바이트·문서 길이·참조 수·오류 및 충돌 비율을 결과에 기록한다.
  macOS와 Windows에서 같은 변경본·데이터·seed·측정 항목·시작과 완료 경계·보고서 형식으로 실제 성능을 측정한다. OS별로 명령과 준비 절차를 통일하고 필요한 실행 파일·프로세스 관측은 해당 OS에 맞게 제공한다.
  OS 차이를 이유로 측정 항목을 생략하거나 mock의 실행 시간을 실제 성능으로 보고하지 않는다. 필수 조건을 준비하지 못하면 준비 실패와 미측정 범위를 기록하며 성공으로 간주하지 않는다.

  특정 개발 PC나 OS를 기준으로 고정하지 않는다. 실행할 때마다 장비·OS·Node 정보를 자동 기록하고 실제 실행 환경에서 측정값과 참고 기준을 비교한다.
  프로세스 수·파일 캐시 상태·측정 경계도 함께 기록한다. 한 환경의 통과를 다른 OS나 장비의 통과로 간주하지 않는다.

  ## 실행과 보고서

  성능 검사는 [[테스트 컨벤션]]의 일반 기능 테스트와 분리한 별도 명령으로 실행한다.
  성능 측정은 커밋 훅과 일반 기능 CI에 자동으로 포함하지 않는다. 측정 장비·실행 위치·실제 OS를 결과에 명시한다.
  일반 테스트는 기능의 정확성을 검증하고, 성능 명령은 실행 환경·실제 측정값·정확성·완결성·참고 목표 비교를 보고한다.
  IDE 기능 검사와 성능 측정은 기존 실행기 및 공통 준비·설치·실행·정리 경로를 재사용한다. 성능 측정과 화면 조작·관측은 별도 모듈로 구성해 명령 또는 옵션으로 선택하며 별도 설치 실행기나 OS별 중복 준비 절차를 만들지 않는다.
  성능 시나리오는 각자 필요한 세션과 변경 가능한 시험 상태를 준비하며 이전 테스트의 실행 순서·성공·결과·예열 상태에 의존하지 않는다. 개별 선택·실행·중단·재실행을 지원한다. 초기 준비 시험의 성공을 다른 시험의 선행 조건으로 삼지 않으며, 재진입이나 색인 전후 비교처럼 한 시나리오의 의미에 필요한 단계만 연결한다. 실제 공통 환경 장애나 정리 실패로 독립 실행이 불가능하면 차단 범위와 원인을 기록한다.
  성능 모드의 제품 준비 대기와 API·UI·변경 반영·편집 측정에는 고정 시간 제한을 두지 않는다. 다운로드·빌드·설치·정리의 실행 관리 제한은 별도로 유지하며 일반 기능 검사의 제한이나 전체 실행 제한으로 성능 관측을 강제로 끊지 않는다. 대기 중 경과 시간·현재 단계·관측 가능한 진행 상태를 주기적으로 보존한다. 시간 경과만으로 무한 로딩이나 제품 실패를 확정하지 않는다. 명확한 오류·예기치 않은 프로세스 종료는 실패, 사용자 중단은 중단 시점까지 미완료로 남긴다.
  성능 실행은 요청별 완료 기록과 진행 상태를 내구성 있게 보존하고 수동 중단·자식 프로세스 실패에도 부분 보고서를 생성한다.
  실행마다 원시 측정값과 환경 정보를 담은 JSON 및 사람이 읽는 한국어 Markdown 보고서를 함께 저장한다. JSON 키·명령·원본 오류 로그는 기존 식별자를 유지하며, Markdown의 제목·표·상태·오류 설명은 한국어로 쓴다. 재실행 명령과 측정하지 않은 범위도 결과에 포함한다.
  실행한 VS Code·OS·아키텍처·장비·소스·VSIX 해시·입력 구성을 결과에 연결한다. 비교 버전은 검증 시작 시 정확한 정식 버전으로 고정하며 다른 시점의 결과와 조건이 다르면 차이를 명시한다.
  측정 도구 오류는 수정 후 영향받은 측정을 다시 실행한다. 제품 오류는 재현 근거·기대 및 실제 결과·영향·미측정 항목과 별도 수정 작업으로 추적하고 독립적인 나머지 검증은 계속한다. 결과 정리의 완료와 제품 오류 수정·지원 검증 통과는 별개이며 실패가 있는 환경을 지원 검증 완료로 표시하지 않는다.

  ## 검증 의존 관계

  공통 계산의 검증을 바탕으로 IDE와 MCP의 종단 동작을 확인한다.
  SDK·watcher 설정·응답 한계·OS 파일 연산은 실제 지원 환경에서 검증한다.
  지원 환경 검증에는 [[실행 구조]]의 프로세스 경계와 [[쓰기 조정]]의 실패 조건을 포함한다.

  ## 지원 환경과 회귀 검증

  검토 하한과 배포 시점 최신 정식 VS Code에서 실제 VSIX를 시험한다.
  의존성이 더 높은 런타임을 요구하면 검증 근거에 따라 하한을 조정한다.

  공백·한글 경로와 OS별 줄바꿈, 파일 생성의 비덮어쓰기·권한·교체·동기화를 확인한다.
  코어의 초기 준비·상세 조회·외부 파일 변경 결과나 일반 기능 테스트만으로 IDE 성능 측정을 완료했다고 판단하지 않는다. 위 IDE 측정 계약은 실측 완료 선언이 아니며, 실제 결과가 없는 항목은 미측정으로 남긴다. 삭제·이동, 목록/필터/커서, MCP 통신, 변경 계획 및 쓰기 전체는 각각의 측정 범위와 실제 실행 여부를 별도로 확인한다.

  write 전체에는 조회의 100ms 목표를 자동 적용하지 않고 별도 측정 후 목표를 정한다.
  언어 독립 입력·기대 결과와 TypeScript 회귀 테스트를 보관한다.

  쓰기 검증·revision·변경 계획 계산에는 문서 형식·예시를 함께 대조한다.
  실제 VS Code 응답성, VS Code 없는 MCP 조회→저장→검증과 가이드 배포까지 확인해야 연동 완료다.

  가이드와 예시는 실제 배포 패키지의 전체 파일 목록과 바이트를 원본과 비교하며, 일부 예시의 고정 목록만 검사해 배포 검증을 대신하지 않는다.
  실제 VSIX에도 같은 자산과 상대 링크 대상이 포함되는지 확인한다. 예시의 참조·역참조 기대 관계는 실제 결과에서 역산하지 않는다.
  저장소 밖에 설치한 MCP 패키지에서 [[사용 가이드]]의 모든 주제를 호출하여 저장소 원문이나 작업 디렉터리에 의존하지 않는지 확인한다. 배포된 YAML 예시 전체는 실제 파서·스키마·참조 검증을 통과해야 한다.
  사용자 가이드의 수정·선택 속성 삭제·상호 참조 작성 절차는 실제 MCP 호출과 파일 반영 결과로 확인한다. [[저장 후 색인 갱신 실패를 복구하는 절차]]의 처리 중 대기와 실제 실패 후 복구도 안내한 동작과 대조한다.

  구체적인 SDK 스키마·응답 한계·watcher 설정과 파일 연산은 구현·시험으로 정한다.
  확정한 기능 범위를 다시 미결정으로 돌리는 것은 아니다.

  ## 공개 후보 조립과 동일 산출물 검증

  pnpm release:pack은 현재 소스를 빌드한 뒤 실행별 고유 staging에서 각 대상 manifest 버전의 co-documentation tarball과 seojaewan.codocs VSIX를 조립한다. 파일명과 검증 기대값도 대상별 버전을 따른다. 내부 workspace 패키지는 비공개로 유지한다. 공개 MCP는 의존성을 포함한 ESM codocs bin이며 Node 24.x에서 실행하고 별도 공개 JS API를 약속하지 않는다.
  배포 목록은 실행 코드·가이드·예시·양언어 README·MIT LICENSE·원본 logo.png·번들 의존성 라이선스 원문으로 제한한다. 원본 로고를 변형하지 않으며 프롬프트·소스·테스트·개발용 map/선언 파일을 포함하지 않는다. npm README의 가이드·예시 상대 링크는 staging의 실제 dist 경로로 조정하고 Marketplace README는 저장소의 공개 원문 링크를 사용한다.
  자체 README·한국어 README·MIT LICENSE는 체크아웃 줄바꿈과 무관하게 UTF-8 LF로 패키징한다. 상대 링크는 배포 위치에 맞춰 한 번 변환하고 VSCE의 추가 링크·issue 변환을 끈다. 검증은 같은 규칙의 예상 바이트와 압축 파일을 정확히 비교하며 실제 산출물을 관대하게 정규화하지 않는다. 제3자 라이선스 원문과 PNG 바이트는 정규화 대상이 아니다.

  release.json은 소스 commit·diff·미추적 파일을 포함한 Git blob 목록과 실제 OS·CPU·Node 및 tgz/VSIX SHA-256을 기록한다. pnpm release:verify <tgz> <vsix>는 재빌드 없이 명시된 파일을 검사하고 저장소 밖 새 소비자에 tarball 하나를 offline 설치하여 codocs bin의 initialize·목록·상세·검증·생성/수정·가이드·refresh·종료를 검증한다. 내부 패키지 overrides나 저장소 의존성으로 실행 누락을 보충하지 않는다.
  기능·성능 실행기의 --vsix와 --mcp-tgz는 함께 지정하며 두 파일을 재빌드하지 않고 설치하여 사용한다. lifecycle 실행기의 --vsix도 같은 파일을 실제 설치해 실패·취소·시간 제한 후 정리를 확인한다. 인자를 생략한 기존 개발 실행은 현재 소스를 빌드·패키징한다. 검증한 파일과 나중에 다시 만든 파일의 해시를 혼동하지 않는다.
