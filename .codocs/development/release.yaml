id: release
name: '배포'
domains:
  - '개발'
definition: |
  사용자가 실행할 패키지를 제공하고 지원 환경에서 동작을 검증하는 영역이다.
  배포 가능성과 성능을 확인한 범위를 명시한다.

  ## 판단 기준

  [[개발 환경]]의 빌드와 [[테스트 컨벤션]]의 동작 검증을 통과한 뒤 실제 IDE·MCP 설치와 응답성도 확인한다.
  실행한 환경·데이터·측정 범위를 남기고 다른 플랫폼까지 일반화하지 않는다.

  ## 배포 계약

  개발 VSIX 설치와 별도 MCP 패키지를 시험한다.
  언어 서버 시작·빌드된 stdio 연결·기능·외부 파일 변화·원문 보존·충돌 차단·대기 취소를 확인한다.

  Windows·macOS·Linux 로컬 디스크를 지원 목표로 하되 검증된 OS·CPU·런타임부터 명시한다.
  WSL·컨테이너·SSH는 별도 시험이며 네트워크 공유 폴더는 초기 보장 밖이다.

  VS Code 1.100.0은 검토 하한 후보이며 실제 의존성·VSIX 시험으로 확정한다.
  npm 이름·Marketplace 계획은 게시 완료가 아니다.

  ## 성능 목표

  문서 1,000개에서 초기 준비 2초, Hover·자동완성 및 MCP 목록·상세 처리의 95%가 100ms, 한 문서 저장 후 반영 500ms 이내를 초기 목표로 삼는다.

  100·5,000·10,000개와 긴 본문·많은 참조도 비교한다.
  파일 수·바이트·메모리·장비·프로세스 수·OS 캐시·측정 경계를 기록한다.
  AI 추론 시간은 MCP 처리 측정에서 제외한다.
  목표는 실측 성과나 모든 장비 보장이 아니다.
  미달하면 병목 측정과 TypeScript 개선 후 언어 이전을 검토한다.

  ## 구현 순서

  공통 계산과 성능 기반 → 실제 VS Code 기능 → MCP 도구와 저장 종단 흐름 순으로 완성한다.
  정확한 SDK·watcher 설정·응답 한계·OS 파일 연산은 구현 중 검증한다.

  지원 환경 검증에는 [[실행 구조]]의 프로세스 경계와 [[쓰기 조정]]의 실패 조건을 포함한다.

  ## 지원 환경과 회귀 검증

  검토 하한과 배포 시점 최신 정식 VS Code에서 실제 VSIX를 시험한다.
  의존성이 더 높은 런타임을 요구하면 검증 근거에 따라 하한을 조정한다.

  공백·한글 경로와 OS별 줄바꿈, 파일 생성의 비덮어쓰기·권한·교체·동기화를 확인한다.
  성능 측정은 영속 색인 캐시 없는 초기 준비와 색인 중 요청 지연·삭제·이동·다중 클라이언트 메모리를 포함한다.

  write 전체와 후보 검사에는 조회의 100ms 목표를 자동 적용하지 않고 별도 측정 후 목표를 정한다.
  언어 독립 입력·기대 결과와 TypeScript 회귀 테스트를 보관한다.

  공통 기반 단계부터 쓰기 검증·revision·후보 계산과 문서 형식·예시를 관리한다.
  실제 VS Code 응답성, VS Code 없는 MCP 조회→저장→검증과 가이드 배포까지 확인해야 연동 완료다.

  구체적인 SDK 스키마·응답 한계·watcher 설정·대기열 형식과 파일 연산은 구현·시험으로 정한다.
  확정한 기능 범위를 다시 미결정으로 돌리는 것은 아니다.
