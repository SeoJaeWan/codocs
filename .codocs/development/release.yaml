id: release
name: '배포'
domains:
  - '개발'
definition: |
  사용자가 설치할 패키지를 만들어 게시하고, 지원하는 환경에서 동작을 확인하는 흐름이다.
  PR 검사와 병합 규칙은 [[검사와 병합]], 테스트 종류와 UI 테스트 방법은 [[테스트 컨벤션]]에서 정한다.

  ## 공개 배포와 게시 주체

  공개 소스와 배포 패키지에는 MIT 라이선스를 적용하고, 저장소 루트 LICENSE와 배포 메타데이터·산출물의 라이선스 표기를 맞춘다.
  첫 공개 배포 버전은 0.0.1이다. 초기 실험 버전이며 호환성 검토 범위와 알려진 제한을 공개 안내에 밝힌다. 낮은 버전 번호가 설치·핵심 기능 검증을 면제하지는 않는다.

  [[제품]]의 MCP 패키지 co-documentation은 npm으로, VS Code 확장은 Marketplace로 각각 배포한다. 사용자는 필요한 것만 설치하거나 둘 다 쓸 수 있다.
  npm 게시 계정과 Marketplace publisher ID는 모두 seojaewan이며 VS Code 확장 식별자는 seojaewan.codocs다. 이름·계정을 정한 것과 실제 게시 권한은 구분해, 공개 게시 전에 이름 사용 가능 여부와 두 게시처의 권한·설정을 확인한다.

  Version PR이 main에 병합되면 npm·Marketplace 중 아직 게시되지 않은 manifest 버전만 하나의 자동 배포 흐름에서 게시한다. 기능 PR 병합만으로는 게시하지 않으며, Version PR 병합을 출시 승인으로 보고 별도 수동 게시나 추가 승인 단계를 두지 않는다.

  ## 변경 기록과 Version PR

  배포에 반영할 기능·수정 PR은 코드와 함께 Changesets 파일을 main에 반영한다. 각 기록은 영향받는 대상(npm·확장), 변경 수준(patch·minor·major)과 설명을 담으며 다음 버전 번호를 적는 용도가 아니다.
  기능 PR 병합마다 버전을 올리지 않고 기록을 파일로 쌓는다. 배포 파일을 바꾸지 않는 CI·개발 도구 변경에는 Changesets를 추가하지 않는다.
  Changesets 본문은 제품별 CHANGELOG와 GitHub Release 본문에 그대로 실리므로 영어 문단, 빈 줄, 같은 내용의 한국어 문단 순서로 쓰며 한 언어로만 쓰지 않는다.

  기록 작성은 pnpm changeset을 쓴다. 버전 계산·changelog·기록 소비는 고정한 공식 Changesets CLI가, Version PR의 생성·갱신은 공식 Changesets version Action이 맡으며 자체 버전 계산기나 PR 관리자를 두지 않는다.
  Action은 main에 쌓인 미출시 기록을 모아 릴리스 브랜치에서 버전·changelog를 갱신하고 main을 대상으로 Draft Version PR 하나를 만든다. main에 기능이 더 병합되면 같은 PR을 갱신하며 main에 직접 쓰지 않는다.
  매 갱신은 미출시 기록 전체로 다시 계산하므로 이전에 만든 다음 버전을 또 올리지 않는다. 같은 제품의 여러 patch 기록은 한 번의 patch 릴리스로 모으고, 더 높은 변경 수준이 있으면 그 수준을 반영한다.

  Version PR은 GitHub App 토큰으로 만들고 갱신해 그 PR의 CI가 실제로 시작되게 한다. 기본 GITHUB_TOKEN으로 만든 PR에서는 workflow가 시작되지 않기 때문이다. App은 PR만 만들고 main에 직접 쓰거나 병합 조건을 우회하지 않는다.
  Version PR이 만들어지거나 갱신된 것은 출시 승인이 아니다. 출시할 작업이 준비되면 리뷰 준비로 바꿔 포함된 작업·제품별 버전·changelog를 확인하고, 기능 PR과 같은 CI와 병합 조건([[검사와 병합]])을 적용한다. 리뷰 준비 뒤 Action이 같은 PR을 갱신하면 최신 내용으로 다시 검사하며 공식 Action의 갱신을 막지 않는다.

  ## 버전과 자동 게시

  npm 패키지와 VS Code 확장의 버전은 독립적으로 관리하며 두 버전이 같을 필요는 없다. 배포할 버전과 공통 코드 변경의 배포 대상은 Changesets에 명시하며 코드 경로만으로 정하지 않는다.
  Version PR 병합으로 main이 바뀌면 배포 workflow가 main 소스로 배포 파일을 다시 만들고 pnpm release:verify로 확인한 뒤 게시한다. 검증에 실패하면 게시하지 않는다. 같은 소스가 Version PR의 CI에서 Windows·macOS 검사를 통과했으므로 OS별 테스트와 UI 테스트는 반복하지 않는다.
  게시는 별도 스크립트 없이 workflow step에서 도구 기능으로 한다. npm은 npm view로 이미 게시된 버전인지 확인한 뒤 없을 때만 npm publish하고, Marketplace는 vsce publish --skip-duplicate로 이미 있는 버전을 건너뛴다. 게시 토큰은 배포 job에만 준다.
  배포 workflow는 main push에서만 실행하며 수동 실행을 두지 않는다. 게시 대상 계획은 매 실행의 로그와 요약에 남긴다.

  게시에 성공한 대상마다 co-documentation@버전, codocs@버전 형식의 태그와 GitHub Release를 gh release로 만들고, 이미 있으면 건너뛴다. Release 본문에는 그 버전의 CHANGELOG 항목과 설치 안내 한 줄을 넣고, 해당 제품의 배포 파일과 SHA-256만 첨부한다.
  일부 대상만 실패하면 Actions의 실패 job 재실행으로 재시도하며, 이미 게시된 버전과 태그·Release를 건너뛰므로 성공한 대상을 중복 게시하지 않는다. 게시 결과는 Actions 실행·알림·태그·Release로 확인한다.

  ## 배포 파일 조립과 검증

  pnpm release:pack은 현재 소스를 빌드한 뒤 실행마다 새 staging에서 co-documentation tarball과 seojaewan.codocs VSIX를 조립해 고정된 출력 위치에 둔다. 출력 위치는 실행마다 비워 그 실행의 두 파일만 남기며 파일명과 검증 기대값은 대상별 manifest 버전을 따른다.
  공개 MCP는 내부 패키지와 의존성을 Node 24용 ESM 번들 하나로 묶어 dist/runtime/cli.js에 두고 codocs bin으로 실행한다. 가이드의 상대 경로를 보존하며 별도 공개 JS API는 약속하지 않는다. 내부 workspace 패키지는 비공개로 유지하며 그 개별 포장·외부 소비 검사는 두지 않는다.
  VSIX는 CommonJS 확장·언어 서버 번들을 쓰며 별도 Node 설치가 필요하지 않다.

  배포 목록은 실행 코드·가이드·예시·두 언어의 README·MIT LICENSE·원본 logo.png·번들 의존성 라이선스 원문으로 제한하며, 소스·테스트·개발용 map·선언 파일은 넣지 않는다.
  npm README의 가이드·예시 상대 링크는 배포 위치에 맞춰 한 번 바꾸고, Marketplace README는 저장소의 공개 원문 링크를 쓴다. VSCE의 추가 링크·issue 변환은 끈다.
  프로젝트가 소유한 README·LICENSE·가이드·예시는 체크아웃 줄바꿈과 관계없이 UTF-8 LF로 넣고, 로고·바이너리·제3자 라이선스 원문은 바이트를 그대로 보존한다.

  pnpm release:verify는 다시 빌드하지 않고 pnpm release:pack의 출력 또는 지정한 tgz·VSIX를 검사한다.
  MCP는 저장소 밖 새 소비자에 tarball을 offline 설치해 codocs bin의 시작·SDK 연결·도구 등록(listTools)을 확인한다. 도구별 결과나 쓰기·감시의 세부 계약은 기능 테스트가 맡으며 여기서 반복하지 않는다.
  VSIX는 manifest·진입점·자산을 확인한다. 가이드와 예시는 배포 파일의 전체 목록과 바이트를 원본(LF로 맞춘 예상 바이트)과 비교하며 일부 파일만 확인해 대신하지 않는다.
  내부 패키지 overrides나 저장소 의존성으로 빠진 파일을 보충하지 않고, 검사 뒤 시험 프로세스를 정리한다.

  CI는 Ubuntu job에서 tgz·VSIX를 한 번 조립해 artifact로 넘기고, Windows·macOS job은 같은 파일로 검증과 UI 테스트를 한다. 검사 도중 다시 빌드하지 않으며, 한 OS에서 다시 만든 파일로 다른 OS의 검사를 대신하지 않는다. 파일 전달의 무결성은 artifact 기능에 맡긴다.

  ## 지원 환경

  현재 지원·검증 대상은 Windows와 macOS의 로컬 디스크이며 검증한 OS·CPU·런타임부터 명시한다.
  Linux는 지원 범위에 넣지 않는다. CI의 정적 검사와 배포 workflow가 Ubuntu에서 돈다는 사실은 Linux 지원 검증이 아니다. WSL·컨테이너·SSH는 별도 시험이 필요하며 네트워크 공유 폴더는 보장하지 않는다.
  배포는 같은 소스의 Windows·macOS 검증이 모두 통과한 뒤 진행하며 한 OS만 통과한 소스를 공개하지 않는다. CI 실행 성공만으로 실제 Mac에서의 동작까지 검증했다고 보지 않으며, macOS에서 드러난 문제의 조사와 재검증도 배포 준비에 포함한다.
  실행한 환경·버전·검사 범위를 기록하고 다른 플랫폼이나 이전 버전으로 넓혀 말하지 않는다. 테스트 도구 실패와 제품 실패를 구분하며 준비 실패·미실행·취소는 통과 근거가 아니다.

  VS Code manifest의 지원 하한(engines.vscode 1.100.0)과 CI의 UI 테스트 버전은 구분한다. CI 검사 버전을 바꿨다는 이유로 하한을 올리지 않고, API·번들 의존성·내장 런타임 요구가 달라질 때 근거를 확인해 조정한다.

  ## 배포용 저장소 설정

  자동 배포에 필요한 저장소 설정은 소스와 별도로 적용하고 실제 동작으로 확인한다.

  1. main의 Rulesets는 [[검사와 병합]]의 병합 규칙대로 적용한다.
  2. GitHub App의 Client ID(CODOCS_RELEASE_APP_CLIENT_ID)와 CODOCS_RELEASE_APP_PRIVATE_KEY를 준비하고, App이 만든 Version PR에서 리뷰 준비 전환과 갱신의 CI가 실제로 시작되는지 확인한다.
  3. 배포 job에 CODOCS_NPM_TOKEN·CODOCS_MARKETPLACE_TOKEN을 연결하고 각 제품의 실제 권한·이름을 확인한다.
  4. 태그 Rulesets로 co-documentation@*·codocs@*·v* 태그의 수정과 삭제를 막고, 배포 job이 태그를 만들 수 있도록 생성은 허용한다.

  배포 workflow는 main에서만 실행되므로 게시 경로는 병합 전에 실행할 수 없다. 병합 전에는 Version PR의 CI로 확인하고, 실제 게시 결과는 병합 뒤 Actions 실행·태그·Release로 확인한다.
  로컬 테스트는 실제 GitHub 이벤트·Rulesets 적용·App 권한·공개 게시의 성공을 대신하지 않는다.
