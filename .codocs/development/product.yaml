id: product
name: '제품'
domains:
  - '개발'
definition: |
  Codocs가 해결할 문제와 제공할 기능의 범위를 정의하는 영역이다.
  지식 관리의 목적과 구현 범위를 판단하는 기준을 제공한다.

  ## 목적과 판단 기준

  개발자와 AI가 같은 개념과 규칙을 근거로 구현·리뷰하도록 [[문서]]를 파일로 관리한다.
  원문을 찾고 변경된 계약을 유지하는 활동은 [[지식 관리]]에서 설명한다.

  [[도메인]]은 지식의 분류이며 코드가 사용될 위치를 제한하지 않는다.

  ## 제공할 동작

  개발자는 IDE에서 용어 정의와 관련 지식을 확인한다.
  AI는 목록에서 필요한 원문을 선택하고 직접 연결을 따라 추가 조회한다.

  연결된 문서 본문을 모두 펼치지 않는 이유는 원문을 한 곳에서 관리하고 필요한 근거만 선택하기 위해서다.

  ## 범위와 예외

  코드 이름 자동 변경, 이전 명칭 자동 교체, 자연어 정책의 코드 위반 판정, 별도 문서 편집 UI는 제공하지 않는다.
  코드 경로별 우선순위·정의 override도 두지 않는다.

  코드 용어 매칭은 영어를 대상으로 하고 문서용 이름·정의·본문은 작성자가 원하는 언어를 사용한다.

  키워드·의미 검색과 원격 MCP는 향후 검토 사항이다.
  지식을 제공했다고 AI가 관련 내용을 빠짐없이 읽거나 업무 사실의 정확성이 보장되는 것은 아니다.

  ## 구현 연결

  제품 표시명은 Codocs, 지식 폴더는 .codocs다.
  공개 npm 이름 co-documentation과 codocs 실행 명령은 합의한 배포 방향이며 게시·예약 완료가 아니다.

  현재 core/workspace 기반 기능을 구현했고 IDE·MCP 연결은 후속 작업이다.

  ## 초기 제공 범위

  초기 연동은 로컬 MCP와 VS Code다.
  별도 explain·AI용 식별자 resolve·독립 CLI 제품·CI 전용 기능은 필수 구현으로 확정하지 않았다.

  npm 패키지의 bin으로 codocs 명령을 제공하는 방향이다.
  이름 선정은 예약·게시 완료가 아니므로 실제 게시 시 사용 가능 여부를 확인한다.
