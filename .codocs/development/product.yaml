id: product
name: '제품'
domains:
  - '개발'
definition: |
  Codocs가 해결할 문제와 제공할 기능의 범위를 정의하는 영역이다.
  지식 관리의 목적과 구현 범위를 판단하는 기준을 제공한다.

  ## 목적과 판단 기준

  개발자가 코드를 읽고 이해할 때 프로젝트의 용어·개념·규칙과 판단 근거를 확인할 수 있도록 [[문서]]를 파일로 관리한다.
  AI가 작성한 코드도 같은 근거로 이해하고 검토할 수 있어야 하며, AI 역시 이 지식을 조회해 구현·리뷰에 참고한다.
  기능의 가치는 코드의 의미를 파악하고 관련 원문을 확인하는 데 얼마나 도움이 되는지를 중심으로 판단한다. 코드 입력을 빠르게 하는 작성 편의는 제품의 핵심 목표에 포함하지 않는다.
  이 프로젝트에서 원문을 찾고 변경된 계약을 유지하는 방법은 [[문서 컨벤션]]에서 설명한다.

  [[도메인]]은 지식의 분류이며 코드가 사용될 위치를 제한하지 않는다.

  ## 제공하는 동작

  개발자는 IDE의 코드 식별자에서 연결된 용어·기능의 의미와 계약을 확인한다. 연결 기준은 [[코드 식별자 매칭]], 표현은 [[IDE 지원]]에서 정의한다.
  [[명시적 코드 참조]]로 문서의 검증 조건·제약 조건과 구현·테스트를 연결하고 문서에서도 해당 출현으로 돌아간다. [[코드 참조 색인]]은 이 연결의 검색·관측 범위를 정의한다.
  AI는 목록에서 필요한 원문을 선택하고 직접 연결을 따라 추가 조회한다.
  문서를 실제 변경한 경우 [[문서 변경의 코드 연결 영향 안내]]로 다시 확인할 연결을 제공하며 문장의 새 위치나 코드 수정안을 자동 확정하지 않는다.

  연결된 문서 본문을 모두 펼치지 않는 이유는 원문을 한 곳에서 관리하고 필요한 근거만 선택하기 위해서다.

  ## 범위와 예외

  코드 입력 후보의 추천·삽입에 관한 제공 범위와 판단은 [[코드 자동완성]]에서 정의한다.
  문서의 ID 변경이나 이전 ID 매칭을 이유로 사용자 코드의 식별자를 자동 변경하지 않는다.
  자연어 정책의 코드 위반 판정과 별도 문서 편집 UI는 제공하지 않는다.
  코드 경로별 우선순위·정의 override도 두지 않는다.

  코드 용어 매칭은 영어를 대상으로 하고 문서용 이름·정의·본문은 작성자가 원하는 언어를 사용한다.

  키워드·의미 검색과 원격 MCP의 제공 여부는 확정하지 않았다.
  지식을 제공했다고 AI가 관련 내용을 빠짐없이 읽거나 업무 사실의 정확성이 보장되는 것은 아니다.

  ## 제품 이름과 실행 방식

  제품 표시명은 Codocs, 지식 폴더는 .codocs다.
  공개 npm 패키지 이름은 co-documentation이며 실행 명령은 codocs다.

  ## 제품 심볼

  로고는 코드와 프로젝트 지식이 맞물리는 두 연결 고리이며, 원본 자산은 저장소 루트의 logo.png다.
  보라색 고리는 코드 식별자, 민트색 고리는 용어·동작·정책과 판단 근거를 나타낸다.
  열린 C와 코드 괄호를 연상시키는 형태로 코드에서 관련 지식을 찾고 그 지식으로 코드를 이해하는 관계를 표현한다.
  개발자와 AI가 같은 프로젝트 지식을 참고한다는 제품 목적을 담는다.

  ## 연동 범위

  연동 대상은 로컬 MCP와 VS Code다.
  별도 explain·AI용 식별자 resolve·독립 CLI 제품·CI 전용 기능의 제공 여부는 확정하지 않았다.

  npm 패키지의 bin으로 codocs 명령을 제공한다.
  패키지 게시 전에는 선택한 이름의 사용 가능 여부를 확인한다.
