id: authoring
name: '지식을 선택해서 읽고 변경하는 흐름'
domains:
  - '개발'
kind: procedure
status: confirmed
definition: |
  ## 사용 목적

  전체 지식을 매번 읽는 대신 작업에 필요한 계약을 찾고 그 원문에 근거해 판단한다.
  연결된 원문의 자동 확장이 모든 관련 지식의 발견을 보장하지는 않는다.

  ## 흐름

  1. [[조회]]의 목록과 [[프로젝트 지식 읽기 안내]]에서 필요한 원문을 찾는다.
  2. [[기본 작성 지침]]의 원문 선택 기준으로 수정할 문서를 정한다. 새 주제를 나눌지는 [[설명 분리]]를 참고한다.
  3. [[기본 작성 지침]]에 맞춰 설명을 작성하고 [[참조]]로 필요한 원문을 연결한다.
  4. 문서용 이름 변경은 [[이름 변경 시 기존 참조의 의미 보존]], ID 변경은 [[이전 ID]]와 [[저장]]에서 연결 의미와 목록 변경을 확인한다.
  5. [[문서 검증]]을 적용하고 [[기본 작성 지침]]에 따라 내용의 변경과 개발 진행 기록을 구분한다.

  ## 읽기에서 수정까지

  [[조회]]로 선택한 문서의 최신 원문과 연결을 읽는다.
  형식과 작성법 안내가 필요하면 [[사용 가이드]]를 확인한다.

  수정 전 읽은 [[원문 버전]]을 기준으로 변경안을 만들고 [[문서 검증]]을 적용한다.
  MCP로 수정할 때는 [[저장]]의 revision·set/unset 계약으로 반영한다.
  YAML을 직접 편집할 때도 같은 문서 형식과 참조 규칙을 검증한다.

  상호 참조를 처음 만들 때는 A를 참조 없이 생성하고, A를 참조하는 B를 만든 뒤 A에 B 참조를 추가할 수 있다.

  ## 예외와 후속 행동

  이름 변경은 [[이름 변경 시 기존 참조의 의미 보존]], 오류 수정은 [[검증 오류가 있는 문서를 조회하고 수정하는 절차]]를 따른다.

  Local Work Memory와 .codocs를 함께 관리하는 절차는 [[메모리 동시 갱신]]에서 확인한다.
