id: vscode-local-development
name: 'VS Code에서 직접 실행하기'
domains:
  - '개발'
deprecatedAliases: []
definition: |
  로컬 저장소에서 빌드한 Codocs를 개발용 VS Code 창에 불러와 직접 사용하는 절차다.
  VSIX를 일반 확장으로 설치하지 않고 저장소의 .codocs 문서와 코드를 실제 편집기에서 직접 확인한다.
  사용자가 직접 조작하며 개발할 확장 창을 여는 절차다. 자동 VS Code UI 검사는 GitHub Actions에서만 지원한다. 이 수동 개발 절차와 자동 검증의 역할·범위는 [[테스트 컨벤션]]에서 구분한다.

  ## 준비와 빌드

  터미널에서 Codocs 저장소 루트로 이동한다. 설치·빌드 명령은 macOS와 Windows에서 같으며 창 실행 명령은 아래 OS별 예시를 사용한다.
  [[개발 환경]]에 따라 .node-version의 Node.js와 package.json의 packageManager에 지정된 pnpm을 준비한다.
  macOS에서 nvm을 사용하는 경우 `nvm use "$(cat .node-version)"`으로 저장소의 Node.js 버전을 선택할 수 있다. 설치되지 않은 버전이면 먼저 설치한다.
  Windows에서는 사용하는 Node.js 설치·버전 관리 도구로 .node-version의 버전을 준비한다. macOS용 nvm 셸 명령을 PowerShell에 그대로 적용하지 않는다.

  ```sh
  pnpm install --frozen-lockfile
  pnpm build
  ```

  빌드가 성공한 다음 창을 연다. pnpm build는 확장과 언어 서버를 함께 만들고, 확장이 사용할 서버 번들도 배치한다.
  packages/vscode/dist/index.cjs와 packages/vscode/dist/server/index.cjs가 실행에 사용되므로 TypeScript 소스만 수정한 상태로 새 구현이 적용되지는 않는다.

  ## 개발용 창 열기

  기존 VS Code 창에서 같은 프로젝트를 열어 둔 채 시험하려면 별도 사용자 데이터 경로로 개발용 인스턴스를 실행한다.
  VS Code는 같은 인스턴스의 다른 창에 이미 열린 폴더를 개발용 창의 열기 대상에서 제외한다. --new-window만 지정해도 이 중복 검사를 피하지 못해 빈 창이 열릴 수 있다.
  그 빈 창에서 Open Folder로 같은 폴더를 선택하면 기존 창으로 전환될 수 있으므로, 아래처럼 --user-data-dir로 인스턴스를 분리한다.

  두 OS 모두 저장소 루트에서 실행하며 code 명령을 PATH에서 사용할 수 있어야 한다.
  아래 예시는 Git에서 제외된 .workbench/vscode-manual 아래에 개발용 설정·기록과 설치 확장을 보관한다. 같은 경로로 다시 실행하면 해당 개발용 환경을 재사용한다.
  --extensions-dir도 별도로 지정하여 평소 설치한 확장이 직접 확인할 동작에 개입하지 않도록 한다. Codocs는 --extensionDevelopmentPath로 불러오므로 별도 설치하지 않는다.

  ### macOS

  ```sh
  code --new-window \
    --user-data-dir="$PWD/.workbench/vscode-manual/user-data" \
    --extensions-dir="$PWD/.workbench/vscode-manual/extensions" \
    --extensionDevelopmentPath="$PWD/packages/vscode" \
    "$PWD"
  ```

  macOS에서 code 명령을 찾지 못하면 VS Code 명령 팔레트에서 `Shell Command: Install 'code' command in PATH`를 실행하고 터미널을 다시 연다.
  VS Code가 기본 응용 프로그램 위치에 설치되어 있다면 위 명령의 code 대신 다음 CLI 전체 경로를 사용할 수도 있다. 나머지 인자는 그대로 유지한다.

  ```text
  "/Applications/Visual Studio Code.app/Contents/Resources/app/bin/code"
  ```

  ### Windows PowerShell

  ```powershell
  $codocsProject = (Get-Location).Path
  code --new-window --user-data-dir="$codocsProject\.workbench\vscode-manual\user-data" --extensions-dir="$codocsProject\.workbench\vscode-manual\extensions" --extensionDevelopmentPath="$codocsProject\packages\vscode" "$codocsProject"
  ```

  Windows에서 code를 찾지 못하면 VS Code 설치 경로의 bin이 PATH에 등록되어 있는지 확인하고 설치 후 터미널을 다시 연다.

  ### 열린 작업 공간 확인

  Extension Development Host 창은 packages/vscode의 빌드 결과를 개발용 확장으로 불러오고 저장소 루트를 작업 공간으로 연다.
  --extensionDevelopmentPath는 실행할 확장 위치이고 마지막 인자는 문서와 코드를 읽을 프로젝트 위치다. packages/vscode나 .codocs 자체가 아니라 저장소 루트를 마지막 인자로 지정한다.
  새 창의 탐색기에 codocs 프로젝트와 .codocs 폴더가 보이는지 확인한다. No Folder Opened이면 아직 프로젝트가 열리지 않은 것이며 문서가 없는 것으로 판단하지 않는다.
  기존 창과 분리되는 것은 VS Code의 사용자 데이터·설치 확장이다. 프로젝트는 복사되지 않으며 두 창이 같은 코드와 .codocs 파일을 읽고 수정한다.
  작업 공간 신뢰를 묻는 경우 자신이 신뢰하는 저장소인지 확인하고 허용한다.
  OS별 실행 안내는 각 OS의 실제 검증 완료를 의미하지 않는다. 한 OS의 기능·프로세스 정리 관측을 다른 OS의 결과로 간주하지 않는다.

  ## 직접 확인할 동작

  1. 개발용 창에서 packages/vscode/src/open-source/index.ts를 열고 openSource 식별자에 마우스를 올린다. [[코드 호버]]에 문서 설명과 원문 링크가 표시되는지 확인한다.
  2. 호버의 원문 링크를 눌러 .codocs/concepts/features/vscode/open-source.yaml로 이동한다. [[원문 열기]]에 따라 파일 맨 위로 이동하는지 확인한다.
  3. 해당 YAML의 definition 본문에서 `[[문서]]` 또는 `[[코드 호버]]`에 마우스를 올리고 링크를 연다. 편집기가 안내하는 링크 열기 제스처를 사용하며 기본 설정은 macOS에서 Cmd+클릭, Windows에서 Ctrl+클릭이다.
  4. 이름 참조에 복수 후보가 있으면 호버에서 원하는 후보의 링크를 선택한다. 임의의 대표 문서로 이동할 것으로 기대하지 않는다.

  이 창은 복사된 테스트 자료가 아니라 실제 저장소를 연다. 문서나 코드를 편집하고 저장하면 작업 트리에 변경이 남는다.
  .codocs/index.yaml의 `[[개발]]`에서 개발 안내를 열고, 그 본문의 'VS Code에서 직접 실행하기' 참조 링크를 따라 이 문서로 이동할 수도 있다.
  문서 설명 갱신을 확인하려면 대상 YAML의 definition을 수정·저장한 뒤 코드에서 마우스를 빼고 다시 호버한다. 이미 떠 있는 호버가 제자리에서 즉시 바뀌는 것으로 검사하지 않는다.
  참조 진단은 definition에 존재하지 않는 이름 참조를 잠시 입력하고 편집기와 문제 패널에서 확인한다. 시험을 마치면 자신이 추가한 변경만 되돌리고 기존 작업은 보존한다.

  ## 변경 사항 반영과 문제 확인

  확장·언어 서버 또는 그 의존 코드의 TypeScript를 수정한 경우 저장소 루트에서 pnpm build를 다시 실행한다.
  성공한 뒤 개발용 창의 명령 팔레트에서 `Developer: Reload Window`를 실행한다. 소스 변경이 자동으로 재빌드·재로드된다고 가정하지 않는다.
  .codocs 문서만 편집하는 경우 확장을 다시 빌드할 필요는 없다. 문서 편집과 파일 변경의 반영은 [[편집기 기능]]과 [[탐색]]의 책임이다.

  문서 정보가 표시되지 않으면 개발용 창에서 저장소 루트를 열었는지와 빌드 성공 여부를 먼저 확인한다.
  명령 팔레트의 `Codocs: Restart Language Servers`로 서버 연결을 다시 시작할 수 있지만, 확장 코드 변경을 적용하는 재빌드·창 새로고침을 대신하지는 않는다.
  계속 실패하면 출력 패널의 Codocs 관련 로그와 확장 활성화 오류를 확인한다. 자세한 연결 책임은 [[VS Code 확장]]에서 확인한다.
