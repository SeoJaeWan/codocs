_codocs:
  id: development-environment
  name: 개발 환경
  parent:
    - 개발
개요: |
  이 저장소를 개발하는 데 쓰는 도구·스크립트·실행 런타임·빌드 산출물이다.
  검사가 실행되는 시점과 병합 조건은 [[검사와 병합]], 배포 파일을 만들고 게시하는 흐름은 [[배포]]에서 정한다.
도구와 스크립트: |
  pnpm workspaces로 내부 패키지를 관리한다. Vitest는 동작 테스트, tsc는 타입 검사, ESLint는 규칙 검사([[코드 컨벤션]]), Prettier는 서식을 맡는다.
  Vitest는 TypeScript 설정과 선택 실행이 편해서 골랐으며 Jest보다 빠르다는 보장은 하지 않는다.

  package.json 스크립트는 사람이 직접 실행하는 진입점만 둔다.

  - prepare·build·typecheck·lint·format·test: 개발과 검사
  - test:vscode: CI의 실제 VS Code UI 테스트 진입점. 로컬 자동 실행은 지원하지 않으며 직접 확인은 [[직접 실행하기]]를 따른다.
  - dev:vscode·dev:mcp: 빌드한 뒤 개발용 VS Code 창과 MCP Inspector를 연다. 파일 변경을 감시하지 않으며 사용법은 [[직접 실행하기]]를 따른다.
  - changeset·release:pack·release:verify: 변경 기록과 배포 파일 조립·검증([[배포]])

  여러 검사를 묶는 check류 스크립트나 CI 전용 조합 스크립트는 두지 않는다. 빠른 검사는 커밋 훅이, 전체 검사는 PR CI가 맡는다([[검사와 병합]]). 게시 단계는 로컬의 실수 게시를 막기 위해 스크립트로 두지 않는다.
  각 패키지의 package.json에는 스크립트를 두지 않는다. 타입 검사와 빌드는 루트의 pnpm typecheck·pnpm build가 패키지 의존 순서대로 선언 파일부터 만들어 처리한다. 패키지 단위로 실행하면 이전에 빌드한 선언 파일로 검사해 다른 패키지의 변경을 놓칠 수 있기 때문이다.
  pnpm format은 서식을 고치고, CI는 `prettier . --check`로 파일을 바꾸지 않고 확인한다.

  도구를 찾을 때는 현재 프로세스가 쓰는 package manager와 manifest 버전을 기준으로 하고, Windows의 .cmd·.ps1 wrapper와 macOS·Linux 실행 파일의 차이를 함께 처리한다.
  도구를 찾지 못하면 테스트 실패와 구분되는 환경 준비 오류로 기록하며 검사를 건너뛰어 숨기지 않는다. 한 OS에서 명령이 성공했다고 다른 OS의 결과로 보지 않는다.
실행 런타임: |
  개발과 자동 테스트는 Node.js 24 LTS, 독립 MCP는 24.x로 시작한다. 다른 메이저 버전은 검증한 뒤 추가하고 세부 버전을 기록한다.
  MCP TypeScript SDK의 버전은 Node.js·Zod 조합으로 검증한다.
  [[VS Code 확장]]과 언어 서버는 VS Code 내장 런타임에 맞춰 빌드하며 호버를 쓰는 데 별도 Node.js 설치를 요구하지 않는다.
빌드 산출물: |
  core·workspace는 tsc로 JavaScript와 타입 선언을, mcp는 tsc로 실행 JavaScript(`packages/mcp/dist/cli.js`)를 만든다. 결과물은 ESM·NodeNext와 상대 .js import를 사용한다.
  language-server는 의존성과 함께 esbuild로 번들하고 vscode는 CommonJS 번들로 만든다. esbuild는 타입 검사를 대신하지 않는다.
  공개 배포 파일의 조립은 [[배포]]에서 정한다.
