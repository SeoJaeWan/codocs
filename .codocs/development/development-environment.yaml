id: development-environment
name: '개발 환경'
domains:
  - '개발'
definition: |
  ## 도구와 확인 방법

  pnpm workspaces로 내부 패키지를 관리한다.
  Vitest는 동작 테스트, tsc는 타입 검사, ESLint·typescript-eslint·eslint-plugin-jsdoc·eslint-plugin-check-file은 규칙 검사, Prettier는 서식을 담당한다.

  Vitest는 TypeScript 설정과 선택 실행의 편의성으로 선정했으며 Jest 대비 보편적인 속도 우위를 약속하지 않는다.
  실제 VS Code 기능 검사는 공식 @vscode/test-electron 기반으로 실행한다. 로컬 Vitest·실제 Extension Host·CI 환경 계약 검사의 책임과 포커스 격리 기준은 [[테스트 컨벤션]]에서 정한다.
  VS Code와 테스트 도구의 버전을 고정하고 지원 조합을 실제 실행으로 확인한다. 다운로드 결과는 버전별로 재사용하되 현재 변경본의 빌드와 검사를 생략하지 않는다.
  정확한 설치 버전은 현재 manifest·lockfile·.node-version에서 확인한다. 검사 도구는 루트 devDependency에 고정된 pnpm의 Node 진입점과 패키지 버전을 확인하여 사용한다. 전역 wrapper가 프로젝트 버전만 출력하는 경우를 실제 실행 버전 일치로 오인하지 않는다.
  pnpm test:vscode는 현재 빌드와 고정 VS Code를 자동 준비하고 pnpm test:ui도 같은 기능 검사로 위임한다. provider·명령 API의 결과를 검사하며 화면 렌더링이나 클릭 제스처 통과로 보고하지 않는다.
  Windows는 별도 Win32 데스크톱과 Job Object에서 준비부터 종료까지 격리하고 외부 전경·입력 데스크톱과 잔여 프로세스를 관측한다. macOS에는 현재 검증된 무노출 실행 어댑터가 없으므로 창을 열기 전에 준비 실패를 반환한다. macOS 수락 조건은 유지하며 안전한 어댑터와 동일 후보 SHA의 사용자 Mac 결과를 받은 후에만 충족으로 판정한다.
  로컬 빌드를 편집기에서 직접 사용하는 절차는 [[VS Code에서 직접 실행하기]]에서 확인한다.

  pnpm test는 기능 watch, pnpm test:run은 기능 단일 실행이다.
  pnpm check:development는 개발 규칙·설치 계약, pnpm check:build는 빌드·패키지 소비를 검사한다.
  pnpm check는 준비와 전체 검사를 순차 실행하고 실패하면 중단한다.
  pnpm install의 prepare 단계에서 Husky 커밋 훅을 설치한다.
  커밋 전 lint-staged가 스테이징된 코드에 ESLint 자동 수정과 Prettier를 적용하고, 문서·데이터·스타일에는 Prettier를 적용한다.
  성공한 자동 수정은 커밋에 포함하며, 남은 ESLint 오류나 파싱 오류는 커밋을 중단한다. ESLint 경고도 --max-warnings=0 기준으로 커밋을 중단한다.
  서식·자동 수정 후 로컬 기능 검사를 단일 실행하고, 포커스가 격리된 실제 VS Code 기능 검사도 실행한다. watch 모드로 커밋을 대기시키지 않는다.
  기능·VS Code 검사나 필수 준비가 실패하면 커밋을 중단한다. CI 전용 OS 환경 검사와 성능 측정은 커밋 훅에 포함하지 않는다.
  커밋 검사는 자동 수정 뒤 인덱스 트리를 독립 복사본으로 체크아웃하고 frozen install, 로컬 기능 단일 실행, 실제 VS Code 순서로 검사한다. 미스테이징·미추적 변경은 기능 검사에 섞지 않는다. 검사 후 복사본의 소스·인덱스와 원본 인덱스·HEAD가 그대로인지 확인하고 달라졌으면 커밋을 거부한다.
  자동 수정 실패·취소에는 lint-staged의 원상 복원 경로를 유지하며 Git 줄바꿈 자동 변환으로 원본 바이트가 달라지지 않도록 실행별 옵션을 사용한다. 성공한 자동 수정의 staged blob에만 원래 Git clean 규칙을 다시 적용하며 미스테이징 작업 파일을 재추가하지 않는다. 자동 수정이 성공한 뒤 기능 검사가 실패하면 수정된 인덱스는 남고 사용자 미스테이징 변경은 보존한다.
  취소 요청은 실행 중인 단계의 자원 정리와 복원을 기다린 후 커밋 실패로 처리한다. Windows 경로 길이 제한을 피하도록 복사본은 고유 OS 임시 디렉터리에 만든다. 트리 해시·VS Code 증거는 .workbench/commit-check에 모으고 성공한 복사본을 정리하며 실패한 복사본 경로는 결과 JSON에 남긴다. macOS GUI 격리 어댑터가 미구현인 동안 실제 VS Code 필수 준비와 커밋 훅은 실패하며 통과로 우회하지 않는다.
  커밋 훅이 전체 타입·설치·패키지 소비 검사를 대신하지는 않는다. 필요한 검사는 해당 검증 명령으로 별도 실행한다.
  지정된 Node·pnpm 외에 전용 환경변수나 미리 채운 store를 요구하지 않는다.
  현재 저장소의 추가 검증 명령과 실행 방법은 루트 README에서 확인한다.

  검증 명령은 특정 셸의 실행 파일 확장자나 PATH 표기에 의존하지 않아야 한다.
  Node에서 도구를 찾을 때는 현재 프로세스가 사용하는 package manager와 manifest의 버전을 기준으로 확인하고, Windows의 .cmd·.ps1 wrapper와 macOS·Linux의 실행 파일 차이를 함께 처리한다.
  도구를 찾지 못한 경우 기능·회귀 테스트 실패와 구분되는 환경 준비 오류로 기록하며, 도구 탐색 오류를 숨기기 위해 검사를 건너뛰지 않는다.
  지원 OS별로 같은 검증 명령을 실행해 명령 자체의 호환성을 확인하고, 한 OS에서의 도구 실행 성공을 다른 OS의 검증 결과로 간주하지 않는다.

  ## 실행 런타임

  개발·자동 테스트는 Node.js 24 LTS, 독립 MCP는 24.x로 시작한다.
  다른 메이저는 검증 후 추가하고 세부 버전을 기록한다.

  [[실행 구조]]의 VS Code 확장과 언어 서버는 VS Code 내장 런타임에 맞춰 빌드한다.
  Hover 사용에 별도 Node.js 설치를 요구하지 않는 방향이다.

  ## 빌드 산출물

  core/workspace는 tsc로 JavaScript와 타입 선언, mcp는 tsc로 실행 JavaScript를 만든다.
  language-server는 의존성과 함께 esbuild로 번들하고 vscode는 CommonJS 번들로 제공한다.

  core/workspace/mcp 결과물은 ESM·NodeNext와 상대 .js import를 사용한다.
  esbuild가 타입 검사를 대신하지 않는다.

  가이드와 예시도 배포에 포함하며 사용자 환경에서는 TypeScript 즉석 변환 없이 빌드된 JavaScript를 실행한다.
  정확한 target과 언어 서버 번들 형식·버전 조합은 지원 환경 시험으로 확정한다.
