id: development-environment
name: '개발 환경'
domains:
  - '개발'
definition: |
  ## 도구와 확인 방법

  pnpm workspaces로 내부 패키지를 관리한다.
  Vitest는 동작 테스트, tsc는 타입 검사, ESLint·typescript-eslint·eslint-plugin-jsdoc·eslint-plugin-check-file은 규칙 검사, Prettier는 서식을 담당한다.

  Vitest는 TypeScript 설정과 선택 실행의 편의성으로 선정했으며 Jest 대비 보편적인 속도 우위를 약속하지 않는다.
  실제 VS Code 기능 검사는 공식 @vscode/test-electron 기반으로 실행한다. 로컬과 CI의 실행 범위는 [[테스트 컨벤션]]에서 정한다.
  pnpm test는 로직·도구 검사를 한 번 실행하며 pnpm test --watch는 로직 변경 감지 모드다. pnpm check는 타입·린트·서식·빌드·일반 테스트·개발 규칙·패키지 소비 검사를 수행한다. pnpm format은 서식을 수정한다.
  pnpm test:vscode는 packages/vscode/test-runner/run.mjs를 통해 현재 소스의 VSIX 패키징·설치와 고정 VS Code를 준비하고 설치된 확장에서 전체 기능 사례를 한 번 실행한다. 기능 사례의 배치는 [[폴더 컨벤션]]을 따른다.
  IDE 성능은 같은 실행기의 --mode performance와 --scenario 옵션으로 명시적으로 선택한다. --vscode-version에는 검증할 정확한 x.y.z를 주고 --resolve-version stable로 받은 버전을 고정할 수 있다. 성능 실행의 결과와 기준은 [[배포]]가 소유하며 기본 pnpm test:vscode와 일반 CI에는 성능 측정을 포함하지 않는다.
  실제 창 사용과 격리·종료 기준은 [[테스트 컨벤션]]을 적용한다.
  CI는 Windows·macOS에서 로컬과 같은 pnpm check와 pnpm test:vscode 및 실행기 정리 검사를 실행한다. 실행기 정리 검사의 진입점은 packages/vscode/test-runner/lifecycle.mjs다.

  ## 커밋 검사

  .husky/pre-commit은 tools/git/pre-commit.mjs를 실행한다. lint-staged가 스테이징된 파일의 lint와 서식을 수정한 뒤 인덱스를 고유 임시 복사본으로 만들어 frozen install, 타입 검사, 린트, 빌드, 로직 테스트를 순서대로 실행한다. 빌드된 CLI를 실행하는 MCP 테스트처럼 산출물이 필요한 검사는 복사본의 현재 소스에서 빌드가 성공한 뒤에만 시작한다. 기존 작업 트리의 dist가 복사본의 빌드를 대신하지 않는다.
  실제 VS Code 검사·성능·전체 패키지 소비 검사는 커밋 훅에 포함하지 않는다. 따라서 Mac의 GUI 실행 여부가 커밋을 막지 않는다.
  부분 스테이징과 미추적 파일은 보존하고 검사 중 인덱스·HEAD 변경은 거부한다. 실패 시 복사본과 트리 해시를 .workbench/commit-check에 기록하며 성공하면 복사본을 정리한다. 취소는 실행 중인 단계의 정리와 복원을 기다린 뒤 실패로 처리한다.
  커밋 훅이나 필수 검사가 실패하면 커밋·병합·푸시를 완료 처리하지 않는다. HUSKY=0, --no-verify, hooksPath 변경 등으로 훅을 우회하거나 작업 트리에서 별도로 통과한 검사로 실패한 훅을 대체하지 않는다. 원인을 수정하고 동일한 스테이징 내용에 대해 훅 전체가 통과한 뒤 진행한다.

  Node에서 도구를 찾을 때는 현재 프로세스가 사용하는 package manager와 manifest의 버전을 기준으로 확인하고, Windows의 .cmd·.ps1 wrapper와 macOS·Linux의 실행 파일 차이를 함께 처리한다.
  도구를 찾지 못한 경우 기능·회귀 테스트 실패와 구분되는 환경 준비 오류로 기록하며, 도구 탐색 오류를 숨기기 위해 검사를 건너뛰지 않는다.
  지원 OS별로 같은 검증 명령을 실행해 명령 자체의 호환성을 확인하고, 한 OS에서의 도구 실행 성공을 다른 OS의 검증 결과로 간주하지 않는다.

  ## 실행 런타임

  개발·자동 테스트는 Node.js 24 LTS, 독립 MCP는 24.x로 시작한다.
  다른 메이저는 검증 후 추가하고 세부 버전을 기록한다.

  [[실행 구조]]의 VS Code 확장과 언어 서버는 VS Code 내장 런타임에 맞춰 빌드한다.
  Hover 사용에 별도 Node.js 설치를 요구하지 않는 방향이다.

  ## 빌드 산출물

  core/workspace는 tsc로 JavaScript와 타입 선언, mcp는 tsc로 실행 JavaScript를 만든다.
  MCP의 CLI 진입점은 `packages/mcp/dist/cli.js`이며 빌드한 JavaScript를 Node로 실행한다.
  language-server는 의존성과 함께 esbuild로 번들하고 vscode는 CommonJS 번들로 제공한다.

  core/workspace/mcp 결과물은 ESM·NodeNext와 상대 .js import를 사용한다.
  esbuild가 타입 검사를 대신하지 않는다.

  가이드와 예시도 배포에 포함하며 사용자 환경에서는 TypeScript 즉석 변환 없이 빌드된 JavaScript를 실행한다.
  정확한 target과 언어 서버 번들 형식·버전 조합은 지원 환경 시험으로 확정한다.
