id: development-environment
name: '개발 환경'
domains:
  - '개발'
definition: |
  ## 도구와 확인 방법

  pnpm workspaces로 내부 패키지를 관리한다.
  Vitest는 동작 테스트, tsc는 타입 검사, ESLint·typescript-eslint·eslint-plugin-jsdoc·eslint-plugin-check-file은 규칙 검사, Prettier는 서식을 담당한다.

  Vitest는 TypeScript 설정과 선택 실행의 편의성으로 선정했으며 Jest 대비 보편적인 속도 우위를 약속하지 않는다.
  pnpm test는 코드 옆의 제품 로직·IO·프로토콜·자체 도구 테스트를 표준 러너로 실행한다. 자체 수집기 대신 러너의 설정과 선택 기능을 사용하며, 기본 실행에서 자체 CI·릴리스 로직 검사도 빠뜨리지 않는다.
  로컬 pnpm check는 타입·린트·서식·빌드·코드 옆 테스트와 [[배포]]의 최종 패키지 구성·MCP 실행 확인을 조합한다. VS Code를 실행하는 설치·활성화·UI 검사는 CI에서 수행한다. 별도 개발 규칙 검사와 비공개 내부 패키지 소비 검사는 두지 않는다. pnpm format은 서식을 수정한다.
  pnpm check의 서식 검사는 prettier . --check로 파일을 수정하지 않고 확인한다. 별도 format:check 스크립트를 두지 않으며, pnpm format의 자동 수정과 pnpm check의 검증 역할을 유지한다.
  pnpm test:vscode는 GitHub Actions의 실제 VS Code UI 검사 진입점으로 사용한다. 설치한 VSIX의 활성화·서버 연결 API 확인과 실제 Hover·링크 클릭 검사의 역할은 [[테스트 컨벤션]]에서 정한다. 로컬 자동 실행은 지원하지 않으며 수동 개발은 [[VS Code에서 직접 실행하기]]를 따른다.
  CI 실행당 최신 stable을 한 번 정확한 버전으로 확정하고 Windows·macOS job이 같은 버전을 사용한다. 최소 버전의 별도 실행과 의도한 실패·시간 초과·취소의 lifecycle 시험은 두지 않는다.
  CI job마다 다운로드·프로필·확장·작업 공간 경로를 격리하고 준비를 순서대로 실행한다. 공식 VS Code 도구의 다운로드·실행 파일·CLI 경로 helper를 우선 사용하며 자체 공유 캐시·잠금·복구·전체 트리 지문을 유지하지 않는다. 실제 실행 실패·시간 제한·취소·정리·증거 수집에 필요한 최소 기능은 유지한다.
  벤치마크와 성능 모드·측정 계측·전용 도구는 [[테스트 컨벤션]]의 제거 범위를 따른다.

  ## PR 검사와 병합 기준

  기능·수정 PR은 develop을 대상으로 하고, develop은 다음 출시의 변경을 모으는 통합 브랜치다. main은 출시를 확정하는 브랜치로 유지한다.
  릴리스는 develop을 바탕으로 만든 임시 브랜치에서 main으로 PR을 보내며 버전·변경 내역 준비와 최종 검증을 한 PR에서 처리한다. 구체적인 기록 취합과 게시는 [[배포]]에서 정한다.
  main의 릴리스 결과는 PR로 develop에 동기화한다. 기능 PR·릴리스 PR·동기화 PR 모두 아래 검사와 병합 기준을 적용한다.

  Draft PR은 모든 자동 검사를 생략한다. 타입·린트·서식이나 변경 분류·결과 집계만을 위한 검사 러너도 시작하지 않는다.
  develop 병합을 받아 Draft 릴리스 PR을 갱신하는 봇의 관리 작업은 제품 검사와 구분한다. 이 작업을 이유로 Draft PR의 검사 러너를 시작하지 않는다.
  리뷰 준비 PR은 문서 변경을 포함해 변경 경로와 관계없이 동일한 전체 CI를 실행한다. 경로별 검사 선택이나 생략 규칙을 두지 않는다.
  타입·린트·서식은 공통으로 한 번 검사한다. 빌드·코드 옆의 OS 동작 검사·최종 MCP와 VSIX 구성 및 설치 확인·실제 VS Code UI 검사는 Windows·macOS에서 수행한다. UI 검사는 실행당 확정한 같은 최신 stable 버전을 사용하고 실제 실행 종료 때 자원을 정리한다.
  커밋 훅의 통과 여부로 PR CI를 생략하지 않는다. CI는 공통 정적 검사와 OS별 제품 검사를 분리하며 로컬 pnpm check에 없는 VS Code 실행 검사도 수행한다.

  리뷰 준비 전환은 추가 push 없이 CI를 시작하고, 같은 PR의 추가 push는 이전 자동 실행을 취소한 뒤 최신 변경을 검사한다.
  Draft 복귀나 PR 닫기·병합은 진행·대기 중인 해당 PR의 자동 검사를 취소한다. 다시 열 때는 Draft면 생략하고 리뷰 준비 상태면 검사한다.
  취소 범위는 workflow와 PR을 기준으로 분리하여 다른 PR·main 배포·수동 실행에 영향을 주지 않는다. 제목·본문·라벨만 바뀌면 제품 검사를 재실행하지 않는다.

  develop·main 변경은 PR로만 반영하며 각 PR의 최신 대상 브랜치 반영과 필수 CI 통과를 병합 조건으로 요구한다. 직접 push와 PR·필수 검사 우회는 관리자와 릴리스 봇에게도 허용하지 않는다. 사람의 리뷰 승인 횟수는 필수 조건으로 두지 않는다.
  PR CI 통과 뒤 대상 브랜치가 바뀌면 PR을 업데이트하고 같은 CI를 다시 통과해야 한다. 검사 대상이 바뀌지 않았다면 병합 직전 별도 검사를 추가하지 않는다.
  필수 결과 집계는 필요한 job의 실패·취소·예상 밖 생략을 통과로 처리하지 않는다. Draft에서 생략된 결과나 임의의 수동 실행은 리뷰 준비 상태의 필수 검사를 대신하지 않는다.
  보호 규칙의 실제 적용을 확인한 뒤 develop·main 병합 후 자동 테스트 재실행을 생략한다. develop의 릴리스 PR 준비와 main의 버전 변경에 따른 게시는 [[배포]]에서 정하며 테스트 재실행과 구분한다.

  ## CI 결과와 실행 도구

  PR당 결과 댓글 하나를 갱신하여 성공 여부·OS별 소요 시간·Actions 실행 링크를 표시한다. 실패하면 같은 댓글에 실패 단계를 남긴다.
  취소되거나 늦게 끝난 이전 실행이 최신 실행의 결과를 덮어쓰지 않게 한다.
  성공한 실행의 상세 진단 파일은 별도 업로드하지 않으며 일반 콘솔 로그는 Actions 실행에서 확인한다. 실패한 실행은 원인 분석에 필요한 최소 진단 자료만 보관한다.
  검증 후보와 소스·파일 해시·검증 실행 연결 정보의 보관은 [[배포]]의 동일 산출물 재사용을 위한 것이며 성공 로그 생략에 포함하지 않는다.

  ready PR의 자체 CI·릴리스 관리 검사는 변경 경로와 무관하게 Ubuntu 24.04에서 한 번 실행한다. 버전 계산에 필요한 전체 Git history는 이 job에서만 checkout한다. Windows·macOS job은 관리 회귀나 제품 버전 계산을 반복하지 않고 위 OS별 제품 검사를 수행한다. 관리 검사의 선택도 표준 러너 설정으로 관리한다.

  Tests의 static·prepare·release-management·macos·windows 결과는 required-ci로 집계한다. 소스 head/base·run/attempt·업로드 artifact ID·전체 Git tree/blob·제품 SHA-256과 두 OS의 고정 stable 증거를 대조한다. reporter는 신뢰한 기본 브랜치 코드만 실행하고 현재 PR/head/base와 최신 실행을 다시 확인한 뒤 PR별로 댓글 하나를 갱신한다. 게시 결과도 원래 검증 실행의 바인딩을 유지하여 같은 댓글에 전달한다.
  OS 성공 증거에는 같은 VSIX·stable의 설치 API 응답, 실제 renderer 입력을 사용한 전체 대표 사례, 정상 종료와 자원 정리가 포함되어야 한다. step의 성공 표시만으로 누락된 UI 증거를 대신하지 않는다. 수동·push 실행도 source/run/attempt·업로드 ID·제품 해시와 UI 결과를 결합하지만 ready PR의 head/base 바인딩이나 required-ci를 대신하지 않는다.

  JavaScript Action은 지원되는 Node 24 실행 기반을 사용한다. 프로젝트 Node 버전 선택과 Action 자체의 runs.using 런타임은 별도로 확인한다.
  Action은 검증한 commit revision으로 고정하고 해당 revision의 manifest를 대조한다. 자동 준비·동기화·게시의 운영 활성화 순서와 실제 권한 확인은 [[배포]]가 소유한다. 보호 확인 전 main push와 수동 전체 Tests를 유지하며, 로컬 fixture 통과를 실제 보호 적용 근거로 사용하지 않는다.

  ## 커밋 검사

  커밋 훅은 lint-staged로 스테이징된 파일의 lint·서식을 처리한 다음 pnpm test를 실행한다. lint-staged만으로 코드 테스트를 대신하지 않는다.
  인덱스 복사본 생성·의존성 재설치·전체 타입/린트/빌드 검사를 수행하는 자체 커밋 검사 도구는 두지 않는다. 실제 VS Code UI와 최종 배포 패키지 검사는 커밋 훅에 포함하지 않는다.
  부분 스테이징·미추적 파일·기존 작업을 보존하며 pnpm test는 현재 작업 트리에서 실행한다. 이를 Git 인덱스만의 검증으로 표현하지 않는다. 확정된 커밋의 전체 검증은 PR CI에서 수행한다.
  커밋 훅이나 필수 검사가 실패하면 커밋·병합·푸시를 완료 처리하지 않는다. HUSKY=0, --no-verify, hooksPath 변경 등으로 훅을 우회하거나 작업 트리에서 별도로 통과한 검사로 실패한 훅을 대체하지 않는다. 원인을 수정하고 동일한 스테이징 내용에 대해 훅 전체가 통과한 뒤 진행한다.

  Node에서 도구를 찾을 때는 현재 프로세스가 사용하는 package manager와 manifest의 버전을 기준으로 확인하고, Windows의 .cmd·.ps1 wrapper와 macOS·Linux의 실행 파일 차이를 함께 처리한다.
  도구를 찾지 못한 경우 기능·회귀 테스트 실패와 구분되는 환경 준비 오류로 기록하며, 도구 탐색 오류를 숨기기 위해 검사를 건너뛰지 않는다.
  지원 OS별로 같은 검증 명령을 실행해 명령 자체의 호환성을 확인하고, 한 OS에서의 도구 실행 성공을 다른 OS의 검증 결과로 간주하지 않는다.

  ## 실행 런타임

  개발·자동 테스트는 Node.js 24 LTS, 독립 MCP는 24.x로 시작한다.
  다른 메이저는 검증 후 추가하고 세부 버전을 기록한다.

  [[실행 구조]]의 VS Code 확장과 언어 서버는 VS Code 내장 런타임에 맞춰 빌드한다.
  Hover 사용에 별도 Node.js 설치를 요구하지 않는 방향이다.

  ## 빌드 산출물

  core/workspace는 tsc로 JavaScript와 타입 선언, mcp는 tsc로 실행 JavaScript를 만든다.
  MCP의 CLI 진입점은 `packages/mcp/dist/cli.js`이며 빌드한 JavaScript를 Node로 실행한다.
  language-server는 의존성과 함께 esbuild로 번들하고 vscode는 CommonJS 번들로 제공한다.

  core/workspace/mcp 결과물은 ESM·NodeNext와 상대 .js import를 사용한다.
  esbuild가 타입 검사를 대신하지 않는다.

  가이드와 예시도 배포에 포함하며 사용자 환경에서는 TypeScript 즉석 변환 없이 빌드된 JavaScript를 실행한다.
  정확한 target과 언어 서버 번들 형식·버전 조합은 지원 환경 시험으로 확정한다.

  공개 배포는 내부 tsc 구조를 유지하면서 별도 staging을 조립한다. MCP CLI와 내부 의존성을 Node 24용 ESM 번들로 묶고 dist/runtime/cli.js에 배치하여 가이드의 import.meta.url 상대 경로를 보존한다. VSIX는 기존 CommonJS 확장·언어 서버 번들을 사용하며 별도 시스템 Node 설치가 필요하지 않다.
  pnpm release:pack과 pnpm release:verify <tgz> <vsix>의 산출물·검증 경계는 [[배포]]에서 정의한다. CI의 VS Code 검사는 준비 단계가 만든 같은 VSIX를 설치하여 사용하고 검증 도중 제품을 다시 패키징하지 않는다.
  자체 CI·릴리스 연결 판단은 도구 옆 테스트로 확인하며 제품의 전체 설치·UI 흐름을 별도 native 통합 실행기로 반복하지 않는다.
