id: local-development
name: '직접 실행하기'
domains:
  - '개발'
definition: |
  로컬 저장소에서 빌드한 Codocs의 VS Code 확장과 MCP 서버를 배포 전에 직접 실행해 사용하는 절차다.
  VSIX나 npm 패키지를 설치하지 않고 개발 빌드를 그대로 실행해 저장소의 .codocs 문서와 코드로 확인한다.
  개발 빌드와 배포 파일은 같은 소스를 묶으므로 직접 실행은 개발 빌드를 대상으로 하며, 번들 자체의 문제는 [[배포]]의 배포 파일 검증이 맡는다.
  사용자가 직접 조작하며 확인하는 절차다. 자동 VS Code UI 검사는 GitHub Actions에서만 지원한다. 이 수동 절차와 자동 검증의 역할·범위는 [[테스트 컨벤션]]에서 구분한다.

  ## 준비

  터미널에서 Codocs 저장소 루트로 이동한다.
  [[개발 환경]]에 따라 .node-version의 Node.js와 package.json의 packageManager에 지정된 pnpm을 준비한다.
  macOS에서 nvm을 사용하는 경우 `nvm use "$(cat .node-version)"`으로 저장소의 Node.js 버전을 선택할 수 있다. 설치되지 않은 버전이면 먼저 설치한다.
  Windows에서는 사용하는 Node.js 설치·버전 관리 도구로 .node-version의 버전을 준비한다. macOS용 nvm 셸 명령을 PowerShell에 그대로 적용하지 않는다.

  ```sh
  pnpm install --frozen-lockfile
  ```

  ## 실행 스크립트

  두 스크립트 모두 저장소 루트에서 실행하며 macOS와 Windows에서 같은 명령을 쓴다.

  - pnpm dev:vscode: 개발용 VS Code 창을 연다.
  - pnpm dev:mcp: MCP Inspector로 MCP 서버를 실행한다.

  각 스크립트는 먼저 pnpm build를 실행하고 성공한 뒤에만 도구를 연다. 빌드가 실패하면 도구를 열지 않는다.
  확장은 packages/vscode/dist/index.cjs와 packages/vscode/dist/server/index.cjs를, MCP 서버는 packages/mcp/dist/cli.js를 실행하므로 TypeScript 소스만 수정하고 빌드하지 않은 결과로 확인하지 않게 하기 위해서다.
  스크립트는 파일 변경을 감시하지 않는다. 실행 중에 소스를 고쳤다면 아래 각 절의 반영 방법을 따른다.
  OS별 실행 안내는 각 OS의 실제 검증 완료를 의미하지 않는다. 한 OS의 기능·프로세스 정리 관측을 다른 OS의 결과로 간주하지 않는다.

  ## VS Code 확장

  pnpm dev:vscode는 code 명령으로 Extension Development Host 창을 연다. code 명령을 PATH에서 사용할 수 있어야 한다.
  macOS에서 code 명령을 찾지 못하면 VS Code 명령 팔레트에서 `Shell Command: Install 'code' command in PATH`를 실행하고 터미널을 다시 연다.
  Windows에서 code를 찾지 못하면 VS Code 설치 경로의 bin이 PATH에 등록되어 있는지 확인하고 설치 후 터미널을 다시 연다.

  ### 개발용 창의 구성

  개발용 창은 packages/vscode의 빌드 결과를 개발용 확장으로 불러오고 저장소 루트를 작업 공간으로 연다. Codocs를 별도로 설치하지 않는다.
  개발용 설정·기록과 설치 확장은 Git에서 제외된 .workbench/vscode-manual 아래의 별도 사용자 데이터·확장 경로에 보관한다. 다시 실행하면 해당 개발용 환경을 재사용한다.
  사용자 데이터 경로를 분리하는 이유는 기존 VS Code 창에서 같은 프로젝트를 열어 둔 채 시험하기 위해서다. VS Code는 같은 인스턴스의 다른 창에 이미 열린 폴더를 개발용 창의 열기 대상에서 제외하므로, 같은 인스턴스에서 열면 빈 창이 열리거나 기존 창으로 전환될 수 있다.
  확장 경로를 분리하는 이유는 평소 설치한 확장이 직접 확인할 동작에 개입하지 않게 하기 위해서다.

  ### 열린 작업 공간 확인

  새 창의 탐색기에 codocs 프로젝트와 .codocs 폴더가 보이는지 확인한다. No Folder Opened이면 아직 프로젝트가 열리지 않은 것이며 문서가 없는 것으로 판단하지 않는다.
  기존 창과 분리되는 것은 VS Code의 사용자 데이터·설치 확장이다. 프로젝트는 복사되지 않으며 두 창이 같은 코드와 .codocs 파일을 읽고 수정한다.
  작업 공간 신뢰를 묻는 경우 자신이 신뢰하는 저장소인지 확인하고 허용한다.

  ### 직접 확인할 동작

  1. 개발용 창에서 .codocs/concepts/features/vscode/editor-features.yaml을 열고 definition 본문의 `[[원문 열기]]`에 마우스를 올려 링크를 연다. 편집기가 안내하는 링크 열기 제스처를 사용하며 기본 설정은 macOS에서 Cmd+클릭, Windows에서 Ctrl+클릭이다.
  2. .codocs/concepts/features/vscode/open-source.yaml이 열리는지 확인한다. [[원문 열기]]에 따라 파일 맨 위로 이동하는지 확인한다.
  3. 일반 코드 파일의 식별자에 마우스를 올려도 Codocs 문서 설명이 표시되지 않는지 확인한다.
  4. 이름 참조에 복수 후보가 있으면 호버에서 원하는 후보의 링크를 선택한다. 임의의 대표 문서로 이동할 것으로 기대하지 않는다.

  이 창은 복사된 테스트 자료가 아니라 실제 저장소를 연다. 문서나 코드를 편집하고 저장하면 작업 트리에 변경이 남는다.
  .codocs/index.yaml의 `[[개발]]`에서 개발 안내를 열고, 그 본문의 '직접 실행하기' 참조 링크를 따라 이 문서로 이동할 수도 있다.
  참조 진단은 definition에 존재하지 않는 이름 참조를 잠시 입력하고 편집기와 문제 패널에서 확인한다. 시험을 마치면 자신이 추가한 변경만 되돌리고 기존 작업은 보존한다.

  ### 변경 사항 반영과 문제 확인

  확장·언어 서버 또는 그 의존 코드의 TypeScript를 수정한 경우 저장소 루트에서 pnpm build를 다시 실행한다.
  성공한 뒤 개발용 창의 명령 팔레트에서 `Developer: Reload Window`를 실행한다. 개발용 창을 닫고 pnpm dev:vscode를 다시 실행해도 된다. 소스 변경이 자동으로 재빌드·재로드된다고 가정하지 않는다.
  .codocs 문서만 편집하는 경우 확장을 다시 빌드할 필요는 없다. 문서 편집과 파일 변경의 반영은 [[편집기 기능]]과 [[탐색]]의 책임이다.

  문서 정보가 표시되지 않으면 개발용 창에서 저장소 루트를 열었는지와 빌드 성공 여부를 먼저 확인한다.
  명령 팔레트의 `Codocs: Restart Language Servers`로 서버 연결을 다시 시작할 수 있지만, 확장 코드 변경을 적용하는 재빌드·창 새로고침을 대신하지는 않는다.
  계속 실패하면 출력 패널의 Codocs 관련 로그와 확장 활성화 오류를 확인한다. 자세한 연결 책임은 [[VS Code 확장]]에서 확인한다.
  macOS는 VS Code 프로세스 간 통신 소켓 경로가 약 103자로 제한되어, 저장소가 매우 깊은 경로에 있으면 .workbench/vscode-manual/user-data가 이를 넘어 창이 정상적으로 시작되지 않을 수 있다. 이 경우 더 짧은 경로의 체크아웃에서 실행한다.

  ## MCP 서버

  pnpm dev:mcp는 공식 MCP Inspector로 packages/mcp/dist/cli.js를 `--project .`과 함께 실행한다. 저장소 루트가 [[MCP 서버]]의 프로젝트가 된다.
  Inspector는 저장소의 devDependency로 버전을 고정해 사용하며 별도로 설치하지 않는다.
  Inspector에서 서버에 연결해 [[MCP 도구]] 목록을 확인하고, 도구를 골라 입력값을 넣어 직접 호출한다.
  환경 변수 MCP_CATALOG_PATH가 설정되어 있으면 Inspector 웹 UI가 명령줄로 지정한 서버를 거부할 수 있으므로 해제하고 실행한다.

  이 서버는 복사된 테스트 자료가 아니라 실제 저장소의 .codocs를 읽는다. [[codocs_write]]나 [[codocs_rename]]처럼 문서를 바꾸는 도구를 호출하면 작업 트리에 변경이 남는다. 시험을 마치면 자신이 추가한 변경만 되돌리고 기존 작업은 보존한다.
  MCP 서버나 그 의존 코드의 TypeScript를 수정한 경우 Inspector를 종료하고 pnpm dev:mcp를 다시 실행한다. 실행 중인 서버에 소스 변경이 자동으로 적용된다고 가정하지 않는다.

  ## 자동 검증과의 관계

  PR CI는 dev:vscode·dev:mcp를 실행하지 않는다. 확장 기능의 대표 동작은 UI 테스트가, 배포 파일의 설치와 시작은 배포 파일 검증이 확인한다. 각 검사가 실행되는 시점은 [[검사와 병합]]에서 정한다.
  두 스크립트는 사람이 가끔 쓰는 개발 도구이고 깨져도 제품과 배포에 영향이 없으므로, 창을 띄우고 정리하는 CI 비용을 들이지 않는다.
  스크립트를 바꾸면 바꾼 사람이 사용할 수 있는 OS에서 직접 실행해 확인하고, 확인하지 못한 OS는 확인하지 않았다고 기록한다.
