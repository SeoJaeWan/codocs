id: development-conventions
name: '개발'
domains:
  - '개발'
kind: procedure
status: confirmed
definition: |
  개발은 제품 범위를 정하고 구현·검증·지식 갱신을 거쳐 배포 가능한 상태로 만드는 영역이다.
  아래 문서는 이 도메인의 전체 구성이다. 작업 순서에 따라 필요한 기준을 선택한다.

  ## 범위와 준비

  - [[제품]]: 제공할 기능과 제외 범위를 확인한다.
  - [[실행 구조]]: 기능을 담당하는 패키지와 프로세스 경계를 찾는다.
  - [[개발 환경]]: 실행 도구·런타임·빌드 조건을 확인한다.
  - [[VS Code에서 직접 실행하기]]: 로컬 빌드를 개발용 창에 불러와 코드 호버와 문서 이동을 직접 사용한다.

  ## 구현과 문서 작성

  - [[폴더 컨벤션]]: 변경할 소스·테스트·문서의 위치와 파일명을 정한다.
  - [[코드 컨벤션]]: 코드의 이름·타입·함수 설명과 모듈 경계를 맞춘다.
  - [[테스트 컨벤션]]: 변경한 동작의 입력·출력·실패 사례를 검증한다.
  - [[문서 컨벤션]]: 프로젝트에만 적용하는 작성 규칙과 README의 역할, 사용자 가이드의 직접 적용 방식을 확인한다.

  ## 갱신과 배포

  - [[메모리 동시 갱신]]: Local Work Memory와 .codocs에 같은 합의를 반영하고 결과를 확인한다.
  - [[배포]]: 실제 설치·연동·지원 환경과 성능을 검증해 제공할 범위를 판단한다.

  작업에 필요한 원문을 찾고 수정하는 전체 흐름은 [[지식을 선택해서 읽고 변경하는 흐름]]에서 확인한다.
