id: code-convention
name: '코드 컨벤션'
domains:
  - '개발'
definition: |
  ## 목적과 범위

  TypeScript와 ESM JavaScript 코드의 명명·타입·함수 설명과 모듈 경계를 통일하는 규칙이다.
  소스와 테스트의 위치는 [[폴더 컨벤션]]을 따른다.

  ## 이름과 함수 설명

  - 함수와 변수는 camelCase, 클래스와 타입은 PascalCase를 사용한다.
  - 공개 함수의 반환 타입을 명시한다.
  - 선언 함수·메서드·변수에 할당한 함수에는 한국어 JSDoc을 작성한다.

  ## 입력과 타입

  외부 프로젝트 입력은 unknown으로 받고 구조와 의미를 확인한 뒤 내부 타입으로 사용한다.
  strict와 exactOptionalPropertyTypes를 유지한다.

  ES2022·NodeNext와 명시적인 ESM package type, 로컬 .js import를 사용한다.
  패키지의 types: [] 설정으로 루트 도구용 Node 타입이 자동 유입되지 않게 한다.

  ## 상수와 모듈 경계

  고정 메시지와 오류 코드는 책임 모듈의 공통 상수로 관리하고 오류의 발생 조건을 설명한다.
  원본 정의에서 도출할 수 있는 값은 그 정의를 참조한다.

  다른 패키지는 공개 진입점으로 사용한다.
  상대 경로·subpath·별칭을 통해 다른 패키지의 내부 구현에 접근하지 않는다.

  상세 도구 버전은 현재 manifest와 lockfile을 기준으로 확인한다.

  ## 함수 설명의 범위

  JSDoc은 역할과 필요한 매개변수 의미·반환·오류·부수 효과를 설명하며 TypeScript 타입을 반복하지 않는다.
  짧은 map 콜백과 테스트 인라인 콜백은 제외하고, 복잡한 콜백은 이름 있는 함수로 분리한다.
  주석은 한국어로 의도를 설명한다.
  async/await를 사용하며 Promise는 await·반환·오류 처리로 처리한다.
  오류를 누락하거나 조용히 무시하지 않는다.

  ## 값의 원본과 동적 메시지

  진단 고정 문구는 packages/core/src/diagnostics/index.ts에서 관리한다.
  원본 정의가 있는 필드 목록은 별도 리터럴 배열로 복제하지 않고 스키마 등 원본에서 도출한다.

  동적 메시지 전체를 고정 상수로 만들지는 않는다.
  고정 문구·접두사는 상수로 두고 입력 값과 라이브러리 상세 메시지는 원본에서 받아 조합한다.

  ## 도메인 상수와 타입

  Codocs가 의미를 정의하는 상태·판정·실패 사유·진단 심각도는 책임 기능의 설명 있는 상수로 관리한다.
  기능별 domain-values.ts에 원본 값을 두고 항목별 한국어 JSDoc으로 발생 조건과 의미를 설명한다.
  진단 코드·메시지는 기존 diagnostics의 원본을 사용한다.
  같은 철자라도 문서 상태와 스캔 확인 상태처럼 의미가 다르면 별도로 정의한다.
  여러 계층이 같은 계약을 사용하면 하나의 원본을 공개 진입점으로 공유한다.

  타입은 상수에서 도출한다. 스키마·허용값 검사·분기에서 목록을 다시 선언하지 않는다.
  문서 필드 값은 스키마에서 도출하고 지식 루트 이름은 workspace의 원본 상수를 사용한다.
  언어의 typeof 값, 일반 객체 키, 타입의 속성 선택, 외부 API 값, 문법 문자와 사용자 원문은 문자열로 유지한다.

  ## lint 검사 경계

  원본 상수의 @domainValues JSDoc을 검사 표식으로 사용한다.
  codocs/no-raw-domain-value는 TypeScript의 타입 별칭·속성·매개변수 선언을 따라 해당 원본을 확인한다.
  객체 생성·대입·비교·함수 인자·반환문 등에서 도메인 값으로 직접 작성한 문자열과 보간 없는 template literal을 거부한다.
  결과를 만드는 경계에 반환 타입·타입 주석·satisfies를 사용해 의미를 명시한다.
  원본 상수·import 별칭·기존 도메인 값의 전달은 허용한다.
  원본 선언과 일반 문자열, 외부 원문 fixture, 공개 문자열 호환성의 독립 검사는 허용한다.
  타입 정보가 사라진 일반 문자열의 최초 출처를 추적하는 규칙은 아니며 파일 전체나 같은 철자의 문자열을 일괄 금지하지 않는다.
  계약 검사에서 명시적 타입 때문에 예외가 필요하면 해당 줄에만 이유를 적어 규칙을 해제한다.
  일반 동작 테스트의 타입이 있는 도메인 값 작성에도 같은 규칙을 적용한다.
