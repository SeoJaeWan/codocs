_codocs:
  id: rename
  name: 이름 변경
  parent:
    - 참조
개요: |
  이름 변경은 문서의 name을 바꾸면서 그 문서를 가리키던 [[문서 참조]]와 [[코드 참조]], 다른 문서의 parent를 함께 고치는 작업이다.
  참조와 parent는 이름으로 대상을 찾으므로 name만 바꾸면 기존 참조가 끊기고 parent는 없는 문서를 가리키게 된다.
  같은 글자를 일괄 치환하면 원래 어느 문서를 가리켰는지 구분할 수 없으므로, 바꾸기 전과 후에 각 참조가 가리키는 대상을 비교해 고칠 곳을 정한다.
  문서의 섹션 이름을 바꾸는 작업도 같은 규칙을 쓰며 '섹션 이름 변경'에서 설명한다. 아래에서 따로 말하지 않으면 문서 이름 변경을 가리킨다.

  이름 변경은 미리보기와 반영 두 단계로 진행한다.
  MCP에서는 `codocs_rename` 도구로, VS Code에서는 문서의 name 값이나 참조에서 이름 바꾸기(F2)로 시작한다.
  두 경로는 같은 규칙으로 고칠 곳을 계산하고 같은 방식으로 파일에 반영한다.
  [[codocs_write]]는 다른 문서의 참조와 코드 파일의 표기를 고치지 않으므로 changes를 포함해 name을 바꾸는 요청을 받지 않고 이름 변경으로 안내한다.
고치는 참조: |
  바꾸기 전에 이 문서로 확정된 참조만 새 이름으로 고친다. 여기서 확정은 참조의 이름 부분이 이 문서로 확정된다는 뜻이다.
  같은 글자라도 다른 문서를 가리키던 참조는 그대로 둔다.
  `\[[주문:취소]]`처럼 섹션이 붙은 참조는 그 섹션이 있든 없든 이름 부분만 고치고 `:취소`는 그대로 둔다. 이 문서 안에서 자기 섹션을 가리키는 참조도 같다.
  이름에 콜론이 들어가면 [[참조]]의 표기대로 `\:`로 적는다.
  바꾼 위치 외의 원문은 그대로 두고, 바꾼 값도 그 위치의 따옴표·escape 형식에 맞춰 적는다.
  코드 파일의 `@codocs \[[주문]]`·`@codocs \[[주문:취소]]`도 같은 규칙으로 고친다. 이름 부분이나 섹션 부분만 바꾸고 파일의 나머지는 그대로 둔다.

  예를 들어 '주문'을 '새주문'으로 바꿀 때 이 문서를 가리키던 `\[[주문]]` 세 곳은 `\[[새주문]]`이 되고, `\[[주문:취소]]`는 `\[[새주문:취소]]`가 된다.
부모 이름: |
  다른 문서의 `_codocs.parent`에 이 문서의 이름이 적혀 있으면 항상 새 이름으로 함께 고친다.
  parent는 참조와 달리 바꾸기 전의 확정 여부나 선택을 따지지 않으며 고를 대상도 없다.
  parent도 참조와 같이 바꾼 위치 외의 원문과 그 위치의 따옴표·escape 형식을 그대로 유지한다.
  이 문서의 이름이 프로젝트에서 유일할 때만 parent를 고친다. 같은 이름의 문서가 여럿이면 어느 문서를 가리키는지 알 수 없으므로 parent는 고치지 않는다.
  이름을 바꾼 뒤 이번 변경으로 새로 생기는 parent_not_found나 parent_cycle이 있으면 blocked다. 이름을 바꾸기 전부터 있던 parent 오류는 막지 않는다.
모호한 참조: |
  바꾸기 전에 후보가 여럿이라 모호했던 참조는 자동으로 고치지 않는다.
  미리보기는 이런 참조마다 후보의 이름·경로를 보여주고 사용자가 대상을 고르게 한다.
  고른 참조는 고른 대상을 기준으로 고친다.
  고르지 않은 참조는 원문 그대로 두고 미해결로 알린다.
  이름 변경 때문에 기존의 모호한 참조가 다른 후보 하나로 확정되는 경우도 영향으로 알린다.
  코드 파일의 모호한 표기도 같은 방식으로 선택하게 한다.
코드 파일: |
  코드 파일의 표기는 코드 파일을 모두 수집한 뒤에 고칠 곳을 계산한다.
  코드 수집이 끝났지만 일부 파일을 읽지 못했으면 읽은 파일만 고치고, 읽지 못한 경로는 확인하지 못한 영향(unconfirmed)으로 알린다. 이때 결과 상태는 unresolved다.
  코드 파일의 변경·영향·반영 파일은 fileKind가 "code"이며 문서(YAML)의 항목에는 fileKind가 없다.
  읽지 못한 코드 파일의 영향은 reason이 unconfirmed이고 fileKind가 "code"이며, 특정 경로가 없는 실패는 경로가 "."이다. 모호한 코드 표기는 reason이 selection_required이고 fileKind가 "code"인 영향이며 선택의 sourcePath에 코드 경로를 쓸 수 있다.
  미리보기와 반영은 코드 파일도 영향받는 파일에 포함해 파일별 [[revision]]을 받고 확인한다.
  코드 파일은 이름 변경을 반영할 때에만 고치며, 그 밖의 경로로는 고치지 않는다.
  반영 뒤에는 코드 참조를 곧바로 다시 수집한다.
  VS Code에서는 영향받는 코드 파일에 저장하지 않은 수정이 있으면 시작 전에 중단한다.
미리보기: |
  미리보기는 파일과 색인을 바꾸지 않고 다음을 돌려준다.
  - 결과 상태
  - 고칠 위치와 바꾸기 전후의 표기
  - 선택이 필요한 참조와 그 후보
  - 영향과 충돌, 진행할 수 없는 이유
  - 영향받는 파일마다의 [[revision]]

  결과 상태는 다음 중 하나다.
  - ready: 고칠 내용을 모두 계산했다.
  - unresolved: 사용자가 대상을 골라야 하는 참조가 남았다.
  - blocked: 진행할 수 없다.
  ready는 계산이 끝났다는 뜻이며 저장해도 된다는 허가가 아니다.
  unresolved는 반영할 수 있으며, 고르지 않은 참조는 바꾸지 않는다.

  다음 경우는 blocked이며 이름과 참조를 모두 바꾸지 않는다.
  - 새 이름과 같은 이름의 다른 문서가 있다(name_conflict). 이름은 프로젝트 전체에서 유일해야 하므로 어느 폴더에 있든 같다.
  - 이름 변경으로 새로 생기는 parent 오류가 있다. 이때 blockingReason은 name_conflict이고 conflicts에 오류가 생기는 문서를 담는다.
  - 기존 이름과 같은 이름으로 바꾸려 한다.
  - 프로젝트 탐색이 끝나지 않았다.
  - 코드 파일을 수집하는 중이다. 이미 코드 색인이 있는 세션이 다시 수집하는 중이면 기다리지 않고 바로 blocked이며 blockingReason은 unconfirmed다. 세션에 코드 색인이 아직 없으면 첫 이름 변경은 처음 수집이 끝나기를 기다린 뒤 계산한다.
  - 존재하지 않는 참조를 고르는 등 선택이 잘못되었다.
  - 바꿀 파일의 원본을 UTF-8 손실 없이 보존할 수 없다.
  - 바꿀 위치의 따옴표·escape 형식으로 새 이름을 안전하게 적을 수 없다.
섹션 이름 변경: |
  섹션 이름 변경은 한 문서의 최상위 섹션 키 하나를 바꾸면서 그 섹션을 가리키던 `\[[이름:섹션]]`을 함께 고치는 작업이다.
  대상은 문서 하나와 그 문서의 섹션 하나다. `_codocs`는 섹션이 아니므로 대상이 아니다.
  결과 상태, 미리보기 내용, 선택, 반영과 복구는 문서 이름 변경과 같은 규칙을 따르며 다른 점만 아래에 적는다.

  고치는 곳은 다음과 같다.
  - 대상 문서의 그 섹션 키. 키의 따옴표 형식을 유지하고 이름만 바꾼다.
  - 이름 부분이 그 문서로, 섹션 부분이 그 섹션으로 확정된 모든 참조의 섹션 부분. 같은 문서 안의 참조를 포함하며 이름 부분과 원문의 다른 부분은 그대로 둔다.
  - 이름 부분이 모호했던 참조는 문서 이름 변경의 '모호한 참조'처럼 사용자가 대상을 고르게 하고, 이 문서를 고른 참조만 고친다.
  코드 파일에서 이름 부분이 그 문서로, 섹션 부분이 그 섹션으로 확정된 `@codocs \[[이름:섹션]]`의 섹션 부분도 같은 규칙으로 고친다.
  섹션이 없어 확정되지 않은 참조와 다른 문서의 같은 이름 섹션을 가리키는 참조는 고치지 않는다.
  섹션 이름에 콜론이 들어가면 참조에는 [[참조]]의 표기대로 `\:`로 적는다.

  다음 경우는 blocked이며 아무것도 바꾸지 않는다.
  - 같은 문서에 새 이름의 섹션이 이미 있다(section_conflict). conflicts에는 그 대상 문서를 담는다.
  - 대상 문서에 바꿀 섹션이 없다(section_not_found).
  - 기존 이름과 같은 이름으로 바꾸려 한다(invalid_name).
  - 새 이름이 비었거나 `_`로 시작하거나 대괄호를 포함한다.
  - 새 이름을 그 섹션 키의 현재 형식이나 `\[[이름:섹션]]` 참조로 안전하게 적을 수 없다(unrepresentable). 키의 따옴표 형식을 바꾸지 않는다.
  - 프로젝트 탐색이 끝나지 않았다.
  - 코드 파일을 수집하는 중이다(위와 같이 색인이 이미 있을 때).
  - 존재하지 않는 참조를 고르는 등 선택이 잘못되었다.
  - 바꿀 파일의 원본을 UTF-8 손실 없이 보존할 수 없다.
  섹션 이름은 문서 안에서만 유일하면 되므로 다른 문서의 같은 이름 섹션은 충돌이 아니다.
반영: |
  blocked 상태인 요청은 rename_blocked로 거절하고 아무 파일도 바꾸지 않는다.
  반영은 미리보기와 같은 대상·새 이름·선택, 그리고 미리보기에서 받은 파일별 revision을 받아 다시 계산한 뒤 저장한다.
  미리보기 결과를 서버에 보관하지 않으므로 반영할 때 다시 계산한다.
  파일의 revision이 다르면 revision_conflict로 거절하고 아무 파일도 바꾸지 않는다.
  영향받는 파일이 미리보기 때와 달라지면 rename_affected_files_changed로 거절하고 미리보기를 다시 요청하도록 안내한다.
  쓰기 전에 모든 대상 파일을 쓸 수 있는지 확인하고, 하나라도 쓸 수 없으면 이유를 알리고 아무 파일도 바꾸지 않는다.

  파일은 하나씩 임시 파일에 기록한 뒤 교체한다.
  중간에 실패하면 이미 바꾼 파일을 원래 내용으로 되돌리려 시도한다.
  결과는 파일마다 변경됨(changed)·복구됨(restored)·복구 실패(restore_failed)·미변경(unchanged) 중 실제 상태로 알린다.
  복구하지 못한 파일은 rename_restore_failed로 알린다.
  여러 파일을 한 번에 바꾸는 원자성은 보장하지 않는다.
  저장 뒤 색인 반영과 그 실패 안내는 [[codocs_write]]와 같다.
VS Code에서 진행: |
  편집기에서 시작하는 위치, 저장하지 않은 파일이 있을 때의 중단, 모호한 참조의 선택과 결과 알림은 문서 이름 변경과 섹션 이름 변경 모두 [[VS Code 문서 이름 변경]]에서 설명한다.
