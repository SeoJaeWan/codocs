_codocs:
  id: reference
  name: 참조
  parent:
    - 제품 개념
개요: |
  참조는 지식 사이를 잇는 링크다. 문서와 문서를 연결해 관련 원문으로 이동하고 되돌아오게 한다.

  - [[문서 참조]]: 문서 섹션의 `\[[이름]]`으로 다른 문서를, `\[[이름:섹션]]`으로 다른 문서의 섹션을 가리킨다.

  코드 식별자의 이름만으로는 문서를 연결하지 않는다.
  문서의 name을 바꿀 때 그 문서를 가리키던 참조와 다른 문서의 parent를 함께 고치는 방법은 [[이름 변경]]에서 설명한다.

  아래 규칙은 참조의 표기와 대상 확인에 공통으로 적용한다.
표기: |
  대괄호 안에는 문서를 가리키는 `이름` 또는 문서의 섹션을 가리키는 `이름:섹션`을 쓴다.
  첫 번째 escape되지 않은 콜론이 이름과 섹션을 나눈다. 앞은 [[문서 속성]]의 name이고 뒤는 그 문서의 섹션 이름이다.
  이름이나 섹션 이름에 콜론이 들어가면 `\:`로 적는다.
  대괄호와 콜론 앞의 백슬래시가 홀수 개면 그 대괄호와 콜론은 글자이고(`\[[`, `\:`), 짝수 개면 백슬래시 글자 뒤의 원래 표기다.
  YAML 큰따옴표 문자열에서는 `\\`가 백슬래시 하나로 바뀐 뒤에 센다.
  대괄호 안이 다음과 같으면 문법 오류다.
  - 빈 이름
  - 이름 안에 남은 대괄호
  - escape되지 않은 콜론이 둘 이상
  - escape되지 않은 콜론 앞이나 뒤가 빔
  예를 들어 `\[[환불]]`은 환불 문서를, `\[[환불:환불정책]]`은 환불 문서의 환불정책 섹션을 가리킨다.
  `]]`로 닫지 않은 참조는 다음 `\[[` 앞까지를 문법 오류로 보고, 그 `\[[`부터 새 참조로 읽는다.
  같은 참조가 여러 번 나오면 나온 위치마다 따로 해석한다.
  같은 참조가 여러 번 나오면 나온 위치마다 따로 진단한다.
후보 찾기: |
  후보는 name이 공백·대소문자까지 정확히 같은 문서다.
  프로젝트의 모든 문서에서 찾으며 파일 하나가 후보 하나다.
  이름은 프로젝트 전체에서 유일해야 하므로 같은 이름의 문서가 둘 이상이면 duplicate_name 오류이고, 그 이름의 참조는 후보가 여럿인 모호한 참조가 된다.
대상 확인: |
  후보 수에 따라 대상을 판단한다.
  - 하나면 확정한다.
  - 없으면 부재로 안내한다.
  - 여러 개면 모호함으로 안내하고 대표를 고르지 않는다.
  문법 오류인 참조는 후보를 찾지 않는다.
  후보는 섹션 부분과 관계없이 이름 부분으로만 찾는다.
  확정된 참조만 연결과 역참조를 만든다.
  대상 문서에 오류가 있어도 확정되면 연결한다.
  대상 문서의 오류는 참조 위치에 경고로 안내한다.
섹션 확인: |
  이름 부분이 하나의 문서로 확정된 `이름:섹션` 참조만 섹션을 확인한다.
  섹션 이름은 대상 문서에서 `_codocs`를 뺀 최상위 키와 공백·대소문자까지 정확히 같아야 한다.
  - 대상 문서에 그 섹션이 있으면 섹션까지 확정한다.
  - 문서는 확정됐지만 그 섹션이 없으면 섹션 부재로 안내한다. 연결과 역참조는 만들지 않는다.
  문서가 확정되지 않은 참조(부재·모호·미확인)는 섹션을 확인하지 않는다.
판단 기준이 되는 원문: |
  대상은 마지막으로 저장된 원문의 색인으로 판단하고, 참조를 쓴 문서는 현재 편집 내용으로 해석한다.
  열린 대상 문서의 저장하지 않은 수정은 대상 판단에 쓰지 않는다. 섹션의 존재도 같은 기준으로 확인한다.
  대상 문서를 저장해 색인이 갱신되면 다시 판단한다.
  참조를 쓴 문서의 저장하지 않은 수정은 현재 편집 내용으로 해석한다. 자기 문서의 섹션을 가리키는 참조는 그 섹션도 현재 편집 내용으로 확인한다.
탐색이 끝나지 않았을 때: |
  탐색이 끝나지 않은 동안에는 후보 수와 관계없이 미확인으로 둔다.
  확인하지 못한 범위에 같은 이름의 문서가 있을 수 있기 때문이다.
  다시 탐색하는 동안 이전에 확인한 문서는 미확인 후보로 보존한다.
