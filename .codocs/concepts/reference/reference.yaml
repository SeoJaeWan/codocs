id: reference
name: '참조'
domains:
  - '제품 개념'
definition: |
  참조는 지식 사이를 잇는 링크다. 문서와 문서, 코드와 문서를 연결해 관련 원문으로 이동하고 되돌아오게 한다.
  쓰는 위치와 연결 조건에 따라 세 가지가 있다.

  - [[문서 참조]]: 문서 본문의 `\[[이름]]`으로 다른 문서를 가리킨다.
  - [[코드 참조]]: 코드·테스트의 `@codocs \[[이름]]#L11`로 문서 전체나 특정 행을 가리키고, 문서에서는 그 코드로 돌아간다.
  - [[식별자 참조]]: 별도 표기 없이 코드 식별자와 문서 ID가 일치하면 연결한다.

  아래 규칙은 여러 참조에 공통으로 적용한다.

  ## 이름과 도메인

  문서 참조와 코드 참조는 대괄호 안에 문서의 id가 아닌 [[문서 속성]]의 name을 쓴다.
  공백·대소문자를 정확히 비교하고 trim이나 표기 보정을 하지 않는다.
  `[[제품 개념:문서]]`처럼 콜론 앞에 도메인을 적으면 그 도메인에 속한 문서 중에서만 찾는다.
  도메인을 생략하면 전체 이름 공간에서 찾으며 참조를 쓴 문서의 도메인을 우선하지 않는다.
  같은 이름이 여러 도메인에 있으면 도메인을 지정해야 하나의 대상으로 연결된다.

  첫 번째 escape되지 않은 콜론이 도메인과 이름의 구분자다. 이름과 도메인 자체에 들어가는 콜론은 `\:`로 작성한다.
  참조 시작 앞의 연속 백슬래시가 홀수이면 연결하지 않는 글자다.
  빈 이름·도메인, 남은 대괄호·추가 구분자·닫히지 않은 참조는 문법 오류다.

  ## 대상 확인

  참조가 가리킨 대상은 확정·부재·모호함·미확인 중 하나로 판단한다.
  후보가 하나일 때만 확정하며, 없으면 부재, 여러 개면 모호함으로 안내하고 임의의 대표를 고르지 않는다.
  표기가 올바르다는 것과 대상이 확정됐다는 것은 구분한다. 확정되지 않은 참조는 진단이나 안내만 남기고 연결이나 역참조를 만들지 않는다.

  ## 판단 기준이 되는 원문

  대상의 이름·도메인·ID와 행 범위는 마지막으로 저장된 원문과 색인으로 판단한다.
  열려 있는 대상 문서의 저장하지 않은 수정은 대상 판단에 반영하지 않으며, 저장과 색인 갱신 뒤 다시 판단한다.
  참조를 쓰고 있는 문서나 코드의 저장하지 않은 수정은 현재 편집 내용으로 해석한다.

  ## 탐색이 끝나지 않았을 때

  프로젝트의 문서를 모두 확인하지 못한 동안에는 확인하지 못한 범위에 같은 이름이나 ID의 문서가 있을 수 있다.
  따라서 후보가 0개나 1개여도 부재나 확정으로 판단하지 않고 미확인으로 둔다.
  처음 탐색이 끝나기 전에는 확정된 연결이 없으므로 연결을 제공하지 않는다.
  이후 다시 탐색할 때는 이전에 확정한 연결을 미확인 상태로 보존하며, 완전한 탐색이 끝난 뒤에만 연결을 다시 확정한다.

  ## 역참조

  확정된 문서 참조와 코드 참조는 대상 문서에서 반대 방향으로도 찾을 수 있다.
  문서 참조는 대상 문서를 참조하는 문서 목록으로, 코드 참조는 대상 행이나 문서에 연결된 코드 위치로 돌아간다.
