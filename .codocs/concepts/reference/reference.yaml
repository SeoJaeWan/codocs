id: reference
name: '참조'
domains:
  - '제품 개념'
definition: |
  참조는 지식 사이를 잇는 링크다. 문서와 문서, 코드와 문서를 연결해 관련 원문으로 이동하고 되돌아오게 한다.
  쓰는 위치와 연결 조건에 따라 세 가지가 있다.

  - [[문서 참조]]: 문서 본문의 `\[[이름]]`으로 다른 문서를 가리킨다.
  - [[코드 참조]]: 코드·테스트의 `@codocs \[[이름]]#L11`로 문서 전체나 특정 행을 가리키고, 문서에서는 그 코드로 돌아간다.
  - [[식별자 참조]]: 별도 표기 없이 코드 식별자와 문서 ID가 일치하면 연결한다.

  아래 규칙은 여러 참조에 공통으로 적용한다.

  ## 표기

  대괄호 안에는 [[문서 속성]]의 name을 쓴다.
  `\[[제품 개념:문서]]`처럼 첫 번째 escape되지 않은 콜론 앞에 도메인을 적는다.
  이름과 도메인에 들어가는 콜론은 `\:`로 작성한다.
  `\[[` 앞의 연속 백슬래시가 홀수이면 참조가 아닌 글자다.
  백슬래시 개수는 YAML이 해석한 문자열에서 센다.
  대괄호 안의 구성이 다음과 같으면 문법 오류다.
  - 빈 이름이나 빈 도메인
  - 이름 안에 남은 대괄호
  - escape되지 않은 두 번째 콜론
  닫히지 않은 참조는 다음 `\[[` 앞이나 본문 끝에서 문법 오류로 끝난다.
  같은 참조가 여러 번 나오면 나온 위치마다 따로 해석하고 진단한다.

  ## 후보 찾기

  후보는 name이 공백·대소문자까지 정확히 같은 문서다.
  도메인을 적으면 그 도메인에 속한 문서에서만 찾는다.
  도메인을 생략하면 모든 도메인에서 찾는다.
  여러 도메인에 속한 문서도 파일 하나가 후보 하나다.
  같은 이름이 여러 도메인에 있으면 도메인을 적어야 하나로 정해진다.

  ## 대상 확인

  후보 수에 따라 대상을 판단한다.
  - 하나면 확정한다.
  - 없으면 부재로 안내한다.
  - 여러 개면 모호함으로 안내하고 대표를 고르지 않는다.
  문법 오류인 참조는 후보를 찾지 않는다.
  확정된 참조만 연결과 역참조를 만든다.
  대상 문서에 오류가 있어도 확정되면 연결한다.
  대상 문서의 오류는 참조 위치에 경고로 안내한다.

  ## 판단 기준이 되는 원문

  대상은 마지막으로 저장된 원문의 색인으로 판단한다.
  대상 문서를 저장해 색인이 갱신되면 다시 판단한다.
  참조를 쓴 문서의 저장하지 않은 수정은 현재 편집 내용으로 해석한다.
  참조를 쓴 코드의 저장하지 않은 수정은 현재 편집 내용으로 해석한다.

  ## 탐색이 끝나지 않았을 때

  탐색이 끝나지 않은 동안에는 후보 수와 관계없이 미확인으로 둔다.
  확인하지 못한 범위에 같은 이름의 문서가 있을 수 있기 때문이다.
  다시 탐색하는 동안 이전에 확인한 문서는 미확인 후보로 보존한다.
