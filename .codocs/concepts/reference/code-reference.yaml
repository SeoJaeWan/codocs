_codocs:
  id: code-reference
  name: 코드 참조
  parent:
    - 참조
개요: |
  코드 참조는 코드·테스트·일반 텍스트 파일에서 문서나 문서의 섹션을 가리키는 [[참조]]다.
  코드에서 설명이 있는 문서로 이동하고, 문서에서 그 문서를 가리키는 코드 위치로 돌아가게 한다.
  표기의 정체는 문서 이름과 섹션 이름이며 코드의 행 번호나 문서의 행 번호를 쓰지 않는다. 문서를 고쳐도 표기를 보정할 필요가 없다.
  코드 식별자의 이름만으로는 문서를 연결하지 않는다.
표기: |
  파일 안에서 `@codocs`와 [[참조]]의 표기를 이어 쓴다.
  - `@codocs \[[이름]]`: 문서 전체를 가리킨다.
  - `@codocs \[[이름:섹션]]`: 문서의 섹션 하나를 가리킨다.
  이름과 섹션의 나눔, 콜론 escape, 문법 오류는 [[참조]]의 표기를 따른다.
  표기는 `]]`에서 끝난다. 그 뒤에 `#L11` 같은 글자가 이어져도 표기에 포함하지 않고 일반 글자로 둔다.
  예를 들어 `@codocs \[[환불]]#L2`는 환불 문서 전체를 가리키는 참조 하나이며 진단은 없다.
  같은 파일에 같은 참조가 여러 번 나오면 나온 위치마다 따로 해석한다.
대상 확인: |
  대상은 [[참조]]의 후보 찾기·대상 확인·섹션 확인을 그대로 따른다.
  - 문서가 하나로 확정되면 문서 전체 참조는 연결한다.
  - 문서가 하나로 확정되고 섹션이 있으면 섹션 참조를 연결한다.
  - 문서는 확정됐지만 섹션이 없으면 섹션 부재(missing_section)로 안내하며 연결하지 않는다. 편집기 진단 코드는 `codocs.codeReference.missing_section`이고 메시지는 "대상 문서에 해당 섹션이 없습니다."다.
  - 문서가 없으면 부재로, 같은 이름의 문서가 여럿이면 모호함으로 안내하며 연결하지 않는다.
  - 문서 탐색이 끝나지 않았으면 미확인으로 두고 연결하지 않는다.
  대상은 마지막으로 저장된 문서 원문의 색인으로 판단한다. 대상 문서에 저장하지 않은 수정이 있어도 판단에 쓰지 않는다.
코드 참조 진단: |
  해석하지 못한 표기, 없는 문서, 없는 섹션, 여러 후보는 error이고 문서 탐색이 끝나지 않아 확정하지 못한 표기는 warning이다. 오류와 미확인은 섞지 않는다.
  [[codocs_validate]]·[[codocs_refresh]]와 편집기는 같은 진단 코드(`codocs.codeReference.<상태>`)와 문구, 같은 심각도를 쓴다. MCP의 진단은 path가 코드 파일이고 range가 표기의 위치다.
  코드 수집이 끝나지 않았거나 일부 파일을 읽지 못했으면 확인한 결과만 알리고 수집 상태를 함께 알려 오류가 없다는 뜻으로 읽히지 않게 한다.
문서 변경과 코드 참조: |
  [[codocs_write]]의 update·replace·delete는 이번 변경으로 코드 참조가 새로 깨지면 저장하지 않는다. 이전부터 깨져 있던 표기는 막지 않는다.
  확인해야 하는 코드 파일을 읽지 못했으면 깨지지 않았다고 보지 않고 저장하지 않는다.
코드에서 문서로: |
  확정된 참조를 편집기에서 누르면 대상 문서를 연다.
  - 섹션 참조는 대상 문서에서 그 섹션의 키가 있는 위치로 이동한다.
  - 문서 전체 참조는 대상 문서의 맨 위로 이동한다.
  누르는 순간 코드 파일의 그 위치에 같은 표기가 그대로 있는지, 대상 문서의 원문이 색인과 같은지 다시 확인한다.
  코드 파일이 바뀌었거나 색인이 오래되었으면 오래된 위치로 이동하지 않는다.
문서에서 코드로: |
  문서를 가리키는 코드 위치는 문서 쪽에서도 확인할 수 있다. 확정된 참조만 대상이 된다.
  - 섹션 키 위에 커서를 두면 그 섹션을 가리키는 코드 참조의 목록을 보여준다.
  - `_codocs.name` 값 위에 커서를 두면 그 문서 전체를 가리키는 코드 참조의 목록을 보여준다.
  목록은 코드가 하나여도 여럿이어도 같은 형식이며, 각 항목을 누르면 그 코드 위치로 이동한다.
  섹션을 가리키는 참조는 섹션 목록에만, 문서 전체를 가리키는 참조는 이름 목록에만 나타난다.

  편집기는 섹션 키 옆과 문서의 첫 행에 `코드 N곳`을 표시한다.
  - 섹션 키 옆에는 그 섹션을 가리키는 코드 참조의 수를 표시한다.
  - 문서의 첫 행에는 그 문서 전체를 가리키는 코드 참조의 수를 표시한다.
  - 코드 참조가 없으면 표시하지 않는다.
  - 수집이 끝난 상태의 표시다. 코드 파일을 다시 수집하는 중에는 이전 결과를 유지한 채 `확인된 코드 N곳 · 수집 중`으로, 일부 파일을 읽지 못했으면 `확인된 코드 N곳 · 수집 불완전`으로 바뀐다.
  - 처음 수집이 끝나기 전에는 개수 없이 `코드 연결 수집 중`만 표시한다.
  이 표시는 개수만 알리며 눌러도 이동하지 않는다.
  코드에 줄을 추가해 표기의 위치가 옮겨져도 다시 수집하면 목록의 위치만 바뀐다. 가리키는 대상은 그대로다.
코드 파일 수집: |
  코드 참조는 프로젝트의 코드 파일에서 수집한다.
  - Git이 추적하는 파일은 프로젝트의 `.gitignore`와 일치해도 읽는다.
  - 추적하지 않는 파일은 프로젝트의 `.gitignore`에서 제외하지 않은 것만 읽는다. Git 저장소가 아닌 프로젝트도 같은 규칙으로 읽는다.
  - 프로젝트 root의 `.codocsignore`와 일치하는 파일과 일치하는 폴더 아래의 모든 파일은 Git 추적과 무관하게 읽지 않는다.
  - 심볼릭 링크와 프로젝트 밖 파일은 읽지 않는다.
  - UTF-8로 손실 없이 읽을 수 없는 파일은 건너뛴다.
  `.codocsignore`는 `.gitignore`와 같은 문법으로 쓰며 코드 참조 수집에서 뺄 경로를 정한다.
  - 프로젝트 root의 `.codocsignore`만 읽는다. 하위 폴더의 `.codocsignore`는 규칙 파일이 아니다.
  - 제외만 하며 `!`는 같은 파일의 앞선 패턴만 취소한다. `.gitignore`가 제외한 파일을 되살리지 않고, 폴더가 제외되면 그 아래 `!`로도 되살리지 않는다.
  - 제외한 경로에 둔 코드 참조는 확인한 출현·진단·역참조 목록·편집기 진단·이름 변경 대상에 나타나지 않는다. 문서(`.codocs`) 탐색에는 영향이 없다.
  - `.codocsignore`를 만들거나 고치거나 지우면 제외 범위를 다시 계산해 새로 제외한 경로의 출현은 사라지고 제외에서 뺀 경로는 다시 수집한다.
  - `.codocsignore`를 읽지 못하면 제외 범위를 확인하지 못한 것이므로 수집이 불완전하며 실패 경로는 `.codocsignore`다. 이때 추적 파일을 포함해 어느 코드 파일도 확인한 것으로 보지 않는다.
  파일이 바뀌면 감시가 알려 해당 경로만 다시 읽는다. 제외한 경로의 변경은 다시 읽지 않는다.
  편집기에서 열린 코드 파일은 저장하지 않은 현재 내용으로 표기를 찾는다.
  일부 파일을 읽지 못하면 수집이 불완전하다고 알리고 읽은 파일의 참조는 계속 사용한다.
  문서 탐색과 달리 코드 파일은 읽기만 하며, 코드 파일을 고치는 경우는 [[이름 변경]]이 코드 파일의 표기까지 고치는 때뿐이다.
