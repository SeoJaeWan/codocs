id: document-link
name: '문서 참조'
domains:
  - '제품 개념'
deprecatedAliases: []
definition: |
  문서 본문에서 `\[[이름]]`으로 다른 문서를 가리키는 [[참조]]다.
  설명에 필요한 다른 문서를 연결하며, 편집기에서는 클릭해 대상 문서로 이동한다.

  ## 쓰는 위치

  definition에서 사용한다.
  문서 이름·ID·사용자 필드에 같은 표기를 넣어도 연결로 해석하지 않는다.
  자기 문서를 가리키는 참조는 연결하지 않는다. 서로 다른 문서 사이의 상호 참조는 허용한다.

  ## YAML 안의 표기

  이름·도메인과 escape 규칙은 [[참조]]의 공통 규칙을 따르며 YAML 해석 후 문자열에 적용한다.
  작은따옴표와 literal 블록은 백슬래시를 그대로 보존하며 큰따옴표에서는 백슬래시 자체를 한 번 더 escape한다.

  ```yaml
  definition: |
    [[문서 속성]]에서 작성할 속성을 확인한다.
    \[[문서 속성]]은 연결하지 않는 글자다.
  ```

  ## 역참조

  확정된 문서 참조는 대상 문서 쪽에서도 확인할 수 있다.
  [[codocs_get]] 결과의 referencedBy가 대상 문서를 참조하는 문서들을 보여준다.
  대상이 확정되지 않은 참조는 역참조에 나타나지 않는다.
