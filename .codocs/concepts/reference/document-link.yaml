_codocs:
  id: document-link
  name: 문서 참조
  parent:
    - 참조
개요: |
  문서의 섹션에서 `\[[이름]]`으로 다른 문서를, `\[[이름:섹션]]`으로 다른 문서의 섹션을 가리키는 [[참조]]다.
  설명에 필요한 다른 문서나 섹션을 연결하며, 편집기에서는 클릭해 대상으로 이동한다.
쓰는 위치: |
  모든 섹션의 문자열에서 사용한다.
  `_codocs`의 이름·ID·parent에 같은 표기를 넣어도 연결로 해석하지 않는다.
  parent는 문서의 소속을 나타내는 이름이며 참조가 아니므로 역참조도 만들지 않는다.
  `\[[이름]]`으로 자기 문서를 가리키는 참조는 연결하지 않는다. 서로 다른 문서 사이의 상호 참조는 허용한다.
같은 문서의 섹션: |
  `\[[자기 이름:섹션]]`으로 자기 문서의 섹션을 가리키는 참조는 문서 사이의 참조가 아니다.
  - 그 섹션이 있으면 같은 문서 안에서 그 섹션으로 이동하는 링크가 된다. 진단은 없다.
  - 그 섹션이 없으면 [[참조]]의 섹션 부재로 안내한다.
  문서 사이의 연결이 아니므로 references·referencedBy와 역참조에 넣지 않는다.
YAML 안의 표기: |
  이름과 escape 규칙은 [[참조]]의 공통 규칙을 따르며 YAML 해석 후 문자열에 적용한다.
  작은따옴표와 literal 블록은 백슬래시를 그대로 보존하며 큰따옴표에서는 백슬래시 자체를 한 번 더 escape한다.

  ```yaml
  개요: |
    [[문서 속성]]에서 작성할 속성을 확인한다.
    \[[문서 속성]]은 연결하지 않는 글자다.
  ```
역참조: |
  확정된 문서 참조는 대상 문서 쪽에서도 확인할 수 있다.
  [[codocs_get]] 결과의 referencedBy가 대상 문서를 참조하는 문서들을 보여준다.
  대상이 확정되지 않은 참조는 역참조에 나타나지 않는다.
  섹션까지 확정된 다른 문서의 참조는 문서 단위 역참조에 더해 어느 섹션이 어느 섹션을 가리키는지도 [[문서 색인]]에 남는다. 이 섹션 단위 역참조는 MCP 도구로 조회하지 않는다.
