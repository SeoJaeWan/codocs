id: identifier-link
name: '식별자 참조'
domains:
  - '제품 개념'
deprecatedAliases:
  - id: match-identifier
  - id: identifier-matching
definition: |
  코드에 별도 표기를 쓰지 않아도 코드 식별자와 문서 ID가 일치하면 연결되는 [[참조]]다.
  편집기에서 식별자에 마우스를 올리면 연결된 문서의 설명을 호버로 보여준다. [[코드 참조]] 표기 안에서는 식별자 참조를 표시하지 않는다.
  예를 들어 returnZone은 ID가 return-zone인 문서와 연결되지만 returnOldZone은 중간 단어를 건너뛰어 같은 ID로 연결하지 않는다.

  ## 비교 대상

  문서의 현재 id와 deprecatedAliases의 이전 ID를 비교한다. 문서 name과 사용자 속성 aliases는 비교하지 않는다.
  식별자는 언어 문법으로 검증한 코드 식별자에 한정하지 않으며 주석·문자열의 텍스트도 포함한다.
  문서 본문에 함수명을 적거나 폴더·도메인을 맞추는 것만으로는 연결이 생기지 않는다.

  ## 일치 조건

  camelCase·PascalCase·snake_case·kebab-case를 단어로 나누고 대소문자를 무시해 비교한다.
  연속 대문자는 마지막 대문자 앞에서 나누므로 HTTPServer는 HTTP와 Server, getURLValue는 get·URL·Value가 된다. 글자와 숫자 사이도 나누며 zone2Count는 zone·2·Count다.
  연속한 단어 묶음에서만 찾으며 중간 단어나 숫자를 건너뛰지 않는다. 앞뒤에 다른 단어가 붙어 있는 것은 허용한다.
  공백·줄바꿈·비영어 문자·점·슬래시 같은 구두점은 단어 묶음을 끊는다.
  마지막 단어는 단수형으로도 비교하므로 return-zone은 returnZones와도 연결된다.

  ## 여러 문서가 걸릴 때

  한 위치에 여러 문서가 걸리면 현재 ID 일치, 일치한 단어 수가 많은 것, 단수화 없이 일치한 것 순서로 우선한다.
  이 기준까지 같으면 하나를 임의로 고르지 않고 모두 보여준다. 코드 경로·도메인·폴더로 후보를 숨기거나 우선하지 않는다.
  같은 현재 ID의 문서가 여러 개면 ID 충돌로 안내하며 대표 문서를 고르지 않는다.
  검증 오류가 있는 문서도 확인할 수 있는 현재 ID와 이전 ID로는 연결된다.
  호버에는 우선한 문서의 설명과 함께, 같은 식별자 안에서 함께 연결된 용어와 그 문서가 참조하거나 참조받는 문서의 링크를 보여준다.
