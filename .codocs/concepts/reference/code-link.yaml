id: code-link
name: '코드 참조'
domains:
  - '제품 개념'
deprecatedAliases:
  - id: code-reference
definition: |
  코드·테스트 등 프로젝트 텍스트에서 `@codocs`로 근거가 되는 문서 전체나 특정 행·범위를 명시적으로 가리키는 [[참조]]다.
  식별자 이름으로 표현하지 못하는 검증 조건·제약 조건도 연결할 수 있으며 함수명·테스트명과 문서 ID의 일치를 요구하지 않는다.

  - 문서 전체: `@codocs \[[문서]]`
  - 특정 행: `@codocs \[[문서]]#L11`
  - 행 범위: `@codocs \[[문서]]#L11-L12`
  - 도메인을 지정한 행 범위: `@codocs \[[제품 개념:문서]]#L11-L12`

  ## 쓰는 위치

  언어·확장자·주석 여부로 표기를 제한하지 않는다. 주석·문자열·일반 텍스트에 같은 표기가 있으면 각각 하나의 참조다.
  대상은 현재 프로젝트의 .codocs에서만 찾으며 다른 프로젝트나 상위 폴더의 .codocs와 섞지 않는다.
  같은 파일이나 같은 줄에 여러 번 나와도 각각 별도 참조로 다룬다.
  문서 참조의 쓰는 위치 제한과 자기 문서 참조 규칙은 코드 텍스트에 적용하지 않는다.

  ## 행 지정

  행 지정은 닫는 대괄호 바로 뒤에 붙인다. 번호는 YAML 원문의 1부터 시작하는 행이며 범위의 끝 행을 포함한다.
  대괄호 안의 콜론을 행 구분자로 재해석하지 않는다.
  대상 없음·모호한 이름·잘못된 행 형식·역전 범위·파일 범위 초과를 구분하며 임의 대상이나 보정된 범위로 연결하지 않는다.

  행 번호는 문장을 따라가는 고정 식별자가 아니다. 문서 앞부분에 줄을 넣어 설명이 밀려도 표기의 번호를 자동으로 고치거나 원래 문장의 새 위치를 추측하지 않는다.
  문서를 고쳐 가리키던 줄이 바뀌면 코드의 표기도 함께 고친다.

  ## 편집기에서의 동작

  올바른 표기는 문서 설명 호버 없이 지정한 문서·행·범위로 이동하는 링크가 된다. 표기 범위에는 [[식별자 참조]]의 호버를 표시하지 않는다.
  잘못된 표기에는 밑줄과 원인을 알려주는 호버를 표시하며, 같은 텍스트의 식별자 참조로 대신 연결하지 않는다.

  ## 문서에서 코드로 돌아가기

  확정된 코드 참조는 대상 문서에서 연결한 코드의 실제 위치로 돌아가는 링크가 된다. 문서에 코드 경로를 따로 적지 않는다.
  행을 지정한 참조는 해당 행에서 돌아간다. 연결이 1곳이면 바로 이동하고, 2곳 이상이면 `연결된 코드 · N곳` 호버에서 위치를 고른다.
  행 지정 없이 문서 전체를 가리킨 참조는 문서 상단에 `문서 전체에 연결된 코드 · N곳`으로 표시된다.
  구현과 테스트가 같은 행을 함께 가리키는 것은 정상적인 복수 연결이다.
