id: code-link
name: '코드 참조'
domains:
  - '제품 개념'
deprecatedAliases:
  - id: code-reference
definition: |
  코드·테스트 등 프로젝트 텍스트에서 `@codocs`로 근거가 되는 문서 전체나 특정 행·범위를 명시적으로 가리키는 [[참조]]다.
  식별자 이름으로 표현하지 못하는 검증 조건·제약 조건도 연결할 수 있으며 함수명·테스트명과 문서 ID의 일치를 요구하지 않는다.

  - 문서 전체: `@codocs \[[문서]]`
  - 특정 행: `@codocs \[[문서]]#L11`
  - 행 범위: `@codocs \[[문서]]#L11-L12`
  - 도메인을 지정한 행 범위: `@codocs \[[제품 개념:문서]]#L11-L12`

  ## 쓰는 위치

  언어·확장자·주석 여부로 표기를 제한하지 않는다. 주석·문자열·일반 텍스트에 같은 표기가 있으면 각각 하나의 참조다.
  대상은 현재 프로젝트의 .codocs에서만 찾으며 다른 프로젝트나 상위 폴더의 .codocs와 섞지 않는다.
  같은 파일이나 같은 줄에 여러 번 나와도 각각 별도 참조로 다룬다.
  문서 참조의 쓰는 위치 제한과 자기 문서 참조 규칙은 코드 텍스트에 적용하지 않는다.

  ## 행 지정

  행 지정은 닫는 대괄호 바로 뒤에 붙인다. 번호는 YAML 원문의 1부터 시작하는 행이며 범위의 끝 행을 포함한다.
  대괄호 안의 콜론을 행 구분자로 재해석하지 않는다.
  대상 없음·모호한 이름·잘못된 행 형식·역전 범위·파일 범위 초과를 구분하며 임의 대상이나 보정된 범위로 연결하지 않는다.

  행 번호는 문장을 따라가는 고정 식별자가 아니다. 문서 앞부분에 줄을 넣어 설명이 밀려도 표기의 번호를 자동으로 고치거나 원래 문장의 새 위치를 추측하지 않는다.
  문서를 고쳐 가리키던 줄이 바뀌면 코드의 표기도 함께 고친다.

  ## 편집기에서의 동작

  올바른 표기는 문서 설명 호버 없이 지정한 문서·행·범위로 이동하는 링크가 되며, 누르면 [[원문 열기]]로 이동한다. 표기 범위에는 [[코드 호버]]를 표시하지 않는다.
  잘못된 표기에는 밑줄과 원인을 알려주는 호버를 표시하며, 같은 텍스트의 식별자 참조로 대신 연결하지 않는다. 표기를 고치거나 대상을 저장해 해결되면 안내를 지운다. 별도 팝업이나 자동 수정은 하지 않는다.

  ## 문서에서 코드로 돌아가기

  확정된 코드 참조는 대상 문서에서 연결한 코드의 실제 위치로 돌아가는 링크가 된다. 문서에 코드 경로를 따로 적지 않는다.
  행을 지정한 참조는 해당 행에서 돌아간다. 연결이 1곳이면 편집기의 이동 동작으로 바로 열고, 2곳 이상이면 `연결된 코드 · N곳` 호버에서 위치를 고른다. 2곳 이상일 때 본문을 눌러도 파일이나 선택 창이 열리지 않는다.
  호버의 링크는 프로젝트 상대 경로와 1부터 세는 행 번호로 구분하며 같은 줄에 여러 번 나오면 열 번호도 보여준다.
  같은 줄에 [[참조 링크]]가 있으면 그 부분은 문서 이동을 유지하고, 코드 연결은 1곳이어도 호버의 링크로 준다. 줄 앞뒤 공백에는 링크를 두지 않는다.

  행 지정 없이 문서 전체를 가리킨 참조는 문서 첫 줄 앞에 `문서 전체에 연결된 코드 · N곳`으로 표시된다. N은 문서 전체 참조만 세며 행 참조 수를 더하지 않는다.
  이 표시는 편집기 화면에만 나타나며 YAML 원문이나 행 번호를 바꾸지 않는다. VS Code의 Inlay Hint로 보여주므로 editor.inlayHints.enabled를 끄면 함께 숨겨지며, 설정을 강제로 바꾸지 않는다.
  연결 수가 바뀌면 표시·호버·이동을 함께 바꾸고, 수집이 끝났는데 0곳이면 표시를 지운다.
  구현과 테스트가 같은 행을 함께 가리키는 것은 정상적인 복수 연결이며 중복이나 모호함으로 경고하지 않는다.

  [[코드 참조 수집]]이 처음 수집하는 동안에는 링크 없이 `코드 연결 수집 중`만 보여준다. 일부를 읽지 못했으면 `수집 불완전`과 이유를, 감시를 다시 연결하는 중이면 `확인된 코드 N곳 · 감시 재연결 중`과 자동 갱신 안내를 함께 보여준다.
