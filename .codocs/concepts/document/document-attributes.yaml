id: document-attributes
name: '문서 속성'
domains:
  - '제품 개념'
definition: |
  [[문서]]를 이루는 속성과 각 속성의 역할·작성 규칙이다.
  문서는 id·name·definition·domains 네 속성을 모두 가져야 하며, 이 밖의 속성은 사용자 속성으로 보존한다.

  ## id

  현재 문서의 식별자다. 영어로 작성하며 ID 기반 조회·수정의 기준이 된다.
  프로젝트 전체에서 유일해야 하며 중복은 오류다. 중복 검사로 변경 이력을 추적하지는 않는다.
  소문자·숫자를 하이픈으로 연결하며 형식은 `^[a-z0-9]+(?:-[a-z0-9]+)*$`다. 시작·끝·연속 하이픈, 공백과 밑줄을 허용하지 않는다.
  문서용 이름·도메인·위치 변경만으로 ID를 바꿀 필요는 없다.
  ID를 바꾸면 이전 ID를 남기지 않으며, 이후 조회·수정은 새 ID로 한다.

  ## name

  문서의 이름이다. 원하는 언어로 작성하며 [[문서 참조]]는 ID가 아닌 이 이름을 사용한다.
  ID만 바뀌고 이름이 같으면 참조는 유지된다.

  이름은 도메인마다 구분한다. 다른 도메인에는 같은 이름의 문서가 있을 수 있지만, 같은 도메인에 같은 이름이 있으면 충돌이다.
  여러 도메인에 속한 문서는 각 도메인에 같은 이름으로 등록된다.
  같은 이름이 여러 도메인에 있을 때 대상을 가리키는 방법은 [[참조]]에서 설명한다.

  ## definition

  문서의 본문이다. 정의·규칙·조건·예외·판단 근거·작업 흐름을 담는다.
  여러 줄 문자열로 작성하며 본문 안의 [[문서 참조]]가 다른 문서와의 연결이 된다.

  ## domains

  문서가 속한 도메인의 문자열 배열이며 하나 이상 작성한다.
  도메인은 문서가 설명하는 책임·주제의 분류이자 문서 이름을 구분하는 범위다. 같은 이름이 영역마다 다른 뜻으로 쓰여도 도메인으로 나누어 각각 문서로 관리할 수 있다.
  한 문서가 여러 책임 영역을 함께 다루면 여러 도메인에 속할 수 있다.
  도메인은 domains에 적은 문자열로만 정하며 파일·폴더 이름에서 추론하지 않는다. 코드가 사용될 위치를 제한하지도 않는다.

  문서 목록은 도메인으로 걸러 조회할 수 있다. 문서가 속한 도메인 중 하나가 같으면 해당 도메인의 문서로 본다.
  어느 문서에도 쓰이지 않은 도메인으로 조회하면 빈 목록이다.

  ## 값 규칙

  필수 문자열은 비거나 공백뿐일 수 없다.
  속성의 자료형에 맞지 않는 null과 빈 배열 원소 문자열은 오류다.
  속성별 최대 글자 수 제한은 두지 않는다. 파일 크기와 중첩 한계를 추가하려면 별도의 제품 정책으로 근거와 동작을 정한다.

  ## 사용자 속성

  네 속성 밖의 속성은 사용자 속성으로 경고 없이 보존한다.
  내부까지 재귀적으로 JSON 표현 가능 여부를 검사하며, 비유한 숫자 등 JSON으로 표현할 수 없는 값은 오류다.
  deprecatedAliases는 예외로, Codocs가 문서를 저장할 때 지운다. 이전 ID를 기록하는 속성은 두지 않는다.
  aliases 같은 사용자 속성은 이름 참조 기능을 갖지 않는다. 현재 사용하는 다른 이름을 별도 문서로 설명할 때는 원래 뜻을 참조한다.
