_codocs:
  id: document-attributes
  name: 문서 속성
  parent:
    - 문서
개요: |
  [[문서]]를 이루는 `_codocs` 객체와 섹션의 역할·작성 규칙이다.
  문서는 `_codocs` 하나와 하나 이상의 섹션으로 구성하며, 이 밖의 최상위 키는 허용하지 않는다.
  `_codocs`는 문서의 id·name·parent를 담고, 섹션은 문서의 설명을 나누어 담는다.
id: |
  `_codocs.id`는 문서의 내부 식별자다. 영어로 작성하며 ID 기반 조회·수정의 기준이 된다.
  프로젝트 전체에서 유일해야 하며 중복은 오류다. 중복 검사로 변경 이력을 추적하지는 않는다.
  소문자·숫자를 하이픈으로 연결하며 형식은 `^[a-z0-9]+(?:-[a-z0-9]+)*$`다. 시작·끝·연속 하이픈, 공백과 밑줄을 허용하지 않는다.
  문서의 이름·부모·위치가 바뀌어도 ID를 바꿀 필요는 없다.
  ID를 바꾸면 이전 ID를 남기지 않으며, 이후 조회·수정은 새 ID로 한다.
name: |
  `_codocs.name`은 문서의 이름이며 사용자가 문서를 가리키는 주소다. 원하는 언어로 작성하며 [[문서 참조]]는 ID가 아닌 이 이름을 사용한다.
  ID만 바뀌고 이름이 같으면 참조는 유지된다.
  이름은 프로젝트 전체에서 유일해야 하며, 같은 이름의 문서가 둘 이상이면 모두 duplicate_name 오류다.
  폴더나 부모가 달라도 같은 이름은 충돌이다.
parent: |
  `_codocs.parent`는 문서의 상위 문서 이름을 담는 문자열 배열이며 선택이다.
  작성하면 비어 있지 않은 배열이고, 각 항목은 비어 있지 않은 문자열이며 프로젝트에 있는 문서의 name이어야 한다.
  parent를 쓰지 않은 문서는 최상위 문서다.

  parent는 문서의 소속을 나타내며 참조가 아니다. parent에 적은 문서가 이 문서를 되가리키는 역참조가 되지는 않는다.
  없는 이름을 적으면 parent_not_found 오류다.
  문서가 자기 자신을 parent로 적거나 parent를 따라가다 다시 자신으로 돌아오면 parent_cycle 오류다.
  문서의 name이 바뀌면 다른 문서의 parent에 적은 그 이름도 [[이름 변경]]이 함께 고친다.
섹션: |
  `_codocs` 밖의 최상위 키는 모두 섹션이다. 키가 섹션의 이름이며 값이 섹션의 내용이다.
  섹션은 하나 이상 있어야 하고, 이름은 문서 안에서 유일하다.
  내용은 비어 있지 않은 문자열이다. 여러 줄 문자열로 작성하며 정의·규칙·조건·예외·판단 근거·작업 흐름을 담는다.
  내용 안의 [[문서 참조]]는 모든 섹션에서 다른 문서와의 연결이 된다.
  섹션 이름은 `_`로 시작할 수 없다. 이 접두는 `_codocs`처럼 Codocs가 쓰는 키를 위해 남겨 둔다.
  섹션 이름은 id·name처럼 다른 용도로 쓰이는 이름이어도 섹션으로만 해석한다.
값 규칙: |
  `_codocs`에는 id·name·parent만 둘 수 있으며 다른 키는 invalid_field_value 오류다.
  `_codocs`가 없으면 최상위에서 missing_required_field 오류이고, `_codocs` 안에 id나 name이 없으면 `_codocs` 값의 위치에서 missing_required_field 오류다.
  필수 문자열은 비거나 공백뿐일 수 없다.
  섹션의 내용이 문자열이 아니면 invalid_field_type 오류이고, 비어 있으면 invalid_field_value 오류다.
  속성의 자료형에 맞지 않는 null과 빈 배열 원소 문자열은 오류다.
  속성별 최대 글자 수 제한은 두지 않는다. 파일 크기와 중첩 한계를 추가하려면 별도의 제품 정책으로 근거와 동작을 정한다.
