id: document-format
name: '문서 형식'
domains:
  - '제품 개념'
definition: |
  [[문서]]를 파일로 작성하는 형식과 저장 위치다.

  ## YAML 형식

  YAML 파일 하나에 문서 하나를 저장하며 최상위 값은 속성 이름과 값을 짝지은 매핑이어야 한다.
  YAML 라이브러리가 해석할 수 있는 모든 구문을 Codocs 문서로 허용하는 것은 아니다.
  일반 값·목록·객체·주석·여러 줄 문자열과 단일 문서 시작 표시 `---`를 허용한다.
  중첩 매핑과 [[YAML 매핑 표기]]의 block·flow 표기를 모두 허용한다.

  문법 오류가 있는 원문, 빈 문서와 최상위 값이 매핑이 아닌 원문은 허용하지 않는다.
  앵커·별칭·병합 키·사용자 태그·복수 문서·중복 키도 허용하지 않는다.
  원문이 이 형식에 맞는지 확인하고 데이터로 해석하는 처리는 [[YAML 파싱]]에서 설명한다.
  도구로 문서를 수정해도 바꾸지 않은 속성의 공백·주석·따옴표·줄바꿈·순서는 그대로 유지한다.

  ## 저장 위치

  문서는 프로젝트의 .codocs 아래에 둔다. 제품은 고정 폴더 계층·config.yaml·문서별 버전 선언을 요구하지 않는다.
  파일·폴더 이름에서 식별자나 소속을 추론하지 않는다.
