id: document-format
name: '문서 형식'
domains:
  - '제품 개념'
deprecatedAliases: []
definition: |
  [[문서]]를 파일로 작성하는 형식과 저장 위치다.

  ## YAML 형식

  YAML 파일 하나에 문서 하나를 저장하며 최상위 값은 속성 이름과 값을 짝지은 매핑이어야 한다.
  YAML 라이브러리가 해석할 수 있는 모든 구문을 Codocs 문서로 허용하는 것은 아니다.
  일반 값·목록·객체·주석·여러 줄 문자열과 단일 문서 시작 표시 `---`를 허용한다.

  문법 오류가 있는 원문, 빈 문서와 최상위 값이 매핑이 아닌 원문은 허용하지 않는다.
  앵커·별칭·병합 키·사용자 태그·복수 문서·중복 키도 허용하지 않는다. 중복 키는 뒤에 나온 키를 진단하며 어느 값도 골라 쓰지 않는다.

  ## block과 flow 매핑

  매핑은 block과 flow 두 표기로 쓸 수 있고 중첩 매핑에도 모두 허용한다.
  block 매핑은 들여쓰기와 줄바꿈으로 항목을 구분한다.

  ```yaml
  id: payment
  name: 결제
  ```

  flow 매핑은 중괄호와 쉼표로 항목을 구분한다.

  ```yaml
  { id: payment, name: 결제 }
  ```

  두 예시는 같은 속성과 값을 나타낸다. 도구로 문서를 수정할 때는 작성한 표기를 그대로 두고 바꾼 속성만 고친다.

  ## 해석에 실패한 문서

  YAML 해석에 오류가 하나라도 있으면 문서 전체를 해석 실패로 본다. 일부 구조를 읽을 수 있더라도 그 내용으로 ID·이름·참조를 추측해 색인에 넣지 않는다.
  실패한 문서도 원문과 [[진단]]은 보존하므로 조회해서 고칠 수 있다.
  해석에 성공해도 속성 값이 올바르다는 뜻은 아니며, 속성 검사는 [[문서 검증]]이 맡는다. 빠진 속성을 채우거나 원문을 정규화하지 않는다.

  ## 원문 보존과 위치

  도구로 문서를 수정해도 바꾸지 않은 속성의 공백·주석·따옴표·줄바꿈·순서는 그대로 유지하며 문서 전체를 다시 포맷하지 않는다.
  진단·참조 링크의 위치는 따옴표·escape·여러 줄 문자열이 있어도 원문의 실제 글자를 가리킨다.

  ## 저장 위치

  문서는 프로젝트의 .codocs 아래에 둔다. 제품은 고정 폴더 계층·config.yaml·문서별 버전 선언을 요구하지 않는다.
  파일·폴더 이름에서 식별자나 소속을 추론하지 않는다.
