id: revision
name: '원문 버전'
domains:
  - '제품 개념'
definition: |
  원문 버전(revision)은 문서 파일을 읽은 시점의 내용을 나타내는 값이다.
  파일 내용 전체로 계산하므로 주석·공백·줄바꿈 한 글자만 바뀌어도 값이 달라지고, 내용이 같으면 언제 계산해도 같은 값이다.
  문서 속성이나 편집 횟수가 아니며 편집 이력을 기록하지도 않는다.

  ## 쓰임

  [[codocs_get]]은 문서를 읽은 시점의 revision을 함께 돌려준다.
  [[codocs_write]]로 수정할 때 이 값을 보내면, 저장 직전 실제 파일의 revision과 비교해 그사이 다른 사람이나 도구가 파일을 바꿨는지 확인한다. 다르면 저장하지 않고 revision_conflict로 알린다.
  revision은 읽은 시점의 내용만 나타내며 최신 파일 내용을 확인하거나 동시 수정을 잠그는 장치는 아니다.
