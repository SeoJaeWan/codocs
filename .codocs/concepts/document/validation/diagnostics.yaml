id: diagnostics
name: '진단'
domains:
  - '제품 개념'
definition: |
  진단은 문서나 요청에서 발견한 문제를 사용자가 고칠 수 있도록 원인과 위치를 알려주는 정보다.
  같은 실패라도 문법 오류·파일 접근 실패·이름 충돌처럼 고치는 방법이 다르므로, 문제의 종류와 실제 문서·탐색·저장 상태를 구분해 알려준다.
  편집기와 MCP 도구는 같은 진단을 같은 의미로 보여준다.

  ## 진단에 담기는 정보

  - code: 문제의 종류를 구분하는 코드
  - severity: error 또는 warning. error는 문서나 요청이 유효하지 않다는 뜻이고 warning은 저장을 막지 않는 문제다.
  - message: 사람이 읽을 설명
  - path: 문제가 있는 파일 경로
  - range: 원문에서 문제가 있는 위치
  - fieldPath: 문제가 있는 값의 위치. 최상위 속성부터 속성 이름과 0부터 세는 배열 순번을 차례로 담는다. 예를 들어 deprecatedAliases 첫 항목의 id는 `["deprecatedAliases", 0, "id"]`다.
  - relatedIds: 함께 봐야 할 문서 ID
  - ioCode: 파일 접근에 실패했을 때 확인한 시스템 오류 코드
  - suggestion: 다음에 할 일 안내

  code·severity·message는 항상 있고 나머지는 확인된 경우에만 담는다. 확인하지 못한 위치를 추측해 만들지 않으며, 위치를 모르면 파일 전체를 대신 가리키지도 않는다.
  잘못된 값은 그 값의 위치를, 빠진 속성은 그 속성이 있어야 할 상위 위치를 가리킨다. 편집기에서는 줄과 글자 위치를 1부터 센다.

  ## 문제의 종류

  - invalid_input: 잘못된 입력이나 알 수 없는 요청 속성
  - invalid_path: 허용 범위 밖이거나 잘못된 경로
  - not_found: 요청한 문서나 파일이 없음
  - file_access_failed: 파일을 읽거나 접근하지 못함
  - invalid_yaml: YAML 문법 오류
  - unsupported_yaml_feature: [[문서 형식]]에서 허용하지 않는 구문
  - missing_required_field: 필수 속성 누락
  - invalid_field_type: 속성 자료형 오류
  - invalid_field_value: 빈 값, 허용되지 않은 값, ID 형식 오류
  - duplicate_id: 같은 ID의 문서가 여러 개
  - invalid_reference: 참조 표기 문법 오류
  - reference_not_found: 참조 대상이 없음
  - reference_ambiguous: 참조 대상이 여러 개
  - revision_conflict: 읽은 뒤 파일이 바뀜
  - file_exists: 만들려는 파일이 이미 있음
  - file_write_failed: 파일 기록이나 반영 실패
  - index_not_ready: 색인을 구성하거나 갱신하는 중
  - index_build_failed: 색인 전체 구성 실패
  - index_update_failed: 저장 뒤 색인 반영 실패
  - cursor_expired: 목록이 바뀌어 커서를 이어 쓸 수 없음
  - internal_error: 다른 종류로 분류되지 않는 내부 실패

  코드 하나만으로 저장 여부나 문서 상태를 추측하지 않는다. 저장 여부는 결과의 saved, 저장 뒤 색인 반영은 indexUpdated처럼 실제 결과 필드로 확인한다.
  준비 중, 요청 취소, 실제 접근 실패처럼 서로 다른 상태를 하나의 문제로 합치지 않는다.

  ## 진단을 보고 문서 고치기

  1. [[codocs_list]]에서 오류·충돌 표시가 있는 문서를 찾고 [[codocs_get]]으로 원문과 진단을 읽는다. ID를 알 수 없는 YAML 문법 오류나 ID 누락은 [[codocs_validate]]의 파일 경로 또는 전체 검증으로 찾는다.
  2. 진단의 위치와 설명을 보고 고칠 속성이나 원문 위치를 정한다.
  3. 같은 ID가 여러 파일에 있으면 결과의 paths로 파일을 찾아 직접 고친다. ID로 수정하면 대상을 하나로 정할 수 없기 때문이다.
  4. 그 밖의 문제는 [[codocs_write]]로 고치거나 YAML을 직접 편집한다.
  5. 다시 조회하거나 검증해 진단이 사라졌는지 확인한다.

  요청 자체가 실패했거나 탐색이 끝나지 않아 확인하지 못한 경우에는 파일이 없다고 단정하지 말고 그 원인을 먼저 해결한다.
  저장은 됐지만 색인 반영이 실패했다면 [[codocs_refresh]]로 색인을 다시 구성한 뒤 확인한다.
