id: validate-document
name: '문서 검증'
domains:
  - '제품 개념'
definition: |
  문서 검증은 문서 하나가 [[문서 속성]]의 필수 속성·자료형·허용 값에 맞는지 검사하는 것이다.
  예를 들어 definition이 빠졌거나 id가 허용된 형식이 아니면 그 속성의 오류를 [[진단]]으로 알린다.
  문서 하나만 보므로 프로젝트 전체의 ID·이름 충돌과 참조 대상은 따로 확인하며, 검증을 통과했다고 그런 문제가 없다는 뜻은 아니다.

  ## 검사 범위

  YAML로 해석한 문서 전체를 검사한다. YAML 해석에 성공해도 속성이 올바르다는 뜻은 아니며, 해석 자체의 조건은 [[문서 형식]]에서 정의한다.
  [[codocs_write]]로 만들거나 고칠 때도 변경을 적용한 뒤의 문서 전체를 검사한다.
  값을 다른 자료형으로 바꾸거나 빠진 값을 채우지 않는다.
  deprecatedAliases 항목의 잘못된 id·message와 빠진 id도 각 위치에 진단한다. 현재 ID와 같은 이전 ID를 직접 적으면 경고하되 값을 지우지 않는다.
  정책의 의미가 서로 모순되는지, 업무 사실이 맞는지, 코드가 문서의 정책을 지키는지는 판정하지 않는다.

  ## 결과

  경고만 있으면 통과이고 오류가 하나라도 있으면 통과하지 못한다.
  통과하지 못해도 원문과 확인한 이름·소속·본문은 버리지 않으므로 [[진단]]을 보고 문서를 찾아 고칠 수 있다.
  위치를 확인할 수 없는 문제도 같은 규칙으로 검사하며, 그 위치를 추측해 만들지 않는다.
