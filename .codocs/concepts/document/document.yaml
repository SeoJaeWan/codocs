id: document
name: '문서'
domains:
  - '제품 개념'
deprecatedAliases: []
definition: |
  문서는 이름을 붙여 찾아보고 참조할 수 있는 설명의 단위다.
  개념의 정의뿐 아니라 규칙·조건·예외·판단 근거·작업 흐름을 담을 수 있으며, 설명의 종류와 관계없이 같은 형식을 사용한다.

  ## 구성과 작성

  - [[문서 속성]]: 문서를 이루는 id·name·definition·domains 등 각 속성의 역할과 작성 규칙을 확인한다.
  - [[문서 형식]]: 문서를 저장하는 YAML 형식과 저장 위치를 확인한다.

  ## 검증

  YAML 해석에 성공해도 속성의 자료형이나 필수 값이 올바르다는 뜻은 아니며, 그 조건은 [[문서 검증]]에서 검사한다.
  잘못된 필드가 있어도 확인 가능한 이름·소속·본문은 버리지 않는다.
