id: reference
name: '참조'
domains:
  - '제품 개념'
definition: |
  참조는 지식 사이를 잇는 링크다. 문서 이름으로 대상을 가리켜 문서와 문서, 코드와 문서를 연결한다.
  쓰는 위치에 따라 두 가지 표기가 있다.

  | 표기 | 쓰는 위치 | 연결 |
  | --- | --- | --- |
  | `\[[이름]]` | 문서의 definition·examples | 문서에서 다른 문서로 |
  | `@codocs \[[이름]]`, `@codocs \[[이름]]#L11`, `@codocs \[[이름]]#L11-L12` | 코드·테스트 등 프로젝트 텍스트 | 코드에서 문서 전체·특정 행·행 범위로 |

  코드 식별자와 문서 ID가 일치해서 생기는 연결은 참조가 아니며 [[편집기 기능]]의 코드 호버에서 설명한다.

  ## 이름과 도메인

  두 표기 모두 문서의 id가 아닌 name을 사용한다. `[[문서]]`는 문서의 형식과 속성을 확인하는 연결이다.
  `[[제품 개념:문서]]`처럼 도메인을 명시하면 해당 소속 안에서 찾는다.
  도메인을 생략하면 전체 이름 공간에서 찾으며 현재 문서의 소속을 우선하지 않는다.
  공백·대소문자를 정확히 비교하고 trim이나 표기 보정을 하지 않는다.

  ## 문서 참조

  문서 참조는 definition과 examples의 문자열 원소에서 사용한다.
  문서 이름·ID·이전 ID 목록·사용자 필드에 같은 표기를 넣어도 연결로 해석하지 않는다.
  자기 문서를 가리키는 참조는 연결하지 않는다. 서로 다른 문서 사이의 상호 참조는 허용한다.

  ## 코드 참조

  코드 참조는 코드가 근거로 삼는 문서 전체나 특정 행·범위를 명시적으로 연결한다.
  식별자의 이름으로 표현하지 못하는 검증 조건·제약 조건도 연결할 수 있으며 함수명·테스트명과 문서 ID의 일치를 요구하지 않는다.
  언어·확장자·주석 여부로 표기를 제한하지 않는다.
  행 지정은 닫는 대괄호 바로 뒤에 붙인다. 번호는 YAML 원문의 1부터 시작하는 행이며 범위의 끝 행을 포함한다.
  편집기에서는 표기에서 문서로 이동하고, 문서에서는 그 행을 연결한 코드 위치로 돌아갈 수 있다.

  ## 특수 문자와 문법 오류

  첫 번째 escape되지 않은 콜론이 도메인과 이름의 구분자다.
  이름과 도메인 자체에 들어가는 콜론은 `\:`로 작성한다.
  참조 시작 앞의 연속 백슬래시가 홀수이면 연결하지 않는 글자다.
  빈 이름·도메인, 남은 대괄호·추가 구분자·닫히지 않은 참조는 문법 오류다.

  이 규칙은 YAML 해석 후 문자열에 적용한다.
  작은따옴표와 literal 블록은 백슬래시를 그대로 보존하며 큰따옴표에서는 백슬래시 자체를 한 번 더 escape한다.

  ```yaml
  definition: |
    [[문서]]에서 작성할 속성을 확인한다.
    \[[문서]]는 연결하지 않는 글자다.
  ```

  ## 대상 확인

  이름이 같아도 대상 문서가 없거나 여러 개일 수 있으므로 표기의 유효성과 연결 확정은 구분한다.
  코드 참조는 대상 없음·모호한 이름·잘못된 행 형식·역전 범위·파일 범위 초과를 구분하며 임의 대상이나 보정된 범위로 연결하지 않는다.
  실제 후보 집계·탐색 상태·자기 참조의 처리는 [[참조 후보를 문서 연결로 확정하는 절차]]에서 확인한다.
  문법 오류의 위치와 반복 등장을 찾는 방법은 [[참조 추출]]에서 확인한다.
