id: product-concepts
name: '제품 개념'
domains:
  - '제품 개념'
definition: |
  Codocs를 사용하는 사람과 개발하는 사람이 함께 알아야 하는 제품의 개념이다.
  각 문서는 개념이 무엇인지 설명하며, 구현 방식과 예외는 core·workspace·mcp·language-server·vscode의 담당 문서에서 관리한다.

  ## 문서와 연결

  - [[문서]]: 설명의 단위와 id·name·domains·definition 같은 저장 속성을 확인한다.
  - [[도메인]]: 문서가 속하는 책임·주제의 분류를 확인한다.
  - [[참조]]: 문서와 문서, 코드와 문서를 잇는 `\[[이름]]`·`@codocs` 링크를 확인한다.

  ## 사용하는 기능

  - [[편집기 기능]]: VS Code의 코드 호버, 원문 열기, 코드와 문서 사이의 이동을 확인한다.
  - [[MCP 도구]]: AI가 문서를 찾고 읽고 수정할 때 호출하는 도구를 확인한다.
