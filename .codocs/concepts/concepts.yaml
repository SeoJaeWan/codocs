_codocs:
  id: product-concepts
  name: 제품 개념
  parent:
    - 프로젝트 지식 읽기 안내
개요: |
  Codocs를 사용하는 사람과 개발하는 사람이 함께 알아야 하는 제품의 개념이다.
  각 문서는 개념이 무엇인지 설명하며, 구현 방식과 예외는 core·workspace·mcp·language-server·vscode의 담당 문서에서 관리한다.
문서와 연결: |
  - [[문서]]: 설명의 단위와 그 속성·형식·검증을 확인한다.
  - [[참조]]: 문서와 문서를 잇는 문서 참조와 코드에서 문서를 가리키는 코드 참조를 확인한다.
탐색: |
  - [[탐색]]: .codocs 문서를 언제 어떻게 찾아 읽고 감시하는지, 탐색 중 요청이 어떻게 처리되는지 확인한다. 코드 파일은 [[코드 참조]]에서 확인한다.
사용하는 기능: |
  - [[VS Code 확장]]: 편집기에서 언어 서버를 연결해 참조 링크·원문 열기·진단을 제공하는 방식을 확인한다.
  - [[MCP 서버]]: AI가 문서를 찾고 읽고 수정할 때 연결하는 서버와 도구를 확인한다.
