id: product-concepts
name: '제품 개념'
domains:
  - '제품 개념'
definition: |
  Codocs를 사용하는 사람과 개발하는 사람이 함께 알아야 하는 제품의 개념이다.
  각 문서는 개념이 무엇인지 설명하며, 구현 방식과 예외는 core·workspace·mcp·language-server·vscode의 담당 문서에서 관리한다.

  ## 문서와 연결

  - [[문서]]: 설명의 단위와 그 속성·도메인·형식·검증을 확인한다.
  - [[참조]]: 문서와 문서, 코드와 문서를 잇는 문서 참조·코드 참조·식별자 참조를 확인한다.

  ## 색인

  - [[탐색 상태]]: 프로젝트의 문서 파일을 얼마나 확인했는지와 그에 따른 응답을 확인한다.

  ## 사용하는 기능

  - [[VS Code 확장]]: 편집기에서 언어 서버를 연결해 코드 호버·원문 열기·코드와 문서 사이의 이동을 제공하는 방식을 확인한다.
  - [[MCP 서버]]: AI가 문서를 찾고 읽고 수정할 때 연결하는 서버와 도구를 확인한다.
