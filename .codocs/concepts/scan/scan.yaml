definition: |
  탐색은 프로젝트의 .codocs에서 문서 파일을 찾아 읽고 [[문서 색인]]에 반영하는 과정이다.
  VS Code 언어 서버와 [[MCP 서버]]는 각자 탐색해 자기 색인을 만든다. 처음 시작할 때 전체를 탐색하고, 이후에는 [[파일 감시]]가 알린 경로만 다시 확인한다.

  ## 프로젝트 루트

  프로젝트 루트는 탐색 기준 폴더이며 그 아래 .codocs를 지식 폴더로 쓴다.
  MCP 서버는 `--project`로 지정한 폴더나 시작 위치를, VS Code는 연 workspace 폴더를 사용한다. 상대 경로는 시작 위치를 기준으로 해석한다.
  상위 폴더의 Git이나 .codocs를 찾아 올라가지 않으며, 시작한 뒤에는 루트를 바꾸거나 여러 프로젝트의 색인을 섞지 않는다.
  루트 자체가 심볼릭 링크나 정션이면 지원하지 않는다.

  ## 탐색 대상

  .codocs 아래의 .yaml·.yml 일반 파일을 읽는다. 문서는 .codocs 안에서 찾은 상대 경로(발견 경로)로 구분하며, 같은 ID라는 이유로 다른 경로의 파일을 합치지 않는다.
  심볼릭 링크와 Windows 정션은 프로젝트 안을 가리켜도 따라가지 않는다. 탐색 중 만난 링크는 경고로 알리고 나머지 탐색을 계속하며, 요청한 경로나 .codocs 자체가 링크면 오류로 알린다.
  .codocs 밖이나 상위 폴더로 벗어나는 경로는 읽거나 쓰지 않는다. 경로가 허용 범위 안이라는 것은 제품이 허용한다는 뜻이며 실제 파일 권한이나 저장 성공을 보장하지 않는다.

  ## 언제 탐색하는지

  서버가 처음 시작하면 [[파일 감시]]를 먼저 준비한 뒤 .codocs 전체를 탐색한다. 탐색하는 동안 바뀐 파일도 놓치지 않고 다시 확인한다.
  .codocs가 처음에 없으면 빈 프로젝트로 시작하고, 나중에 만들어지면 감지해 탐색한다.
  이후에는 바뀐 파일이나 영향을 받은 하위 폴더만 다시 읽는다. 바뀌지 않은 문서의 읽기 결과는 다시 쓰며 전체 탐색을 반복하지 않는다.
  같은 경로의 신호가 여러 번 와도 한 번만 확인하고, 다시 읽는 중에 또 바뀌면 다시 확인할 대상으로 남긴다. 저장 도구가 쓰는 임시 파일은 다시 확인하지 않는다.
  삭제 신호나 읽기 실패만으로 문서가 없어졌다고 확정하지 않고 실제로 다시 확인한다.
  [[codocs_write]]로 저장한 서버는 감시 신호를 기다리지 않고 저장한 경로를 바로 다시 읽는다. [[codocs_refresh]]를 요청하면 전체를 다시 탐색하고 감시도 다시 연결한다.

  ## 탐색 중의 요청

  처음 탐색하거나 전체를 다시 탐색하는 동안에는 문서 조회·검증·저장 요청에 준비 중(index_not_ready)으로 답하고 저장하지 않는다. 안내([[codocs_guide]])와 refresh는 계속 쓸 수 있다.
  일부 파일의 변경을 반영하는 동안에는 마지막으로 완료한 색인으로 조회에 답하고, 반영이 끝나면 문서·참조·진단을 함께 바꾼다.
  처음 탐색 중에 여러 요청이 오면 같은 탐색이 끝나기를 함께 기다린다. 반영할 변경이 남아 있으면 준비 중을 유지하며, 걸린 시간만으로 완료나 실패를 선언하지 않는다.
  탐색이 일부만 끝났거나 실패한 경우의 처리는 [[탐색 상태]]에서 설명한다.
