_codocs:
  id: workspace-scan
  name: 탐색
  parent:
    - 제품 개념
개요: |
  탐색은 .codocs의 문서 파일을 찾아 읽고, 바뀐 파일을 감시해 다시 읽으며 [[문서 색인]]을 최신으로 유지하는 과정이다.
  VS Code 언어 서버와 [[MCP 서버]]는 각자 탐색하며 결과를 서로 공유하지 않는다. 진행 상태는 [[탐색 상태]]에서 설명한다.
프로젝트 루트: |
  프로젝트 루트는 탐색 기준 폴더다. MCP 서버는 `--project`로 지정한 폴더나 시작 위치를, VS Code는 연 workspace 폴더를 사용한다. 상대 경로는 시작 위치를 기준으로 해석한다.
  상위 폴더의 Git이나 .codocs를 찾아 올라가지 않으며, 시작한 뒤에는 루트를 바꾸거나 여러 프로젝트의 결과를 섞지 않는다. 루트 자체가 심볼릭 링크나 정션이면 지원하지 않는다.
  프로젝트 하나의 문서는 루트의 .codocs와 프로젝트 안 하위 폴더의 .codocs에 나뉘어 있을 수 있으며 모두 한 색인에 모인다.
대상: |
  대상은 루트의 .codocs와 인정된 하위 폴더의 .codocs 아래 .yaml·.yml 일반 파일이다. 예를 들어 `.codocs/orders/order.yaml`과 `packages/core/.codocs/a.yaml`은 같은 프로젝트의 문서다.
  문서가 속한 .codocs는 경로에서 가장 바깥의 `.codocs` 구간이다. 그 안의 `.codocs` 구간은 평범한 폴더이므로 `.codocs/a/.codocs/b.yaml`은 루트 .codocs의 문서다.
  루트 .codocs는 Git·ignore 상태와 무관하게 항상 대상이다.
  하위 폴더의 .codocs는 그 위치가 [[코드 참조]]의 코드 파일 수집 규칙(Git 추적, `.gitignore`, 루트 `.codocsignore`)을 통과할 때만 인정한다. 예를 들어 `.gitignore`가 제외한 `.workbench/x/.codocs`는 인정하지 않는다.
  인정하지 않은 위치에 이미 있는 문서는 읽지 않으며 색인에도 나타나지 않는다.
  Git 상태나 ignore 파일을 확인하지 못하면 하위 .codocs를 인정했다고 보지 않고 탐색을 partial로 알린다.
  문서는 프로젝트 루트 기준 상대 경로(발견 경로)로 구분하며, 같은 ID라는 이유로 다른 경로의 파일을 합치지 않는다. ID와 이름은 .codocs가 달라도 프로젝트 전체에서 유일해야 한다.
  심볼릭 링크와 Windows 정션은 프로젝트 안을 가리켜도 따라가지 않으며 프로젝트 밖 파일은 읽지 않는다. 탐색 중 만난 링크는 경고로 알리고 나머지를 계속 탐색하며, .codocs 자체나 그 바깥 폴더, 요청한 경로가 링크면 오류다.
  .codocs 밖이나 소유 .codocs의 상위 폴더로 벗어나는 경로는 이 탐색에서 읽거나 쓰지 않는다.
  프로젝트의 코드 파일은 문서가 아니므로 탐색 대상이 아니다. 코드 파일을 읽는 방법은 [[코드 참조]]에서, 코드 파일을 고치는 유일한 경우는 [[이름 변경]]에서 설명한다.
언제 읽는지: |
  처음 시작할 때 인정할 하위 .codocs를 찾고 감시를 먼저 준비한 뒤 대상 전체를 읽고, 읽는 동안 바뀐 파일도 놓치지 않고 다시 확인한다.
  이후에는 감시가 알린 파일이나 영향을 받은 하위 폴더만 다시 읽고, 바뀌지 않은 파일의 결과는 다시 쓴다.
  같은 경로의 신호가 여러 번 와도 한 번만 확인하며, 다시 읽는 중에 또 바뀌면 다시 확인할 대상으로 남긴다. 삭제 신호나 읽기 실패만으로 파일이 없어졌다고 확정하지 않는다.
  대상 전체를 다시 읽는 것은 처음 시작, [[codocs_refresh]] 요청, 감시 오류 뒤 복구 때뿐이다.
  .codocs가 처음에 없으면 빈 프로젝트로 시작하고 나중에 만들어지면 감지해 읽는다.
  [[codocs_write]]로 저장한 서버는 감시 신호를 기다리지 않고 저장한 경로를 바로 다시 읽는다. 새로 만든 하위 .codocs도 바로 대상에 넣는다. 저장 도구가 쓰는 임시 파일은 다시 읽지 않는다.
감시: |
  감시는 파일의 생성·수정·삭제·이동을 알아차려 다시 읽을 경로를 알려준다. 같은 경로의 빠른 변경은 하나로 합쳐질 수 있으므로 알림 순서나 횟수를 파일 작업 이력으로 보지 않고 현재 파일을 다시 읽는다.
  감시 오류는 YAML 내용 오류와 구분해 알린다.
  루트 .codocs와 인정된 하위 .codocs마다 그 안의 파일·하위 폴더를 감시하며, .codocs가 지워지거나 다른 폴더로 바뀌어도 새 폴더를 다시 감시한다.
  하위 .codocs의 생성·삭제는 코드 파일 수집 규칙이 허용한 범위의 폴더 변경으로 알아차려 재시작 없이 색인에 반영한다. 새로 인정한 .codocs는 읽고, 지워지거나 더 이상 인정하지 않는 .codocs의 문서는 색인에서 지운다.
  `.gitignore`·`.codocsignore`나 Git 추적 상태가 바뀌면 하위 .codocs의 인정 범위를 다시 계산한다.
  감시 오류가 나면 자동으로 한 번 다시 연결하고(recovering), 성공하면 전체를 다시 확인한 뒤 정상(ready)으로 돌아간다.
  다시 실패하면 failed가 되어 원인과 함께 [[codocs_refresh]]로 복구하라고 안내하며, refresh는 감시를 다시 연결하고 자동 재연결 기회도 다시 준다.
  하위 .codocs의 생성·삭제를 알리는 감시에 오류가 나면 다시 연결하고 인정 범위를 다시 계산한다. 다시 연결하지 못하면 하위 .codocs를 확인하지 못한 것으로 보고 탐색을 partial로 알리며 refresh가 다시 연결한다.
편집 중인 내용: |
  편집기에서 열린 YAML은 그 문서 하나만 현재 편집 내용으로 해석하며, 다른 문서의 판단은 저장된 내용으로 한다. 자세한 내용은 [[문서 색인]]에서 설명한다.
탐색 중의 요청: |
  처음 탐색하거나 전체를 다시 탐색하는 동안에는 문서 조회·검증·저장 요청에 준비 중(index_not_ready)으로 답하고 저장하지 않는다. 하위 .codocs를 찾는 동안도 같다. 안내([[codocs_guide]])와 refresh는 계속 쓸 수 있다.
  일부 파일의 변경을 반영하는 동안에는 마지막으로 완료한 결과로 답하고, 반영이 끝나면 문서·참조·진단을 함께 바꾼다.
  처음 탐색 중에 여러 요청이 오면 같은 탐색이 끝나기를 함께 기다리며, 반영할 변경이 남아 있으면 준비 중을 유지한다.

  걸린 시간만으로 완료나 실패를 선언하지 않으며, 호버나 조회 요청마다 프로젝트 전체를 다시 읽지 않는다.
