id: workspace-scan
name: '탐색'
domains:
  - '제품 개념'
definition: |
  탐색은 프로젝트의 파일을 찾아 읽고, 바뀐 파일을 감시해 다시 읽으며 결과를 최신으로 유지하는 과정이다.
  탐색 대상은 두 가지이며 같은 과정을 거치되 아래 절마다 다른 점을 구분한다.

  - 문서: .codocs의 YAML 문서를 읽어 [[문서 색인]]을 만든다.
  - 코드: 프로젝트의 텍스트 파일에서 [[코드 참조]] 표기를 찾아 문서에서 코드로 돌아가는 연결을 만든다. 코드 식별자와 문서 ID가 일치하는 [[식별자 참조]]는 찾지 않는다.

  VS Code 언어 서버와 [[MCP 서버]]는 각자 탐색하며 결과를 서로 공유하지 않는다. 진행 상태는 [[탐색 상태]]에서 설명한다.

  ## 프로젝트 루트

  프로젝트 루트는 탐색 기준 폴더다. MCP 서버는 `--project`로 지정한 폴더나 시작 위치를, VS Code는 연 workspace 폴더를 사용한다. 상대 경로는 시작 위치를 기준으로 해석한다.
  상위 폴더의 Git이나 .codocs를 찾아 올라가지 않으며, 시작한 뒤에는 루트를 바꾸거나 여러 프로젝트의 결과를 섞지 않는다. 루트 자체가 심볼릭 링크나 정션이면 지원하지 않는다.

  ## 대상

  두 대상 모두 심볼릭 링크와 Windows 정션은 프로젝트 안을 가리켜도 따라가지 않으며 프로젝트 밖 파일은 읽지 않는다.

  - 문서: 루트의 .codocs 아래 .yaml·.yml 일반 파일이다. 문서는 .codocs 안에서 찾은 상대 경로(발견 경로)로 구분하며, 같은 ID라는 이유로 다른 경로의 파일을 합치지 않는다. 탐색 중 만난 링크는 경고로 알리고 나머지를 계속 탐색하며, .codocs 자체나 요청한 경로가 링크면 오류다. .codocs 밖이나 상위 폴더로 벗어나는 경로는 읽거나 쓰지 않는다.
  - 코드: 루트 아래 텍스트 파일을 언어·확장자와 관계없이 열지 않은 파일까지 모두 포함한다. Git이 추적하는 파일은 .gitignore와 관계없이 포함하고, 추적하지 않는 파일은 .gitignore(하위 폴더의 .gitignore와 재포함 규칙 포함)로 제외하지 않은 것만 포함한다. Git 저장소가 아니면 모든 파일을 추적하지 않는 파일로 본다. .git 내부와 바이너리(UTF-8로 그대로 읽을 수 없거나 NUL 문자가 있는 파일)는 제외하며, node_modules·dist처럼 이름만으로 제외하는 규칙은 두지 않는다.

  ## 언제 읽는지

  처음 시작할 때 감시를 먼저 준비한 뒤 대상 전체를 읽고, 읽는 동안 바뀐 파일도 놓치지 않고 다시 확인한다.
  이후에는 감시가 알린 파일이나 영향을 받은 하위 폴더만 다시 읽고, 바뀌지 않은 파일의 결과는 다시 쓴다.
  같은 경로의 신호가 여러 번 와도 한 번만 확인하며, 다시 읽는 중에 또 바뀌면 다시 확인할 대상으로 남긴다. 삭제 신호나 읽기 실패만으로 파일이 없어졌다고 확정하지 않는다.
  대상 전체를 다시 읽는 것은 처음 시작, [[codocs_refresh]] 요청, 감시 오류 뒤 복구 때뿐이다.

  - 문서: .codocs가 처음에 없으면 빈 프로젝트로 시작하고 나중에 만들어지면 감지해 읽는다. [[codocs_write]]로 저장한 서버는 감시 신호를 기다리지 않고 저장한 경로를 바로 다시 읽는다. 저장 도구가 쓰는 임시 파일은 다시 읽지 않는다.
  - 코드: 대상 문서의 이동·삭제나 이름·도메인·내용이 바뀌면 코드는 다시 읽지 않고 표기의 해석만 다시 한다. .gitignore가 바뀌면 그 폴더 아래 파일을, Git 추적 목록이 바뀌면 추적 여부가 달라진 파일만 다시 확인한다.

  ## 감시

  감시는 파일의 생성·수정·삭제·이동을 알아차려 다시 읽을 경로를 알려준다. 같은 경로의 빠른 변경은 하나로 합쳐질 수 있으므로 알림 순서나 횟수를 파일 작업 이력으로 보지 않고 현재 파일을 다시 읽는다.
  감시 오류는 YAML 내용 오류와 구분해 알리며, 복구 방식은 대상마다 다르다.

  - 문서: .codocs와 그 안의 파일·하위 폴더를 감시하며 .codocs가 지워지거나 다른 폴더로 바뀌어도 새 폴더를 다시 감시한다. 오류가 나면 자동으로 한 번 다시 연결하고(recovering), 성공하면 전체를 다시 확인한 뒤 정상(ready)으로 돌아간다. 다시 실패하면 failed가 되어 원인과 함께 [[codocs_refresh]]로 복구하라고 안내하며, refresh는 감시를 다시 연결하고 자동 재연결 기회도 다시 준다.
  - 코드: 대상과 같은 규칙으로 감시하며 .gitignore로 제외한 폴더는 그 안에 Git이 추적하는 파일이 있을 때만 감시한다. 오류가 나면 바로 다시 등록하고, 계속 실패하면 1초부터 두 배씩 늘려 최대 30초 간격으로 횟수 제한 없이 다시 시도한다. 다시 등록되면 전체를 다시 확인한다.

  코드 감시가 횟수를 제한하지 않는 것은 코드 폴더의 삭제와 재생성이 평소에도 반복되고, 수동 refresh를 기다리는 동안 코드 변경을 계속 놓치기 때문이다.
  문서 감시는 실패가 반복되면 사용자에게 알리고 refresh로 명시적으로 복구하게 한다.

  ## 편집 중인 내용

  저장하지 않은 편집 내용은 그 파일의 결과에만 반영하며 다른 파일의 판단은 저장된 내용으로 한다.

  - 문서: 편집기에서 열린 YAML은 그 문서 하나만 현재 편집 내용으로 해석한다. 자세한 내용은 [[문서 색인]]에서 설명한다.
  - 코드: VS Code에서는 열린 코드의 저장하지 않은 편집 내용을 그 파일의 저장본 대신 쓰고, 닫거나 변경을 취소하면 저장본으로 돌아간다. 같은 파일의 저장본과 편집본을 두 번 세지 않는다. MCP 서버는 저장한 파일만 본다.

  ## 탐색 중의 요청

  - 문서: 처음 탐색하거나 전체를 다시 탐색하는 동안에는 문서 조회·검증·저장 요청에 준비 중(index_not_ready)으로 답하고 저장하지 않는다. 안내([[codocs_guide]])와 refresh는 계속 쓸 수 있다. 일부 파일의 변경을 반영하는 동안에는 마지막으로 완료한 결과로 답하고, 반영이 끝나면 문서·참조·진단을 함께 바꾼다. 처음 탐색 중에 여러 요청이 오면 같은 탐색이 끝나기를 함께 기다리며, 반영할 변경이 남아 있으면 준비 중을 유지한다.
  - 코드: 처음 수집하는 동안에는 연결 링크 없이 수집 중이라고 안내한다. 한 번 완료한 뒤 다시 읽을 때는 이전 결과를 계속 보여준다.

  걸린 시간만으로 완료나 실패를 선언하지 않으며, 호버나 조회 요청마다 프로젝트 전체를 다시 읽지 않는다.
