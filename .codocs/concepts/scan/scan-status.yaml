id: scan-status
name: '탐색 상태'
domains:
  - '제품 개념'
definition: |
  탐색 상태는 [[탐색]]이 대상 파일을 얼마나 확인했는지 나타낸다. 문서와 코드는 상태를 따로 가진다.
  두 상태 모두 일부만 확인했거나 실패한 결과를 "없음"이나 "완료"로 보여주지 않는다.
  코드 상태는 문서 상태와 별개이며 코드를 읽지 못해도 문서 조회·검증·저장은 막지 않는다.

  ## 문서

  응답의 scanStatus로 전달한다.

  - complete: 탐색할 범위를 모두 확인했다. .codocs가 없는 프로젝트도 빈 프로젝트로 complete다.
  - partial: 일부 파일이나 하위 폴더를 확인하지 못했지만 나머지는 확인했다.
  - failed: 프로젝트 루트나 .codocs 자체를 확인할 수 없거나 그 위치가 링크·정션이다.

  YAML 내용에 오류가 있는 파일과 탐색에서 제외한 링크·정션은 진단으로 알리며, 그것만으로 partial이 되지는 않는다.
  partial은 권한 때문에 파일을 읽거나 하위 폴더를 열지 못했거나, 탐색 도중 파일이 옮겨지거나 지워진 경우다. 원인을 추측하지 않으며, 진단의 경로와 시스템 오류 코드(ioCode)를 보고 권한이나 파일 이동을 확인한 뒤 다시 탐색한다.

  이번 탐색에서 확인하지 못했지만 이전 결과로 색인에 남아 있는 문서는 미확인(unconfirmed) 문서이며, 이번에 확인한 문서는 confirmed다.
  미확인 문서는 마지막으로 읽은 원문과 그때의 revision을 그대로 가지며 지금도 있는지나 최신인지 보장하지 않는다.
  partial에서는 확인하지 못한 이전 문서를 지우지 않고 모두 미확인으로 남기며, failed에서는 새 결과를 쓰지 않고 이전 기록을 미확인으로 남긴다. 미확인 문서를 지우고 연결을 다시 확정하는 것은 complete일 때뿐이다.
  확인하지 못한 범위에 같은 이름이나 ID의 문서가 있을 수 있으므로 [[참조]] 대상을 부재나 하나로 확정하지 않는다.

  partial이면 확인한 문서와 미확인 문서를 조회할 수 있지만 검증과 저장은 complete가 될 때까지 막는다. 색인에 없는 ID를 프로젝트 전체에 없다고 단정하지 않는다.
  문서 감시가 failed이면 마지막으로 완료한 결과로 조회에 답하되 최신이 아닐 수 있다는 진단을 함께 주고, 검증과 저장은 막는다.

  ## 코드

  - 수집 중: 처음 수집하는 동안이다. 연결을 제공하지 않으며 연결이 없다고 확정하지 않는다.
  - 완료: 대상 파일을 모두 확인했다. 완료 뒤 다시 읽는 동안에도 이전 결과를 유지하며 확인이 오래 걸릴 때만 수집 중을 덧붙인다.
  - 불완전: 일부 파일을 읽지 못했거나 감시를 다시 연결하는 중이다. 확인한 연결은 그대로 제공하고 이유를 함께 알린다. 감시가 다시 연결되고 전체를 확인하면 다른 실패가 없는 한 완료로 돌아간다.

  편집기에 표시하는 문구는 [[코드 참조]]에서 설명한다.
