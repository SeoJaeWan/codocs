id: scan-status
name: '탐색 상태'
domains:
  - '제품 개념'
deprecatedAliases:
  - id: incomplete-scan
  - id: unconfirmed-document
  - id: scan-consistency
  - id: workspace-diagnostic
definition: |
  탐색 상태는 [[탐색]]이 프로젝트의 문서 파일을 얼마나 확인했는지 나타내며, 응답의 scanStatus로 전달된다.

  - complete: 탐색할 범위를 모두 확인했다. .codocs가 없는 프로젝트도 빈 프로젝트로 complete다.
  - partial: 일부 파일이나 하위 폴더를 확인하지 못했지만 나머지는 확인했다.
  - failed: 프로젝트 루트나 .codocs 자체를 확인할 수 없거나 그 위치가 링크·정션이다.

  YAML 내용에 오류가 있는 파일과 탐색에서 제외한 링크·정션은 진단으로 알리며, 그것만으로 partial이 되지는 않는다.

  ## partial이 되는 경우

  권한 때문에 파일을 읽거나 하위 폴더를 열지 못했거나, 탐색 도중 파일이 옮겨지거나 지워진 경우다.
  확인한 사실은 접근이나 읽기에 실패했다는 것이므로 원인을 추측하지 않는다. 진단의 경로와 시스템 오류 코드(ioCode)를 보고 권한이나 파일 이동을 확인한 뒤 다시 탐색한다.

  ## 확인하지 못한 문서

  이번 탐색에서 확인하지 못했지만 이전 탐색 결과로 색인에 남아 있는 문서는 미확인(unconfirmed) 문서로 구분한다.
  미확인 문서는 마지막으로 읽은 원문과 그때의 revision을 그대로 가지며, 지금도 있는지나 최신인지 보장하지 않는다. 이번에 확인한 문서는 confirmed다.
  partial에서는 확인하지 못한 이전 문서를 지우지 않고 모두 미확인으로 남긴다. 실패한 범위 밖이라는 이유로 삭제됐다고 판단하지 않는다.
  확인하지 못한 범위에 같은 이름이나 ID의 문서가 있을 수 있으므로 [[참조]] 대상을 부재나 하나로 확정하지 않는다.
  failed에서는 새 탐색 결과를 쓰지 않고 이전 기록을 미확인으로 남긴다. 미확인 문서를 지우고 연결을 다시 확정하는 것은 complete일 때뿐이다.

  ## 요청에 미치는 영향

  partial이면 확인한 문서와 미확인 문서를 조회할 수 있지만 검증과 저장은 complete가 될 때까지 막는다.
  일부만 확인한 상태에서 색인에 없는 ID를 프로젝트 전체에 없다고 단정하지 않는다.
