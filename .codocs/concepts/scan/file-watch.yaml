id: file-watch
name: '파일 감시'
domains:
  - '제품 개념'
deprecatedAliases:
  - id: workspace-watcher
definition: |
  파일 감시는 .codocs의 파일 변경을 알아차려 [[탐색]]이 다시 확인할 경로를 알려주는 기능이다.
  감시는 바뀐 경로만 알리며, 문서를 읽고 색인에 반영하는 일은 탐색이 맡는다.

  ## 감시 대상

  .codocs와 그 안의 파일·하위 폴더의 생성·수정·삭제·이동을 감지한다.
  시작할 때 .codocs가 없어도 나중에 만들어지면 감지하고, .codocs가 지워지거나 다른 폴더로 바뀌어도 새 폴더를 다시 감시한다.
  심볼릭 링크와 정션은 감시하지 않는다.
  같은 경로의 빠른 변경은 하나로 합쳐질 수 있으므로 알림 순서나 횟수를 파일 작업 이력으로 보지 않고 현재 파일을 다시 읽는다.

  ## 감시 상태

  - starting: 감시를 준비하는 중이다.
  - ready: 감시가 연결되어 변경을 받고 있다. 문서 읽기나 색인 반영이 끝났다는 뜻은 아니다.
  - recovering: 감시 오류가 나서 자동으로 한 번 다시 연결하는 중이다. 다시 연결되면 ready로 돌아가고 전체를 다시 확인한다.
  - failed: 자동 재연결이 실패했거나 재연결 뒤 다시 오류가 났다. 원인과 함께 [[codocs_refresh]]로 복구하라고 안내한다.
  - closed: 서버가 끝나 감시를 정리했다.

  감시가 failed인 동안에는 마지막으로 완료한 색인으로 문서 목록과 상세 조회에 답하되 최신이 아닐 수 있다는 진단을 함께 준다. 검증과 저장은 막는다.
  refresh는 감시를 다시 연결하고 자동 재연결 기회도 다시 준다. 감시 오류는 YAML 내용 오류와 구분해 알린다.

  코드 파일의 감시는 별도로 동작하며 규칙은 [[코드 참조 수집]]에서 설명한다.
