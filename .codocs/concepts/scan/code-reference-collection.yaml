id: code-reference-index
name: '코드 참조 수집'
domains:
  - '제품 개념'
definition: |
  코드 참조 수집은 프로젝트의 텍스트 파일에서 [[코드 참조]] 표기를 찾아, 문서에서 코드로 돌아가는 연결을 만들고 최신으로 유지하는 과정이다.
  .codocs 문서를 읽는 [[탐색]]과 대상·시점·상태가 달라 따로 동작한다. 코드 식별자와 문서 ID가 일치하는 [[식별자 참조]]는 수집하지 않는다.

  ## 수집 대상

  [[탐색]]의 프로젝트 루트 아래 텍스트 파일을 언어·확장자와 관계없이 모두 대상으로 하며 열지 않은 파일도 포함한다.
  Git이 추적하는 파일은 .gitignore와 관계없이 포함하고, 추적하지 않는 파일은 .gitignore로 제외하지 않은 것만 포함한다. 하위 폴더의 .gitignore와 재포함 규칙도 적용한다. Git 저장소가 아니면 모든 파일을 추적하지 않는 파일로 본다.
  .git 내부와 바이너리 파일은 제외한다. UTF-8로 그대로 읽을 수 없거나 NUL 문자가 있으면 바이너리로 본다.
  node_modules·dist처럼 이름만으로 제외하는 규칙은 따로 두지 않는다. 심볼릭 링크·정션은 따라가지 않고 프로젝트 밖 파일은 읽지 않는다.

  ## 저장한 파일과 편집 중인 파일

  VS Code에서는 열려 있는 코드의 저장하지 않은 편집 내용을 그 파일의 저장된 내용 대신 사용하고, 닫거나 변경을 취소하면 저장된 내용으로 돌아간다. 같은 파일의 저장본과 편집본을 두 번 세지 않는다.
  MCP 서버는 저장한 파일만 본다.
  대상 문서의 이름·도메인·행은 저장된 문서 색인으로 판단한다.

  ## 다시 수집하는 경우

  처음 시작할 때 전체를 수집하고, 이후에는 코드 파일의 추가·수정·이동·삭제와 대상 문서의 이동·삭제·이름·도메인·내용 변경에 따라 바뀐 부분만 다시 확인한다.
  .gitignore가 바뀌면 그 폴더 아래 대상 파일을, Git 추적 목록이 바뀌면 추적 여부가 달라진 파일만 다시 확인한다.
  전체를 다시 수집하는 것은 처음 시작, [[codocs_refresh]], 코드 감시 오류 뒤 복구 때뿐이다. 호버할 때마다 프로젝트를 다시 훑지 않는다.

  ## 수집 상태

  - 수집 중: 처음 수집하는 동안이다. 연결 링크를 제공하지 않고 `코드 연결 수집 중`이라고 안내하며 연결이 없다고 확정하지 않는다.
  - 완료: 대상 파일을 모두 확인했다. 한 번 완료한 뒤 다시 수집할 때는 이전 결과를 유지하며 확인이 오래 걸릴 때만 수집 중을 덧붙인다.
  - 불완전: 일부 파일을 읽지 못했거나 감시가 끊겨 다시 연결하는 중이다. 확인한 연결은 그대로 제공하고 `수집 불완전`과 이유를 함께 안내한다.

  일부나 전체 수집이 실패했는데 연결이 없는 완료처럼 보여주지 않는다. 이 상태는 .codocs의 [[탐색 상태]]와 별개이며 코드 수집 실패가 문서 저장을 막지 않는다.

  ## 코드 감시

  코드 파일 감시도 수집 대상과 같은 규칙으로 등록한다. .gitignore로 제외한 폴더는 그 안에 Git이 추적하는 파일이 있을 때만 감시한다.
  감시 오류가 나면 확인한 연결을 유지한 채 불완전으로 알리고 바로 다시 등록한다. 계속 실패하면 1초부터 두 배씩 늘려 최대 30초 간격으로 횟수 제한 없이 다시 시도한다. 다시 등록되면 전체를 다시 확인한 뒤 완료로 돌아간다.
  문서 감시와 달리 횟수를 제한하지 않는 것은 코드 폴더의 삭제와 재생성이 평소에도 반복되고, 수동 refresh를 기다리는 동안 코드 변경을 계속 놓치기 때문이다.

  ## 링크를 눌렀을 때

  편집기에서 코드 참조 링크나 문서의 역참조 링크를 누르면, 진행 중인 수집을 기다리지 않고 원래 파일과 대상 파일을 바로 확인한 뒤 이동한다.
  표기가 지워지거나 옮겨졌거나 대상이 다른 문서로 바뀌었으면 이동하지 않는다. 같은 파일의 다른 곳을 고친 것만으로는 이동을 막지 않는다.
