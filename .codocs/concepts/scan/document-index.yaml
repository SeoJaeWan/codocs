id: catalog
name: '문서 색인'
domains:
  - '제품 개념'
definition: |
  문서 색인은 [[탐색]]으로 읽은 문서를 모아 ID·이름으로 찾고 문서 사이의 연결을 계산해 둔 결과다.
  조회·검증·저장·편집기 기능은 요청마다 모든 YAML을 다시 읽지 않고 이 색인을 사용한다.
  VS Code 언어 서버와 [[MCP 서버]]는 각자 색인을 가지며, 한 프로젝트의 색인에 다른 프로젝트의 문서를 섞지 않는다.

  ## 담는 정보

  문서마다 발견 경로·ID·이름·도메인·revision과 [[진단]]을 담고, 이번 탐색에서 확인했는지(confirmed·unconfirmed)를 구분한다.
  [[문서 참조]]로 확정된 연결을 직접 참조와 역참조로 나눠 담는다. 확정되지 않은 참조는 연결에 넣지 않고 진단만 남긴다.
  코드에서 문서로 가는 [[코드 참조]]의 연결은 코드 [[탐색]]이 따로 관리하며 이 연결에 합치지 않는다.

  ## 프로젝트 전체 검사

  [[문서 검증]]과 별도로 프로젝트 전체에서 ID 중복과 같은 도메인 안의 이름 충돌을 검사한다. 충돌하면 모든 파일을 진단하고 대표 문서를 고르지 않는다.
  문서가 추가·이동·삭제되거나 ID·이름·도메인·본문이 바뀌면 영향을 받는 검색 정보와 연결·진단을 다시 계산한다. 다시 읽지 않은 문서도 참조 대상이 바뀌면 연결과 진단이 달라질 수 있다.

  ## 편집 중인 문서

  편집기에서 저장하지 않은 YAML은 그 문서 하나만 현재 편집 내용으로 해석해 참조·ID·이름 충돌을 보여준다.
  다른 문서의 판단과 색인 자체는 저장한 내용으로만 바뀐다.

  ## 저장 뒤의 반영

  [[codocs_write]]로 저장한 서버는 저장한 경로를 바로 다시 읽어 색인에 반영하고, 반영이 끝나면(indexUpdated:true) 같은 서버의 조회가 저장 결과를 보여준다.
  다른 서버는 [[탐색]]의 감시로 변경을 알아차려 반영하므로 프로세스마다 반영 시점이 조금씩 다를 수 있다.
