_codocs:
  id: document-rename
  name: VS Code 문서 이름 변경
  parent:
    - 편집기 기능
개요: |
  VS Code 문서 이름 변경은 편집기에서 .codocs 문서의 name이나 섹션 이름을 바꾸면서 그 문서나 섹션을 가리키던 참조를 함께 고치는 동작이다.
  무엇을 고치는지와 결과 상태, 반영 방식은 [[이름 변경]]이 정하며, 이 문서는 편집기에서 시작하는 위치와 사용자가 보는 선택·알림만 설명한다.
  [[VS Code 확장]]이 실행한 언어 서버의 계산을 쓰므로 MCP에서 바꾼 결과와 같은 규칙이 적용된다.
시작 위치: |
  이름 바꾸기(F2)는 .codocs 문서에서 다음 위치에 커서를 두었을 때 시작한다.
  - 문서의 `_codocs.name` 값: 그 문서의 이름을 바꾼다.
  - 하나의 문서로 확정되는 `\[[참조]]`의 이름 부분: 참조가 가리키는 문서의 이름을 바꾼다. 같은 문서의 섹션을 가리키는 `\[[자기:섹션]]`의 이름 부분도 그 문서의 이름을 바꾼다.
  - 문서의 최상위 섹션 키: 그 섹션의 이름을 바꾼다. `_codocs`는 섹션이 아니다.
  - 문서와 섹션이 확정되는 `\[[이름:섹션]]`에서 섹션 부분: 참조가 가리키는 섹션의 이름을 바꾼다.

  다음 위치에서는 시작하지 않고 이름을 바꿀 수 없다고 안내한다.
  - 후보가 여럿이거나 대상이 없어 하나의 문서로 확정되지 않는 참조
  - 섹션이 없는 참조의 섹션 부분
  - 섹션 없이 자기 문서만 가리키는 `\[[자기]]`
  - name 외의 값과 섹션의 일반 텍스트
  - .codocs 문서가 아닌 파일

  시작할 수 없는 위치에서는 "이 위치에서는 문서나 섹션 이름을 바꿀 수 없습니다."라고 안내한다.

  입력 창에는 바꿀 문서의 현재 이름이나 섹션의 현재 이름이 채워진다.
  새 이름을 확정하면 파일을 바꾸지 않고 고칠 곳을 먼저 계산하며, 이 계산 결과를 보여주는 별도 미리보기 화면은 없다.
저장하지 않은 파일: |
  영향받는 파일 중 저장하지 않은 수정이 있는 파일이 하나라도 있으면 시작 전에 중단한다.
  영향받는 파일은 이름이 바뀌는 문서와 참조를 고칠 문서, 대상을 고르지 않으면 미해결로 남는 참조가 있는 문서다. 섹션 이름을 바꿀 때는 섹션이 있는 문서가 이름이 바뀌는 문서다.
  중단하면 아무 파일도 바꾸지 않고 저장하지 않은 파일의 경로를 알린다.
  저장하거나 수정을 되돌린 뒤 이름 바꾸기를 다시 시작하면 된다.
  모호한 참조의 대상을 고른 뒤에 영향받는 파일이 달라지면 쓰기 전에 같은 확인을 다시 한다.
모호한 참조 선택: |
  바꾸기 전에 후보가 여럿이었던 참조마다 대상을 고르는 목록이 열린다.
  목록의 제목에는 참조가 있는 파일과 참조 표기를 보여준다.
  목록의 항목은 후보 문서의 이름과 경로다.
  항목을 고르면 그 참조는 고른 문서를 기준으로 고친다.
  목록을 고르지 않고 닫으면 그 참조는 바꾸지 않고 미해결로 남긴다.
  한 참조를 닫아도 나머지 참조의 목록은 이어서 열린다.
반영과 결과 알림: |
  모든 선택이 끝나면 선택을 반영한 결과를 다시 계산해 파일에 바로 쓴다.
  파일에 직접 쓰므로 편집기의 실행 취소로 되돌릴 수 없다.
  이미 열린 파일은 저장하지 않은 수정이 없으므로 디스크의 새 내용으로 갱신된다.

  결과는 알림 메시지로 알린다.
  - 반영에 성공하면 바뀐 이름과 바꾼 파일 수를 알린다.
  - 바꾸지 않고 남긴 참조가 있으면 미해결 참조를 포함해 그 개수를 경고로 함께 알린다.
  - 진행할 수 없는 상태(blocked)이면 이유를 알리고 아무 파일도 바꾸지 않는다.
  - 파일이 미리보기 때와 달라져 반영하지 못하면 아무 파일도 바꾸지 않고 이름 바꾸기를 다시 시작하도록 안내한다.
  - 쓰는 도중 실패하면 파일마다 바뀜·복구됨·복구 실패 상태를 알린다.

  미저장 파일 확인과 파일 쓰기 사이에 새로 수정한 내용은 이 확인으로 보호하지 못한다.
  파일 쓰기 전의 [[revision]] 확인은 디스크 내용만 비교하므로 편집기에만 있는 수정은 감지하지 않는다.
