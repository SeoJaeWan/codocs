_codocs:
  id: editor-features
  name: 편집기 기능
  parent:
    - VS Code 확장
개요: |
  편집기 기능은 VS Code에서 .codocs 문서를 읽고 고치면서 관련 문서 사이를 오가게 하는 기능이다.
  [[VS Code 확장]]이 실행한 언어 서버가 .codocs 문서와 코드 파일의 참조를 읽어 제공한다.
  코드 식별자의 이름만으로 문서 설명을 띄우거나 문서를 연결하지 않는다.

  - [[참조 링크]]: YAML 섹션의 문서 참조를 눌러 대상 문서로 이동한다.
  - [[코드 참조]]: 코드 파일의 `@codocs` 표기를 눌러 문서나 섹션으로 이동하고, 문서의 섹션 키와 name 값에서 Hover 목록과 `코드 N곳` 표시로 코드 위치를 확인한다.
  - [[원문 열기]]: 링크를 눌렀을 때 대상을 확인하고 탭과 위치를 정하는 방식이다.
  - [[편집기 진단]]: .codocs 문서의 문제를 문제 목록과 밑줄로 보여준다.
  - [[VS Code 문서 이름 변경]]: 문서의 name이나 참조에서 이름 바꾸기(F2)로 문서 이름과 그 문서를 가리키는 문서 참조·코드 참조를 함께 고친다.

  이름 바꾸기는 .codocs 문서에서만 시작하며 코드 파일에서는 시작하지 않는다. 코드 파일은 이름 바꾸기를 반영할 때 표기만 고쳐진다.
