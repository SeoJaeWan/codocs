id: editor-features
name: '편집기 기능'
domains:
  - '제품 개념'
deprecatedAliases: []
definition: |
  편집기 기능은 VS Code에서 코드를 읽는 중에 관련 문서를 확인하고 문서와 코드 사이를 오가게 하는 기능이다.
  [[VS Code 확장]]이 실행한 언어 서버가 .codocs 문서와 코드를 함께 읽어 제공한다.
  프로그래밍 언어나 확장자와 관계없이 프로젝트의 모든 텍스트 파일에서 같은 방식으로 동작하며, 주석·문자열·화면 텍스트도 대상이다. 코드에 문법 오류가 있어도 동작한다.

  - [[코드 호버]]: 식별자에 마우스를 올려 연결된 문서의 설명과 관련 링크를 본다.
  - [[참조 링크]]: YAML 본문의 문서 참조를 눌러 대상 문서로 이동한다.
  - [[원문 열기]]: 링크를 눌렀을 때 대상을 확인하고 탭과 위치를 정하는 방식이다.
  - [[편집기 진단]]: .codocs 문서의 문제를 문제 목록과 밑줄로 보여준다.
  - [[VS Code 문서 이름 변경]]: 문서의 name이나 참조에서 이름 바꾸기(F2)로 문서 이름과 그 문서를 가리키는 참조를 함께 고친다.

  문서 이름 바꾸기는 .codocs 문서에서만 시작하며, 위 기능과 달리 코드 파일에서는 제공하지 않는다.
  입력 중인 식별자에 문서 ID를 추천하는 자동완성은 제공하지 않는다.
