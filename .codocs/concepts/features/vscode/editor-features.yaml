id: editor-features
name: '편집기 기능'
domains:
  - '제품 개념'
definition: |
  편집기 기능은 VS Code에서 코드를 읽는 중에 관련 문서를 확인하고 문서와 코드 사이를 오가게 하는 기능이다.
  Codocs 확장이 실행한 언어 서버가 .codocs 문서와 코드를 함께 읽어 아래 기능을 제공한다.

  ## 코드 호버

  코드의 식별자에 마우스를 올리면 [[식별자 참조]]로 연결된 문서의 이름과 정의를 보여준다.
  호버에는 함께 연결된 용어, 표시 중인 문서가 참조하는 문서, 그 문서를 참조하는 문서의 링크가 함께 표시된다.

  ## 원문 열기

  호버의 링크나 문서 본문의 [[문서 참조]]를 클릭하면 대상 문서의 YAML 원문을 열거나 이미 열린 탭으로 이동한다.

  ## 코드 참조 이동

  코드의 `@codocs \[[이름]]#L11` 같은 [[코드 참조]]는 지정한 문서·행·범위로 이동하는 링크가 된다.
  이 표기 범위에는 식별자 참조 호버를 표시하지 않는다.
  대상이 없거나 행 범위가 잘못된 표기에는 밑줄과 원인을 알려주는 호버가 표시된다.

  ## 문서에서 코드로 돌아가기

  코드 참조로 연결된 문서에서는 그 문서나 행을 가리킨 코드 위치로 돌아갈 수 있다. 표시 방식은 [[코드 참조]]에서 설명한다.

  ## 진단

  문서 형식 오류와 대상을 찾을 수 없는 참조 같은 문제는 편집기의 오류·경고로 표시된다.
