_codocs:
  id: editor-diagnostics
  name: 편집기 진단
  parent:
    - 편집기 기능
개요: |
  편집기 진단은 .codocs 문서의 [[진단]]을 편집기의 문제 목록과 밑줄로 보여주는 [[편집기 기능]]이다.
  열린 파일뿐 아니라 색인에 있는 모든 문서의 진단을 보여준다.
기준이 되는 내용: |
  닫힌 문서는 저장된 내용으로, 열린 문서는 저장하지 않은 현재 편집 내용으로 검사한다.
  열린 문서의 ID·이름은 저장 전에도 다른 문서들의 저장된 내용과 비교해 중복을 알려준다. 다른 문서 쪽의 중복 진단은 저장한 뒤에 바뀐다.
  .codocs 밖의 일반 YAML은 검사하지 않는다.
진단의 정리: |
  오류가 해결되거나 문서 삭제가 확인되면 그 진단을 지운다. 탐색이 일부만 끝났거나 실패해 보이지 않는 문서를 삭제된 것으로 처리하지 않는다.
  참조 대상이 없거나 확정되지 않은 경우를 구분해 보여주며 참조 텍스트를 자동으로 지우지 않는다.
  문서는 확정됐지만 섹션이 없는 참조는 `missing_section_reference` 오류로 참조 전체 위치에 보여준다. 같은 문서의 섹션을 가리키는 참조는 그 섹션이 있으면 진단하지 않는다.
다시 검사하지 못했을 때: |
  다시 검사하지 못한 것은 오류가 없다는 결과와 구분한다. 이전 진단을 보여줄 때는 과거 결과이고 현재 상태는 확인하지 못했다고 함께 알린다.
  이전 결과의 위치가 지금 내용에 그대로 맞을 때만 밑줄을 유지하고, 편집으로 위치가 달라졌거나 저장된 내용을 다시 확인하지 못했으면 밑줄을 지운다.
  다시 검사에 성공하면 최신 결과로 바꾸고 실패 안내를 지운다. 실패 안내는 반복 팝업 대신 상태 표시줄로 알리며, 누르면 영향받은 workspace·파일·실패 이유를 보여준다.
