_codocs:
  id: vscode-extension
  name: VS Code 확장
  parent:
    - 제품 개념
개요: |
  VS Code 확장은 편집기에서 Codocs를 쓰게 하는 진입점이다.
  확장이 별도 프로세스로 언어 서버를 실행해 연결하고, 언어 서버가 .codocs 문서와 코드를 읽어 [[편집기 기능]]을 제공한다.
프로젝트 연결: |
  VS Code에서 연 workspace 폴더를 프로젝트 루트로 사용하고 그 아래 루트 .codocs와 하위 폴더의 .codocs를 모두 지식 폴더로 연결한다.
  여러 workspace 폴더를 열면 폴더마다 별도 언어 서버와 색인을 두며 프로젝트 사이의 자료를 섞지 않는다.
  workspace 폴더가 중첩되면 파일을 담은 가장 가까운 폴더에 연결한다. 하위 폴더가 별도 workspace 폴더로 열려 있으면 바깥 폴더는 그 안의 .codocs를 하위 .codocs로 인정하지 않고 안쪽 폴더만 인정하므로, 같은 .codocs가 두 색인에 들어가 이름이 겹치지 않는다. 별도로 열지 않은 하위 폴더의 .codocs는 바깥 폴더가 계속 인정한다. 폴더 없이 연 파일과 모든 workspace 폴더 밖의 파일은 연결하지 않는다. 상위 디렉터리의 .codocs를 찾아 올라가지 않는다.

  프로젝트에 .codocs가 없으면 만들지 않고 기다린다. 사용자가 루트나 하위 폴더에 .codocs를 만들거나 지우면 감지해 색인을 다시 준비한다.
  .codocs 안의 파일 변경은 언어 서버가 감시해 반영하며, 문서 내용이 바뀐 것만으로는 확장이 색인 갱신을 요청하지 않는다.
연결 상태: |
  언어 서버가 예기치 않게 종료되면 자동으로 다시 시작하고, 열린 코드의 현재 내용(저장하지 않은 편집 포함)을 다시 동기화한다.
  반복해서 실패하면 자동 재시작을 멈추고 오류와 수동 재시작 방법을 안내한다.
  서버 연결 실패, 파일 접근 실패, .codocs 부재는 서로 구분해 안내하며 연결 실패를 빈 결과나 문서 부재로 보이지 않는다.
  진단 재검사 실패는 [[편집기 진단]]에서 설명하는 대로 상태 표시줄로 알린다.
