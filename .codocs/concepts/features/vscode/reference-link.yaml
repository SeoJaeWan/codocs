_codocs:
  id: reference-link
  name: 참조 링크
  parent:
    - 편집기 기능
개요: |
  참조 링크는 YAML 섹션의 [[문서 참조]]를 눌러 대상 문서로 이동하게 하는 [[편집기 기능]]이다.
  모든 섹션의 참조가 링크가 되며 `_codocs`의 이름·ID·parent에 쓴 같은 표기는 링크가 되지 않는다.
대상이 하나일 때: |
  대상이 하나로 확정되면 본문의 참조를 눌러 그 문서를 연다. 링크에는 대상 이름과 workspace 기준 상대 경로를 함께 보여주어 어떤 문서가 열릴지 알 수 있게 하며, 경로 구분자는 OS와 관계없이 `/`로 표시한다.
후보가 여러 개일 때: |
  같은 이름의 문서가 여러 개면 참조 위의 호버에 후보별 링크를 보여준다. 본문 자체에는 이동 대상을 두지 않으므로 본문을 눌러도 파일이나 선택 창이 열리지 않는다.
  호버에서 후보를 고르면 그 문서를 연다. 후보를 고른 것이 참조를 하나로 확정한다는 뜻은 아니므로 진단은 그대로 남는다.
후보의 표시 이름: |
  참조 링크에서 이름이 같은 후보가 여러 개면 .codocs 기준 상대 경로를 함께 보여준다. 예를 들어 `예약 · payment/reservation.yaml`과 `예약 · shipping/reservation.yaml`처럼 표시한다.
  이름이 겹치지 않으면 이름만 보여주며, 표시에 쓴 경로를 후보의 우선순위로 쓰지 않는다.
누를 때의 확인: |
  링크를 누르면 최신 [[문서 색인]]에서 대상을 다시 확인한 뒤 연다. 예전 경로가 있다는 것만으로 같은 문서라고 판단하지 않으며 확인하지 못하면 열지 않는다.
  저장하지 않은 편집 중에도 본문의 참조를 고치면 이전 위치에 링크가 남지 않도록 현재 편집 내용으로 다시 계산한다.
