id: hover
name: '코드 호버'
domains:
  - '제품 개념'
definition: |
  코드 호버는 코드의 식별자에 마우스를 올렸을 때 [[식별자 참조]]로 연결된 문서의 설명과 관련 링크를 보여주는 [[편집기 기능]]이다.

  ## 보여주는 내용

  가장 우선하는 문서의 이름과 정의를 먼저 보여주고 현재 ID·도메인·원문 열기 링크를 이어서 보여준다. 우선순위가 같은 문서가 여러 개면 모두 보여준다.
  그 아래에 연결 이유별 링크를 보여주며, 해당하는 링크가 없는 항목은 생략한다.

  - 함께 매칭된 용어: 같은 식별자 안에서 함께 연결된 다른 문서
  - 이 문서가 참조: 표시 중인 문서가 [[문서 참조]]로 가리키는 문서
  - 이 문서를 참조: 표시 중인 문서를 가리키는 문서

  예를 들어 reservationReturnZones의 reservation에 올리면 예약 설명과 return-zone 링크를, ReturnZones에 올리면 반납 구역 설명과 reservation 링크를 보여준다. 같은 파일의 다른 식별자에서만 연결된 문서는 넣지 않는다.
  링크한 문서의 본문이나 그 문서가 다시 참조하는 문서는 펼치지 않는다. 문서의 이름·정의 같은 내용은 그대로 표시만 하며 링크나 명령으로 실행되지 않는다.

  ## 이전 ID와 오류

  이전 ID로 연결된 문서에는 이전 ID라는 표시와 현재 ID를 함께 보여주고, message가 있으면 그 안내를 보여준다. message가 없으면 "이전 ID입니다. 현재 ID: return-zone" 같은 기본 안내를 쓴다.
  같은 문서가 같은 위치에서 현재 ID로도 연결되면 한 번만 보여주고 이전 ID 안내는 하지 않는다.
  필수 속성 누락 같은 문서 오류는 호버에도 보여주며 확인할 수 있는 내용과 원문 링크는 유지한다.
  같은 현재 ID의 문서가 여러 개면 중복 오류와 모든 문서의 링크를 보여주며 대표 설명을 고르지 않는다. 이 경우에도 함께 매칭된 용어 링크는 숨기지 않는다.
  읽지 못한 문서가 있으면 "일부 문서를 읽지 못해 후보가 누락될 수 있습니다"라고 안내하고, 연결된 문서가 없으면 호버를 띄우지 않는다. 색인 준비 중이나 조회 실패는 따로 안내한다.

  ## 최신 반영

  문서가 바뀌면 다음 호버부터 최신 내용을 보여준다. 이미 떠 있는 호버를 즉시 바꾸거나 강제로 닫지는 않지만, 그 링크를 누를 때는 최신 대상을 다시 확인한다.
  문서가 옮겨졌으면 새 위치로 링크를 바꾸고, 삭제가 확인되면 설명과 링크를 지운다. 탐색이 일부만 끝났거나 준비 중이면 삭제로 단정하지 않는다.
