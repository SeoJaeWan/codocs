id: open-source
name: '원문 열기'
domains:
  - '제품 개념'
definition: |
  원문 열기는 [[편집기 기능]]의 링크를 눌렀을 때 대상 문서의 YAML을 열고 이동하는 동작이다.
  [[참조 링크]]의 본문 링크와 호버의 후보 링크가 모두 같은 방식으로 연다. 코드 편집기의 기존 정의 이동과는 별개이며, 누르는 방법은 편집기 설정을 따른다.

  ## 확인된 대상만 열기

  링크를 누르면 최신 [[문서 색인]]으로 대상을 다시 확인한 뒤 연다. 화면에 남아 있던 오래된 링크도 같은 확인을 거친다.
  같은 파일의 내용만 바뀌었으면 최신 내용을 열고, 삭제됐거나 다른 문서로 바뀌었거나 대상이 새로 모호해졌으면 열지 않는다. 예전 경로에 새로 생긴 다른 문서를 대신 열지 않는다.
  서버가 다시 시작됐거나 링크가 있던 문서를 닫거나 고쳐 링크가 무효가 되었으면 열지 않는다.
  후보가 여러 개면 후보마다 링크를 주며 대표 문서를 골라 열지 않는다.
  경로에 Windows 드라이브, 공백, 한글 같은 Unicode 문자, %, #이 있어도 같은 방식으로 연다.

  ## 탭과 이동 위치

  이미 열린 파일은 그 탭을 다시 쓰며, 저장하지 않은 편집 내용은 그대로 두고 디스크 내용으로 덮어쓰거나 강제로 저장하지 않는다.
  문서 링크는 파일 맨 위로 이동하며 문서 전체를 선택하지 않는다.

  ## 열지 못했을 때

  이동하지 못한 이유(대상 확인 실패, 링크 무효, 파일 접근 오류 등)는 Codocs 출력 로그에 남기며 같은 실패는 반복해 기록하지 않는다.
  팝업을 띄우거나 출력 창을 자동으로 열어 작업을 방해하지 않는다.
