id: open-source
name: '원문 열기'
domains:
  - '제품 개념'
definition: |
  원문 열기는 [[편집기 기능]]의 링크를 눌렀을 때 대상 문서의 YAML이나 코드 위치를 열고 이동하는 동작이다.
  [[코드 호버]]·[[참조 링크]]의 문서 링크와 [[코드 참조]]의 문서·행 이동, 문서에서 코드로 돌아가는 이동이 모두 같은 방식으로 연다. 코드 편집기의 기존 정의 이동과는 별개이며, 누르는 방법은 편집기 설정을 따른다.

  ## 확인된 대상만 열기

  링크를 누르면 최신 [[문서 색인]]과 코드 [[탐색]] 결과로 대상을 다시 확인한 뒤 연다. 화면에 남아 있던 오래된 링크도 같은 확인을 거친다.
  같은 파일의 내용만 바뀌었으면 최신 내용을 열고, 삭제됐거나 다른 문서로 바뀌었거나 대상이 새로 모호해졌으면 열지 않는다. 예전 경로에 새로 생긴 다른 문서를 대신 열지 않는다.
  서버가 다시 시작됐거나 링크가 있던 문서를 닫거나 고쳐 링크가 무효가 되었으면 열지 않는다.
  코드 참조와 그 역참조 링크는 진행 중인 코드 탐색을 기다리지 않고 원래 파일과 대상 파일을 바로 확인한다. 표기가 지워지거나 옮겨졌거나 대상이 다른 문서로 바뀌었으면 열지 않으며, 같은 파일의 다른 곳만 고친 것으로는 막지 않는다.
  후보가 여러 개면 후보마다 링크를 주며 대표 문서를 골라 열지 않는다.
  경로에 Windows 드라이브, 공백, 한글 같은 Unicode 문자, %, #이 있어도 같은 방식으로 연다.

  ## 탭과 이동 위치

  이미 열린 파일은 그 탭을 다시 쓰며, 저장하지 않은 편집 내용은 그대로 두고 디스크 내용으로 덮어쓰거나 강제로 저장하지 않는다.
  문서 링크와 행을 지정하지 않은 코드 참조는 파일 맨 위로 이동하며 문서 전체를 선택하지 않는다.
  행을 지정한 코드 참조는 지금 열린 내용에서 그 행을 선택하고 강조한다. 저장하지 않은 편집이 있어도 이동을 막지 않으며, 지정한 행이 없으면 마지막 행으로 줄이지 않고 이동하지 않는다.
  문서에서 코드로 돌아갈 때는 함수 정의나 파일 맨 위가 아니라 코드 참조 표기가 있는 실제 위치를 선택한다.

  ## 열지 못했을 때

  이동하지 못한 이유(대상 확인 실패, 링크 무효, 파일 접근 오류, 지정한 행이 없음 등)는 Codocs 출력 로그에 남기며 같은 실패는 반복해 기록하지 않는다.
  팝업을 띄우거나 출력 창을 자동으로 열어 작업을 방해하지 않는다.
