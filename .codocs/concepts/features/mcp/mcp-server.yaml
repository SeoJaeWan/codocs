_codocs:
  id: mcp-server
  name: MCP 서버
  parent:
    - 제품 개념
개요: |
  MCP 서버는 AI 클라이언트가 프로젝트의 .codocs 문서를 찾고 읽고 수정하게 하는 진입점이다.
  AI 클라이언트가 서버를 실행해 stdio로 연결하면 [[MCP 도구]]를 호출할 수 있다.
실행과 프로젝트: |
  Node.js 24.x에서 설치한 codocs 실행 파일을 MCP 클라이언트 설정에 등록하고 `--project`로 프로젝트 폴더를 지정한다.
  `--project`를 생략하면 서버를 시작한 위치를 프로젝트로 사용하며, 상대 경로도 시작 위치를 기준으로 고정한다.
  서버 하나는 프로젝트 하나를 다루며 그 아래 .codocs를 지식 폴더로 사용한다.
세션과 색인: |
  서버는 시작할 때 프로젝트의 조회 세션 하나를 만들고 모든 도구가 같은 세션을 사용한다. 도구마다 별도 색인을 만들지 않는다.
  서버는 자기 색인을 유지하며 .codocs의 파일 변경을 감시해 반영한다. 색인이 준비되기 전이나 다시 구성하는 동안의 요청은 준비 중으로 안내한다.
  VS Code 언어 서버와 MCP 서버는 같은 계산 규칙을 쓰지만 색인과 메모리는 각자 따로 둔다.
전송과 종료: |
  stdout은 MCP 프로토콜 전용이며 로그는 stderr로 남긴다.
  stdin 종료·종료 신호·시작 중 실패는 같은 종료 절차로 연결과 세션을 정리한다. 정리 요청이 중복되거나 초기화가 일부만 완료된 경우에도 확보한 자원을 해제한다.
  세션 종료 뒤에는 진행 중인 읽기와 감시를 정리하고 새 결과를 게시하지 않는다.
