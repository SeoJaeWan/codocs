_codocs:
  id: write-review
  name: 중복 탐지
  parent:
    - MCP 서버
개요: |
  중복 탐지는 [[codocs_write]]가 문서를 저장하기 전에, 이번 요청으로 새로 쓴 문장이 다른 문서에 이미 있는 내용을 다시 적은 것인지 사용자가 고른 모델에게 물어보는 기능이다.
  겹치면 저장하지 않고 겹치는 문장 쌍을 돌려주며, 실제로 중복인지와 어느 쪽을 고칠지는 codocs_write를 부른 AI가 판단한다.
  모델은 겹침을 찾기만 하고 파일은 지금처럼 서버가 쓴다. 모델이 내용을 고쳐 저장하지 않는다.

  원본 문서에 `\[[링크]]`를 걸고도 그 옆에 같은 규칙을 표현만 바꿔 옮겨 적으면 글자 비교로는 잡히지 않는다. 쓰는 순간에 겹치는 문장을 보여 주어 링크로 바꿀 기회를 주려는 것이다.
켜기와 설정: |
  MCP 서버 설정의 환경 변수 `CODOCS_REVIEW_API_KEY`에 모델 제공자의 API 키를 넣었을 때만 켜진다.
  키가 없으면 codocs_write의 입력·동작·응답은 탐지가 없을 때와 같다. 설정 파일이 있어도 읽지 않는다.
  키는 서버를 시작할 때 읽으므로 키를 넣거나 빼면 서버를 다시 시작한다. 나머지 설정은 저장 요청마다 다시 읽는다.
  키 변수 이름은 `ANTHROPIC_API_KEY`가 아니다. 그 변수가 셸에 있으면 AI 클라이언트 자체가 그 키로 과금될 수 있기 때문이다.

  나머지 설정은 환경 변수나 프로젝트 루트의 선택 파일 `codocs.config.yaml`로 정한다.

  - 제공자: `CODOCS_REVIEW_PROVIDER` 또는 파일의 `review.provider`. 기본값은 `anthropic`이며 지금은 이것만 지원한다.
  - 모델: `CODOCS_REVIEW_MODEL` 또는 파일의 `review.model`. 기본값은 `claude-haiku-5-5`다.
  - 제외 경로: `CODOCS_REVIEW_EXCLUDE`(쉼표로 구분) 또는 파일의 `review.exclude`(목록). 기본값은 없음이다.

  항목마다 환경 변수 → 파일 → 기본값 순서로 쓴다. 제외 경로는 두 목록을 합치지 않고 환경 변수 값이 파일 값을 대신한다.
  환경 변수만으로 모든 항목을 정할 수 있어 저장소에 파일을 더하지 않아도 된다.
  API 키는 파일로 받지 않는다. 파일에 키 항목을 넣으면 잘못된 설정으로 본다.
  설정 파일은 `.codocs` 밖의 프로젝트 루트에 둔다. `.codocs` 안의 YAML은 문서로 읽히기 때문이다.
잘못된 설정: |
  설정 파일을 YAML로 해석할 수 없거나, 모르는 항목·잘못된 값·키 항목이 있거나, 환경 변수의 제공자가 지원하지 않는 값이면 그 요청은 탐지하지 못한 것으로 처리한다.
  이때도 저장은 진행하고 review_failed 경고의 suggestion에 원인(파일과 항목)을 담는다. 설정 실수 때문에 문서를 쓰지 못하게 하지 않으려는 것이다.
제외 경로: |
  논의 기록처럼 결정을 옮겨 적는 이력 문서를 탐지에서 빼기 위한 설정이다.
  경로는 프로젝트 루트 기준이며 `.gitignore`와 같은 문법으로 쓴다. 예를 들어 `.codocs/discussions/`는 그 폴더 아래의 모든 문서를 뺀다. `!`로 시작하는 줄은 앞에서 뺀 경로를 다시 넣는다.
  제외된 문서는 겹침 후보가 되지 않는다.
  제외된 문서에 쓰는 글은 탐지하지 않는다.
  검색·조회·검증에는 영향이 없다.
탐지하는 글: |
  요청을 지금처럼 검증하고, 저장할 수 있는 요청에만 탐지한다. 문서 검증, ID·이름 충돌, 참조 보호, revision 확인에서 실패하는 요청은 모델을 부르지 않고 지금처럼 실패한다.
  요청을 반영한 뒤의 섹션과 현재 파일의 같은 섹션을 문장 단위로 비교해 새로 쓴 문장만 보낸다. 문장은 줄과, 마침표 다음 공백에서 나눈다(숫자 뒤 마침표는 나누지 않는다).

  - create: 문서의 모든 섹션의 모든 문장
  - update(set·edit)와 replace: 반영 뒤 섹션에서 이전 섹션에 없던 문장. 새로 만든 섹션은 모든 문장이다.
  - unset, position만 쓴 update와 delete, move: 새 문장이 없다.

  조사나 낱말·값 하나를 바꾼 정도로 조금 고친 문장은 새 문장으로 보지 않는다. 이미 겹침이 있는 섹션에서 오타 하나를 고쳐도 막히지 않게 하려는 것이며, 참조 보호가 새로 끊어지는 참조만 막는 것과 같은 원칙이다.
  기존 줄 끝에 덧붙인 문장은 새 문장이다.
  새 문장이 없으면 모델을 부르지 않고 저장한다.
후보와 판정: |
  새 문장이 있는 섹션마다 그 문장과 낱말이 가까운 다른 문서의 섹션을 최대 10개 골라 함께 보낸다. 새 글이 들어가는 문서 자신은 후보가 아니다.
  후보는 요청을 반영한 뒤의 상태에서 고른다. 그래서 같은 changes 요청에서 함께 만들거나 고치는 다른 문서도 후보가 되고, 한 요청으로 두 문서에 같은 내용을 적으면 그것도 겹침으로 찾는다. delete로 지우는 문서는 후보가 아니다.
  가까운 섹션이 하나도 없으면 그 섹션은 모델을 부르지 않는다.

  모델은 후보가 정한 조건·기준·예외·값을 새 글이 다시 정하면, 표현을 바꾸거나 옆에 참조를 달았어도 겹침으로 본다.
  서로 다른 질문에 답하거나 다른 문서를 가리키며 관계와 목적만 적은 글은 겹침이 아니다.
  모델은 겹침마다 양쪽 문장을 인용해 섹션당 최대 3개를 돌려준다. 서버는 이 항목을 걸러서 버리지 않는다.
방향: |
  겹치는 문장 쌍마다 어느 쪽이 옮겨 적었는지는 겹치는 문장에 달린 링크로만 정한다. 모델에게 묻지 않는다.
  같은 줄의 다른 문장에 있는 링크는 보지 않는다.

  - 새 문장에만 상대 문서로 가는 `\[[상대 문서]]`나 `\[[상대 문서:섹션]]`이 있으면 새 글이 옮겨 적은 것(copiedBy: new)이다.
  - 상대 문장에만 이 문서로 가는 링크가 있으면 상대 문서가 이 내용을 옮겨 적고 있는 것(copiedBy: existing)이다.
  - 링크가 없거나 양쪽에 모두 있거나 인용이 든 문장을 찾지 못하면 방향을 모르는 것이며 copiedBy를 담지 않는다.
처리: |
  문장 쌍의 방향에 따라 요청을 처리한다. 쌍이 여럿이면 하나라도 막는 쌍이 있을 때 막는다.

  - 겹침이 없으면 저장한다.
  - copiedBy: new가 있으면 막는다.
  - 방향을 모르는 쌍이 있으면 막는다. 어느 쪽이 원본인지는 말하지 않는다.
  - 모든 쌍이 copiedBy: existing이면 저장하고 그 쌍들을 알린다.

  막은 요청은 파일과 폴더를 바꾸지 않으며 changes면 어떤 항목도 저장하지 않는다.
  결과의 모양은 [[codocs_write]]의 결과에서 설명한다.
확인 값: |
  지금 쓰는 글이 원본이라 고칠 것이 없거나 모델이 틀린 경우에도 저장할 수 있도록, 막은 결과에 확인 값 reviewToken을 담는다.
  같은 요청에 그 값을 붙여 다시 보내면 모델을 부르지 않고 저장한다. 기존 검증과 revision 확인은 그대로 거친다.
  확인 값은 저장하려던 내용에 묶여 있어 내용이 하나라도 달라지면 인정하지 않고 다시 탐지한다. 서버가 만들지 않은 값도 인정하지 않는다.
  서버를 다시 시작하면 이전 확인 값은 맞지 않으므로 다시 탐지한다. 서버는 확인 값을 따로 기억하지 않는다.

  확인 값을 붙이기 전에 겹치는 두 문장을 읽고, 새 글을 원본 문서로 가는 링크와 관계 설명으로 바꿀 수 있는지 먼저 본다. 서버는 AI가 문장을 읽었는지 확인할 수 없다.
탐지하지 못함: |
  모델 호출 오류, 60초 시간 초과, 모델의 판정 거부, 출력을 해석하지 못한 경우는 탐지하지 못한 것이다.
  탐지하지 못해도 저장은 진행하고 review_failed 경고로 원인을 알린다. 여러 섹션 가운데 일부만 실패하면 실패한 섹션의 경고를 담고, 나머지 섹션의 판정은 위 처리를 따른다.
외부 전송: |
  탐지를 켜면 새로 쓴 문장과 후보 섹션의 본문, 섹션 주소가 사용자가 고른 제공자에게 전송된다. 문서 전체나 다른 파일은 보내지 않는다.
  새 문장이 있는 섹션마다 한 번씩 호출하므로 섹션이 많은 문서를 만들면 호출도 그만큼 늘어난다. 비용은 사용자의 API 키로 청구된다.
알려진 한계: |
  낱말을 거의 다 바꾼 재서술은 후보에 오르지 못해 모델이 보지 못할 수 있다.
  모델이 가끔 관련 없는 문장을 묶어 막을 수 있으며, 같은 글의 판정이 호출마다 다를 수 있다. 이때는 확인 값으로 저장한다.
  탐지를 켜기 전에 생긴 중복은 그대로 남고 새로 쓰는 글만 본다. 중복이 많은 프로젝트에서는 새 문장이 자주 막힐 수 있다.
