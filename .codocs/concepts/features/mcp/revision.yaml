id: revision
name: 'revision'
domains:
  - '제품 개념'
definition: |
  revision은 [[MCP 도구]]로 문서를 읽은 뒤 고칠 때, 그사이 다른 사람이나 도구가 같은 파일을 바꿨는지 확인하는 값이다.
  이 확인이 없으면 AI가 처음 읽은 내용을 기준으로 저장하면서 그사이 사람이 고친 내용을 모르고 덮어쓸 수 있다.

  ## 확인하는 방법

  1. [[codocs_get]]이 문서와 함께 읽은 시점의 revision을 돌려준다.
  2. 수정할 때 [[codocs_write]]에 그 revision을 함께 보낸다.
  3. 서버는 저장 직전 실제 파일로 revision을 다시 계산해 비교한다. 다르면 읽은 뒤 파일이 바뀐 것이므로 저장하지 않고 revision_conflict로 알린다.
  4. 충돌이 나면 문서를 다시 읽고 바뀐 내용을 반영해 수정안을 다시 만든 뒤 새 revision으로 보낸다. 서버가 수정안을 새 revision에 자동으로 다시 적용하지는 않는다.

  ## 값의 성질

  파일 내용 전체로 계산하므로 주석·공백·줄바꿈 한 글자만 바뀌어도 값이 달라지고, 내용이 같으면 언제 계산해도 같은 값이다.
  버전 번호나 편집 횟수가 아니며 편집 이력을 남기지 않는다. 문서 속성도 아니다.
  읽은 시점의 내용만 나타내므로 최신 파일 내용을 대신하지 않으며 저장 순서를 정하는 잠금도 아니다. 동시 저장에서 남는 한계는 [[codocs_write]]에서 설명한다.
  VS Code에서 사람이 편집할 때는 쓰이지 않는다.
