id: tool-result
name: '도구 결과'
domains:
  - '제품 개념'
deprecatedAliases: []
definition: |
  도구 결과는 모든 [[MCP 도구]]가 돌려주는 응답의 공통 형식이다.
  최상위 success는 요청을 처리했는지를 나타내며, 문서가 유효한지·있는지·파일에 저장됐는지를 대신하지 않는다.

  ## 요청 실패와 개별 문제

  입력·커서·탐색 문제로 요청을 처리할 수 없으면 success:false와 error([[진단]])를 돌려준다.
  요청을 처리했다면 빈 목록이나 개별 ID의 부재·충돌·문서 오류가 있어도 success:true이며 문제는 각 항목에 표시한다.
  [[codocs_validate]]가 문서 오류를 보고하거나 [[codocs_refresh]]가 오류 문서를 포함해 탐색을 마친 경우도 요청 처리는 성공이다.

  MCP 응답의 structuredContent에는 결과 객체를, content의 text에는 같은 결과를 JSON 문자열로 담는다. isError는 success:false일 때만 true다.
  알 수 없는 도구나 잘못된 JSON-RPC 메시지 같은 프로토콜 오류는 이 결과와 구분한다.

  ## 탐색 상태에 따른 응답

  목록·상세 결과의 scanStatus는 [[탐색 상태]]를 전달한다.
  complete이고 문서 감시가 정상일 때만 없는 ID를 found:false와 not_found로 확정한다.
  partial이면 가진 결과를 돌려주되 문서마다 confirmation과 미확인 진단을 주고, 색인에 없는 ID는 없다고 확정하지 않는다. 이때 totalCount는 가진 목록의 수이며 실제 전체 수를 보장하지 않는다.
  failed이면 원인과 함께 요청을 실패로 돌려주며 이전에 보관한 자료를 최신 결과처럼 보여주지 않는다.
  문서 감시가 끊긴 상태의 응답은 [[탐색 상태]]에서 설명한다.

  ## 저장 결과

  [[codocs_write]]는 saved·changed와 색인 반영 결과 indexUpdated를 따로 돌려준다. success나 오류 코드 하나로 저장 여부를 추측하지 않는다.
