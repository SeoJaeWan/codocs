id: mcp-tools
name: 'MCP 도구'
domains:
  - '제품 개념'
definition: |
  MCP 도구는 AI가 [[MCP 서버]]를 통해 프로젝트의 문서를 찾고 읽고 수정할 때 호출하는 기능이다.
  AI는 전체 문서를 한 번에 읽지 않고 목록에서 필요한 문서를 골라 읽은 뒤 판단한다.

  ## 도구

  - [[codocs_list]]: 문서 목록을 도메인으로 걸러 페이지 단위로 조회한다.
  - [[codocs_get]]: 현재 ID로 문서의 내용·참조·revision을 읽는다.
  - [[codocs_write]]: 문서를 새로 만들거나 읽은 revision을 기준으로 수정한다.
  - [[codocs_validate]]: 프로젝트 전체나 YAML 파일 하나의 오류·경고를 확인한다.
  - [[codocs_duplicates]]: 문서 본문에서 같은 설명이 반복되는 곳을 찾는다.
  - [[codocs_refresh]]: 문서 색인 전체를 다시 구성한다.
  - [[codocs_guide]]: 문서 형식과 작성·수정 방법 안내를 읽는다.

  ## 공통 규칙

  도구 이름은 위 일곱 개이며 서버는 실제로 처리할 수 있는 도구만 제공한다.
  도구 입력에 알 수 없는 속성이 있으면 invalid_input으로 거부한다.
  요청이 처리되면 success:true다. 문서 오류를 정상적으로 보고한 경우도 요청 처리는 성공이다.
  색인이 준비되지 않았거나 일부만 확인된 상태는 결과의 scanStatus로 구분하며, 확인하지 못한 문서를 없는 문서로 단정하지 않는다.
