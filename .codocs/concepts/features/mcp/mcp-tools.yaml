_codocs:
  id: mcp-tools
  name: MCP 도구
  parent:
    - MCP 서버
개요: |
  MCP 도구는 AI가 [[MCP 서버]]를 통해 프로젝트의 문서를 찾고 읽고 수정할 때 호출하는 기능이다.
  AI는 전체 문서를 한 번에 읽지 않고 목록으로 parent 구조를 따라가며 필요한 문서나 섹션을 골라 읽은 뒤 판단한다.
도구: |
  - [[codocs_list]]: 최상위 문서나 한 문서의 직속 자식을 섹션 이름과 함께 조회한다.
  - [[codocs_get]]: `이름`이나 `이름:섹션` 주소로 문서 전체나 섹션 하나의 내용·참조·revision을 읽는다.
  - [[codocs_write]]: 문서를 새로 만들거나 읽은 revision을 기준으로 수정한다.
  - [[codocs_rename]]: 문서의 name을 바꾸고 그 문서를 가리키던 문서 참조와 코드 파일의 `@codocs` 표기를 함께 고친다. 미리보기 뒤에 반영한다.
  - [[codocs_validate]]: 프로젝트 전체나 YAML 파일 하나의 오류·경고를 확인한다.
  - [[codocs_duplicates]]: 문서 본문에서 같은 설명이 반복되는 곳을 찾는다.
  - [[codocs_refresh]]: 문서 색인 전체를 다시 구성한다.
  - [[codocs_guide]]: 문서 형식과 작성·수정 방법 안내를 읽는다.
공통 규칙: |
  도구 이름은 위 여덟 개이며 서버는 실제로 처리할 수 있는 도구만 제공한다.
  도구 입력에 알 수 없는 속성이 있으면 invalid_input으로 거부하며 조용히 지우고 처리하지 않는다.
  입력 형태가 잘못된 요청은 invalid_input이고, 문서 내용의 문제는 [[진단]]으로 따로 알린다.
  문서를 고칠 때는 읽은 시점의 [[revision]]으로 그사이 파일이 바뀌었는지 확인한다. 이름을 바꿀 때는 미리보기가 돌려준 파일별 revision을 쓴다.
  응답의 공통 형식은 [[도구 결과]]를 따른다. 요청이 처리되면 success:true이며, 문서 오류를 정상적으로 보고한 경우도 요청 처리는 성공이다.
  오류·경고는 [[진단]]의 필드와 코드로 전달한다.
  색인이 준비되지 않았거나 일부만 확인된 상태는 결과의 scanStatus([[탐색 상태]])로 구분하며, 확인하지 못한 문서를 없는 문서로 단정하지 않는다.
