id: list-tool
name: 'codocs_list'
domains:
  - '제품 개념'
definition: |
  프로젝트의 문서 목록을 조회하는 [[MCP 도구]]다.
  본문 없이 문서를 고를 수 있는 정보만 돌려주며, 필요한 문서의 내용은 [[codocs_get]]으로 읽는다.

  ## 입력

  모든 입력은 선택이다. domain을 주면 그 도메인에 속한 문서만 조회하며, 어느 문서에도 쓰이지 않은 도메인이면 빈 목록이다.
  cursor를 주면 이전 응답의 nextCursor 다음 페이지를 이어서 조회한다.

  ## 결과

  목록을 50개씩 돌려주며 마지막 페이지는 남은 수만큼이다.
  items에는 문서마다 id·name·domains와 오류 표시(hasErrors)를 담는다. 검증 오류가 있는 문서도 ID와 이름을 확인할 수 있으면 목록에 나온다.
  같은 ID의 파일들은 항목 하나로 묶어 conflict와 모든 파일 paths를 주며 대표 이름·도메인을 고르지 않는다.
  목록은 ID 순서이며 충돌 경로는 경로 순서다.
  totalCount는 조건에 맞는 전체 수, returnedCount는 이번 페이지의 수, nextCursor는 다음 페이지 토큰이며 마지막 페이지에서는 null이다.
  색인이 바뀌어 이어 읽을 수 없는 커서는 만료로 안내한다.
