_codocs:
  id: get-tool
  name: codocs_get
  parent:
    - MCP 도구
개요: |
  문서 이름으로 문서 전체나 섹션 하나의 내용과 연결을 읽는 [[MCP 도구]]다.
  문서를 수정하기 전에 이 도구로 읽은 ID와 [[revision]]을 [[codocs_write]]에 사용한다.
입력: |
  addresses 배열은 필수이며 처음 등장한 순서로 중복을 제거한 뒤 1~20개여야 한다. 빈 배열이나 초과는 요청 전체를 거부한다.
  주소는 대괄호 없이 적는 문자열이며 다음 두 형태다.
  - `이름`: 그 이름의 문서 전체를 읽는다.
  - `이름:섹션`: 그 문서의 섹션 하나를 읽는다.

  이름과 섹션을 나누는 콜론과 escape는 [[참조]]의 표기 규칙과 같다. 이름이나 섹션 이름에 콜론이 들어가면 `\:`로 적는다.
  읽을 문서와 섹션의 이름은 [[codocs_list]]의 items와 sections에서 확인한다.
결과: |
  요청한 주소마다 results에 처음 등장한 순서로 결과를 돌려주며, 각 결과에 요청한 address를 담는다.
  한 주소의 부재·오류가 다른 주소의 결과를 막지 않으며, 본문이나 참조 목록을 응답 크기 때문에 자르지 않는다.
문서 결과: |
  `이름` 주소로 찾은 문서에는 found·document(`_codocs`와 섹션), 파일 위치 source.path, 읽은 시점의 [[revision]]을 담는다. source.path는 서버가 계산한 값이며 문서의 키가 아니다.
  references는 이 문서의 모든 섹션에 있는 [[문서 참조]]가 직접 가리키는 문서 이름, referencedBy는 이 문서를 확정된 문서 참조로 가리키는 문서 이름이다.
  섹션까지 확정된 `\[[이름:섹션]]`도 대상 문서 하나로 세며, references·referencedBy는 섹션 정보 없이 문서 이름만 담는다. 같은 문서의 섹션을 가리키는 참조와 섹션이 없는 참조는 담지 않는다.
  references·referencedBy에는 대상이 프로젝트에서 하나로 확정된 문서만 이름 순서로 담는다. 대상이 없거나 여러 개이면 목록에서 빼고 진단으로 알린다.
  검증 오류가 있는 문서도 확인 가능한 내용과 원문, 진단을 함께 돌려주어 고칠 수 있게 한다. 내용을 JSON으로 나타낼 수 없으면 값을 고치지 않고 전체 원문(rawYaml)을 준다.
  `_codocs.parent`는 document에 그대로 담기며 references·referencedBy에는 넣지 않는다.
섹션 결과: |
  `이름:섹션` 주소로 찾은 섹션에는 found와 문서의 name·id, source.path, 읽은 시점의 [[revision]], section(name·content)을 담는다.
  revision은 섹션이 아닌 문서 파일 전체의 값이므로, 섹션을 읽은 뒤 다시 조회하지 않고 [[codocs_write]]로 그 문서를 고칠 수 있다.
  references는 그 섹션 안의 [[문서 참조]]가 직접 가리키는 문서 이름만 문서 결과와 같은 기준으로 담는다.
  referencedBy와 다른 섹션의 내용은 담지 않는다. 다른 문서가 이 섹션을 가리키는 섹션 단위 역참조는 [[문서 색인]]에만 있다.
찾지 못한 주소와 충돌: |
  주소마다 문제를 그 결과에 found:false와 진단으로 알린다.
  - 주소 형식이 [[참조]]의 표기 규칙에 맞지 않으면 invalid_input이다.
  - 그 이름의 문서가 없으면 not_found다.
  - 문서는 있지만 그 섹션이 없으면 section_not_found다.

  같은 이름의 문서가 여럿이면 conflict와 해당 파일 paths, duplicate_name 진단을 주며 대표 내용이나 revision을 만들지 않는다.
  찾은 문서의 ID가 다른 파일과 같으면 conflict와 해당 파일 paths, duplicate_id 진단을 주며 revision을 만들지 않는다. ID로 수정할 대상을 하나로 정할 수 없기 때문이다.
  탐색이 끝나지 않았을 때 찾지 못한 주소의 처리는 [[도구 결과]]를 따른다.
