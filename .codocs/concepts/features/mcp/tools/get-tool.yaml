_codocs:
  id: get-tool
  name: codocs_get
  parent:
    - MCP 도구
개요: |
  현재 ID로 문서의 내용과 연결을 읽는 [[MCP 도구]]다.
  문서를 수정하기 전에 이 도구로 읽은 revision을 [[codocs_write]]에 사용한다.
입력: |
  ids 배열은 필수이며 처음 등장한 순서로 중복을 제거한 뒤 1~20개여야 한다. 빈 배열이나 초과는 요청 전체를 거부한다.
  조회 키는 현재 ID다. ID를 바꾼 뒤에는 목록에서 새 ID를 확인한다.
결과: |
  요청한 ID마다 results에 결과를 돌려준다. 찾은 문서에는 found·document(`_codocs`와 섹션), 파일 위치 source.path, 읽은 시점의 [[revision]]을 담는다. source.path는 서버가 계산한 값이며 문서의 키가 아니다.
  references는 이 문서의 모든 섹션에 있는 [[문서 참조]]가 직접 가리키는 문서 ID, referencedBy는 이 문서를 확정된 문서 참조로 가리키는 문서 ID다.
  섹션까지 확정된 `\[[이름:섹션]]`도 대상 문서 하나로 세며, references·referencedBy는 섹션 정보 없이 문서 ID만 담는다. 같은 문서의 섹션을 가리키는 참조와 섹션이 없는 참조는 담지 않는다.
  references·referencedBy에는 ID가 유효하고 프로젝트에서 유일한 문서만 ID 순서로 담는다. 대상이 없거나 여러 개이거나 ID에 문제가 있으면 목록에서 빼고 진단으로 알린다.
  검증 오류가 있는 문서도 확인 가능한 내용과 원문, 진단을 함께 돌려주어 고칠 수 있게 한다. 내용을 JSON으로 나타낼 수 없으면 값을 고치지 않고 전체 원문(rawYaml)을 준다.
  같은 ID가 여러 파일에 있으면 conflict와 해당 파일 paths, duplicate_id 진단을 주며 대표 내용이나 revision을 만들지 않는다.
  `_codocs.parent`는 document에 그대로 담기며 references·referencedBy에는 넣지 않는다.
  한 ID의 부재·오류가 다른 ID의 결과를 막지 않으며, 본문이나 참조 목록을 응답 크기 때문에 자르지 않는다.
