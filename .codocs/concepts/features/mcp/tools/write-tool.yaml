id: write-tool
name: 'codocs_write'
domains:
  - '제품 개념'
definition: |
  문서를 새로 만들거나 수정하는 [[MCP 도구]]다. 요청 하나는 문서 하나를 다룬다.
  저장 전에 변경 후의 문서 전체를 [[문서 검증]]과 프로젝트의 ID·이름 충돌, 참조 기준으로 검사하며 오류가 남으면 저장하지 않는다.

  ## create

  .codocs 아래의 상대 path와 전체 document를 받아 새 파일을 만든다. 경로는 `/`로 구분하고 `.yaml` 또는 `.yml`로 끝나야 한다.
  절대 경로, `.`·`..` 구간, 빈 구간, 역슬래시는 보정하지 않고 거부한다. 이미 있는 파일은 덮어쓰지 않는다.
  document에 deprecatedAliases가 없으면 `[]`로 채운다.

  ## update

  현재 ID, [[codocs_get]]으로 읽은 revision, 최상위 속성의 set·unset을 받는다. 파일 위치는 그대로 둔다.
  객체·배열 값은 통째로 바꾸며 점이 있는 속성 이름을 중첩 경로로 해석하지 않는다.
  필수 속성의 unset, set과 unset의 같은 속성 지정, 빈 변경은 거부한다.
  set.id로 ID를 바꾸면 직전 ID를 deprecatedAliases에 자동으로 추가한다. deprecatedAliases는 update로 직접 바꿀 수 없다.

  ## 충돌과 원문 보존

  저장 직전 실제 파일의 revision이 요청과 다르면 revision_conflict로 실패하고 파일을 바꾸지 않는다. 최신 문서를 다시 읽고 수정안을 검토한 뒤 새 revision으로 요청한다.
  바꾸지 않은 속성의 공백·주석·따옴표·줄바꿈·순서는 유지하며 문서 전체를 다시 포맷하지 않는다.
  프로젝트 탐색이 완료되지 않았으면 충돌·참조를 확정할 수 없으므로 저장하지 않는다.

  ## 결과

  저장 여부와 변경 여부, 새 revision과 진단을 돌려준다. 바뀐 내용이 없으면 파일을 쓰지 않고 변경 없음으로 알린다.
  저장 전에 같은 입력으로 [[codocs_duplicates]]의 초안 검토를 요청해 반복 설명을 확인할 수 있다.
