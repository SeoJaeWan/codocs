_codocs:
  id: write-tool
  name: codocs_write
  parent:
    - MCP 도구
개요: |
  문서를 새로 만들거나 일부를 수정하거나 문서 전체를 교체하는 [[MCP 도구]]다. 요청 하나는 문서 하나를 다룬다.
  저장 전에 변경 후의 문서 전체를 [[문서 검증]]과 프로젝트의 ID·이름 충돌, 참조 기준으로 검사하며 오류가 남으면 저장하지 않는다. 다른 문서와 코드 파일의 참조를 새로 끊는 변경도 저장하지 않는다.
  create가 실패했다고 update로 바꾸거나 update가 실패했다고 replace로 바꾸거나, 없는 문서의 update를 새 문서로 만들지 않는다.
create: |
  .codocs 아래의 상대 path와 전체 document를 받아 새 파일을 만든다. 경로는 `/`로 구분하고 `.yaml` 또는 `.yml`로 끝나야 한다.
  절대 경로, `.`·`..` 구간, 빈 구간, 역슬래시는 보정하지 않고 거부한다. 이미 있는 파일은 덮어쓰지 않으며(file_exists), 필요한 .codocs와 상위 폴더는 만든다.
  document는 `_codocs`와 섹션으로 구성하며 입력한 키 순서대로 저장한다.
update: |
  현재 ID, [[codocs_get]]으로 읽은 [[revision]], 최상위 키의 set·unset을 받는다. 파일 위치는 그대로 둔다.
  섹션은 `set: { 개요: "..." }`처럼 이름을 키로 지정해 그 섹션만 바꾸고 나머지 섹션의 원문은 그대로 둔다. unset에 섹션 이름을 넣으면 그 섹션을 지우며, 마지막 섹션을 지우면 검증 오류다.
  `set._codocs`는 `_codocs` 객체 전체를 교체하며 일부 키만 병합하지 않는다. id·parent도 이 값으로 바뀌며, id와 name을 빼면 검증 오류다. 이때 `_codocs` 안의 주석·따옴표는 다시 쓰인다.
  `unset`에 `_codocs`를 넣으면 invalid_input이다. set과 unset의 같은 키 지정, 빈 변경도 거부한다.
  `set._codocs`의 name이 현재 이름과 다르면 name_change_not_allowed로 저장하지 않고 `codocs_rename`으로 [[이름 변경]]을 하도록 안내한다. name을 바꾸면 다른 문서의 참조도 함께 고쳐야 하는데 이 도구는 문서 하나만 다루기 때문이다.
  `set._codocs`의 name이 현재 이름과 같으면 이름은 바뀌지 않은 것으로 처리한다.
  `set._codocs`의 id로 ID를 바꾸면 이전 ID를 남기지 않는다. ID를 바꿔도 다른 문서의 참조나 사용자의 코드는 자동으로 고치지 않는다.
  `set.id`는 `_codocs.id`를 바꾸지 않고 `id`라는 이름의 섹션을 만든다.
replace: |
  현재 ID, [[codocs_get]]으로 읽은 [[revision]], `_codocs`를 포함한 문서 전체 document를 받아 파일의 문서 전체를 새 값으로 바꾼다. 파일 위치는 그대로 둔다.
  document에 없는 최상위 섹션은 삭제한다. 지우려는 섹션을 가리키던 다른 문서와 코드 파일의 참조가 새로 깨지면 아래 참조 보호가 거절한다.
  set·unset은 함께 보낼 수 없고 id·revision·document 외의 속성이 있으면 invalid_input이다. mode를 보고 update나 create 입력으로 바꿔 해석하지 않는다.
  `_codocs.name`이 현재 이름과 다르면 update와 같이 name_change_not_allowed로 거절하며, `_codocs.id`는 바꿀 수 있다.
  새 값과 현재 값이 같으면 파일을 쓰지 않고 changed:false로 알린다. 값이 같은 최상위 키의 주석·따옴표·형식은 그대로 두고 순서만 다른 요청도 변경으로 보지 않는다. 문서 최상위의 주석은 보존한다.
참조 보호: |
  update와 replace는 이번 변경으로 새로 끊어지는 참조만 막는다. 다른 문서의 `\[[이름]]`·`\[[이름:섹션]]`과 코드 파일의 [[코드 참조]]가 이전에는 확정되었는데 변경 뒤 확정되지 않으면 reference_broken으로 저장하지 않고 진단에 참조를 쓴 파일과 위치를 담는다.
  이전부터 깨져 있던 참조나 이번 변경과 무관한 오류는 실패 사유로 쓰지 않는다.
  코드 파일의 참조를 확인해야 하는데 코드 수집이 끝나지 않았거나 일부 파일을 읽지 못해 확인할 수 없으면 확정하지 못한 것을 없다고 보지 않고 code_evidence_incomplete로 저장하지 않는다. 확인이 필요하지 않은 변경은 이 이유로 막지 않는다.
  이 도구는 코드 파일을 고치지 않으며 한 요청이 다루는 문서도 하나다.
충돌과 원문 보존: |
  저장 직전 실제 파일의 revision이 요청과 다르면 revision_conflict로 실패하고 파일을 바꾸지 않는다. 최신 문서를 다시 읽고 수정안을 검토한 뒤 새 revision으로 요청한다. 서버가 수정안을 새 revision에 자동으로 다시 적용하지는 않는다.
  바꾸지 않은 최상위 키의 공백·주석·따옴표·줄바꿈·순서는 유지하며 문서 전체를 다시 포맷하지 않는다.
  새 키는 마지막 키 뒤에 주변 들여쓰기에 맞춰 추가하고, 지운 키는 그 키의 원문만 지운다.
  읽는 과정에서 글자가 깨지는 파일(UTF-8로 해석할 수 없는 내용이 있는 파일)은 수정하지 않는다. 깨진 글자로 저장하면 고치지 않은 부분까지 손상되기 때문이다.
  프로젝트 탐색이 완료되지 않았으면 충돌·참조를 확정할 수 없으므로 저장하지 않는다.
충돌 검사: |
  ID와 이름은 프로젝트 전체에서 유일해야 하며, 같은 ID나 같은 이름의 다른 문서가 있으면 저장하지 않는다.
  `_codocs.parent`에 적은 이름의 문서가 없거나 parent를 따라가 순환하면 저장하지 않는다.
  수정한 문서는 기존 문서를 대체한 상태로 검사하므로 자기 자신과 충돌하지 않는다.
  이번 변경과 관계없는 다른 문서의 오류는 실패 사유로 쓰지 않는다. 오류가 남은 문서에 같은 값을 다시 보내는 요청은 실패하고, 경고만 있으면 저장한다.
동시 수정: |
  저장은 임시 파일에 먼저 기록한 뒤 교체하므로 저장 도중 실패해도 원래 파일은 비지 않는다.
  revision 확인과 파일 교체는 한 번의 연산이 아니며 저장 순서를 정하는 잠금도 없다. 두 작성자가 같은 revision을 확인한 뒤 차례로 저장하면 뒤의 저장이 앞의 변경을 덮어쓸 수 있고, 이 경우 revision_conflict가 나오지 않을 수 있다.
  실제로 동시 저장 때문에 변경이 사라지는 사례가 생기면 잠금이나 조건부 저장을 다시 검토한다.
결과: |
  success·saved·changed로 요청 처리, 파일 저장, 내용 변경 여부를 구분하고, 저장했으면 id·source.path·새 revision·경고와 색인 반영 결과(indexUpdated)를 돌려준다. 문서 본문은 다시 돌려주지 않는다.
  바뀐 내용이 없으면 파일을 쓰지 않고 success:true·saved:false·changed:false로 알린다.
  저장은 됐지만 색인 반영이 실패하면 한 번 더 다시 읽어 복구하고, 그래도 실패하면 saved:true·indexUpdated:false로 알리며 [[codocs_refresh]]를 안내한다. 이미 저장한 파일을 다시 쓰거나 되돌리지 않으므로 같은 요청을 다시 보내지 않는다.
  저장 뒤 임시 파일 정리만 실패한 경우도 저장은 성공이며 정리 실패를 진단으로 따로 알린다.
