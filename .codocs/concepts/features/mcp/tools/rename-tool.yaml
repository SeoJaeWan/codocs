_codocs:
  id: rename-tool
  name: codocs_rename
  parent:
    - MCP 도구
개요: |
  문서의 name이나 섹션 이름을 바꾸고 그 문서나 섹션을 가리키던 문서 참조와 코드 파일의 코드 참조를 함께 고치는 [[MCP 도구]]다. 요청 하나는 문서 하나의 이름이나 문서 하나의 섹션 이름을 다룬다.
  무엇을 고치고 어떤 참조를 남기는지의 규칙은 [[이름 변경]]을 따르며, 이 문서는 도구의 입력과 응답만 설명한다.
  mode로 preview와 apply를 나누며 서버는 미리보기 결과를 보관하지 않는다.
입력: |
  모든 mode가 받는 값은 다음과 같다.
  - mode: preview 또는 apply.
  - id: 이름을 바꿀 문서의 현재 ID.
  - newName: 새 이름.
  - section: 이름을 바꿀 섹션의 현재 이름. 생략할 수 있다.
  - selections: 모호한 참조의 대상을 고르는 목록. 생략할 수 있다.

  section을 생략하면 문서 이름 변경이다. section을 주면 id 문서의 그 섹션 이름 변경이며 newName은 새 섹션 이름이다.

  selections의 항목은 다음 값을 가진다.
  - sourcePath: 고를 참조가 있는 파일의 경로.
  - occurrenceIndex: 그 파일에서 고를 참조의 순번.
  - targetPath: 대상으로 고른 후보 문서의 파일 경로.

  sourcePath·occurrenceIndex·targetPath는 preview 결과에 나온 값을 그대로 쓴다. 후보의 targetPath는 preview 결과의 후보 경로다.

  apply는 추가로 revisions를 반드시 받는다. 값은 preview 결과의 revisions를 고치지 않고 그대로 되돌려 준 것이다.
  revisions가 없는 apply 요청은 invalid_input이다.
  알 수 없는 속성이 있거나 id·newName·section이 문자열이 아니면 invalid_input이며 파일을 바꾸지 않는다.
  updateReferences처럼 참조 수정을 끄는 속성은 없으며 이 도구는 항상 참조를 함께 고친다.
대상 문서: |
  id에 해당하는 문서가 없으면 not_found로 실패한다.
  프로젝트 탐색이 끝나지 않았으면 고칠 곳을 확정할 수 없으므로 preview는 blocked를 돌려주고 apply는 저장하지 않는다.
  코드 파일을 수집하는 중이어도 같다.
  코드 수집이 끝났지만 일부 코드 파일을 읽지 못했으면 읽은 파일만 고치고, 읽지 못한 경로를 impacts에 unconfirmed 영향으로 담으며 status는 unresolved다.
preview: |
  파일과 색인을 바꾸지 않고 [[이름 변경]]의 미리보기를 돌려준다.
  응답은 success:true와 scanStatus에 이어 다음 값을 가진다.
  - status: ready·unresolved·blocked.
  - targetPath·oldName·newName: 대상 문서의 경로와 바꾸기 전후의 이름. 섹션 이름 변경이면 oldName·newName은 섹션 이름이다.
  - targetSection: 섹션 이름 변경일 때만 있으며 바꿀 섹션의 현재 이름이다.
  - blockingReason: blocked인 이유. blocked가 아니면 없다.
  - changes: 고칠 위치별 path·fieldPath·range·oldText·newText. 코드 파일의 표기 변경도 포함하며 문서 변경과 구분할 수 있다. 대상 문서의 이름을 가리키는 다른 문서의 `_codocs.parent` 항목도 포함하며, 이 항목의 fieldPath는 `["_codocs", "parent", 0]`처럼 배열 순번까지 담는다. 섹션 이름 변경이면 섹션 키의 변경도 포함한다.
  - impacts: 자동으로 고치지 않은 참조. path·occurrenceIndex·text·range·reason과 바꾸기 전후의 후보(before·after)를 가진다.
  - conflicts: 새 이름과 같은 이름의 다른 문서, 또는 이름 변경으로 parent 오류가 새로 생기는 문서. 이름은 프로젝트 전체에서 유일해야 하므로 어느 폴더에 있든 충돌이다. 섹션 이름 변경에서 section_conflict이면 같은 이름의 섹션이 이미 있는 대상 문서를 담는다.
  - invalidSelections: 잘못된 선택.
  - revisions: 영향받는 파일의 경로별 [[revision]]. 고칠 코드 파일도 포함한다.

  impacts 중 다음은 사용자가 대상을 골라야 하는 참조다.
  - before.status가 ambiguous인 참조: 이름 변경 뒤에도 모호하면 reason이 selection_required이고, 이름 변경 뒤 후보 하나로 바뀌면 changed_resolution이다. 후보는 before.candidates의 경로·이름이다.
  before가 모호하지 않은 changed_resolution과 그 밖의 reason은 고르지 않은 채로 남기거나 이름 변경으로 대상이 바뀐다는 알림이다.
  blockingReason은 target_unavailable·invalid_name·name_conflict·section_conflict·section_not_found·unconfirmed·invalid_selection·source_not_lossless·unrepresentable 중 하나다.
  섹션 이름 변경에서는 새 섹션 이름의 섹션이 이미 있으면 section_conflict, 바꿀 섹션이 대상 문서에 없으면 section_not_found이며, 새 이름이 비었거나 `_`로 시작하거나 대괄호를 포함하거나 현재 섹션 이름과 같으면 invalid_name, 키의 현재 형식이나 참조로 안전하게 적을 수 없으면 unrepresentable이다.
  선택이 필요한 참조가 있으면 사용자에게 후보를 보여주고 고른 결과를 selections에 담아 preview를 다시 요청한다.
apply: |
  preview와 같은 id·newName·selections에 revisions를 더해 보낸다. 서버는 다시 계산한 뒤 저장한다.
  blocked이면 rename_blocked로 실패하고 응답의 preview에 blockingReason과 후보를 담고 섹션 이름 변경이면 targetSection도 담으며 파일은 바뀌지 않는다.
  revisions의 파일이 바뀌었으면 revision_conflict로 실패한다.
  영향받는 파일의 집합이 preview 때와 달라졌으면 rename_affected_files_changed로 실패하며, 이때는 preview를 다시 요청한다.
  쓰기 전에 파일을 쓸 수 없는 것으로 확인되면 그 이유를 진단으로 알리고 files는 빈 목록이며 파일은 바뀌지 않는다.
  저장 도중 실패하면 되돌린 결과를 files의 state로 알리고, 되돌리지 못한 파일은 rename_restore_failed로 알린다.
  이 실패에서도 이미 저장된 파일이 있으면 saved·changed가 true이므로 이를 확인하고 같은 요청을 그대로 반복하지 않는다.

  apply의 성공 응답은 다음 값을 가진다.
  - success:true와 status: ready 또는 unresolved. unresolved는 고르지 않은 참조를 원문 그대로 남겼다는 뜻이다.
  - saved·changed: 파일 저장 여부와 내용 변경 여부.
  - files: 파일별 path·state·revision. state는 changed·restored·restore_failed·unchanged 중 하나다.
  - impacts: 고치지 않고 남긴 참조.
  - diagnostics: 경고를 포함한 진단.
  - indexUpdated: 바뀐 파일이 있을 때만 있으며 색인 반영 결과를 나타낸다.

  저장은 됐지만 색인 반영이 실패하면 [[codocs_write]]와 같이 indexUpdated:false와 index_update_failed 진단으로 알리며 [[codocs_refresh]]를 안내한다. 같은 요청을 다시 보내지 않는다.
  바뀐 파일이 없으면 saved:false·changed:false이며 indexUpdated는 없다.
오류 코드: |
  - invalid_input: 입력 형태가 잘못되었거나 apply에 revisions가 없다.
  - not_found: id의 문서가 없다. 바꿀 섹션이 없는 것은 오류가 아니라 blocked(section_not_found)다.
  - rename_blocked: blocked 상태의 apply 요청.
  - revision_conflict: preview 이후 파일이 바뀌었다.
  - rename_affected_files_changed: 영향받는 파일의 집합이 달라졌다.
  - rename_restore_failed: 중간 실패 뒤 파일을 되돌리지 못했다.
  - file_write_failed·file_access_failed·source_not_lossless: 쓰기 전 확인에 실패했다.
  - index_update_failed: 저장 뒤 색인 반영에 실패했다.
