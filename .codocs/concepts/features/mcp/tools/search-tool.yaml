_codocs:
  id: search-tool
  name: codocs_search
  parent:
    - MCP 도구
개요: |
  검색어 여러 개로 프로젝트 문서에서 관련 있는 섹션을 찾아 주소를 돌려주는 [[MCP 도구]]다.
  AI는 작업을 시작하거나 다루는 범위가 바뀔 때 대화에서 뽑은 주제·용어·식별자로 이 도구를 호출해 읽을 문서를 고른다.
  본문은 돌려주지 않으며, 결과의 주소를 [[codocs_get]]에 그대로 넣어 읽는다. 문서 이름을 모를 때 이름을 따라 내려가는 [[codocs_list]]의 대안이다.
입력: |
  queries 배열은 필수이며 1~10개의 문자열이어야 한다. 각 검색어는 1~200자다.
  원문을 통째로 넣지 않고 주제·용어·식별자를 뽑은 짧은 검색어 여러 개를 준다.
  빈 배열, 개수나 길이의 위반, 알 수 없는 입력 속성은 요청 전체를 invalid_input으로 거부한다.
검색 대상: |
  문서의 섹션이 검색 단위다. 섹션의 이름과 내용, 그 섹션이 속한 문서의 이름을 비교하며 어휘가 일치하는 정도로 점수를 낸다. 의미가 비슷하지만 단어가 다른 문서는 찾지 못한다.
  한국어 어절은 부분 문자열로도 비교하고 영문·숫자는 대소문자를 구분하지 않으며, snake_case·kebab-case·camelCase 식별자는 전체와 분리한 조각 모두로 찾는다.
  [[문서 참조]]는 연결된 문서를 펼치지 않으며 참조 표기도 내용의 글자로만 비교한다.
  YAML을 해석할 수 있는 문서는 규칙 위반이나 이름 충돌이 있어도 검색 대상이다. 그 오류와 충돌은 이 도구가 아니라 [[codocs_get]]이 알린다. 해석할 수 없는 문서는 섹션을 알 수 없어 제외한다.
점수와 순서: |
  점수는 검색어마다 따로 계산해 그 검색어에서 가장 높은 섹션을 1.0으로 맞춘다. 섹션의 점수는 검색어별 점수 가운데 가장 높은 값이며 0보다 크게 걸린 검색어만 그 섹션의 queries에 담긴다.
  점수가 같으면 걸린 검색어가 많은 섹션이 앞이고, 그다음은 주소 순서라 같은 문서 상태에서 같은 검색어는 항상 같은 결과를 낸다.
  점수 순으로 상위 섹션 10개를 고른다. 점수는 검색어 안에서만 비교하는 상대 값이므로 검색어가 달라지면 같은 점수가 같은 관련도를 뜻하지 않는다.
결과: |
  items에 상위 섹션을 점수 순서로 담고, 항목마다 다음 값을 갖는다.
  - address: [[codocs_get]]에 그대로 넣을 수 있는 주소. 섹션 하나는 `이름:섹션`, 묶인 문서는 `이름`이다. 이름이나 섹션 이름의 콜론은 [[참조]]의 표기 규칙대로 `\:`로 적는다.
  - score: 0보다 크고 1 이하인 점수.
  - queries: 이 항목에 걸린 검색어 원문. 입력한 순서다.
  - sections: 문서 단위로 묶인 항목에서만 걸린 섹션 이름 목록.

  상위 10개 안에서 같은 문서의 섹션이 둘 이상이면 문서 크기와 관계없이 문서 주소 하나로 묶고, 묶인 항목의 점수는 그 섹션들의 최댓값이다. 묶여서 줄어든 자리를 다른 섹션으로 채우지 않아 items는 10개보다 적을 수 있다.
  본문, 일치한 단어, 문서 사이의 연결, 오류 표시는 담지 않는다. 연결과 오류는 주소를 [[codocs_get]]으로 읽어 확인한다.
결과 없음: |
  0보다 큰 점수로 걸린 섹션이 하나도 없는 검색어는 emptyQueries에 입력 원문으로 담는다. 모든 검색어가 걸리지 않으면 items는 빈 배열이며 요청은 성공이다.
  결과가 없다는 것은 그 어휘를 쓴 문서가 없다는 뜻일 뿐 관련 문서가 없다는 단정이 아니므로, 다른 용어나 더 짧은 검색어로 다시 찾거나 [[codocs_list]]로 구조를 따라간다.
준비 상태와 부분 결과: |
  scanStatus와 준비 상태는 [[codocs_list]]·[[codocs_get]]과 같은 규칙으로 [[도구 결과]]와 [[탐색 상태]]를 따른다. 색인이 준비되기 전에는 준비 중으로 안내하고 탐색이 실패하면 원인과 함께 실패로 돌려준다.
  scanStatus가 partial이면 확인한 문서에서만 찾은 결과이므로 결과가 없거나 적어도 문서가 없다고 단정하지 않고, 미확인 진단을 함께 읽는다.
