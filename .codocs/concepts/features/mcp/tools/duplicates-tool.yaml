id: duplicates-tool
name: 'codocs_duplicates'
domains:
  - '제품 개념'
deprecatedAliases:
  - id: duplicate-detection
definition: |
  문서 본문에서 같은 설명이 반복되는 곳을 찾는 [[MCP 도구]]다.
  반복 후보와 원문 위치를 돌려주는 검토 정보이며, 설명을 합치거나 나눌지는 사용자가 판단한다.

  ## 전체 검토와 초안 검토

  입력을 생략하면 프로젝트 전체 문서의 반복을 확인한다.
  draft에 [[codocs_write]]와 같은 create 또는 update 입력을 넣으면 저장 전 본문을 기존 문서와 비교한다. update 초안은 대상 문서의 기존 원문을 비교에서 뺀다.

  ## 비교 기준

  문서 본문(definition)의 문단이나 연속 문장을 비교하며, 문서 사이의 반복뿐 아니라 한 문서 안의 반복도 찾는다.
  공백·줄바꿈·Unicode 표현 차이는 무시하고 비교하지만 숫자나 부정 표현을 지워 다른 조건을 같은 구절로 만들지 않는다.
  도메인이 다르거나 참조 표기가 있다는 이유로 비교에서 빼지 않는다. YAML 해석에 실패한 문서는 비교하지 못한 문서와 이유로 알린다.

  완전히 같은 구절과 표현이 일부 바뀐 비슷한 구절을 구분한다. 유사도 점수는 글자가 얼마나 비슷한지이며 의미가 같을 확률이 아니다.
  A와 B, B와 C가 각각 비슷하다고 A와 C를 같은 설명으로 묶지 않는다.
  짧은 구절처럼 비교에서 제외한 범위와 적용한 비교 설정을 결과에 함께 알린다.

  ## 결과

  반복 후보와 원문 위치를 돌려주며 문서를 자동으로 합치거나 지우지 않는다. 초안 검토도 파일을 만들거나 바꾸지 않는다.
  후보가 있다고 저장이나 [[codocs_validate]]를 막지 않으며, 후보가 없다고 검증을 생략하지 않는다.
  결과가 많으면 커서로 다음 페이지를 요청하며, 검사가 일부만 끝났거나 실패하면 전체 중복 없음으로 안내하지 않는다.
  후보가 없다는 것은 적용한 범위와 기준에서 반복을 찾지 못했다는 뜻이며 표현이 다른 같은 의미까지 없다는 보장은 아니다.
