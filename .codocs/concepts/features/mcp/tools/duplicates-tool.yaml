_codocs:
  id: duplicates-tool
  name: codocs_duplicates
  parent:
    - MCP 도구
개요: |
  문서 본문에서 같은 설명이 반복되는 곳을 찾는 [[MCP 도구]]다.
  반복 후보와 원문 위치를 돌려주는 검토 정보이며, 설명을 합치거나 나눌지는 사용자가 판단한다.
전체 검토와 초안 검토: |
  입력을 생략하면 프로젝트 전체 문서의 반복을 확인한다.
  draft에 [[codocs_write]]와 같은 create 또는 update 입력을 넣으면 저장 전 본문을 기존 문서와 비교한다. update 초안은 대상 문서의 기존 원문을 비교에서 뺀다.
비교 기준: |
  `_codocs`를 뺀 모든 섹션의 문단이나 연속 문장을 비교하며, 문서 사이의 반복뿐 아니라 한 문서 안의 반복도 찾는다.
  섹션 이름은 비교하지 않으며 결과의 fieldPath는 반복이 있는 섹션 이름 하나를 담는다. 예를 들어 `["환불정책"]`이다.
  공백·줄바꿈·Unicode 표현 차이는 무시하고 비교하지만 숫자나 부정 표현을 지워 다른 조건을 같은 구절로 만들지 않는다.
  부모가 다르거나 참조 표기가 있다는 이유로 비교에서 빼지 않는다. YAML 해석에 실패한 문서는 비교하지 못한 문서와 이유로 알린다.

  완전히 같은 구절과 표현이 일부 바뀐 비슷한 구절을 구분한다. 유사도 점수는 글자가 얼마나 비슷한지이며 의미가 같을 확률이 아니다.
  A와 B, B와 C가 각각 비슷하다고 A와 C를 같은 설명으로 묶지 않는다.
  짧은 구절처럼 비교에서 제외한 범위와 적용한 비교 설정을 결과에 함께 알린다.

  초안 검토는 저장할 입력을 그대로 받아 [[codocs_write]]와 같은 요청 검사를 거친 결과를 비교한다. 본문을 고친 뒤에는 이전 초안의 결과를 다시 쓰지 않는다.
  결과가 초안 본문 전체의 반복인지, 이번 변경으로 새로 생긴 반복만인지 구분해 알린다.
  [[codocs_write]]는 이 검토를 실행하지 않으며 결과를 응답에 넣지도 않는다. 저장 전에 같은 입력으로 이 도구를 먼저 부르는 순서는 사용자 가이드에서 안내한다.
결과: |
  반복 후보마다 양쪽 원문의 위치와 반복 구절, 비교 근거를 돌려주며, 저장되지 않은 초안의 위치는 파일 위치와 구분하고 검사 당시의 revision에 해당하는 결과임을 알린다.
  문서를 자동으로 합치거나 지우거나 참조를 넣지 않으며 초안 검토도 파일을 만들거나 바꾸지 않는다. 정상적인 참조 안내나 적용 예시도 비슷한 표현을 가질 수 있으므로 점수만으로 지울 대상을 정하지 않는다.
  후보가 있다고 저장이나 [[codocs_validate]]를 막지 않으며, 후보가 없다고 검증을 생략하지 않는다.
  결과가 많으면 커서로 다음 페이지를 요청하며, 검사가 일부만 끝났거나 실패하면 전체 중복 없음으로 안내하지 않는다.
  후보가 없다는 것은 적용한 범위와 기준에서 반복을 찾지 못했다는 뜻이며 표현이 다른 같은 의미까지 없다는 보장은 아니다.
  검사가 정해진 시간을 넘기면 그때까지 검사한 결과와 중단 이유를 부분 완료로 알린다. 탐색이 끝나지 않았으면 준비 중으로 알리고 빈 결과로 대신하지 않는다.
  다음 페이지는 서버가 보관한 가장 최근 검사 결과에서 이어진다. 비교한 문서의 revision이나 비교 설정이 바뀌었거나 다른 검사 결과로 바뀌었으면 다음 페이지 대신 만료를 알린다.
