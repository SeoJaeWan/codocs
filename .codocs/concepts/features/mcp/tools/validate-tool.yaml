_codocs:
  id: validate-tool
  name: codocs_validate
  parent:
    - MCP 도구
개요: |
  프로젝트 전체나 YAML 파일 하나의 문서 문제와 코드 파일의 `@codocs` 참조 문제를 확인하는 [[MCP 도구]]다.
  문서 하나의 형식 검사인 [[문서 검증]]과 프로젝트의 ID·이름 충돌, 참조 검사를 함께 적용한다.
입력: |
  path를 생략하면 .codocs 전체를 검사한다.
  path에는 프로젝트 루트 기준 .codocs 아래의 상대 경로로 YAML 파일 하나를 지정한다. [[codocs_get]]의 source.path를 그대로 쓸 수 있다.
  .codocs 밖, 코드 파일을 포함한 YAML이 아닌 경로, 절대 경로, 폴더, 와일드카드, 여러 경로는 허용하지 않으며 invalid_path로 거부하고, 절대 경로를 보내면 상대 경로로 고치라고 안내한다. 링크·정션 경로는 따라가지 않고 거부한다.
결과: |
  파일 하나를 지정해도 전체 색인으로 ID 중복과 참조 대상을 확인하되, 그 파일의 진단과 관련 충돌 파일 경로만 돌려준다.
  ID가 없거나 YAML을 해석하지 못한 파일도 경로로 검사할 수 있다.
  예를 들어 A와 B의 ID가 같고 C에 YAML 오류가 있을 때, A를 지정하면 A의 중복 ID 진단과 B의 경로만 주고 C의 오류는 빼며, path를 생략하면 세 문제를 모두 준다.
  diagnostics에는 문서 진단과 함께 코드 파일의 `@codocs` [[코드 참조]] 진단을 담는다. 코드 진단의 path는 코드 파일이고 range는 표기의 위치다.
  코드 진단은 invalid·missing·missing_section·ambiguous를 error로, 대상 탐색이 끝나지 않은 unconfirmed를 warning으로 구분하며 편집기와 같은 코드(`codocs.codeReference.<상태>`)와 문구를 쓴다.
  path를 지정하면 후보 문서 중에 그 YAML이 있는 코드 진단만 더한다. 그 YAML을 가리키거나 가리킬 수 있는 코드 참조의 문제이며 코드 파일 경로를 직접 지정할 수는 없다.
  scanStatus는 문서 탐색 상태 그대로이고 코드 수집 상태는 codeScanStatus(collecting·complete·incomplete)로 따로 알린다. 코드 수집이 진행 중이거나 불완전하면 diagnosticsComplete가 false이며 확인한 결과만이라는 뜻이다. 읽지 못한 코드 파일은 codeFailures에 경로와 이유로 담는다. 확인한 결과가 없다고 오류가 없다고 단정하지 않는다.
  검증은 저장된 파일 내용만 기준으로 하며 편집기의 저장하지 않은 내용은 보지 않는다. 코드 확인 중에 문서 색인이 바뀌면 이전 진단을 주지 않고 index_not_ready로 알린다.
  검증은 [[탐색 상태]]가 complete이고 문서 감시가 정상일 때만 한다. 지정한 파일이 아직 색인에 반영되지 않았으면 준비 중으로 답하며, 확인하는 사이 색인이 바뀌면 이전 진단을 결과로 주지 않는다.
  문서 오류를 보고한 경우도 요청 처리는 성공이다. 경로 오류는 invalid_path, 파일 부재는 not_found, 접근 실패는 file_access_failed로 구분한다.
  오류가 있는 문서를 고치는 순서는 [[진단]]에서 설명한다.
