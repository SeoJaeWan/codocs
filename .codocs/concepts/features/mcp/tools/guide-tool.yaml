id: guide-tool
name: 'codocs_guide'
domains:
  - '제품 개념'
definition: |
  문서 형식과 작성·수정 방법 안내를 읽는 [[MCP 도구]]다.
  사용자 가이드와 같은 원문을 Markdown으로 돌려주며, 서버와 함께 배포된 원문을 읽으므로 색인이 준비 중이거나 실패한 상태에서도 기다리지 않고 안내한다.

  ## 주제

  topic은 overview·schema·writing·examples·updating·validation 중 하나다. 생략하면 overview와 전체 주제 목록을 돌려준다.
  결과의 topic은 선택한 주제, topics는 전체 주제 목록, content는 Markdown 원문이다.
  알 수 없는 주제나 요청 속성은 invalid_input이고, 원문을 읽지 못하면 file_access_failed로 알린다. 읽기 실패를 빈 결과나 준비 중으로 바꾸지 않는다.

  - overview: 전체 사용 순서
  - schema: [[문서 형식]]과 [[문서 속성]]
  - writing: 작성 원칙
  - examples: 문서 연결 예시
  - updating: 문서 수정과 revision 충돌·저장 뒤 확인
  - validation: 검증과 오류 수정

  ## 원문

  안내 원문은 사용자 가이드(docs/guide)이며 서버와 함께 배포된 원문을 읽는다. 프로젝트나 작업 폴더의 파일로 대신하지 않고 색인 준비나 refresh를 시작하지 않는다.
