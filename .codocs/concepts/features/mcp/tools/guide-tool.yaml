id: guide-tool
name: 'codocs_guide'
domains:
  - '제품 개념'
definition: |
  문서 형식과 작성·수정 방법 안내를 읽는 [[MCP 도구]]다.
  사용자 가이드와 같은 원문을 Markdown으로 돌려준다.

  ## 주제

  topic은 overview·schema·writing·examples·updating·validation 중 하나다. 생략하면 overview와 전체 주제 목록을 돌려준다.
  알 수 없는 주제는 invalid_input이다.

  ## 색인과의 관계

  안내는 서버와 함께 배포된 원문을 읽으며 프로젝트 색인에 의존하지 않는다.
  색인이 준비 중이거나 실패한 상태에서도 기다리지 않고 작성법과 복구 안내를 제공한다.
