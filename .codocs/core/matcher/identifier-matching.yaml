id: match-identifier
name: '코드 식별자 매칭'
domains:
  - 'Core'
deprecatedAliases:
  - id: identifier-matching
definition: |
  텍스트에서 추출한 매칭 문자열 하나를 [[문서]]의 현재 ID와 [[이전 ID]]를 비교해 연결할 문서 후보를 찾는다. 이 문서의 식별자는 언어 문법으로 검증한 코드 식별자에 한정하지 않으며 주석·문자열에서 추출한 텍스트도 포함한다.
  일치한 후보와 식별자 내부의 상대 범위·일치 근거를 반환한다.
  예를 들어 returnZone은 문서 ID return-zone과 연결할 수 있지만 returnOldZone은 중간 단어를 건너뛰어 같은 ID로 연결하지 않는다.
  YAML 데이터의 형식이 올바른지 확인하는 [[문서 검증]]과 달리 코드 표기가 어떤 문서를 뜻하는지 판단한다.
  언어 공통 텍스트 추출·원본 위치 관리와 화면 표시의 책임은 [[문서 동기화]]와 [[IDE 지원]]에서 구분한다.

  ## 매칭 입력과 좌표

  현재 id와 deprecatedAliases[].id를 대상으로 하며 문서용 name과 사용자 속성 aliases는 코드 매칭 대상이 아니다.
  이전 ID 항목의 계약은 [[이전 ID]]에서 확인한다.
  매칭 요청은 원본 텍스트를 받으며 코드·text·identifier 입력 이름을 사용할 수 있다. 결과 범위는 입력 텍스트 기준 0 기반 UTF-16, 시작 포함·끝 제외다.
  코어는 입력 텍스트 안의 모든 연속 토큰 매칭을 반환하며, 각 범위를 코드 파일 위치로 옮기는 책임은 [[문서 동기화]]에서 정의한다.

  ## 토큰 분리와 연속 매칭

  원본 위치를 보존하며 camelCase·PascalCase·snake_case·kebab-case를 분리하고 비교할 때 대소문자를 정리한다.
  연속 대문자 뒤 소문자가 나오면 마지막 대문자 앞을 경계로 삼는다. HTTPServer → HTTP/Server, HTTPSServer → HTTPS/Server, getURLValue → get/URL/Value다. 약어의 뜻을 추론하지 않는다.
  문자·숫자 경계도 나누되 숫자를 유지한다. zone2Count → zone/2/Count다. zone-2-count는 전체 매칭되지만 zone-count는 중간 숫자를 건너뛸 수 없다. zone과 count는 각각의 위치에서 매칭할 수 있다.
  밑줄·하이픈·일반 공백·탭은 복합 용어의 단어 구분자로 허용한다. return__zone·return--zone처럼 반복되어도 매칭하며 원본 범위에 구분자를 포함한다. 등록 ID 자체의 형식 검증을 완화하는 규칙은 아니다.
  비영어 문자와 점·슬래시 같은 구두점, LF/CRLF 줄바꿈은 복합 매칭을 끊는다. return한글Zone이나 return.zone을 return-zone으로 연결하지 않지만 양옆의 return과 zone은 각각 매칭할 수 있다.
  연속 토큰 묶음에서만 찾는다. returnOldZone의 Old나 return2Zone의 2를 건너뛰지 않는다. 접두·접미 토큰은 허용하므로 reservationReturnZoneId 안에서 등록된 reservation과 return-zone을 각각 찾을 수 있다.

  ## 표기와 단수화 비교

  현재·이전 ID와 코드에 동일한 비교 규칙을 적용한다. 대소문자·구분자를 정리한 표기 일치를 계산하고, 양쪽 묶음의 마지막 단어만 pluralize로 단수화한 일치를 추가한다.
  return-zone ↔ returnZones, return-zones ↔ returnZone은 매칭하지만 return-zone ↔ returnsZone은 매칭하지 않는다.
  가능한 모든 영어 형태를 생성하거나 의미를 판단하는 도구로 간주하지 않으며 중간 단어 굴절 등 모든 영어 예외를 보장하지 않는다.

  표기 일치는 exact, 마지막 단어의 단수화 비교는 singular로 구분한다.
  현재 ID에서 얻은 근거는 current, 이전 ID에서 얻은 근거는 previous로 구분한다.

  ## 후보 순위와 근거 보존

  커서 위치에 함께 걸리는 후보의 우선순위는 다음 순서다.

  1. 현재 ID 일치가 이전 ID 일치보다 우선한다.
  2. 같은 현재/이전 구분 안에서는 연속 매칭 토큰 수가 많은 용어가 우선한다.
  3. 앞선 조건이 같으면 표기 일치가 단수화 일치보다 우선한다.

  따라서 짧은 현재 ID zone은 긴 이전 ID return-zone보다 우선한다. 이 기준까지 동률이면 후보를 임의로 하나 선택하지 않는다.
  서로 다른 문서의 현재/이전 ID 충돌, 이전/이전 ID 충돌은 모든 후보와 개별 근거를 유지한다. 코드 경로·도메인·폴더로 후보를 숨기거나 우선하지 않는다. 동일한 현재 ID의 여러 문서는 고유성 오류로 취급하며 정상 대표를 선택하지 않는다.
  같은 문서·같은 범위의 현재/이전 매칭은 묶되 모든 근거를 보존한다. 현재 ID로 매칭되면 이전 ID라고 경고하지 않는다. zoneToZone처럼 반복 등장한 위치는 모두 보존한다.
  단어 색인으로 후보를 찾는다. 공개 결과에는 범위·경로와 비교 근거를 보존하고, UI의 중복 제거 때문에 원래 발생 위치를 잃지 않는다.

  ## 오류 문서와 부분 읽기

  문서 전체에 오류가 있어도 확인 가능한 유효한 현재·이전 ID는 매칭한다. 형식이 잘못된 이전 ID는 해당 항목만 제외하고 다른 유효한 값은 유지한다.
  message가 잘못돼도 유효한 이전 ID는 매칭한다. 현재 ID가 누락되거나 잘못돼도 유효한 이전 ID로 찾을 수 있으며, 확인 불가능한 현재 ID는 추측하지 않는다.
  진단은 매칭 결과와 함께 보존한다. 직접 편집한 현재/이전 ID 중복 등 오류·경고 판정은 [[문서 검증]]에서 확인한다.
  문서를 일부 읽지 못하면 읽은 결과를 제공하되 불완전 상태를 유지한다. 후보가 하나라는 이유만으로 전체 프로젝트에서 유일하다고 확정하지 않는다.

  ## 코드와 검증 위치

  대표 식별자 matchIdentifier와 매칭 결과는 [코드 식별자 매칭 구현](../../../packages/core/src/matcher/index.ts)에서 확인한다. 같은 모듈의 matchCode·tokenizeCode도 관련 진입점이다.
  표기·연속 토큰·후보 순위·이전 ID와 오류 문서 사례는 [인접 테스트](../../../packages/core/src/matcher/matcher.test.ts)에서 확인한다.
