id: yaml-mapping-style
name: 'YAML 매핑 표기'
domains:
  - 'Core'
definition: |
  YAML 매핑은 속성 이름과 값을 짝지은 구조이며 block과 flow 표기로 작성할 수 있다.
  두 표기가 같은 데이터로 해석되어도 원문에서 항목을 구분하는 방식이 달라, Codocs가 원문 위치를 찾거나 일부를 수정할 때 구분해야 한다.

  ## block과 flow

  block 매핑은 들여쓰기와 줄바꿈으로 항목을 구분한다.

  ```yaml
  id: payment
  name: 결제
  ```

  flow 매핑은 중괄호와 쉼표로 항목을 구분한다.

  ```yaml
  { id: payment, name: 결제 }
  ```

  두 예시는 같은 속성과 값을 나타내지만 원문 길이와 속성 사이의 구분자는 다르다.

  ## 원문을 다룰 때의 의미

  해석한 데이터만으로는 사용자가 어떤 표기로 작성했는지 알 수 없다.
  따라서 원문 범위를 구하거나 부분 수정할 때 해당 표기의 항목 경계와 주변 구분자를 고려해야 한다.
  키·값·속성 전체의 범위를 어디까지 포함하는지는 [[YAML 파싱]], 부분 수정에서 주변 구분자를 어떻게 처리하는지는 [[문서 변경 계획]]에서 설명한다.
