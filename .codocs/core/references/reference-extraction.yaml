id: extract-references
name: '참조 추출'
domains:
  - 'Core'
deprecatedAliases:
  - id: reference-extraction
definition: |
  해석된 문자열에서 [[참조]]의 등장 위치와 문법 오류를 찾아내는 순수 계산이다.
  이름·도메인 표기의 의미와 문법은 [[참조]]에서 정의하며, 추출은 각 표기가 어디에 등장했고 문법이 유효한지 확인한다.
  대상 문서의 존재나 연결 가능 여부는 [[참조 후보를 문서 연결로 확정하는 절차]]에서 판단한다.

  ## 추출과 오류 복구

  [[참조]]의 문법과 대상 필드 규칙을 [[YAML 파싱]]으로 해석한 문자열에 적용한다.
  전체 문서 검증의 성공이나 내용 종류 판별을 추출의 선행 조건으로 요구하지 않는다.
  다른 필드가 틀려도 확인된 문자열은 유지하고 examples의 자료형이 잘못된 원소만 제외한다.
  문자열로 강제 변환하지 않으며 YAML 파싱 실패에서는 원문 검색으로 참조를 추측하지 않는다.

  잘못된 참조 뒤의 독립된 정상 참조도 계속 찾는다.
  반복 등장은 각각의 위치로 보존하고 문법 진단과 등장 기록을 반환한다.

  ## 등장 기록과 연결의 구분

  문법이 유효한 등장은 이름과 선택 도메인을 제공한다. 문법이 잘못된 등장도 위치와 진단을 남긴다.
  문법이 유효하다는 사실만으로 대상 문서가 존재하거나 하나로 확정된 것은 아니다.
  같은 참조가 여러 번 등장하면 각 위치를 유지한다. 연결 목록의 중복 제거는 [[문서 색인]]에서 다룬다.

  ## 원문 위치

  해석 문자열의 offset을 YAML 원문에 단순히 더하지 않는다.
  [[문자열 위치 대응]]으로 따옴표·escape·접힌 문자열의 실제 등장 위치를 찾는다.

  일반 텍스트의 [[명시적 코드 참조]]는 같은 이름·도메인 문법만 재사용한다. YAML 대상 필드와 자기 문서 제한은 그 표기에 적용하지 않는다.

  ## 코드와 검증 위치

  대표 함수 extractReferences와 등장·진단 결과는 [참조 추출 구현](../../../packages/core/src/references/index.ts)에서 확인한다.
  문법·오류 복구·반복 등장·YAML 표기별 위치 사례는 [인접 테스트](../../../packages/core/src/references/references.test.ts)에서 확인한다.
