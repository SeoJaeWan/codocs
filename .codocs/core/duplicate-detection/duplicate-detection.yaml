id: duplicate-detection
name: '본문 중복 탐지'
domains:
  - 'Core'
status: proposed
definition: |
  문서 본문의 반복된 구절을 찾아 같은 설명을 여러 원문에서 관리하는지 검토할 근거를 제공하는 계산이다.
  문장이 같거나 비슷하다는 사실과 설명을 한 곳으로 합쳐야 한다는 판단을 구분한다.
  담당 원문과 적용 관계를 정리하는 기준은 [[기본 작성 지침]]과 [[설명 분리]]에서 정의한다.

  ## 비교 대상과 입력

  [[문서]]의 definition과 examples에 있는 문단 또는 연속 문장을 비교한다.
  전달받은 원문과 [[YAML 파싱]]의 해석 결과·위치 정보를 사용하며 파일을 직접 읽거나 입력을 변경하지 않는다.
  파싱에 실패한 원문에서 본문을 추측하지 않고 비교하지 못한 입력과 이유를 남긴다.

  문서 집합 전체의 비교와 특정 대상 본문을 집합과 비교하는 계산에 같은 기준을 적용한다.
  문서 간 반복뿐 아니라 한 문서의 서로 다른 위치에 나타난 반복도 찾는다.
  같은 원문 위치를 가리키는 겹친 비교 구간끼리는 별도의 반복으로 세지 않는다.
  도메인이 다르거나 참조 표기가 있다는 이유만으로 비교에서 제외하지 않는다.
  문서 ID가 충돌해도 확인한 본문을 비교할 수 있도록 경로·필드·발생 위치를 구분한다.

  ## 비교와 정규화

  비교용으로 공백·줄바꿈·Unicode 표현을 정규화하되 작성한 원문과 위치 대응은 보존한다.
  숫자·부정 표현을 지워 서로 다른 조건을 같은 구절로 만들지 않는다.
  Markdown 링크의 표시 문구와 목적지를 구분하고, 목적지를 점수 계산에서 제외하더라도 다른 대상을 가리킨다는 정보는 보존한다.

  정규화된 구절의 완전 일치와 일부 표현이 바뀐 유사 반복을 구분한다.
  비교 단위·최소 길이·제목이나 코드 등의 제외 정책과 유사도 기준을 결과에 연결한다.
  짧거나 제외된 구절까지 검사했다고 표현하지 않는다.

  기본 기준값은 과거 정리 커밋에서 실제로 정리한 반복 규칙을 찾은 실험 기준선에서 시작하며, 적용한 비교 설정의 버전을 결과에 포함한다.
  기준값은 실제 문서의 검사 결과를 유용한 후보·정상 반복·잡음으로 판정한 자료와 함께 조정한다.
  이런 판정이나 과거 사례의 탐지는 정확도·재현율의 근거가 아니며, 그런 수치는 정답을 분류한 별도 평가 자료에서만 계산한다.

  ## 후보와 원문 위치

  후보에는 양쪽 경로·문서 식별 정보·필드·실제 구절·원문 범위와 비교 근거를 제공한다.
  [[문자열 위치 대응]]을 사용해 비교용 구절을 실제 YAML 위치에 연결하며, 전달받은 원문 버전 식별 정보도 함께 보존한다.
  위치를 확인할 수 없으면 추측한 행이나 범위를 만들지 않는다.

  유사도 점수는 적용한 비교 기준에서의 문자 유사도이며 의미가 같을 확률이 아니다.
  완전 일치도 링크 목적지나 주변 조건까지 같다는 뜻은 아니다. 숫자·부정 표현·목적지의 차이를 검토 근거에서 가리지 않는다.
  참조 표기의 존재와 실제 연결된 대상은 구분하며, 연결 맥락이 필요하면 [[문서 색인]]의 해석 결과를 사용한다.

  같은 구절을 중첩된 창마다 반복 보고하지 않는다.
  완전 일치는 구절과 발생 위치 목록으로 묶을 수 있지만, 유사 후보는 비교 쌍별 근거를 유지한다.
  A와 B, B와 C가 각각 비슷하다는 이유만으로 A와 C도 같은 설명이라 묶지 않는다.

  ## 판단의 경계

  ID·이름 충돌이나 형식 오류의 판정과 본문 중복 후보를 구분한다. 형식 검사는 [[문서 검증]], 충돌과 연결은 [[문서 색인]]에서 다룬다.
  각 사용 문맥에 필요한 참조 안내나 적용 예시는 반복된 표현이 있어도 유지할 수 있다.
  후보가 없다는 결과는 적용한 범위와 기준에서 반복을 찾지 못했다는 뜻이며 모든 의미 중복이 없다는 보장이 아니다.

  표현이 다른 동일 개념의 완전한 판정, 불필요한 참조 안내나 문서 책임의 자동 판단, 정책 충돌 판정은 이 탐지의 보장 범위에 포함하지 않는다.
  탐지 결과는 검토 정보이며 문서 오류나 저장 허가를 결정하지 않고, 원문을 자동 병합·삭제하거나 참조를 삽입하지 않는다.
