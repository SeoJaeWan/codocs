id: previous-id
name: '이전 ID'
domains:
  - 'Core'
definition: |
  현재 ID로 바뀌기 전의 코드 표기에서도 같은 문서를 찾을 수 있게 유지하는 식별자다.
  문서의 현재 식별자나 문서용 이름을 대신하지 않는다.

  ## 사용 범위

  이전 ID는 코드와 문서를 연결하는 데 사용하며 모든 변경 사건을 보관하는 이력은 아니다.
  이 값의 존재가 코드 자동 치환을 요청한다는 뜻도 아니다.
  저장할 항목 형식은 [[문서]]의 deprecatedAliases 속성에서 확인한다.

  어떤 표기가 같은 ID로 매칭되는지와 충돌 후보의 순위는 [[코드 식별자 매칭]]에서 확인한다.
  ID 변경 때 목록을 추가·제거하는 조건과 직접 편집 시 관리 방식은 [[저장]]에서 확인한다.
  이전 ID를 목록·상세 요청의 대상 키로 해석하지 않도록 외부 조회 입력은 [[조회]]에서 구분한다.
