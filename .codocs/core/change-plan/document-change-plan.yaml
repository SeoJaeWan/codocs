id: document-change-plan
name: '문서 변경 계획'
domains:
  - 'Core'
definition: |
  한 [[문서]]의 생성·수정 요청과 확인한 색인·원문을 받아, 검증된 변경 후보를 계산하는 책임이다.
  YAML 후보는 변경 후 문서를 YAML 원문으로 표현한 미저장 결과다. 문서의 속성과 형식은 [[문서]], 원문 해석과 위치 대응은 [[YAML 파싱]]에서 확인한다.
  후보를 계산할 수 있다는 사실과 실제 파일에 안전하게 반영할 수 있다는 사실을 구분하기 위해 [[저장]]과 분리한다.

  ## 요청과 계산의 범위

  단일 요청은 문서 하나다. create 실패를 update로 바꾸거나 없는 update를 자동 생성하지 않는다.
  create는 mode·상대 path·전체 document를 받으며 revision은 요구하지 않는다.
  update는 현재 ID·revision과 최상위 set/unset을 받으며 위치를 유지한다.
  요청 대상은 현재 ID로 찾고 set.id로 새 ID를 지정할 수 있다. 새 ID에는 [[문서]]의 식별자 규칙을 적용한다.

  객체·배열은 전체 교체하고 점이 있는 속성명을 중첩 수정 명령으로 해석하지 않는다.
  필수 필드 삭제·set/unset 중복 지정·빈 변경 요청은 거부한다.
  이미 없는 선택 속성의 unset은 허용한다.
  사용자 속성도 set/unset과 보존·경고 규칙을 적용한다.

  생성 경로는 `/`로 구분하고 `.yaml` 또는 `.yml`로 끝나야 한다.
  절대 경로, 경로 구간의 `.`·`..`, 중복 `/`처럼 빈 구간을 만드는 표기와 역슬래시는 자동 보정하지 않고 거부한다.
  예를 들어 `.codocs/team/order.yaml`을 사용하고 `.codocs/./order.yaml`이나 `.codocs//order.yaml`은 거부한다.
  색인에 이미 있는 생성 경로는 거부한다. 이 표기·색인 검사는 실제 파일의 부재나 접근 허가를 보장하지 않는다.
  실제 접근 범위와 생성 직전의 파일 확인은 [[저장]]에서 수행한다.

  ## 계산에 필요한 관측

  [[문서 색인]]과 수정 대상의 경로·원문·revision·UTF-8 해석 손실 여부를 사용한다.
  수정 대상은 현재 ID로 유일하게 선택되고 확인된 관측이어야 하며, 전달한 경로·원문이 색인의 대상과 대응해야 한다.
  요청 revision은 전달받은 원문의 revision과 비교한다. 디스크를 직접 읽어 최신성을 확인하지 않는다.
  같은 관측의 자료를 준비하는 책임은 [[작업 공간 변경 계획]], 버전의 의미와 계산은 [[원문 버전]]에서 확인한다.

  [[탐색 상태]]가 complete가 아니면 프로젝트 전체의 충돌·참조 검증을 완료할 수 없으므로 생성·수정 후보와 검증된 무변경 결과를 확정하지 않는다.
  수정 대상 자체가 확인됐거나 설명만 바꾸는 요청이어도 동일하게 차단한다. 탐색 실패 원인을 해결하고 전체 탐색을 완료한 뒤 다시 요청한다.

  ## 후보의 검증

  요청·대상·revision을 확인하고 변경 후 전체 문서에 [[문서 검증]]을 적용한다.
  YAML 후보에 [[YAML 파싱]]을 적용해 기대 데이터와 같음을 확인하고 [[문서 색인]]으로 관련 충돌·참조를 검사한다.
  수정 후보는 기존 대상 문서를 대체한 상태로 검사하여 자기 자신을 중복 대상으로 세지 않는다.
  검증은 변경 후보의 오류와 이번 변경에 관련된 충돌·참조를 대상으로 한다. 수정과 무관한 다른 문서의 오류는 이번 결과에 포함하거나 실패 사유로 사용하지 않는다.

  생성·수정 모두 ID는 프로젝트 전체에서 유일해야 하며, 이름이 완전히 같고 공통 도메인이 하나 이상인 다른 문서가 있으면 차단한다.
  이름은 공백·영문 대소문자·단복수를 정규화하지 않고 해석된 문자열 그대로 비교한다.
  도메인이 겹치지 않는 동명 문서는 허용한다.
  오류가 남으면 같은 값을 보낸 무변경 요청도 실패한다. 경고만 있으면 후보나 검증된 무변경의 반환을 막지 않는다.

  ## ID 변경과 이전 ID 목록

  변경 전 식별자를 유지하는 목적과 사용 범위는 [[이전 ID]], 항목 형식은 [[문서]]에서 확인한다.
  명시적인 ID 변경 기능(MCP update의 set.id 포함)으로 유효한 현재 ID가 바뀌면 직전 ID를 deprecatedAliases에 자동 추가한다.
  직전 ID가 이미 등록되어 있으면 중복 추가하지 않고 기존 항목과 작성된 message를 유지한다.
  새 현재 ID가 이전 ID 목록에 있으면 그 항목을 제거한다. zone → return-zone → zone으로 변경하면 현재 ID는 zone이고 이전 목록에는 return-zone을 남긴다.
  현재 ID와 이전 목록을 하나의 변경 후보로 계산·검증하며 [[저장]]도 이 후보를 함께 반영한다. ID만 또는 목록만 부분 반영하지 않는다. 같은 ID를 다시 지정하는 것을 새 ID 변경으로 취급하지 않는다.
  사용자가 YAML을 직접 편집하면 필요한 이전 ID를 직접 관리한다. watcher는 이전 값을 추측해 목록에 추가하거나 원문을 자동 정리하지 않는다.
  ID 변경만으로 name 기반 본문 참조를 수정하거나 사용자의 코드를 자동 변경하지 않는다. 이전 ID와 코드를 연결하는 기준은 [[코드 식별자 매칭]]에서 확인한다.
  update API에서는 deprecatedAliases를 직접 수정할 수 없다. set.deprecatedAliases와 unset의 deprecatedAliases 지정을 모두 거부하며 빈 배열로 초기화하는 요청도 포함한다.
  이 제한은 ID 변경의 동시 지정 여부나 같은 ID의 재지정 여부와 무관하다. update API의 목록 변경은 실제 ID 변경에 따른 자동 관리로만 수행한다.
  YAML 직접 편집과 문서 스키마의 이전 ID 목록 허용 규칙은 유지한다.

  ## 원문 보존

  바꾸지 않은 공백·주석·따옴표·줄바꿈·순서를 유지한다.
  수정된 배열 내부의 이전 표기는 보존 대상이 아니다.
  부분 교체 후보를 다시 파싱해 기대 데이터와 같음을 확인하고 검증한다.

  원본 바이트를 UTF-8 문자열로 읽는 과정에서 정보가 손실된 파일은 수정 요청을 거부하며 무변경 요청도 예외로 두지 않는다.
  해석할 수 없는 바이트가 대체 문자로 바뀐 상태에서 저장하면 수정하지 않은 영역까지 손상될 수 있기 때문이다.
  한글·이모지 등 유효한 UTF-8 문자는 이 차단 대상이 아니다. 바이트 기반 버전 계산은 [[원문 버전]]에서 확인한다.

  ## 속성별 부분 수정

  기존 속성은 값 범위를 바꾸고 새 속성은 마지막 뒤에 주변 들여쓰기·줄바꿈에 맞춰 추가한다.
  삭제는 [[YAML 파싱]]이 반환한 속성 전체 범위를 사용한다. 그 범위에 속한 원문만 제거하고 바깥 원문은 유지한다.

  변경한 값의 따옴표·여러 줄 표기는 바꿀 수 있으나 실제 문자열의 줄바꿈·끝 개행을 정확히 보존한다.
  새 파일은 보존할 원문이 없으므로 별도 출력 규칙을 적용한다.
  개발용 Prettier로 사용자 문서 전체를 재포맷하지 않는다.

  ## 결과와 후속 책임

  문서 변경 계획에서는 다음 세 결과를 구분한다.

  - failed: 요청 또는 후보를 검증하지 못했으며 진단을 제공한다.
  - unchanged: 검증을 통과했고 원문 변경이 없으며 대상 경로·ID·현재 revision과 진단을 제공한다.
  - candidate: 검증된 YAML 원문·문서 데이터·경로·ID와 진단을 제공한다. 수정 후보의 baseRevision은 계산에 사용한 원문의 버전이다.

  계획 단계는 파일을 쓰거나 운영 색인을 갱신하지 않는다.
  후보의 새 바이트 버전은 [[작업 공간 변경 계획]]에서 계산하고, 최신 디스크 확인·파일 반영과 저장 결과는 [[저장]]에서 결정한다.

  ## 코드와 검증 위치

  대표 함수 planDocumentChange와 결과 타입은 [변경 계획 구현](../../../packages/core/src/change-plan/index.ts)에서 확인한다.
  요청·ID 변경·원문 보존·후보 검증 사례는 [인접 테스트](../../../packages/core/src/change-plan/change-plan.test.ts)에서 확인한다.
