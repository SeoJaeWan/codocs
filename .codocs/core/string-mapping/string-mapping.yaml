id: string-mapping
name: '문자열 위치 대응'
domains:
  - 'Core'
definition: |
  YAML을 해석한 문자열의 각 위치가 원문의 어느 구간에서 만들어졌는지 나타내는 대응 관계다.
  [[YAML 파싱]]에서 문자열의 값과 함께 확보하며, 해석 문자열 안에서 찾은 내용을 실제 원문 위치로 연결할 때 사용한다.

  ## 대응이 필요한 이유

  따옴표·escape·줄 접기 때문에 해석 문자열과 YAML 원문의 길이와 위치는 다를 수 있다.
  해석값의 위치를 원문 시작점에 단순히 더하면 다른 글자를 가리킬 수 있다.
  예를 들어 큰따옴표 문자열의 Unicode escape로 만든 문자는 해석값의 한 위치와 원문의 여러 글자가 대응한다.
  [[참조 추출]]은 이 대응으로 해석된 문자열 안의 참조가 원문의 어느 위치에 있는지 찾는다.

  ## 문자열과 원문 구간

  문자열이 속한 [[필드 경로]]와 해석된 문자열 값, 각 UTF-16 코드 단위에 기여한 원문 구간을 함께 다룬다.
  좌표 기준은 [[진단]]에서 확인한다.
  해석 문자열의 위치는 해당 문자열 시작 기준이고, 대응하는 원문 위치는 전체 YAML 원문 시작 기준이다.
  두 위치 모두 시작 포함·끝 제외로 표현하지만 기준 문자열이 다르므로 구분한다.

  escape·접힌 개행·여러 줄 표기가 있어도 해석값과 대응 구간은 같은 원문에 근거해야 한다.
  하나의 escape가 이모지처럼 두 UTF-16 코드 단위를 만들면 각 코드 단위가 같은 원문 구간에 대응할 수 있다.
  원문을 정규화하거나 해석 문자열과 길이가 같도록 고쳐 대응시키지 않는다.

  ## 문자열 내부 범위 조회

  해석 문자열의 일부를 선택하면 그 부분을 만든 원문의 범위를 구한다.
  문자열 값 전체의 표기 범위와 문자열 내부 내용의 범위는 구분한다. 키·값·속성 전체의 범위는 [[YAML 파싱]]에서 설명한다.
  문자열 대응이 없거나 파싱에 실패한 경우, 선택 범위가 비어 있거나 음수·비정수·역순·문자열 길이 밖인 경우에는 원문 범위를 제공하지 않는다.
  확인하지 못한 위치를 원문 검색으로 추측하지 않는다.

  대응 위치는 원문을 가리키는 정보이며 수정 가능 여부를 판단하지 않는다.
  원문 변경과 보존 조건은 [[문서 변경 계획]]에서 확인한다.

  ## 코드와 검증 위치

  대응 관계의 수집과 타입은 [문자열 위치 대응 구현](../../../packages/core/src/string-mapping/index.ts)에서 확인한다.
  getStringMapping·getStringRange의 조회 진입점은 [파싱 구현](../../../packages/core/src/parser/index.ts)에서 확인한다.
  escape·줄 접기·Unicode와 범위 조회 사례는 [인접 테스트](../../../packages/core/src/string-mapping/string-mapping.test.ts)에서 확인한다.
