id: code-reference
name: '명시적 코드 참조'
domains:
  - 'Core'
kind: policy
status: confirmed
definition: |
  코드·테스트 등 프로젝트 텍스트의 @codocs 표기에서 근거가 되는 .codocs 문서 전체 또는 특정 행·범위를 명시적으로 연결하는 계약이다.
  식별자의 이름으로 표현하지 못하는 검증 조건·제약 조건도 연결할 수 있으며 함수명·테스트명과 문서 ID의 일치를 요구하지 않는다.
  [[코드 식별자 매칭]]이나 문서 사이의 [[참조]]와 구분한다.

  ## 표기와 출현 위치

  언어·확장자·주석 여부로 표기를 제한하지 않는다. 검색 대상 텍스트의 주석·문자열·일반 텍스트·예제에 같은 표기가 있으면 각각 출현으로 유지한다.
  언어별 구문 파서나 실제 주석인지 판별하는 처리를 요구하지 않는다.

  | 연결 대상 | 표기 예 |
  | --- | --- |
  | 문서 전체 | `@codocs [[문서]]` |
  | 특정 행 | `@codocs [[문서]]#L11` |
  | 행 범위 | `@codocs [[문서]]#L11-L12` |
  | 도메인을 선택한 행 범위 | `@codocs [[문서 작성 가이드:문서]]#L11-L12` |

  대괄호 안은 문서의 name이며 ID가 아니다. 이름·선택 도메인과 특수 문자 해석은 [[참조]]의 이름 규칙을 재사용한다.
  YAML의 대상 필드 제한과 자기 문서 참조 규칙을 일반 코드 텍스트에 그대로 적용하지 않는다.
  행 지정은 닫는 대괄호 바로 뒤에 붙인다. 번호는 YAML 원문의 1부터 시작하는 실제 행이며 범위의 끝 행을 포함한다.
  대괄호 안의 콜론을 행 구분자로 재해석하지 않는다. 같은 파일의 다른 출현이나 같은 행의 여러 출현도 별도로 보존한다.
  출현의 전체 표기 범위와 원문 좌표를 함께 유지하며, 잘못된 행 지정도 해당 명시적 참조의 문제로 구분한다.

  ## 대상과 유효성

  대상은 현재 [[프로젝트 루트]] 아래의 .codocs에서만 찾는다. 다른 프로젝트나 상위 디렉터리의 지식 폴더와 후보를 섞지 않는다.
  이름·도메인 후보의 집계와 확인 상태는 [[참조 후보를 문서 연결로 확정하는 절차]]의 기준을 재사용한다.
  대상 없음·모호한 이름·잘못된 행 형식·역전 범위·파일 범위 초과를 구분하며 임의 대상이나 보정된 범위로 연결하지 않는다.
  탐색이 불완전하면 확인되지 않은 대상을 부재나 유일한 후보로 확정하지 않는다.

  대상 이름·도메인과 행·범위의 유효성은 마지막 저장 원문과 색인으로 판단한다.
  열린 대상의 미저장 메타데이터를 다른 출처의 대상 검색에 일괄 반영하지 않는다. 저장·색인 갱신 뒤 다시 판단한다.
  링크 출처의 미저장 추가·수정·삭제는 현재 편집 내용으로 해석한다.
  오류·모호함·미확인 결과로 확정된 역참조를 만들지 않는다.

  ## 행 번호의 의미

  행 번호는 문장이나 의미를 추적하는 영구 식별자가 아니다.
  앞부분에 행을 삽입해 설명이 밀려도 표기의 번호를 자동 수정하거나 원래 문장의 새 위치를 추론하지 않는다.
  저장·닫기·재시작 후에도 표기에 명시한 같은 번호를 사용한다. 역방향 연결 영역도 같은 번호를 기준으로 한다.
  실제 열린 버퍼에 지정한 시작·끝 행이 있는지 확인하고 이동하는 책임은 [[원문 열기]], 표시와 오류 안내는 [[IDE 지원]]에서 정의한다.

  ## 코드와 검증 위치

  표기의 위치·이름 해석과 저장 후보·행 판정은 [담당 구현](../../../packages/core/src/code-reference/index.ts)에서 확인한다.
  잘못된 행·범위와 Unicode·LF/CRLF 위치 계약은 [인접 테스트](../../../packages/core/src/code-reference/code-reference.test.ts)에서 확인한다.
