id: reference-extraction
name: '참조 추출'
domains:
  - 'Core'
definition: |
  해석된 문자열에서 [[참조]]의 등장 위치와 문법 오류를 찾아내는 순수 계산이다.
  작성자가 사용하는 이름·도메인 표기는 참조 문서에서 확인하고, 여기서는 추출과 원문 위치 대응을 정의한다.

  ## 추출과 오류 복구

  [[참조]]의 문법과 대상 필드 규칙을 YAML 해석 후 문자열에 적용한다.
  전체 문서 검증의 성공이나 내용 종류 판별을 추출의 선행 조건으로 요구하지 않는다.
  다른 필드가 틀려도 확인된 문자열은 유지하고 examples의 자료형이 잘못된 원소만 제외한다.
  문자열로 강제 변환하지 않으며 YAML 파싱 실패에서는 원문 검색으로 참조를 추측하지 않는다.

  잘못된 참조 뒤의 독립된 정상 참조도 계속 찾는다.
  반복 등장은 각각의 위치로 보존하고 문법 진단과 등장 기록을 반환한다.

  ## 원문 위치

  해석 문자열의 offset을 YAML 원문에 단순히 더하지 않는다.
  [[문자열 위치 대응]]으로 따옴표·escape·접힌 문자열의 실제 등장 위치를 찾는다.
