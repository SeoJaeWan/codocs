id: project-catalog
name: '조회 투영'
domains:
  - 'Core'
deprecatedAliases:
  - id: query-projection
definition: |
  [[문서 색인]]의 관측·문서·연결을 목록과 상세 데이터로 계산하는 처리다.
  파일을 읽거나 커서를 발급하지 않으며 전달받은 색인과 조회 조건을 변경하지 않는다.
  도구 입력과 외부 필드 배치는 [[조회]]에서 정의한다.
  [[참조 후보를 문서 연결로 확정하는 절차]]가 판단한 경로 연결을 조회용 ID로 표현하며, 참조 대상을 다시 선택하지 않는다.

  ## 목록과 필터

  유효한 ID와 문서용 이름이 있으면 오류 문서도 목록에 포함하고 hasErrors로 표시한다.
  잘못된 목록 속성은 생략하고 해당 속성의 필터에는 일치시키지 않는다.
  domain·kind·status 필터는 AND이며 한 파일이 모든 조건을 만족해야 한다.
  domain은 소속 중 하나와 같으면 일치하고 kind·status는 속성이 없으면 해당 필터와 일치하지 않는다.

  같은 ID의 파일들이 조건을 나누어 만족한 것을 하나의 일치로 합치지 않는다.
  중복 ID는 하나의 충돌 항목으로 집계하고 대표 이름·도메인·본문을 선택하지 않는다.
  충돌 파일 중 필터를 만족하는 것이 있으면 그 ID를 한 번 세고 모든 충돌 경로를 포함한다.
  목록은 ID 오름차순, 충돌 경로는 경로 오름차순으로 정렬한다.

  ## 상세와 원문

  요청 ID별로 결과를 계산하며 한 항목의 부재·오류·충돌이 다른 항목을 중단하지 않는다.
  해석 가능하고 JSON으로 표현할 수 있으면 원래 document와 진단을 제공한다.
  JSON으로 표현할 수 없으면 값을 보정하지 않고 전체 rawYaml과 확인 가능한 식별 정보·경로·revision·[[진단]]을 제공한다.
  revision의 의미는 [[원문 버전]]에서 정의하며, 조회 투영은 원본 파일 바이트를 읽어 버전을 계산하지 않는다.
  중복 ID는 충돌 경로와 진단만 제공하고 대표 document·rawYaml·revision을 만들지 않는다.
  본문과 참조 목록을 응답 크기에 따라 자르거나 요약하지 않으며 response_too_large로 거부하지 않는다.

  코드 매칭 후보의 발견 경로를 조회할 때는 ID로 대상을 다시 선택하지 않고 경로별 문서를 독립적으로 투영한다.
  현재 ID가 유효하고 프로젝트 전체에서 유일할 때만 ID를 제공한다.
  현재 ID가 없거나 형식 오류이면 문서 내용·원문·진단을 유지하면서 ID를 생략하고, 중복이면 ID를 생략하면서 모든 충돌 경로를 제공한다.
  파서가 최상위 YAML 범위를 확인한 문서는 같은 원문의 UTF-16 offset 범위와 0 기반 줄·문자 범위를 제공한다.
  CRLF도 원문 그대로 계산하며 파싱 실패처럼 범위를 확인할 수 없으면 좌표를 만들지 않는다.

  ## 편집 중 YAML 참조

  편집 중 출처의 전체 원문에서 definition·문자열 examples의 등장과 실제 UTF-16 위치를 계산하고 같은 디스크 색인의 후보·내용·진단·revision을 함께 투영한다.
  문서의 다른 속성 오류 때문에 확인한 문자열을 버리지 않으며 YAML 파싱 실패에서 원문 검색으로 참조를 추측하지 않는다.
  반복·잘못된 문법·자기 참조·부재·모호함·미확인을 구분한다. 확정되지 않은 후보를 단일 연결로 만들지 않는다.
  폐기 상태 참조 경고는 코드·문구·위치를 보존하며 대상의 내용과 관계를 제거하지 않는다.
  요청마다 전체 색인을 재구성하지 않고 출처 하나와 해당 후보만 계산한다.

  ## 연결의 ID 표현

  색인의 확정 직접 연결 중 유효한 ID가 프로젝트 전체에서 유일한 문서만 references와 referencedBy에 포함한다.
  직접 참조와 역참조에 같은 원칙을 적용하며 ID 오름차순으로 반환한다.
  참조 본문과 전이 연결은 펼치지 않는다.

  대상이 없으면 연결 목록에서 제외하고 대상 없음 진단을 제공하며 경로를 만들지 않는다.
  이름 후보가 여러 개이면 제외하고 모든 후보 경로를 진단에 남긴다.
  대상 경로가 확정돼도 ID가 누락·오류·중복이면 내부 경로 연결을 유지하되 외부 ID 목록에서 제외하고 경로와 원인을 안내한다.
  경로별 조회는 같은 Catalog가 확정한 직접·역참조의 발견 경로를 각각 제공한다.
  연결 대상의 현재 ID도 유효하고 전역에서 유일할 때만 덧붙이며, 빈 관계 목록은 생략한다.

  ## 관측 상태와 페이지의 경계

  관측의 최신성은 [[탐색 상태]]와 [[미확인 문서]]의 의미를 함께 해석한다.
  목록의 페이지 구분과 [[조회 커서]]의 유효성 판단은 [[목록 페이지 조회]]에서 수행한다.
  이 결과로 오류를 고치는 사용 순서는 [[검증 오류가 있는 문서를 조회하고 수정하는 절차]]에서 확인한다.

  ## 코드와 검증 위치

  대표 함수 projectCatalogList·projectCatalogGet·projectCatalogPaths·projectLiveReferences와 목록·상세 결과는 [조회 투영 구현](../../../packages/core/src/query/index.ts)에서 확인한다.
  필터·충돌·원문 보존·연결 ID와 입력 보존 사례는 [인접 테스트](../../../packages/core/src/query/query.test.ts)에서 확인한다.
