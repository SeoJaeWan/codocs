id: rename
name: '이름 변경 시 기존 참조의 의미 보존'
domains:
  - 'Core'
kind: policy
status: confirmed
definition: |
  ## 발생 상황

  문서의 이름을 바꾸면 기존 참조가 끊기거나 동명의 다른 문서를 가리킬 수 있다.
  문자열 교체만으로는 이전에 의도한 대상을 보존할 수 없다.

  [[참조 후보를 문서 연결로 확정하는 절차]]로 변경 전후의 대상을 계산한다.
  계산한 변경안을 실제 파일에 반영하는 조건은 [[이름 변경 반영]]에서 확인한다.

  ## 변경 전 판단

  영향받는 문서와 위치를 미리 보여주고 기존 참조도 함께 바꿀지 선택하게 한다.
  같은 소속 도메인의 새 이름이 충돌하면 이름과 참조 변경 모두 차단한다.

  확정 참조는 기존 대상을 유지한다.
  명시한 도메인은 유지하고 새 이름만으로 모호해지면 도메인을 명시한다.
  콜론 등 문법 문자는 [[참조]]의 escape 규칙에 따라 표현한다.

  일반 글자로 escape된 참조 표기는 제외한다.

  ## 모호한 후보

  후보가 여러 개면 사용자가 대상과 필요한 도메인을 선택한다.
  후보 목록에는 확인 가능한 도메인·이름·파일 경로를 표시한다.
  다른 후보를 선택한 결정도 존중한다.

  미선택 항목은 미해결로 남긴다.

  이름 변경으로 기존의 모호한 참조가 다른 후보 하나를 가리키게 되는 영향도 보여준다.
  후보를 선택한 후에는 도메인을 명시해야 한다.

  ## 미리보기와 저장의 책임

  이름 변경 미리보기는 수정 위치와 해석값·충돌·미해결 영향을 계산한다.
  ready는 저장 허가가 아니며 해석값은 YAML 원문 patch가 아니다.

  변경안은 위치와 해석값을 전달한다. 실제 파일의 원문 보존·쓰기 가능 여부·충돌과 복구는 [[이름 변경 반영]]의 책임이다.
