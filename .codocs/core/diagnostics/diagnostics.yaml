id: diagnostics
name: '진단'
domains:
  - 'Core'
definition: |
  문제의 원인과 확인된 위치를 사용자가 조치할 수 있는 정보로 전달하는 영역이다.
  오류 종류와 실제 문서·탐색·저장 상태를 구분한다.

  ## 발생 상황

  같은 실패 상태도 문법 오류·파일 접근 실패·이름 충돌처럼 해결 방법이 다르다.
  오류 코드만 보여주거나 확인되지 않은 좌표를 만들면 사용자가 원인을 잘못 이해한다.

  ## 원인과 위치의 전달

  진단에는 code·severity·message를 제공한다.
  확인한 파일 경로·필드 경로·원문 위치와 관련 대상·해결 방법을 상황에 맞춰 덧붙인다.

  모르는 메타데이터는 생략한다.

  기계 좌표는 0 기반 UTF-16이고 시작 포함·끝 제외다.
  사람이 읽는 줄·열 안내는 1 기반으로 표시한다.

  잘못된 값과 배열 원소는 그 값 위치, 사용자 필드 경고는 키 위치, 누락 필드는 확인된 부모 위치를 사용한다.
  원문 위치가 없으면 전체 파일을 대신 가리키지 않는다.

  고정 문구의 관리 위치와 동적 메시지 조합은 [[코드 컨벤션]]에서 정의한다.
  문서 충돌·참조·저장 여부는 코드 하나로 추측하지 않고 해당 계약의 실제 결과를 함께 읽는다.

  ## 외부 진단 필드

  | 속성 | 필수 여부 | 의미 |
  | --- | --- | --- |
  | code | 필수 | 프로그램이 구분할 오류·경고 코드 |
  | severity | 필수 | error 또는 warning |
  | message | 필수 | 사람이 이해할 설명 |
  | path | 해당 시 | 문제가 발생한 파일 경로 |
  | range | 위치 확인 시 | 원문 시작·끝 위치 |
  | fieldPath | 해당 시 | [[필드 경로]]로 표현한 문제 위치 |
  | relatedIds | 해당 시 | 관련 문서 ID |
  | suggestion | 해결 방법이 있을 때 | 다음 행동 안내 |

  range의 start/end는 각각 line·character를 가지며 character는 화면 너비가 아닌 UTF-16 코드 단위 수다.
  [[YAML 파싱]]의 전체 원문 offset을 외부 range로 변환할 때 앞의 좌표 기준을 적용한다.

  [[조회]]는 이 진단을 요청 전체 실패와 개별 문서 문제로 구분해 전달한다.
  저장 여부는 [[저장]], 저장 후 조회 가능 상태는 [[저장 후 색인 갱신 실패를 복구하는 절차]]의 결과 필드로 확인한다.

  ## 진단을 사용하는 처리

  [[YAML 파싱]]과 [[문서 검증]]은 원문의 문법·속성 문제를, [[문서 색인]]은 문서 간 충돌과 연결 문제를 판단한다.
  [[조회 투영]]은 조회 대상과 연결의 진단을 함께 제공하고, [[코드 식별자 매칭]]은 후보의 문제와 관측 상태를 보존한다.
  이 문서는 공통 전달 형식을 소유하며, 각 문제의 발생 조건과 처리 정책은 해당 담당 문서에서 정의한다.

  ## 공통 결과와 소비자의 책임

  core·workspace의 해당 기능은 발생 조건을 판단하여 공통 결과와 진단을 반환한다.
  같은 작업의 성공·실패와 진단 의미는 VS Code/LSP와 MCP에서 동일하게 사용한다. 각 어댑터는 전송·화면 표현을 담당하며 별도의 오류 코드 치환표나 성공·실패 판단을 만들지 않는다.
  라이브러리 오류나 파일 접근 원인을 제품 진단으로 해석해야 할 때는 원인을 아는 공통 기능에서 처리하고 확인한 경로·위치·시스템 오류 등 원인 정보를 보존한다.

  준비 중 상태를 파일 읽기 실패로 반환하는 등 의미가 맞지 않으면 결과를 생성하는 공통 기능에서 바로잡는다.
  준비·요청 취소·실제 접근 실패처럼 다른 상태를 하나의 오류로 합치지 않는다. 프로토콜 자체의 오류는 각 전송 계층의 책임으로 구분한다.

  ## 외부 오류 코드

  오류 코드는 다음 목록을 사용한다. 구체 원인과 해결 방법은 message·suggestion 등 공통 진단 필드로 설명한다.

  | code | 의미 |
  | --- | --- |
  | invalid_input | 잘못된 입력·알 수 없는 요청 속성 |
  | invalid_path | 허용 범위 밖이거나 잘못된 경로 |
  | not_found | 요청 문서·파일 없음 |
  | file_access_failed | 파일 읽기·접근 실패 |
  | invalid_yaml | YAML 문법 오류 |
  | unsupported_yaml_feature | 앵커·복수 문서 등 금지 구문 |
  | missing_required_field | 필수 속성 누락 |
  | invalid_field_type | 속성 자료형 오류 |
  | invalid_field_value | 빈 값·허용되지 않은 값·ID 형식 오류 |
  | duplicate_id | 동일 ID 문서 충돌 |
  | invalid_reference | 참조 작성 문법 오류 |
  | reference_not_found | 참조 대상 없음 |
  | reference_ambiguous | 이름·선택 도메인으로 찾은 대상 문서가 여러 개 |
  | revision_conflict | 조회 이후 파일 변경 |
  | file_exists | 생성 대상 경로가 이미 존재 |
  | file_write_failed | 파일 기록·반영 실패 |
  | index_not_ready | 초기 색인 구성·갱신 진행 중 |
  | index_build_failed | 전체 색인 구성 실패 |
  | index_update_failed | 저장 후 색인 반영·복구 실패 |
  | cursor_expired | 목록 변경 등으로 커서 만료 |
  | internal_error | 다른 코드로 분류되지 않는 내부 실패 |

  저장 계층의 revision_conflict·file_exists·file_write_failed·file_access_failed와 저장 후 index_update_failed 고정 코드·문구는 [공통 진단 정의](../../../packages/core/src/diagnostics/index.ts)에서 관리한다.
  file_write_failed는 임시 파일 기록·닫기·반영과 이미 저장된 뒤의 요청 임시 파일 정리 실패에도 사용한다. 저장 여부는 saved와 함께 판단하고 message·suggestion으로 실패 단계를 구분한다.

  경고 코드는 unknown_field(사용자 정의 문서 속성), deprecated_reference(폐기 상태 지식 참조)를 사용한다. 오류 코드만으로 저장 여부를 추측하지 않도록 saved·indexUpdated 등 실제 결과 필드를 유지한다.

  이 표는 외부 도구에 전달하는 진단 코드의 의미를 정의한다.
  공통 요청 성공·실패 분기 타입은 [공통 진단 정의](../../../packages/core/src/diagnostics/index.ts)에 둔다.
  unsupported_yaml_feature의 대상 구문은 [[문서]]의 YAML 저장 형식에서 정의하며 공통 코드는 원인을 메시지와 위치로 구분한다.
  라이브러리의 오류·경고 분류를 그대로 노출하지 않고 제품 진단으로 변환한다.

  ## 코드와 검증 위치

  Diagnostic·좌표 타입과 진단 코드는 [공통 진단 정의](../../../packages/core/src/diagnostics/index.ts)에서 확인한다.
  원문 위치와 오류·경고 전달은 [파싱 테스트](../../../packages/core/src/parser/parser.test.ts), [문서 검증 테스트](../../../packages/core/src/validator/validator.test.ts), [색인 테스트](../../../packages/core/src/catalog/catalog.test.ts), [조회 투영 테스트](../../../packages/core/src/query/query.test.ts)에서 확인한다.
