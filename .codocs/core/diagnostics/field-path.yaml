id: field-path
name: '필드 경로'
domains:
  - 'Core'
definition: |
  문서의 데이터 구조 안에서 특정 값을 가리키는 경로다.
  문서의 최상위에서 시작해 속성 이름과 배열 인덱스를 찾아가는 순서대로 배열에 담는다.
  속성 이름은 문자열로, 배열 인덱스는 0부터 시작하는 숫자로 표현한다.

  ## 중첩된 값을 가리키는 예

  다음 문서에서 첫 번째 deprecatedAliases 항목의 id를 가리키는 경로는 `["deprecatedAliases", 0, "id"]`다.

  ```yaml
  deprecatedAliases:
    - id: old-payment
  ```

  `deprecatedAliases` 속성의 배열에서 첫 번째 항목을 선택한 뒤 그 항목의 `id` 속성으로 이동하면 `old-payment` 값에 도달한다.

  ## 원문 위치와의 구분

  필드 경로는 데이터 구조상의 위치이며 원문에서 글자가 있는 줄·문자 위치나 offset과는 다르다.
  같은 데이터가 다른 공백·줄바꿈으로 작성되어도 필드 경로는 같을 수 있고 원문 좌표는 달라질 수 있다.
  [[YAML 파싱]]은 확인한 키·값·속성의 원문 위치를 이 경로에 연결한다.

  외부 Diagnostic API의 `fieldPath`는 이 개념을 표현하는 필드명이다.
  진단에 함께 전달하는 원문 좌표와 다른 필드는 [[진단]]에서 확인한다.
