id: catalog
name: '문서 색인'
domains:
  - 'Core'
definition: |
  프로젝트의 문서 관측을 발견 경로별로 보관하고 ID·이름 검색과 직접 연결에 사용하는 정보 구조다.
  단일 문서의 형식 검사 결과와 프로젝트 전체에서 계산한 충돌·연결 정보를 함께 유지한다.

  ## 보관하는 정보

  문서별 확인 상태·ID·이름·소속·진단을 보관한다.
  직접 연결된 대상과 이 문서를 직접 가리키는 문서를 구분해 보관한다.
  연결 목록에 포함할 대상은 [[참조 후보를 문서 연결로 확정하는 절차]]로 결정한다.

  검색에 사용할 정보와 원문 위치를 함께 유지한다.
  이전 자료가 남아 있다는 사실과 최신 내용이 확인됐다는 사실을 구분한다.
  미확인 기록의 보존 조건은 [[불완전한 탐색에서 색인과 연결을 유지하는 절차]]에서 설명한다.

  ## 프로젝트 전체 검사

  [[문서 검증]]의 형식 결과를 받은 뒤 [[문서]]의 ID 고유성과 같은 도메인 안의 이름 충돌을 검사한다.
  충돌한 모든 경로를 진단에 남기고 정상 대표 문서로 합치지 않는다.
  [[참조 후보를 문서 연결로 확정하는 절차]]로 연결을 계산하고 deprecated 문서를 참조하면 경고한다.

  ## 갱신

  문서 추가·이동·삭제와 식별명·이름·소속·본문 변경 시 영향을 받는 검색 정보와 연결·진단을 재계산한다.
  연결된 본문 전체나 전이 관계를 원문 속성으로 복제하지 않는다.
