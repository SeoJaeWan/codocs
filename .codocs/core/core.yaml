id: core
name: 'Core'
domains:
  - 'Core'
kind: procedure
definition: |
  파일 IO 없이 문서 데이터를 해석·검증하고 참조·색인·조회·코드 매칭과 변경 후보를 계산하는 책임 영역이다. 파일 관측과 반영은 [[작업 공간]], 호스트·프로토콜 표현은 담당 영역에서 정의한다.

  ## 원문과 형식

  - [[YAML 파싱]]: 허용 구문·원문 해석·필드 위치와 실패를 확인한다.
  - [[문자열 위치 대응]]: 해석 문자열과 원문 구간의 관계를 확인한다.
  - [[문서 검증]]: 전체 문서의 형식 검사·입력 보존과 오류·경고를 확인한다.
  - [[진단]]: 문제의 원인과 확인한 위치를 전달하는 공통 형식을 확인한다.

  ## 참조와 색인

  - [[참조 추출]]: 해석된 문자열의 참조 등장과 문법 오류를 찾는다.
  - [[문서 색인]]: 경로별 관측·검색 정보·충돌과 연결을 유지한다.
  - [[참조 후보]]: 대상이 될 가능성과 확정된 연결을 구분한다.
  - [[참조 후보를 문서 연결로 확정하는 절차]]: 이름·도메인과 관측 상태로 연결을 판단한다.
  - [[조회 투영]]: 색인을 목록·상세와 외부 ID 연결로 표현한다.

  ## 본문 검토

  - [[본문 중복 탐지]]: 반복 구절과 원문 위치를 검토 후보로 제공하는 계약 제안을 확인한다.

  ## 코드 연결과 변경

  - [[코드 식별자 매칭]]: 현재·이전 ID에 맞는 후보와 근거를 찾는다.
  - [[명시적 코드 참조]]: @codocs의 이름·행·범위 표기로 코드와 문서의 근거를 연결한다.
  - [[이전 ID]]: 변경 전 코드 표기를 유지하는 목적을 확인한다.
  - [[문서 변경 계획]]: 요청 검증·원문 보존과 미저장 후보를 계산한다.
  - [[이름 변경 시 기존 참조의 의미 보존]]: 이름 변경 전후의 참조 대상과 영향을 비교한다.
