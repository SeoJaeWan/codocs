id: core
name: 'Core'
domains:
  - 'Core'
kind: procedure
definition: |
  파일 IO 없이 문서 데이터를 해석·검증하고 참조·색인·코드 매칭 결과를 계산하는 패키지의 용어와 계약이다. 호스트·프로토콜의 표현과 파일 반영은 담당 패키지에서 정의한다.

  ## 용어와 계약

  - [[문서 변경 계획]]: 생성·수정 요청의 검증, 원문을 보존한 후보와 무변경 결과의 계산을 확인한다.
  - [[조회 투영]]: 색인 정보를 목록·상세와 외부 ID 연결로 계산하는 기준을 확인한다.
  - [[문서 색인]]: 계산에 보관할 검색 정보와 연결 기록을 확인한다.
  - [[진단]]: 오류·경고의 원인과 확인 위치를 전달하는 공통 형식을 확인한다.
  - [[문서 검증]]: YAML 데이터의 속성 형식을 검사하고 오류·경고를 반환하는 기준을 확인한다.
  - [[코드 식별자 매칭]]: 코드 식별자에서 연결할 문서 후보·위치·근거를 계산한다.
  - [[이전 ID]]: 변경 전 코드 표기를 유지하는 목적과 사용 범위를 확인한다.
  - [[참조 후보]]: 확정 대상과 후보 정보의 차이를 확인한다.
  - [[참조 추출]]: 해석된 문자열의 등장·오류·원문 위치를 찾는 방법을 확인한다.
  - [[참조 후보를 문서 연결로 확정하는 절차]]: 후보 집계와 관측 상태를 바탕으로 연결 여부를 판단한다.
  - [[이름 변경 시 기존 참조의 의미 보존]]: 이름 변경 전후의 연결 영향과 수정 후보를 계산한다.
  - [[YAML 파싱]]: 지원 구문·실패 처리와 해석값의 원문 위치 대응을 확인한다.
