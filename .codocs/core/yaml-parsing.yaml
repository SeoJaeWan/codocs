id: yaml-parsing
name: 'YAML 파싱'
domains:
  - 'Core'
definition: |
  YAML 원문을 데이터로 해석하고 해석값과 원문 위치의 대응을 보존하는 처리다.

  ## 발생 상황

  원문에는 따옴표·주석·CRLF·여러 줄 문자열과 Unicode escape가 있다.
  해석한 문자열의 길이만으로 원문 위치를 계산하면 다른 글자를 가리키거나 수정할 수 있다.

  ## 처리

  원문은 정규화하지 않고 UTF-16 코드 단위의 시작 포함·끝 제외 범위로 보관한다.
  키·값·속성 전체 위치를 구분한다.
  값 표기는 따옴표를 포함하고 속성 전체는 같은 줄·값 내부 주석을 포함하되 앞의 독립 주석을 제외한다.

  해석 문자열 각 문자가 실제 어떤 원문 구간에서 생겼는지 연결한다.
  접힌 개행이나 escape 때문에 해석 문자열과 원문 길이가 달라도 확인된 원문 위치를 반환해야 한다.

  ## 실패와 예외

  일반 문법 오류와 최상위 비매핑·빈 문서는 거부한다.
  앵커·별칭·병합 키·사용자 태그·복수 문서·중복 키도 거부한다.
  중복 키는 뒤의 키를 진단하고 어느 값도 임의 선택하지 않는다.

  실패 원문과 진단은 보존하지만 정상 데이터는 제공하지 않는다.
  복구 AST가 있어도 성공으로 승격하거나 원문 검색으로 ID·참조를 추측하지 않는다.

  위치를 확인할 수 없으면 범위를 생략한다.
  위치를 찾았다는 사실은 필수 필드 삭제나 저장의 허가가 아니다.
  해석한 데이터의 필수 속성·자료형·허용 값은 [[문서 검증]]에서 확인한다.

  ## 위치 조회의 세부 경계

  fieldPath는 속성 이름과 배열 인덱스를 순서대로 담는다.
  내부 offset은 전체 원문 시작 기준이고 외부 range는 줄·문자 기준이므로 같은 타입으로 취급하지 않는다.

  블록 매핑의 속성 전체 범위는 해당 줄바꿈까지 포함한다.
  flow 매핑 주변의 쉼표 처리는 부분 수정에서 판단하며 하나의 범위만으로 모든 수정이 가능한 것은 아니다.

  일반 값·목록·객체·주석·여러 줄 문자열과 단일 문서 시작 표시 ---를 허용한다.
  파싱 성공은 스키마 성공이 아니므로 해석 가능한 필수 필드 누락은 후속 검증에 넘긴다.

  파싱에 사용하는 라이브러리의 지원 범위와 제품이 허용하는 YAML 범위는 구분한다.
  원문 전체를 다시 출력하는 것만으로 기존 형식의 보존이 보장되지는 않는다.
