id: document-validation
name: '문서 검증'
domains:
  - 'Core'
definition: |
  YAML을 해석한 데이터가 [[문서]]의 필수 속성·자료형·허용 값에 맞는지 검사한다.
  검사 결과로 errors·warnings를 제공하고 성공하면 검증된 data를 함께 반환한다.
  예를 들어 definition이 누락되었거나 id가 허용된 형식이 아니면 해당 속성의 오류를 보고한다.

  ## 입력과 검사 범위

  검사 대상은 전체 data이며 원문·위치·파일 경로는 선택 정보다. 검증 함수는 파일을 읽지 않는다.
  [[YAML 파싱]]으로 문법을 해석한 뒤 속성을 검사한다. 파싱 성공이 문서 형식의 유효성을 보장하지 않는다.
  생성·수정 모두 변경을 적용한 전체 후보를 검사하며 값을 강제 변환하거나 기본값을 보충하지 않는다.
  입력 데이터와 원문·위치 정보는 변경하지 않는다.

  선택 속성 생략과 proposed·deprecated 문서의 존재 자체는 오류가 아니다.
  사용자 속성의 자료형·보존·경고 조건은 [[문서]], 진단의 필드·좌표는 [[진단]]에서 확인한다.
  정책의 의미 모순·업무 사실·코드의 자연어 정책 준수는 자동 판정하지 않는다.

  ## 결과와 원문 위치

  경고만 있으면 success:true이며 오류가 있으면 success:false로 검증된 data를 반환하지 않는다.
  실패해도 호출자가 가진 원본 입력을 폐기하는 것은 아니다.
  원문 위치가 없어도 같은 형식 규칙을 검사하며 확인되지 않은 위치는 만들지 않는다.
  변경된 후보와 맞지 않는 이전 원문 위치를 진단에 연결하지 않는다.

  ## 이전 ID 항목

  deprecatedAliases의 구조는 [[문서]]에서 정의한다. 잘못된 id·message와 필수 속성 누락은 확인한 위치에 진단한다.
  직접 편집으로 현재 ID와 동일한 이전 ID를 등록하면 경고하며 사용자 값을 자동 삭제하지 않는다.

  ## 다른 처리에서 사용하는 결과

  프로젝트 전체의 ID·이름 충돌과 문서 간 연결은 [[문서 색인]]에서 확인한다.
  유효한 식별자로 코드에서 연결할 문서를 찾는 작업은 [[코드 식별자 매칭]]이며 이 문서의 형식 검사와 목적이 다르다.
  문서 검증 결과가 실패했을 때의 원문 조회는 [[조회 투영]], 화면 표현은 [[IDE 지원]]에서 확인한다.
