id: catalog
name: '문서 색인'
domains:
  - 'Core'
definition: |
  프로젝트의 문서 관측을 [[발견 경로]]별로 보관하고 ID·이름 검색과 직접 연결에 사용하는 정보 구조다.
  단일 문서의 형식 검사 결과와 프로젝트 전체에서 계산한 충돌·연결 정보를 함께 유지한다.

  ## 보관하는 정보

  문서별 확인 상태·ID·이름·소속과 [[진단]]을 보관한다.
  [[참조 추출]]의 등장 기록과 [[참조 후보]]를 바탕으로 연결을 판단한다.
  직접 연결된 대상과 이 문서를 직접 가리키는 문서를 구분해 보관한다.
  연결 목록에 포함할 대상은 [[참조 후보를 문서 연결로 확정하는 절차]]로 결정한다.

  검색에 사용할 정보와 원문 위치를 함께 유지한다.
  이전 자료가 남아 있다는 사실과 최신 내용이 확인됐다는 사실을 구분한다. 이전 관측만 남은 자료의 의미는 [[미확인 문서]]에서 확인한다.
  미확인 기록의 보존 조건은 [[불완전한 탐색에서 색인과 연결을 유지하는 절차]]에서 설명한다.

  ## 프로젝트 전체 검사

  [[문서 검증]]의 형식 결과를 받은 뒤 [[문서]]의 ID 고유성과 같은 도메인 안의 이름 충돌을 검사한다.
  충돌한 모든 경로를 진단에 남기고 정상 대표 문서로 합치지 않는다.
  [[참조 후보를 문서 연결로 확정하는 절차]]로 연결을 계산한다.

  확정된 참조 대상의 status가 deprecated이면 참조를 작성한 문서의 각 등장 위치에 deprecated_reference 경고를 남긴다.
  폐기 상태는 대상의 부재를 뜻하지 않으므로 직접·역참조 연결은 유지한다. 모호하거나 미확정인 후보 중 하나를 임의로 골라 폐기 상태 참조로 판단하지 않는다.
  문서 자체의 폐기 상태와 [[이전 ID]]는 별개이며 deprecatedAliases의 존재만으로 이 경고를 만들지 않는다.

  ## 갱신

  문서 추가·이동·삭제와 식별명·이름·소속·본문·status 변경 시 영향을 받는 검색 정보와 연결·진단을 재계산한다.
  대상의 폐기 상태가 해제되거나 해당 참조가 없어지면 더 이상 해당하지 않는 폐기 상태 참조 경고를 제거한다.
  연결된 본문 전체나 전이 관계를 원문 속성으로 복제하지 않는다.

  ## 색인을 사용하는 판단

  [[조회 투영]]은 색인 정보를 목록·상세 조회에 필요한 결과로 바꾼다.
  [[문서 변경 계획]]은 수정 후보가 기존 대상을 대체했을 때의 충돌·참조를 검사한다.
  [[이름 변경 시 기존 참조의 의미 보존]]은 변경 전후 연결을 비교해 수정안과 영향을 판단한다.
  실제 파일 관측과 운영 색인 갱신의 시점은 [[색인 갱신]]의 책임이다.

  ## 코드와 검증 위치

  대표 자료형 Catalog와 색인 구성 함수 buildCatalog는 [색인 구현](../../../packages/core/src/catalog/index.ts)에서 확인한다.
  경로·이름 검색, 충돌·연결, 관측 갱신 사례는 [인접 테스트](../../../packages/core/src/catalog/catalog.test.ts)에서 확인한다.
