id: reference-candidate
name: '참조 후보'
domains:
  - 'Core'
definition: |
  [[참조]]의 이름과 선택 도메인에 일치해 대상이 될 가능성이 있는 문서다.
  [[문서 색인]]에서 이름·도메인으로 찾은 후보이며, 후보로 발견됐다는 사실은 연결이 확정됐다는 뜻이 아니다.

  ## 후보 정보

  확인 가능한 이름·도메인·ID·[[발견 경로]]를 제공한다.
  ID가 없거나 충돌하더라도 확인 가능한 후보 정보를 버리지 않는다.

  후보 정보로 연결 여부를 판단하는 방법은 [[참조 후보를 문서 연결로 확정하는 절차]]에서 확인한다.

  ## 코드와 검증 위치

  후보를 표현하는 ReferenceCandidate는 [색인 구현](../../../packages/core/src/catalog/index.ts)에서 확인한다.
  복수 후보·오류 문서·불완전한 관측의 후보 보존은 [인접 테스트](../../../packages/core/src/catalog/catalog.test.ts)에서 확인한다.
