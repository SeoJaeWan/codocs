id: knowledge-management
name: '지식 관리'
domains:
  - '문서 모델'
definition: |
  작업에 필요한 개념과 계약을 찾고 합의한 내용을 문서로 유지하는 활동이다.
  문서의 연결과 갱신을 통해 개발 중 판단에 활용한다.

  ## 원문 선택과 갱신

  필요한 원문을 선택해서 읽고 연결된 문서는 판단에 필요한 만큼 추가로 확인한다.
  연결을 제공했다는 사실이 모든 관련 지식을 읽었다는 뜻은 아니다.

  새 설명을 추가하기 전에 같은 주제를 소유한 [[문서]]가 있는지 확인한다.
  기존 설명의 보완인지 새 주제의 분리인지는 [[설명 분리]]를 참고해 판단한다.

  기능을 구현하며 새로 합의한 개념·발생 조건·판단 근거·정책·예외를 담당 원문에 반영한다.
  계약과 구현이 다른 경우의 기록 기준은 [[문서 컨벤션]]에서 확인한다.

  ## 연결 유지

  원문이 바뀌면 그 내용을 사용하는 문서의 문맥과 [[참조]]도 함께 확인한다.
  이름을 바꾸는 경우에는 [[이름 변경 시 기존 참조의 의미 보존]]에서 연결 영향을 확인한다.

  조회·검증·저장 도구를 사용하는 순서는 [[지식을 선택해서 읽고 변경하는 흐름]]에서 설명한다.
  이 프로젝트의 Local Work Memory와 .codocs 동시 갱신 절차는 [[메모리 동시 갱신]]에서 확인한다.
