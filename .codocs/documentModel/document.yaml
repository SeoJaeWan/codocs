id: document
name: '문서'
domains:
  - '문서 모델'
definition: |
  문서는 이름을 붙여 찾아보고 참조할 수 있는 설명의 단위다.
  개념의 정의뿐 아니라 규칙·조건·예외·판단 근거·작업 흐름을 담을 수 있다.

  ## 설명의 범위

  이름이 가리키는 주제와 독자가 이 문서에서 해결할 질문을 중심으로 작성한다.
  한 주제를 설명하는 데 여러 개념이 필요하다는 이유만으로 다른 종류의 문서로 나누지 않는다.

  다른 문서의 설명이 필요하면 [[참조]]로 연결하고, 이 문서에서는 그 설명이 필요한 상황과 관계를 적는다.
  독자가 현재 주제를 이해할 수 있는 맥락은 남기되 대상 문서의 규칙 전체를 복제하지 않는다.

  길이나 참조 개수로 문서의 종류를 판정하지 않는다.
  별도 이름으로 관리할 부분이 있는지는 [[설명 분리]]의 권장 기준으로 검토한다.

  ## 표현과 소속

  식별자·문서용 이름·본문 등 저장 속성은 [[문서 형식]]에서 정의한다.
  어떤 책임 영역에 속하는지는 [[도메인]]으로 나타낸다.
  개념 설명과 작업 흐름에 같은 문서 형식을 사용한다.
