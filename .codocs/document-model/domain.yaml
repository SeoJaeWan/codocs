id: domain
name: '도메인'
domains:
  - '문서 모델'
definition: |
  도메인은 문서가 설명하는 책임·주제의 분류다.
  한 문서가 여러 책임 영역을 함께 다루면 여러 도메인에 속할 수 있다.

  ## 분류 기준

  세부 기능 이름마다 도메인을 만들지 않는다.
  기존 영역의 문서로 먼저 설명하고 독립적인 책임과 정책 경계가 필요할 때 분리한다.
  다른 영역의 문서를 참조한다는 사실만으로 그 영역에도 소속시키지 않는다.

  패키지는 구현 책임을 나누는 단위이며 도메인과 반드시 일치하지 않는다.
  문서의 소속이 코드의 사용 위치를 제한하지도 않는다.

  ## 도메인 소개

  도메인 소개 문서는 해당 영역의 책임과 관련 문서를 읽는 출발점을 제공한다.
  소개 문서는 도메인 하위 문서 전체를 [[참조]]하고 각 문서가 답하는 질문을 짧게 안내한다.
  독자는 이 문서를 출발점으로 필요한 설명을 찾고 문서 사이의 관계와 읽는 순서를 파악한다.
  개별 규칙을 소개 문서에 반복하지 않는다.
  소개 문서도 [[문서]]와 같은 설명 단위이며 별도 타입이 아니다.

  소속을 선언하는 속성과 이름 비교는 [[문서]]에서 정의한다.
  이 프로젝트의 도메인 소개 파일과 하위 문서 배치는 [[폴더 컨벤션]]에서 확인한다.
