id: document-validation
name: '문서 검증'
domains:
  - '문서 모델'
definition: |
  문서의 필드와 값이 정해진 형식을 만족하는지 검사하는 처리다.

  ## 발생 상황

  YAML은 해석되지만 필수 필드가 빠지거나 값의 자료형이 틀릴 수 있다.
  문법 해석 성공과 문서 형식의 유효성은 구분한다.

  ## 검증 책임

  [[YAML 파싱]]은 문법을 해석하고, 스키마는 [[문서 형식]]의 필수 필드·자료형·허용 값·ID 형식을 검사한다.
  [[문서 색인]]은 프로젝트 충돌과 참조를 검사한다.
  생성·수정 모두 변경을 적용한 전체 후보를 검증한다.
  값을 강제 변환하거나 기본값을 보충하지 않는다.

  경고만 있으면 성공이고, 오류가 있으면 검증된 데이터는 반환하지 않는다.
  원본 입력을 변경하거나 폐기한다는 뜻은 아니다.
  사용자 속성의 보존·경고 조건은 [[문서 형식]], 오류와 경고의 전달 형식은 [[진단]]에서 정의한다.

  정책의 의미 모순·업무 사실·코드의 자연어 정책 준수는 자동 판정하지 않는다.

  ## 이전 ID 검증과 코드 매칭 진단

  deprecatedAliases 항목의 필수 ID와 선택 message는 문서 스키마의 규칙으로 검증한다. 잘못된 ID·message와 필수 필드 누락은 확인된 원문 위치에 진단한다.
  직접 편집으로 현재 ID와 동일한 이전 ID를 등록하면 경고하며 사용자 값을 자동 삭제하지 않는다.
  여러 문서의 같은 현재 ID는 고유성 오류다. 현재/이전 또는 이전/이전 ID가 겹친다는 이유로 하나의 정상 대상을 고르지 않으며 후보 처리는 [[IDE 지원]]이 소유한다.
  문서 검증 실패가 확인 가능한 개별 ID의 코드 매칭까지 전부 배제한다는 뜻은 아니다. 유효한 값의 부분 매칭·기본 안내·Hover 표현은 매칭 계약을 따른다.
  문서 오류는 YAML 원문 진단, Hover, MCP 조회에 제공한다. MCP의 기존 ID 기반 get/list 입력과 오류 문서 반환 계약은 유지한다.

  ## 검증 입력과 결과

  검사 대상은 전체 data이며 원문·위치·파일 경로는 선택 정보다. 검증 함수는 파일을 읽지 않는다.

  변경된 후보 데이터에 맞지 않는 이전 원문 위치를 연결하지 않는다.
  원문 위치가 없어도 같은 규칙으로 검증하고, 입력 데이터·원문·위치는 변경하지 않는다.

  결과는 success·errors·warnings를 제공하고 성공할 때만 검증된 data를 제공한다.
  선택 속성 생략과 미확정·폐기 문서의 존재 자체는 오류가 아니다.

  deprecated 상태 문서의 참조는 경고 대상이다.
