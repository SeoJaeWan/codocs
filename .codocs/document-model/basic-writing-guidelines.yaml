id: basic-writing-guidelines
name: '기본 작성 지침'
domains:
  - '문서 모델'
definition: |
  Codocs 문서를 작성할 때 설명의 범위·형식·분리·연결 기준을 찾아가는 안내다.
  프로젝트의 목적과 독자에 맞춰 적용할 세부 규칙은 아래 문서에서 확인한다.

  - [[문서]]: 문서의 개념과 설명 범위, YAML 속성, kind·status, 내용 작성과 갱신 기준을 확인한다.
  - [[설명 분리]]: 하나의 설명을 유지할지 별도 이름의 문서로 나눌지 판단한다.
  - [[참조]]: 다른 문서의 설명을 이름으로 연결하는 표기와 해석 규칙을 확인한다.
