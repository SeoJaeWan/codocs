id: document-model
name: '문서 모델'
domains:
  - '문서 모델'
kind: procedure
status: confirmed
definition: |
  문서 모델은 프로젝트의 개념과 규칙을 표현하고 원문을 해석·검증하는 영역이다.
  아래 문서에서 작성 단위를 정한 뒤 데이터의 해석과 검증 기준을 확인한다.

  ## 문서를 작성하고 유지할 때

  - [[기본 작성 지침]]: 문서를 작성할 때 필요한 기준을 찾아간다.
  - [[문서]]: 설명 범위·작성과 갱신 기준·저장 속성과 허용 값을 확인한다.
  - [[설명 분리]]: 별도 문서로 나눌지 판단하는 기본 권장 사항을 확인한다.
  - [[도메인]]: 문서의 소속과 도메인 소개의 역할을 이해한다.
  - [[지식 관리]]: 새 합의를 반영할 원문을 찾고 변경된 설명과 연결을 유지한다.

  ## 원문을 해석하고 검사할 때

  - [[YAML 파싱]]: 허용 구문·실패 처리와 해석값의 원문 위치를 확인한다.
  - [[문서 검증]]: 해석한 데이터의 형식·값과 검증 결과를 확인한다.
  - [[진단]]: 발견한 문제의 코드·원인·위치를 전달하는 방식을 확인한다.

  조회·수정까지 이어지는 작업 순서는 [[지식을 선택해서 읽고 변경하는 흐름]]에서 확인한다.
