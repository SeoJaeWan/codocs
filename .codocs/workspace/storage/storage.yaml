id: storage
name: '저장'
domains:
  - '작업 공간'
definition: |
  생성·수정 요청으로 계산한 검증된 후보를 최신 파일 상태와 대조하고 실제 파일에 반영하는 책임이다.
  파일 반영 여부·변경 여부·새 원문 버전과 진단을 반환하며 저장 뒤의 색인 결과를 함께 안내한다.

  ## 후보 준비와 파일 반영의 경계

  [[작업 공간 변경 계획]]으로 읽은 원문·버전을 [[문서 변경 계획]]에 연결해 검증된 후보 또는 무변경 결과를 준비한다.
  create/update의 입력·속성 변경·이전 ID 관리·원문 보존과 후보 검증 기준은 [[문서 변경 계획]]에서 정의한다.
  후보 준비가 실패하면 파일을 반영하지 않는다. 검증된 무변경은 파일·색인을 갱신하지 않으며 아래 결과 계약을 적용한다.
  후보 준비 완료는 파일 저장 완료를 의미하지 않으며, 실제 저장 단계가 최신 디스크와 접근 조건을 확인해 반영 여부를 결정한다.

  ## 최신 원문과 접근 확인

  AI가 문서를 읽은 뒤 사람이나 다른 Codocs 프로세스가 주석이나 내용을 바꿀 수 있다.
  오래된 원문 기준으로 저장하면 다른 변경을 덮어쓸 수 있으므로 수정 저장 직전 실제 디스크 바이트에서 [[원문 버전]]을 다시 계산해 요청의 revision과 비교한다.
  오래된 색인 값만으로 판단하지 않는다. 불일치하면 revision_conflict와 success:false·saved:false를 반환하고 해당 요청으로 파일을 변경하지 않는다.
  호출자는 최신 문서를 다시 읽고 수정안을 검토한 뒤 새 revision으로 요청한다. 서버는 revision만 바꿔 기존 수정안을 자동 재적용하거나 충돌 요청을 무한 재시도하지 않는다.
  비교와 반영 사이의 동시 수정에 대한 보장 범위와 파일 반영 연산은 [[쓰기 조정]]에서 정의한다.

  생성·수정 경로의 부모 폴더와 대상은 [[파일 접근 범위]]에 따라 확인한다.
  허용 범위 안에서 .codocs와 필요한 부모 폴더가 없으면 생성한다.
  create 대상 파일이 이미 있으면 생성을 차단한다. 후보 계산에서 통과한 경로 검사만으로 기존 파일을 덮어쓰지 않는다.
  create 실패를 update로 바꾸거나 없는 update를 자동 생성하지 않는다.

  ## 반영과 색인 갱신

  [[문서 변경 계획]]에서 검증한 원문 보존과 ID·이전 ID의 동시 변경을 파일 반영에서도 유지한다. 후보를 전체 재포맷하거나 ID와 이전 목록을 부분 반영하지 않는다.
  경고만 있으면 저장 성공을 막지 않으며 무관한 다른 문서 오류 때문에 정상 쓰기를 전부 차단하지 않는다.
  후보 검증에서 허용한 다른 도메인의 동명 문서에 대해 저장 후 별도 동명 문서 안내나 검사를 수행하지 않는다.

  본문을 비교하는 [[작업 공간 중복 검사]]는 이름의 일치를 찾는 검사와 구분한다.
  그 검토 후보나 검사 실패는 저장 조건을 충족한 요청을 추가로 차단하지 않으며, 파일 반영 결과와 검사 상태를 합쳐 판단하지 않는다.
  검토 결과가 비차단이라는 사실은 기존 변경 계획과 저장의 오류·충돌·불완전한 탐색에 따른 차단 조건을 완화하지 않는다.

  파일 반영 연산은 [[쓰기 조정]], 저장 뒤의 색인 반영과 실패 복구는 [[저장 후 색인 갱신 실패를 복구하는 절차]]에서 확인한다.
  파일 반영 여부와 색인 갱신 여부를 구분하여 이미 저장된 요청을 다시 실행하게 하지 않는다.

  ## 저장 결과

  파일 반영 전 실패는 success:false·saved:false와 진단을 제공한다. 파일 반영 뒤 색인만 실패한 경우는 위 복구 절차로 구분한다.
  검증된 무변경은 success:true·saved:false·changed:false·현재 revision을 반환하고 indexUpdated를 생략한다.

  파일 반영 뒤 요청 임시 파일 정리만 실패하면 success:true·saved:true를 유지하고 정리 실패를 별도 진단으로 안내한다.
  이미 저장한 파일을 다시 쓰거나 자동 롤백하지 않으며, 정리 실패 때문에 파일 반영을 재요청하게 하지 않는다.
  원인 안내에는 [[진단]]에 정의된 의미에 맞는 기존 코드를 사용하고, message·suggestion으로 저장 완료 여부와 실패한 후속 처리를 구분한다.
  확인한 경로와 시스템 오류 정보는 [[작업 공간 진단]]에 따라 보존한다.

  변경 저장 성공은 success·saved·changed와 id·source.path·revision·warnings, 색인 갱신 결과를 제공한다.
  반환할 revision은 반영한 새 파일 바이트에서 계산한다.
  문서 본문을 다시 반환하지 않는다.

  ## 현재 단일 파일 반영

  [담당 구현](../../../packages/workspace/src/storage/index.ts)의 saveWorkspaceChange는 같은 스캔으로 [[작업 공간 변경 계획]]을 만들고, 후보 바이트를 대상 폴더의 배타적 임시 파일에 기록·동기화·닫는다.
  직전 전체 탐색으로 최신 ID 충돌을 확인하고 대상 경로와 디스크 원문 버전을 재확인한다. create는 임시 파일의 하드링크를 대상 이름에 등록하여 이미 생긴 대상을 덮어쓰지 않으며, update는 rename으로 교체한다.
  임시 파일을 다시 읽어 후보와 같은 바이트인지 확인하고 그 바이트로 반환 revision을 계산한다. 임시 파일은 YAML 확장자가 아니므로 문서 탐색·색인에서 제외된다.
  검증된 무변경은 디스크 revision을 다시 확인한 뒤 saved:false·changed:false를 반환하고 임시 파일을 만들지 않는다.
  저장 결과의 diagnostics는 저장 전 오류와 저장 후 요청 임시 파일 정리 실패를 구분한다. 이 계층은 색인 갱신을 수행하지 않으므로 indexUpdated를 반환하지 않는다.
  같은 세션의 [쓰기 연결](../../../packages/workspace/src/query/index.ts)은 이 결과를 받아 저장 경로를 재관측한다. 저장 성공과 색인 성공은 별도 결과이며 추가 색인 복구가 실패해도 파일을 재저장하지 않는다.

  [실제 파일 테스트](../../../packages/workspace/src/storage/storage.test.ts)는 Windows의 생성·수정 바이트, 하드링크 비덮어쓰기, 실패 후 원본 보존, 늦은 변경·ID 충돌, 링크 경로, 임시 정리 실패를 확인한다.
