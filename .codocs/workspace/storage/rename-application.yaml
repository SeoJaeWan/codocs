id: rename-application
name: '이름 변경 반영'
domains:
  - '작업 공간'
definition: |
  [[이름 변경 시 기존 참조의 의미 보존]]에서 계산한 변경안을 실제 파일에 반영하는 계약이다.
  미리보기 결과를 입력으로 받아 아래 쓰기 전 조건을 확인한다.

  ## 저장 전후 실패

  수정 불가 파일이 있으면 이유를 안내하고 전체 저장 전에 중단한다.
  미리보기 이후 원문이 바뀌면 최신 원문으로 미리보기를 다시 만든다.

  중간 저장 실패 시 이미 반영한 파일의 복구를 시도하고 복구 실패도 파일별 실제 상태로 안내한다.
  다중 파일 원자성을 보장한다는 뜻은 아니다.

  ## 반영 책임

  [[원문 버전]]으로 최신 원문을 확인하고 [[쓰기 조정]]으로 쓰기 순서를 관리한다.
  [[문서 변경 계획]]의 원문 보존 규칙에 따라 YAML 따옴표·escape와 변경하지 않은 내용을 보존한다.
  요청당 한 문서인 저장 도구를 묵시적 일괄 쓰기로 바꾸지 않는다.
