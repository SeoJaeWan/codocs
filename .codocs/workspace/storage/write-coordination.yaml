id: write-coordination
name: '쓰기 조정'
domains:
  - '작업 공간'
definition: |
  여러 프로세스의 파일 반영 순서와 잠금·대기·취소를 관리하는 처리다.

  ## 발생 상황

  여러 Codocs 프로세스가 같은 프로젝트에 쓰거나 저장 도중 프로세스가 종료될 수 있다.
  원본을 먼저 비우거나 메모리 잠금만 사용하면 데이터 손실과 동시 쓰기를 막을 수 없다.

  ## 반영 계약

  대상과 같은 폴더에 고유 임시 파일을 배타 생성하고 완전히 기록·닫는다.
  update는 [[원문 버전]]과 충돌을 재확인한 뒤 교체한다.

  [[파일 접근 범위]]에서 허용한 일반 파일에만 반영하며, 반영 직전에도 경로의 심볼릭 링크·정션 여부를 다시 확인한다.

  create는 대상이 없을 때만 등록되는 연산을 사용한다.
  임시 파일 하드 링크 방식은 검증 후보이며 일반 rename 덮어쓰기로 대체하지 않는다.

  반영 전 실패는 요청 임시 파일을 정리하고 원본을 유지한다.
  반영 후 정리 실패와 저장 실패는 구분한다.

  교체 원자성은 정전 후 데이터 보존 보장이 아니다.

  현재 파일 반영은 [[저장]]의 단일 문서 저장 계층이 수행한다. 임시 파일의 mode 0600은 새 파일과 교체된 파일에도 이어지며, Windows ACL·파일 시스템별 동작과 정전 내구성은 별도 보장하지 않는다.
  협력 잠금·공유 대기열·취소는 #21의 범위이며, 이 단계의 직전 검사만으로 외부 편집기의 검사·반영 사이 경쟁을 막지는 못한다.

  ## 대기와 취소

  같은 실제 프로젝트의 쓰기는 한 번에 하나이며 등록 완료 순서로 실행한다.
  proper-lockfile은 잠금을 제공하고 공유 파일 대기열은 별도로 구현한다.

  대기열 관리와 실제 쓰기 잠금을 구분해 실행 중에도 등록·취소할 수 있게 한다.

  등록 후 5초 내 시작하지 못하면 취소하고 미저장을 안내한다.
  시작한 작업의 실행 제한이 아니며 다른 소유자의 잠금을 강제 해제하지 않는다.
  소유 프로세스가 종료한 대기 요청은 제거한다.

  ## 검증할 경계

  생존 갱신 2초·만료 30초는 초기 검증값이다.
  잠금을 잃으면 추가 쓰기를 멈추고 실제 반영 여부를 안내한다.

  외부 편집기는 협력 잠금을 따르지 않으므로 revision 검사를 유지한다.

  서로 다른 프로젝트가 공유 원본을 쓰는 경우의 조정 정책은 확정되지 않았다.
  프로젝트 잠금만으로 프로젝트 간 동시 쓰기까지 보호된다고 가정하지 않는다.

  ## 파일 연산과 내부 기록

  Node.js 기본 파일 API를 사용하며 write-file-atomic을 기본 도구로 채택하지 않는다.
  고유 .codocs-write-랜덤값.tmp를 대상과 같은 폴더에 배타 생성하고 색인에서 제외한다.

  AI는 내용을 두 번 전송하거나 임시 파일을 받을 필요가 없다.
  원본을 먼저 비우거나 삭제하지 않으며 교체 실패 후 원본을 삭제해 재시도하지 않는다.

  프로세스들은 같은 실제 프로젝트의 실행 데이터 위치를 사용하고 사용자 지식 문서와 구분한다.
  공유 대기열에는 요청 ID·순번·소유 프로세스·상태만 두며 요청 원본은 소유 프로세스의 메모리에 둔다.
  요청은 소유 프로세스만 실행하며 다른 프로세스가 대신 실행하지 않는다.

  ## 대기 경쟁

  차례가 오면 현재 ID 충돌·revision·참조를 재확인한다.
  5초 대기 제한은 진행 상황에 따라 연장하지 않는다.

  취소와 실행 시작의 경쟁은 관리 잠금 안에서 판정하고 취소한 요청은 나중에 실행하지 않는다.

  모든 참여자는 같은 생존 갱신·만료 설정을 사용한다.
  절전·장시간 정지·강제 종료·복구 경쟁을 실제 여러 프로세스로 검증한다.
