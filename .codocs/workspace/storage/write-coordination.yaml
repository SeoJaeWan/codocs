id: write-coordination
name: '쓰기 조정'
domains:
  - '작업 공간'
definition: |
  파일을 안전하게 반영하는 연산과 여러 작성자가 동시에 수정할 때의 보장 범위를 정하는 정책이다.

  ## 발생 상황

  여러 Codocs 프로세스나 외부 편집기가 같은 문서를 수정하거나 저장 도중 프로세스가 종료될 수 있다.
  원본을 먼저 비우지 않는 파일 반영과 다른 작성자의 변경을 확인하는 검사는 서로 다른 책임이다.

  ## 반영 계약

  대상과 같은 폴더에 고유 임시 파일을 배타 생성하고 완전히 기록·닫는다.
  update는 [[원문 버전]]과 충돌을 재확인한 뒤 교체한다.

  [[파일 접근 범위]]에서 허용한 일반 파일에만 반영하며, 반영 직전에도 경로의 심볼릭 링크·정션 여부를 다시 확인한다.

  create는 대상이 없을 때만 등록되는 연산을 사용한다.
  임시 파일 하드 링크 방식은 검증 후보이며 일반 rename 덮어쓰기로 대체하지 않는다.

  반영 전 실패는 요청 임시 파일을 정리하고 원본을 유지한다.
  반영 후 정리 실패와 저장 실패는 구분한다.

  교체 원자성은 정전 후 데이터 보존 보장이 아니다.

  현재 파일 반영은 [[저장]]의 단일 문서 저장 계층이 수행한다. 임시 파일의 mode 0600은 새 파일과 교체된 파일에도 이어지며, Windows ACL·파일 시스템별 동작과 정전 내구성은 별도 보장하지 않는다.

  ## 동시 수정의 처리 범위

  현재는 저장 직전 검사로 관측한 충돌을 차단하는 방식을 사용한다. revision 불일치의 미저장 결과와 최신 문서 재조회는 [[저장]]에서 정의한다.
  프로세스 간 잠금·공유 FIFO 대기열·등록 후 5초 대기 취소는 도입하지 않는다. 생존 갱신·잠금 만료·소유자 복구도 현재 쓰기 처리에 포함하지 않는다.
  요청 실행 순서나 같은 프로젝트에서 한 번에 하나만 저장한다는 보장은 제공하지 않는다.

  revision 확인과 파일 교체는 별도 연산이다. 파일 교체가 원자적이어도 현재 revision이 기대값일 때만 교체하는 조건부 원자적 연산은 아니다.
  두 작성자가 같은 revision을 확인한 뒤 차례로 저장하면 뒤의 저장이 앞의 변경을 덮어쓸 수 있다. 이 경쟁은 Codocs 프로세스끼리와 외부 편집기와의 수정 모두에 남는다.
  같은 생성 경로의 비덮어쓰기는 위 반영 계약으로 보호하지만, 서로 다른 파일의 동일 ID 생성 등 프로젝트 전체 충돌 검사와 저장도 하나의 원자적 연산은 아니다.

  ## 선택 이유와 재검토 조건

  대기열·잠금 상실·복구 관리의 복잡도를 줄이기 위해 검사와 반영 사이의 경쟁 가능성을 현재 단계에서 받아들인다.
  실제 동시 저장으로 변경 누락이나 충돌이 발생하면 해당 사례를 근거로 잠금 또는 조건부 원자적 저장을 재검토한다.
  검사와 반영 사이에서 발생한 덮어쓰기는 revision 충돌로 보고되지 않을 수 있으므로, 충돌 보고가 없다는 사실만으로 동시 저장의 안전성을 판단하지 않는다.

  ## 파일 연산과 임시 기록

  Node.js 기본 파일 API를 사용하며 write-file-atomic을 기본 도구로 채택하지 않는다.
  고유 .codocs-write-랜덤값.tmp를 대상과 같은 폴더에 배타 생성하고 색인에서 제외한다.

  AI는 내용을 두 번 전송하거나 임시 파일을 받을 필요가 없다.
  원본을 먼저 비우거나 삭제하지 않으며 교체 실패 후 원본을 삭제해 재시도하지 않는다.

  Windows update의 rename이 EPERM으로 실패하면 삭제 공유를 허용하지 않는 일시적인 파일 핸들과의 경합에 대비해 20·50·100ms 뒤 최대 세 번 더 시도한다.
  재시도는 해당 rename 연산에만 적용한다. 다른 OS·오류 코드·임시 기록·읽기·create 하드링크 오류에는 적용하지 않는다. 영구 권한 오류도 EPERM일 수 있으므로 제한을 넘으면 원래 IO 코드를 가진 미저장 결과를 반환한다.
  매 시도 전에 전체 ID 충돌·대상 경로와 원문 버전을 다시 확인하고, 재시도에서는 대상 파일 식별자와 요청 임시 파일의 경로·식별자·바이트도 확인한다.
  대상이 교체됐거나 경로·원문·후보가 달라졌으면 저장을 차단한다. 새 revision으로 요청을 자동 변환하지 않으며 다른 파일로 바뀐 임시 경로는 정리하지 않는다.
  재검사와 rename 사이의 경쟁 가능성은 위 동시 수정 한계와 같으며, 제한 재시도가 프로세스 간 잠금이나 조건부 원자적 저장을 제공하지 않는다.
