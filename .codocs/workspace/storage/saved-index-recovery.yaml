id: saved-index-recovery
name: '저장 후 색인 갱신 실패를 복구하는 절차'
domains:
  - '작업 공간'
kind: procedure
status: confirmed
definition: |
  [[저장]]이 완료된 뒤 [[색인 갱신]]과 [[원문 버전]]을 함께 확인해 실제 반영 상태를 안내하는 절차다.
  파일 반영 성공과 조회용 색인 갱신 성공을 구분한다.

  ## 저장 후 실패

  저장한 서버는 파일 반영 → 자기 색인 갱신 → 응답 순서로 처리한다.
  최초 갱신 실패 시 파일을 다시 읽고 영향받는 참조를 반영하는 복구를 추가 1회 시도한다.

  최초 갱신과 추가 복구는 완료 또는 실제 오류가 확인될 때까지 기다린다.
  경과 시간만으로 실패를 선언하는 고정 제한을 두지 않으며, 1초 이상 걸린다는 이유로 복구를 중단하거나 refresh를 안내하지 않는다.
  완료 대기는 복구 재시도 횟수를 늘리는 것이 아니다. 세션 종료에 따른 중단은 처리 지연과 구분한다.
  늦게 끝난 이전 읽기가 최신 색인을 덮거나 종료된 세션에 결과를 게시하지 않도록 관측 세대와 세션 상태를 확인해 폐기한다.

  복구도 실패하면 saved는 true, indexUpdated는 false로 실제 상태를 안내하고 refresh를 제안한다.
  파일 재저장·create 반복·자동 롤백·무한 재시도는 하지 않는다.

  ## 저장 후 응답 일관성

  indexUpdated:true 직후 같은 서버의 get/list는 저장 결과를 제공한다.
  다른 프로세스는 watcher를 통해 갱신한다.

  복구에 인위적 대기·파일 재저장·자동 전체 재구성을 추가하지 않는다.
  실제 오류로 복구가 실패하면 success:true·saved:true·indexUpdated:false와 저장 revision·진단을 반환하고 refresh를 안내한다.

  refresh까지 실패하면 원인에 맞는 수정·재시작을 안내하고 무한 복구를 유도하지 않는다.
