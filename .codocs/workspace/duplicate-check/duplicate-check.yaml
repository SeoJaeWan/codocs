id: workspace-duplicate-check
name: '작업 공간 중복 검사'
domains:
  - '작업 공간'
status: confirmed
definition: |
  프로젝트에서 관측한 원문과 미저장 후보를 [[본문 중복 탐지]]에 연결하고, 검사 범위·최신성·완료 상태를 관리하는 책임이다.
  비교 규칙과 후보의 의미는 그 담당 문서에서 정의하며, 여기서는 어떤 관측을 언제 비교했는지와 결과를 재사용할 조건을 다룬다.

  ## 관측과 검사 범위

  [[문서 탐색]]과 [[작업 공간 색인 구성]]으로 확보한 원문·파싱 결과·경로·원문 버전을 같은 관측으로 연결한다.
  [[원문 버전]]의 의미를 적용하고, 여러 관측 시점의 본문과 위치를 하나의 최신 결과처럼 섞지 않는다.
  전체 검사는 시작 시점의 대상 문서와 각 문서의 원문 버전을 고정해 문서 간 반복과 각 문서 내부 반복을 검사한다.
  파일 접근·파싱 실패로 확인하지 못한 문서와 그 이유를 검사 범위에 남긴다.

  ## 미저장 본문의 검사

  특정 대상의 본문은 기존 문서 집합과 비교하고, 같은 초안 안의 내부 반복도 함께 확인한다.
  수정 대상의 저장 전 버전은 외부 비교 집합에서 제외한다. 대상의 원래 경로로 구분하며 같은 ID라는 이유로 다른 경로의 문서를 함께 제외하지 않는다.
  미저장 구절의 위치는 해당 초안 원문에 대응시키고 저장된 파일의 위치인 것처럼 제공하지 않는다.

  초안은 생성·수정 요청과 같은 입력으로 받고, [[작업 공간 변경 계획]]이 제공한 변경 후 후보와 후보 버전을 검사한다.
  [[문서 변경 계획]]의 요청 검증이나 충돌·참조 조건을 우회해 저장 가능한 후보를 만들지 않는다.
  초안 검사 자체는 파일을 쓰거나 운영 색인과 비교 자료에 초안을 반영하지 않는다.

  대상 본문 전체의 반복 후보를 제공하는 것과 이번 변경으로 새로 생긴 반복만 찾는 것은 구분한다.
  변경 전후의 후보를 별도로 대조하지 않았다면 새로 생긴 중복만 검사했다고 표시하지 않는다.

  ## 비교 자료의 재사용과 갱신

  문서별로 준비한 비교 구간은 원문 경로·원문 버전·알고리즘과 비교 설정의 버전이 모두 같을 때만 재사용한다.
  전체 검사와 초안 검사가 같은 준비 자료를 사용하여 요청마다 모든 문서를 다시 준비하지 않는다.

  검사를 시작할 때 현재 색인의 문서별 원문 버전을 준비 자료와 대조해 추가·변경된 문서만 다시 준비하고 삭제된 문서의 자료는 사용하지 않는다.
  파일 변경 알림이나 [[저장]] 결과로 비교 자료를 미리 갱신하지 않는다. 저장·직접 편집·삭제는 [[색인 갱신]]으로 색인에 반영된 뒤 다음 검사의 대조에서 비교 자료에 연결된다.
  문서를 다시 준비하지 못했으면 이전 버전의 자료로 대신하지 않고 그 문서를 검사하지 못한 범위로 남긴다.

  검사 결과는 비교한 문서들의 원문 버전에 연결한다.
  원문을 다시 열거나 수정에 이용할 때 버전이 달라졌으면 이전 위치를 그대로 적용하지 않고 해당 결과를 재검사한다.

  ## 실행과 완료 상태

  검사는 [[작업 공간 조회 세션]]에서 실행하되 계산을 나눠 진행하여, 검사 중에도 다른 요청·파일 변경 반영·취소를 처리할 수 있게 한다.
  실행 시간 제한을 넘으면 그때까지 검사한 범위의 결과와 중단 이유를 부분 완료로 제공한다. 시간 제한은 설정값이며 특정 문서 수의 완료를 보장하는 성능 목표가 아니다.
  준비 중이거나 사용할 관측이 없는 경우에는 그 상태를 알리고 빈 후보 목록으로 검사 완료를 대신하지 않는다.

  파일의 [[탐색 상태]]와 본문 검사의 완료 상태는 별도로 판단한다.
  탐색이 끝났어도 본문을 읽거나 비교하지 못한 범위가 남으면 전체 검사를 완료한 것으로 표시하지 않는다.
  확인한 일부를 검사한 경우에는 그 결과와 누락·중단 이유를 함께 제공하고, 검사 자체를 수행하지 못한 실패와 구분한다.
  일부만 검사했거나 실패한 결과를 프로젝트 전체의 중복 없음으로 안내하지 않는다. 정책상 제외한 구간은 [[본문 중복 탐지]]의 비교 범위로 명시한다.

  ## 결과 페이지와 만료

  결과 개수 제한과 계산 중단은 구분한다. 계산을 완료했더라도 표시하지 않은 후보가 있으면 남은 결과가 있음을 알린다.
  같은 결과를 페이지로 제공할 때는 비교한 문서들의 원문 버전 목록과 비교 설정에 연결하고, 그 기준이 바뀌면 다음 페이지를 제공하지 않고 만료를 알린다.
  [[조회 커서]]는 본문만 바뀐 색인 게시에서 세대를 유지하므로 이 페이지의 만료 기준으로 사용하지 않는다.

  조회 세션은 다음 페이지를 제공하기 위해 최근 검사 결과 한 건을 보관한다. 완료와 부분 완료 결과를 보관하며, 문서별 준비 자료의 재사용과 구분한다.
  다른 검사 결과가 보관된 결과를 대체하면 이전 결과의 커서는 만료된다. 원문이나 비교 기준이 그대로여도 더 이상 보관하지 않는 결과의 다음 페이지는 제공하지 않는다.
  원문·비교 기준 변경에 따른 만료와 보관된 결과 교체에 따른 만료를 구분해 안내한다.

  ## 파일 반영과의 경계

  본문 중복 검사는 [[저장]]의 허가 조건을 추가하거나 대체하지 않는다.
  저장은 중복 검사를 실행하지 않으며, 저장 전 반복 확인은 미저장 본문 검사로 따로 요청한다.
  검사 후보·실패·부분 완료는 저장 조건을 충족한 요청을 실패로 바꾸지 않는다.
  부분 관측에서 확인한 본문을 검토할 수 있다는 사실은 기존 변경 계획이 차단하는 불완전한 탐색·문서 오류·충돌 상태에서 저장할 수 있다는 뜻이 아니다.
