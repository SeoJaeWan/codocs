id: workspace-watcher
name: '작업 공간 파일 감시'
domains:
  - '작업 공간'
definition: |
  선택한 [[프로젝트 루트]]에서 문서 상태를 다시 확인해야 할 경로를 알리는 책임이다.
  파일 변경 신호와 감시 연결 상태를 제공하며, 신호를 받은 뒤 원문을 다시 읽고 색인에 반영하는 책임은 [[색인 갱신]]에 있다.
  감시는 YAML을 해석하거나 snapshot을 만들지 않고 원문을 수정하지 않는다.

  ## 감시 대상과 변경 신호

  프로젝트의 .codocs 디렉터리와 내부 파일·하위 폴더의 생성·수정·삭제·이동을 감지한다.
  시작할 때 .codocs가 없어도 이후 생성을 감지하며, 삭제되거나 다른 디렉터리로 교체된 뒤에도 새 내부 문서의 변경을 감지한다.
  심볼릭 링크·정션의 대상은 감시 대상으로 등록하거나 따라가지 않는다. [[문서 탐색]]이 확인한 일반 파일·폴더만 변경 신호의 재확인 대상으로 삼는다.
  접근 허용과 실제 파일 읽기의 판단은 [[파일 접근 범위]]와 [[문서 탐색]]이 담당한다.

  변경 신호는 다시 확인할 절대 경로의 배치다. 같은 배치의 동일 경로는 중복하지 않는다.
  구독을 해제한 대상에는 이후 배치를 전달하지 않는다.
  알림 횟수나 순서를 파일 작업의 이력으로 취급하지 않는다. 같은 경로의 빠른 변경은 합쳐질 수 있으며 소비자는 현재 상태를 다시 읽는다.
  이벤트 하나만으로 문서의 존재·유효성·내용을 확정하거나 삭제·생성을 원문 변경 계획으로 바꾸지 않는다.

  초기 연결과 새 하위 폴더 등록은 각각 독립된 감시 연결의 공개 ready/error로 완료한다.
  같은 폴더의 중복 등록은 준비 promise를 공유한다.
  내용 감시는 OS 알림을 유지하며 .codocs 트리의 metadata 보완 감시도 함께 연결한다.
  보완 감시의 변경은 OS 신호와 같은 배치·발견 경로·캐시 무효화 규칙을 사용한다.
  임시 파일을 먼저 준비한 두 작성자가 역순으로 rename하면 같은 크기라도 나중 본문의 mtime이 더 오래될 수 있다. metadata 보완 감시는 mtime 증가만 기다리지 않고 poll 원시 관측의 파일 식별자·크기·mtime·ctime 변경을 재확인 신호로 보존한다.
  읽기로 바뀐 atime만으로는 신호를 만들지 않아 재읽기 순환을 방지한다. 이 보완은 문서 본문을 주기적으로 읽거나 감시 이벤트의 순서를 보장하지 않는다.
  준비 대기는 종료·연결 교체 시 취소되며 늦은 ready가 상태를 되돌리지 않는다.
  배치 타이머를 기다리지 않는 drain도 같은 구독으로 신호를 전달한다.

  프로젝트 루트의 보완 감시가 먼저 확인한 .codocs 하위 변경도 버리지 않는다.
  새 하위 폴더는 내용 감시를 준비하고 현재 발견한 경로와 폴더 재확인 신호를 전달한다.
  동일 폴더의 중복 등록은 기존 준비를 공유하며 폴더 교체·종료 때 연결을 정리한다.

  OS 알림을 기본으로 사용하며 감지 보완과 알림 병합 뒤 실제 변경 내용이 반영되는지 기능 테스트로 확인한다. 쓰기 안정화 대기는 라이브러리의 기본 2초를 그대로 적용하지 않고 실제 파일 관측·변경 반영 계약에 맞춰 정한다.

  ## 디렉터리 교체와 재연결

  .codocs 자체의 변경이 여러 감시 경로에서 전달되어도 같은 디렉터리에 대한 재연결을 반복하지 않는다.
  재연결 중에는 중복 재연결을 시작하지 않으며, 연결이 완료된 동일 디렉터리는 유지한다.
  경로 이름이 같아도 디렉터리의 실제 대상이 달라졌다면 새 대상을 감시해야 한다.
  새 내용 감시가 준비된 뒤 디렉터리 재확인 신호를 전달해, 신호를 받은 소비자가 재관측을 시작할 수 있게 한다.
  이 신호가 색인 갱신의 완료를 의미하지는 않는다.

  ## 감시 준비와 오류 복구

  감시 연결 준비 중에는 starting, 정상 연결 뒤에는 ready 상태를 제공한다.
  소비자는 감시 시작 전에 구독을 연결할 수 있어야 한다. 시작 요청의 반환만으로 변경 수집이 가능한 상태라고 판단하지 않으며, 대상별 감시 준비 완료를 구분한다.
  이미 실행 중인 감시에 새 하위 폴더를 추가할 때도 등록 요청과 변경 수집 준비 완료를 구분한다. 준비 중 오류·종료를 정상 등록으로 처리하거나 끝나지 않는 준비 대기로 남기지 않는다.
  수집한 변경은 배치 전달 전에도 소비자가 대기 여부를 확인하거나 전달받을 수 있어야 한다. 배치 병합 때문에 색인 완료 판정에서 이미 감지한 변경이 사라져서는 안 된다.
  ready는 감시 연결 상태이며 문서 읽기나 색인 게시의 완료를 뜻하지 않는다. 최초 탐색과 하위 폴더 등록 전후 관측의 재확인·결과 게시 순서는 [[색인 갱신]]이 담당한다.

  감시 오류가 발생하면 recovering으로 전환하고 자동 재연결을 한 번 시도한다. 성공하면 ready로 돌아가 재관측 신호를 전달한다.
  자동 복구가 실패하거나 허용한 자동 복구 이후 다시 오류가 발생하면 failed로 전환하고 원인과 수동 codocs_refresh 안내를 제공한다.
  감시 오류는 YAML 내용 오류와 구분하며, failed를 무기한 준비 중인 상태로 표현하지 않는다.

  수동 refresh는 감시 재연결을 시도하고 자동 복구 횟수를 다시 허용한다. 재연결 실패 시 원인과 수동 안내를 유지한다.
  원문 재스캔과 감시 복구의 조정, 마지막 완료 색인의 제한적 조회와 write·validate 허용 여부는 [[색인 갱신]]에서 정의한다.
  감시를 종료하면 연결·대기 배치·구독을 정리하고 closed 상태를 제공하며, 이후 변경 신호를 전달하지 않는다.
  종료 promise는 OS 감시의 close와 교체 중인 이전 연결의 종료까지 기다린다. 반복 종료 요청은 같은 완료를 공유하며 소비자는 이 완료 뒤 임시 파일을 정리한다.
  시작·하위 폴더 등록·재연결 중 종료된 경우에도 뒤늦은 준비 완료가 감시 자원을 다시 열거나 ready 상태로 되돌리지 않는다.
  하위 폴더의 비동기 경로 확인 뒤에는 연결을 만들기 전에 현재 세대와 종료 상태를 다시 확인한다. 종료 전에 시작한 경로 확인이 늦게 끝나도 새 감시 핸들을 등록하지 않는다.

  ## 코드 출현 감시

  [[코드 참조 색인]]은 프로젝트 텍스트와 프로젝트 .gitignore, Git index·HEAD 변경을 별도 감시한다. 일반 텍스트 감시가 문서 저장 감시의 실패 게이트를 추가하지 않는다.
  텍스트 감시 대상은 [[코드 참조 색인]]의 검색 대상 규칙과 같다. 수집 대상이 될 수 없는 경로에는 감시를 등록하지 않으며, .gitignore로 제외한 폴더는 그 안에 Git 추적 파일이 있을 때만 감시한다. 감시 대상 판단과 수집 대상 판단은 같은 규칙을 사용한다.
  감시 규칙은 각 .gitignore의 내용과, 제외한 폴더 중 Git 추적 파일이 있어 감시하는 폴더의 집합이다. .gitignore나 Git index·HEAD가 바뀐 뒤 이 규칙이 실제로 달라졌을 때만 텍스트 감시 전체를 다시 구성하고 원문을 재확인한다. 새 폴더 생성이나 규칙이 같은 index 갱신으로는 재구성하지 않는다.
  최초 reconciliation 전에 각 연결의 ready/error를 확인한다. 등록 중 수집한 신호도 버리지 않으며 해당 읽기의 세대를 무효화해 현재 경로를 다시 확인한다.
  Git index·HEAD는 metadata 감시로 원자 교체와 역순 mtime을 보완한다. 바이트를 주기적으로 읽지 않고 장치·inode·크기·mtime·ctime 변화만 재확인 신호로 전달하며 읽기 atime은 무시한다.

  코드 감시 오류는 경로를 알 수 없어도 감시 연결의 손상으로 취급한다. 오류 뒤에는 해당 폴더의 기존 파일 수정을 더 이상 관측하지 못할 수 있으므로 오류를 무시하지 않는다.
  오류가 발생하면 확인한 개별 출현을 보존한 채 incomplete로 게시하고 즉시 코드 감시를 다시 등록한다. 연달아 도착한 오류는 한 번의 재등록으로 합친다. 재등록에 성공하면 원문을 전체 재확인한 뒤 수집 상태를 게시한다.
  재등록이 연달아 실패하면 1초부터 두 배씩 늘린 간격으로, 최대 30초마다 다시 시도한다. 시도 횟수에는 한도를 두지 않으며 재등록에 성공하면 간격을 처음으로 되돌린다.
  코드 감시는 문서 감시와 달리 자동 복구 횟수를 제한하지 않는다. 코드 폴더의 삭제·재생성은 정상 작업 중에도 반복될 수 있고, 한도를 넘긴 뒤 수동 refresh를 기다리면 그 사이의 코드 변경을 계속 놓치기 때문이다.
  명시 refresh는 예약된 재시도를 기다리지 않고 코드 연결을 다시 등록하고 원문을 재확인한다. 종료는 준비 대기와 예약된 재시도, 모든 등록을 정리한다.

  ## 코드와 검증 위치

  대표 자료형 WorkspaceWatcher와 createWorkspaceWatcher는 [담당 구현](../../../packages/workspace/src/watcher/index.ts)에서 확인한다.
  실제 파일 변경과 디렉터리 교체 신호는 [인접 테스트](../../../packages/workspace/src/watcher/watcher.test.ts)에서 확인한다.
  오류 주입에 따른 재연결·수동 복구 상태는 [복구 테스트](../../../packages/workspace/src/watcher/watcher-recovery.test.ts)에서 확인한다. 오류 주입은 실제 OS 오류의 재현을 대신하지 않는다.
  실제 하위 폴더 등록과 경로 확인 중 종료의 자식 프로세스 회귀는 [등록 경합 테스트](../../../packages/workspace/src/watcher/watcher-registration.test.ts)에서 확인한다. 종료 회귀는 경로 확인의 실제 반환 경계를 제어하고 close 이후 자식이 자연 종료하는지 검사한다.

  코드와 Git 신호 연결은 [별도 구현](../../../packages/workspace/src/watcher/code-reference-watcher.ts)에서 확인한다. 실제 코드·ignore·Git 변경 갱신은 [코드 참조 통합 테스트](../../../packages/workspace/src/code-reference/code-reference.test.ts)에서 확인한다.

  Git index의 같은 바이트·mtime 원자 교체와 준비 중 종료는 [인접 테스트](../../../packages/workspace/src/watcher/code-reference-watcher.test.ts)에서 확인한다.

  코드 감시의 제외 폴더·추적 파일·.gitignore 범위, 규칙이 바뀔 때만 이루어지는 재구성, 오류 뒤 재등록·재시도 간격·명시 refresh·종료 정리는 [코드 참조 통합 테스트](../../../packages/workspace/src/code-reference/code-reference.test.ts)에서 확인한다.
  수집과 같은 규칙의 감시 대상 판단은 [정책 테스트](../../../packages/workspace/src/paths/code-file-access.test.ts)에서, 제외 경로가 신호를 보내지 않는 실제 감시는 [인접 테스트](../../../packages/workspace/src/watcher/code-reference-watcher.test.ts)에서 확인한다. 오류 복구 검증은 가짜 감시 연결과 재시도 시각 주입을 쓰며 실제 OS 오류의 재현을 대신하지 않는다.
