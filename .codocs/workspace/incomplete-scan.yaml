id: incomplete-scan
name: '불완전한 탐색'
domains:
  - '작업 공간'
definition: |
  하위 파일 읽기·폴더 열거·링크 확인 실패로 전체 대상의 일부를 관측하지 못한 탐색이다.
  코드의 partial에 대응한다.

  읽은 문서의 YAML 오류나 의도적인 순환 건너뜀만으로 이 상태가 되지는 않는다.

  ## 발생 상황과 원인

  파일 권한 때문에 내용을 읽지 못하거나, 하위 폴더를 열거할 수 없거나, 공유 링크가 깨질 수 있다.
  탐색 중 파일 이동·삭제로 발견한 경로를 읽지 못할 수도 있다.

  이때 확인한 사실은 접근 또는 읽기에 실패했다는 것이다.
  이번에 관측되지 않은 이전 문서가 모두 삭제됐다는 뜻은 아니다.

  ## 탐색 결과의 의미

  전체 대상 탐색이 완료되면 읽은 내용에 YAML 오류가 있어도 탐색 자체는 완료다.
  이를 complete로 표현한다.

  일부 하위 범위를 읽지 못했으나 나머지를 탐색했으면 코드의 partial로 표현한다.

  선택 루트가 잘못됐거나 .codocs 자체를 확인·탐색하지 못하면 failed다.
  빈 프로젝트로 돌려주지 않는다.

  ## 경계

  읽은 YAML의 문법 오류는 [[YAML 파싱]], 필수 속성 오류는 [[문서 검증]]이 다룬다.
  순환 링크 건너뜀은 [[문서 탐색]]이 다룬다.
