id: document-discovery
name: '문서 탐색'
domains:
  - '작업 공간'
definition: |
  선택한 프로젝트의 문서 파일을 발견 경로별로 읽고 관측 결과와 실패 범위를 전달하는 처리다.
  탐색 기준 디렉터리는 [[프로젝트 루트]], 링크로 연결된 파일의 허용 범위는 [[파일 접근 범위]]에서 확인한다.

  ## 탐색과 순환

  지식 폴더 아래 .yaml·.yml 파일을 [[발견 경로]]별로 읽는다.
  다른 가지에서 같은 공유 폴더를 방문해도 각각 탐색한다.
  현재 탐색 가지의 조상으로 되돌아가는 링크만 건너뛰어 무한 순환을 막는다.

  경로 동일성은 OS 이름만으로 소문자화하거나 파일 시스템 규칙을 추정하지 않고 실제 동작으로 확인한다.
  복사본과 링크 별칭을 별도 중복 유형으로 분류하지 않는다.
  여러 프로젝트가 원본 하나를 공유한다는 사실은 프로젝트 내부의 중복을 뜻하지 않는다.

  ## 관측과 후속 처리

  읽은 원문·발견 경로·확인한 실제 경로를 보존하고 읽지 못한 원문·ID·실경로를 추측하지 않는다.
  하위 접근 실패는 해당 경로와 실제 원인을 기록하며 원인에 따른 확인 방법은 [[불완전한 탐색]]에서 확인한다.
  루트 부재·접근 실패·YAML 오류·순환 건너뜀의 결과 분류는 [[탐색 상태]]에서 정의한다.

  탐색 결과를 색인에 반영할 때는 [[불완전한 탐색에서 색인과 연결을 유지하는 절차]]로 이전 관측과 연결한다.
  이 절차가 관측되지 않은 이전 경로의 보존·제거 여부를 판단한다.
