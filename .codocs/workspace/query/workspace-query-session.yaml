id: workspace-query-session
name: '작업 공간 조회 세션'
domains:
  - '작업 공간'
definition: |
  하나의 [[프로젝트 루트]]에서 문서 목록·상세를 조회할 때 색인·원문 버전·페이지 연속성을 함께 유지하는 책임이다.
  도구 입력과 응답 필드는 [[조회]], 목록·상세 계산은 [[조회 투영]]에서 정의한다.

  ## 조회에 사용하는 관측

  [[작업 공간 색인 구성]]의 색인과 같은 관측의 [[원문 버전]]을 사용한다.
  프로젝트마다 관측을 구분하고 다른 프로젝트의 자료를 섞지 않는다.
  확인한 값과 이전에 읽은 값을 구분해 [[미확인 문서]]의 원문·버전을 최신 확인값으로 오해하지 않게 한다.
  파일 변화와 전체 재구성의 반영 시점은 [[색인 갱신]]에서 정의한다.

  ## 코드 매칭 연결

  코드 매칭 요청은 열린 문서의 전체 텍스트와 세션이 보유한 같은 프로젝트의 색인 snapshot을 사용하며, 다른 프로젝트의 문서와 섞지 않는다.
  코어가 반환한 모든 후보·근거·범위를 전달하고, 매칭 없음과 색인 미확인·감시 실패를 구분한다.
  요청마다 색인을 새로 읽지 않고 현재 관측의 상태·실패·확인 범위를 매칭 결과와 함께 전달한다.
  색인 갱신 중에는 최신 완료 snapshot과 갱신 상태를 구분하고, 감시 실패를 매칭 없음으로 확정하지 않는다.
  매칭 결과의 최신성 식별자는 목록 커서의 generation과 별도로 관리한다.
  매칭 후보의 내용을 조회할 때는 후보 발견 경로 목록과 매칭 응답의 catalogVersion을 함께 받는다.
  같은 catalogVersion의 snapshot에서 내용·진단·직접/역참조 경로·원문 revision을 반환하며, 버전이 다르면 최신 결과처럼 합치지 않고 불일치로 거부한다.
  확인한 프로젝트의 발견 경로에는 편집기가 열 수 있는 file URI를 연결한다.
  원문 revision과 코어가 확인한 UTF-16 offset·줄 좌표는 같은 snapshot의 관측 근거이며, 확인하지 못한 경로에는 URI나 좌표를 만들지 않는다.

  ## 편집 중 참조와 완료 알림

  열린 YAML의 출처 경로·전체 원문·문서 버전을 받아 최신 완료 관측의 대상과 연결한다. 문서 버전·catalogVersion·등장·진단·대상 내용·revision은 한 결과로 전달한다.
  같은 출처의 새 요청·닫기·취소가 이전 비동기 요청을 무효화한다. 같은 문서 버전의 다른 원문이나 뒤늦은 이전 버전은 적용하지 않는다.
  출처를 닫으면 진행 중 결과와 해당 출처의 선택 근거를 해제한다. 세션 종료 후에는 관측을 게시하거나 구독자에게 알리지 않는다.
  완료 관측 알림은 게시 이후에 전달하며 구독 해제 함수를 제공한다. partial·failed도 상태 변화로 알리고 부재나 유일성을 뜻하는 성공으로 바꾸지 않는다.
  구독자 오류는 기록하며 다른 구독자와 게시된 관측에 영향을 주지 않는다.

  ## 선택 후보의 최신 확인

  선택할 때 원래 이름·도메인 참조 또는 코드 매칭 원문과 명시적으로 선택한 발견 경로·문서 식별 정보를 세션에 보관한다.
  이름 참조의 본문은 단일 확정 연결만 선택한다. Hover에서 명시한 개별 후보는 모호한 참조나 전체 partial 관측에서도 후보 자체가 확인되었으면 선택할 수 있다. 이를 전체 검색의 유일성·부재 증명으로 해석하지 않는다.
  코드 매칭은 명시된 후보와 그 후보의 직접·역참조 출처를 보존하고 최신 조회에서도 해당 관계를 다시 확인한다. 서로 다른 의미의 조회를 섞지 않는다.
  원문 열기 직전에는 진행 중 갱신을 기다리고 최신 완료 관측에서 원래 조회를 다시 수행한다.
  같은 경로의 내용 변경은 관측한 파일 객체의 연속성과 이름·소속·식별 정보가 유지되면 최신 내용·revision으로 반환한다. ID 오류만으로 이 연속성을 거부하지 않는다. 경로 존재나 revision만으로 동일성을 확정하지 않는다.
  경로 이동은 파일 객체의 연속성에 더해 선택 당시와 최신 완료 관측 모두에서 동일한 유효·유일 현재 ID와 이름·소속을 확인해야 연결한다. 전체 partial 관측에서는 이동의 유일성을 추측하지 않는다. 이동 증명이 부족하면 열지 않는다.
  삭제·다른 문서의 옛 경로 재사용·개별 미확인·실패·취소·해제된 선택은 열기 후보를 반환하지 않는다. 단일 본문 연결이 새로 모호해지면 거부하고 명시 후보 선택은 원래 후보를 유지한다.
  최신 관측의 대상 파일 바이트도 개별 확인하며 관측 이후 파일이나 색인이 변경됐다면 결과를 적용하지 않는다. 요청별 전체 탐색은 수행하지 않는다.
  파일 확인 중 관측이 교체되면 낡은 결과를 버리고 최신 완료 관측에서 제한된 횟수로 다시 확인한다. 클릭 전체 대기에도 제한을 두며 취소·닫기·출처 무효화는 즉시 중단한다. 이 제한은 공유 초기화·refresh 완료 정책을 바꾸거나 취소하지 않는다.
  live 출처의 원문이 바뀌거나 닫히면 기존 참조 선택은 무효화한다. 표시를 종료한 선택은 명시적으로 해제하고 세션 종료 시 모두 해제한다.
  이 확인은 영구 문서 동일성 추적이나 파일 수정·저장·재로드가 아니다. 반환 이후 호스트의 실제 열기와 문서 버전 적용은 소비 계층이 보호한다.

  ## 목록과 상세 연결

  목록은 [[조회 투영]]의 결과를 [[목록 페이지 조회]]로 나누며, 다음 페이지의 연속성은 [[조회 커서]]로 판단한다.
  상세는 요청한 현재 ID의 문서와 읽기 시점 버전을 연결한다.
  경로 상세는 현재 ID 상세를 대체하지 않으며 ID 오류 때문에 코드 매칭 후보의 경로를 버리거나 ID로 다시 선택하지 않는다.
  [[탐색 상태]]에 따른 요청 실패·미확인·부재의 응답 의미는 [[도구 결과]]에서 정의한다.
  일부만 확인한 관측에서 색인 밖 ID를 전체 프로젝트의 부재로 확정하지 않는다.

  ## 재구성과 세션 수명

  명시적 refresh의 재구성 결과는 [[색인 갱신]]에 따라 반영하고 이전 커서의 연속성을 판단한다.
  최초 동시 조회는 보정과 게시까지 같은 초기화 완료를 기다린다. 일반 파일 보정 중에는 이전 게시 결과를 읽고, 작업 관측을 중간 조회 결과로 노출하지 않는다.
  종료 뒤 늦은 읽기가 완료돼도 게시 버전과 감시 자원을 만들지 않는다.
  목록의 partial 미확인 항목 진단과 전체 재구성 중 `index_not_ready` 실패는 세션의 공통 결과에서 만든다. 전송 계층은 이를 다시 분류하지 않는다.
  validate는 같은 complete 색인의 전체 또는 단일 발견 경로 진단을 사용한다. 경로를 지정하면 실제 일반 YAML 파일 접근을 확인하고 해당 경로가 색인에 없으면 준비 중으로 반환한다. 경로 확인 동안 색인·refresh·감시 상태가 바뀌면 이전 관측의 진단을 반환하지 않는다.
  세션의 조회 결과가 있다는 사실은 실제 파일 저장이나 감시 연결의 성공을 대신하지 않는다.
  write는 최초 관측과 complete·감시·수동 refresh 준비 상태를 확인한 뒤 [[저장]]의 단일 파일 반영을 호출한다. 실패와 무변경은 색인 재관측 없이 반환한다. 저장됐으면 같은 세션에서 저장 경로의 캐시 세대를 무효화하고 해당 원문 버전이 게시됐는지 확인한다.
  첫 게시 실패에만 저장 경로를 추가 한 번 재관측한다. 후속 watcher 배치를 포함한 게시 완료를 확인하며 경과 시간만으로 실패 처리하지 않는다. 닫힌 세션의 결과는 게시하지 않고 이미 저장한 파일은 다시 쓰지 않는다.

  명시적 IDE 성능 관측은 실제 동기화 시작과 원자적 #publish 경계에서 발생한다. 최초 완료 색인은 complete 게시와 모든 관련 감시 준비를 함께 확인하며, partial·failed 게시를 성공 완료로 바꾸지 않는다. 관측은 조회·refresh·파일 읽기를 시작하지 않는다.

  ## 코드와 검증 위치

  대표 자료형 WorkspaceQuerySession의 write·references·onDidChangeSnapshot·captureCandidate·confirmCandidate·releaseCandidate·closeDocument와 createWorkspaceQuerySession은 [담당 구현](../../../packages/workspace/src/query/index.ts)에서 확인한다.
  관련 계약의 사례는 [인접 테스트](../../../packages/workspace/src/query/query.test.ts)에서 확인한다.
