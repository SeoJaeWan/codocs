id: list-pagination
name: '목록 페이지 조회'
domains:
  - '작업 공간'
definition: |
  목록 요청의 필터와 선택적인 [[조회 커서]]를 받아 현재 목록에서 이어 읽을 페이지를 결정한다.
  [[조회 투영]]으로 계산한 목록을 바탕으로 페이지와 다음 커서를 반환하거나 잘못된 입력·만료를 안내한다.
  외부 입력 필드와 페이지 크기·응답 필드는 [[조회]]에서 정의한다.

  ## 요청과 커서 확인

  커서가 없으면 요청 필터로 첫 페이지를 만든다. 커서만 있으면 토큰에 담긴 필터를 사용한다.
  커서와 필터를 함께 받으면 기존 필터와 같은지 검사하고 다르면 입력 오류로 거부한다.
  서명·프로세스·목록 fingerprint·refresh 세대를 확인한 뒤 해당 목록의 다음 페이지를 계산한다.

  ## 목록 변경과 만료

  추가·삭제·ID 순서·표시 값·필터 포함 여부·오류와 충돌 표시가 바뀌면 이전 커서를 만료로 판단한다.
  본문만 바뀌고 목록 결과가 같으면 커서를 유지한다.
  별도 TTL은 두지 않지만 서버 재시작 뒤에는 이전 프로세스의 커서를 받아들이지 않는다.
  재구성에 따른 세대 변경은 [[색인 갱신]]에서 수행한다.

  만료된 토큰에는 cursor_expired를 반환하고 커서 없이 첫 페이지를 다시 요청하도록 안내한다.
  첫 페이지로 자동 대체하지 않는다.

  ## 코드와 검증 위치

  페이지와 커서의 판단는 [담당 구현](../../../packages/workspace/src/query/index.ts)에서 확인한다.
  관련 계약의 사례는 [인접 테스트](../../../packages/workspace/src/query/query.test.ts)에서 확인한다.
