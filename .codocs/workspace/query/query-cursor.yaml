id: query-cursor
name: '조회 커서'
domains:
  - '작업 공간'
definition: |
  동일한 필터와 목록 결과에서 다음 페이지를 이어 읽기 위한 불투명 토큰이다.
  파일 내용의 동일성을 나타내는 [[원문 버전]]과 달리 목록 조회의 연속성을 나타낸다.

  ## 담고 있는 정보

  domain·kind·status 필터, 목록 투영의 fingerprint와 refresh 세대에 연결된다.
  프로세스 비밀키로 서명한 자체 포함 토큰이며 발급된 커서를 서버 메모리에 계속 쌓는 방식이 아니다.
  사용자는 내부 값을 해석하거나 수정하지 않고 반환된 토큰을 다음 목록 요청에 전달한다.

  문서 본문만 바뀌어 목록 투영의 항목·순서·포함 여부가 그대로라면 최신 색인을 다시 게시해도 cursor 세대는 유지한다.
  이는 본문 색인 갱신을 생략하거나 이전 상세 결과를 다시 보내는 의미가 아니다.
  다음 get 요청은 색인 갱신이 끝난 뒤 최신 문서 결과를 읽으며, get은 이전 응답을 자동으로 push하는 구독 API가 아니다.
  목록 투영이나 필터 결과가 바뀌면 본문 변경과 함께 새 cursor를 발급하고 이전 cursor는 만료한다.

  목록 요청에서 토큰을 확인하고 다음 페이지를 반환하는 과정은 [[목록 페이지 조회]]에서 설명한다.

  ## 코드와 검증 위치

  커서 발급·확인과 세션 연결은 [담당 구현](../../../packages/workspace/src/query/index.ts)에서 확인한다.
  관련 계약의 사례는 [인접 테스트](../../../packages/workspace/src/query/query.test.ts)에서 확인한다.
