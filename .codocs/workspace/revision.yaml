id: revision
name: '원문 버전'
domains:
  - '작업 공간'
definition: |
  읽은 파일 전체 바이트의 SHA-256로 계산할 불투명 문자열이다.
  문서 속성이나 편집 이력 번호가 아니다.

  주석·공백·줄바꿈 변경도 감지하고 같은 바이트는 같은 값을 갖는다.
  저장 직전 재확인해 오래된 수정안을 막는 [[저장]] 계약의 개념이며 아직 구현되지 않았다.

  ## 조회와 비교 시점

  [[조회]]의 get은 읽은 원문과 같은 시점의 값을 반환하고 [[저장]]의 update는 그 값을 받는다.
  저장 직전 실제 디스크 바이트에서 다시 계산하며 오래된 색인만 믿지 않는다.

  생성·수정 성공 후 새 값을 반환한다.
  같은 바이트는 재시작 후에도 같은 값이며 편집 이력의 모든 사건을 기록하지 않는다.

  해시 비교만으로 비교와 반영 사이의 외부 편집 경쟁을 완전히 막지는 못한다.
