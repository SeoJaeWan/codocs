id: revision
name: '원문 버전'
domains:
  - '작업 공간'
definition: |
  읽은 파일 전체 바이트의 SHA-256로 계산한 불투명 문자열이다.
  문서 속성이나 편집 이력 번호가 아니다.

  주석·공백·줄바꿈 변경도 감지한다. 같은 바이트는 재시작 후에도 같은 값이며 편집 이력의 모든 사건을 기록하지 않는다.

  ## 사용 범위

  원문을 읽었을 때의 바이트에 대응하는 값이며 최신 디스크 내용의 확인을 대신하지 않는다.
  해시 값 자체가 동시 수정의 잠금이나 파일 반영을 보장하지는 않는다.
  읽은 결과의 버전 전달은 [[조회]], 수정 직전 비교와 충돌 처리는 [[저장]]에서 확인한다.
