id: load-workspace
name: '문서 탐색'
domains:
  - '작업 공간'
deprecatedAliases:
  - id: document-discovery
definition: |
  폴더 열거 뒤 항목의 lstat에서 직접 확인한 부재는 삭제 관측으로 구분한다.
  원문 읽기의 ENOENT는 부재로 바꾸지 않는다.

  선택한 프로젝트의 문서 파일을 [[발견 경로]]별로 읽고 관측 결과와 실패 범위를 전달하는 처리다.
  탐색 기준 디렉터리는 [[프로젝트 루트]], 일반 파일·폴더의 허용 범위는 [[파일 접근 범위]]에서 확인한다.

  ## 탐색과 미지원 연결

  지식 폴더 아래 .yaml·.yml 파일을 [[발견 경로]]별로 읽는다.
  심볼릭 링크·정션을 만나면 내부 대상을 포함해 따라가지 않고 해당 항목을 문서 탐색에서 제외한다.
  발견한 미지원 연결은 진단으로 알리되, 지원 대상의 탐색을 계속한다.

  경로 동일성은 OS 이름만으로 소문자화하거나 파일 시스템 규칙을 추정하지 않고 실제 동작으로 확인한다.
  복사본과 일반 파일 경로의 중복은 문서 ID·이름의 기존 기준으로 판단한다.

  ## 경로별 재확인

  [[색인 갱신]]에서 변경된 경로의 재확인을 요청하면 같은 프로젝트의 해당 파일이나 영향을 받은 하위 트리를 탐색한다.
  한 경로만 확인한 결과를 프로젝트 전체의 완전한 탐색 결과로 취급하지 않는다. 확인한 범위·관측·부재·실패를 구분해 진행 중인 전체 탐색 결과에 연결할 수 있어야 한다.
  경로 재확인에도 기존 접근 허용·실제 대상 확인·발견 경로·미지원 연결 제외 기준을 적용한다.

  loadWorkspacePath는 확인한 coverage·시작 generation·outcome과 documents·observations·absent·failures를 반환한다.
  전체 상태인 status는 제공하지 않으므로 이 결과를 전체 WorkspaceScanResult 대신 색인에 전달하지 않는다.
  부재는 해당 경로의 lstat로 확인한 결과이며, 존재하는 미지원 연결이나 읽기·열거 실패는 부재로 바꾸지 않는다.
  지정 경로의 조상은 접근 판정에 필요한 확인만 수행하고 형제 폴더를 열거하거나 읽지 않는다.

  ## 관측 재사용과 읽기 세대

  WorkspaceObservationCache는 감시가 연결된 한 프로젝트의 진행 중 전체 탐색과 경로별 재확인에서 공유한다.
  발견 경로별로 원문·원문 버전·파싱 모델·진단을 같은 관측에 보존한다.
  파일 접근 경로·대상·읽기 권한은 캐시 사용 전 다시 확인한다. 확인한 실대상이 바뀌면 이전 캐시와 읽기 세대를 무효화한다.
  파일 내용의 변경 여부를 캐시 자체가 감지하는 것은 아니다. 호출자는 변경 신호마다 invalidate에 해당 논리 경로를 전달해야 한다.
  부모 폴더 교체를 무효화하면 그 하위의 관측도 만료한다. 수동 전체 refresh는 새 캐시나 지식 루트 전체 무효화를 사용한다.

  observations는 원문을 읽기 시작한 generation을 함께 반환한다. 같은 경로·대상·세대의 진행 중 읽기와 완료한 파싱은 공유한다.
  읽는 중 무효화된 관측은 반환할 수 있지만 캐시에는 채택하지 않으며 isCurrent로 게시 가능 여부를 확인한다.
  isScopeCurrent는 범위 확인 시작 generation 뒤 조상이나 자손이 무효화됐는지 검사해 오래된 열거·부재의 적용을 막는다.
  전체 탐색의 나머지 순회를 계속하면서 같은 캐시로 경로 보정을 시작할 수 있다. 전체 순회와 보정의 조합·실패 보존·최종 게시 시점은 [[색인 갱신]]에서 담당한다.

  ## 관측과 후속 처리

  읽은 원문·발견 경로·확인한 실제 경로를 보존하고 읽지 못한 원문·ID·실경로를 추측하지 않는다.
  하위 접근 실패는 해당 경로와 실제 원인을 기록하며 원인에 따른 확인 방법은 [[불완전한 탐색]]에서 확인한다.
  탐색 결과의 complete·partial·failed 분류는 [[탐색 상태]]에서 정의한다.

  읽은 바이트의 버전과 UTF-8 해석은 [[원문 버전]], 해석된 문서의 구조와 속성은 [[YAML 파싱]]과 [[문서 검증]]에서 확인한다.
  탐색 결과는 [[작업 공간 색인 구성]]에 전달한다. 이전 경로의 보존·제거 기준은 [[불완전한 탐색에서 색인과 연결을 유지하는 절차]]에서 정의한다.

  ## 코드와 검증 위치

  대표 함수 loadWorkspace와 관측 결과는 [담당 구현](../../../packages/workspace/src/loader/index.ts)에서 확인한다.
  관련 계약의 사례는 [인접 테스트](../../../packages/workspace/src/loader/loader.test.ts)에서 확인한다.
