id: incomplete-scan
name: '불완전한 탐색'
domains:
  - '작업 공간'
definition: |
  [[탐색 상태]]가 partial이 된 경우 접근 실패의 원인과 재확인 방법을 설명한다.
  전체 상태의 분류 기준은 탐색 상태 문서에서 확인한다.

  ## 실패 원인과 확인

  파일 권한 때문에 내용을 읽지 못하거나 하위 폴더를 열거할 수 없고, 공유 링크가 깨질 수 있다.
  탐색 중 파일 이동·삭제로 발견한 경로를 읽지 못할 수도 있다.
  확인한 사실은 접근 또는 읽기 실패이므로 원인을 추측해서 확정하지 않는다.

  실패 경로와 [[작업 공간 진단]]을 읽고 권한·링크 대상·파일 이동 여부를 확인한 뒤 다시 탐색한다.
  YAML 내용의 오류는 [[YAML 파싱]]과 [[문서 검증]]에서 고치며 파일 접근 실패와 구분한다.
  재탐색 전 이전 관측을 어떻게 다루는지는 [[불완전한 탐색에서 색인과 연결을 유지하는 절차]]에서 확인한다.

  ## 코드와 검증 위치

  하위 접근 실패와 실패 범위는 [담당 구현](../../../packages/workspace/src/loader/index.ts)에서 확인한다.
  관련 계약의 사례는 [인접 테스트](../../../packages/workspace/src/loader/loader.test.ts)에서 확인한다.
