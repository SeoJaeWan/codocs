id: workspace-diagnostic
name: '작업 공간 진단'
domains:
  - '작업 공간'
definition: |
  프로젝트 선택·경로 확인·파일 읽기에서 확인한 실패 원인을 전달하는 [[진단]]이다.
  YAML 내용의 오류와 파일에 접근하지 못한 상황을 구분하여 사용자가 확인할 경로와 원인을 제공한다.

  ## 확인한 원인의 보존

  공통 code·severity·message와 확인한 경로를 제공한다.
  실제 시스템 오류 코드가 확인되면 ioCode로 함께 보존하고, 모르는 코드나 YAML 원문 좌표는 만들지 않는다.
  저장 진단은 확인된 프로젝트 상대 경로와 ioCode·suggestion을 함께 제공한다. 이미 저장된 뒤 임시 정리만 실패한 경우도 진단과 saved:true를 함께 읽어야 한다.
  권한·이동 등의 IO 원인은 실제 관측을 바탕으로 설명하며 추측으로 확정하지 않는다.
  심볼릭 링크·정션을 확인했을 때는 대상 부재나 일반 IO 실패로 바꾸지 않고 미지원 연결임을 알린다.
  탐색 중 제외한 하위 연결은 경고로, 요청한 접근 경로나 탐색 루트의 미지원 연결은 오류로 구분한다.

  ## 후속 판단

  진단 코드만으로 전체 탐색 상태나 문서 부재를 결정하지 않는다.
  [[탐색 상태]]는 지원 대상의 관측 범위로 complete·partial·failed를 구분하며, 제외한 연결과 내용 오류도 이 기준으로 해석한다.
  접근 실패 후 조치는 [[불완전한 탐색]], 허용된 경로의 경계는 [[파일 접근 범위]]에서 확인한다.

  ## 코드와 검증 위치

  WorkspaceDiagnostic과 createWorkspaceDiagnostic는 [담당 구현](../../../packages/workspace/src/diagnostics/index.ts)에서 확인한다.
  관련 계약의 사례는 [인접 테스트](../../../packages/workspace/src/loader/loader.test.ts)에서 확인한다.
