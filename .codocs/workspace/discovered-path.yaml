id: discovered-path
name: '발견 경로'
domains:
  - '작업 공간'
definition: |
  [[문서 탐색]] 과정에서 접근한 프로젝트 상대 경로다.
  외부 링크를 통해 읽은 파일도 프로젝트 안에서 발견한 접근 경로로 표현한다.

  ## 다른 식별 정보와의 구분

  실제 대상 경로는 링크 해석 후 도달한 위치이고, 발견 경로는 그 대상에 접근한 경로다.
  하나의 실제 대상에 여러 발견 경로로 접근할 수 있다.

  문서 ID와 실제 경로를 대신하는 값이 아니라 관측한 접근 위치를 나타낸다.
