id: name-similarity
name: '이름 일치 후보 안내'
domains:
  - '작업 공간'
definition: |
  저장한 문서의 이름을 다른 문서의 이름과 비교해 일치 후보와 근거를 안내한다.
  저장 결과와 변경된 이름·도메인을 받아 아래 조건에 따라 검사하고 후보 요약 또는 검사 생략·실패 정보를 반환한다.
  독자가 원문을 비교하도록 돕는 기능이며 의미 중복을 자동 판정하거나 문서를 합치지 않는다.

  ## 검사할 변경

  생성 또는 문서용 이름·도메인 변경 시 검사한다.
  본문·예문·상태만 변경하면 생략하며 이전 코드 ID 목록만 바뀐 것도 문서용 이름 변경으로 보지 않는다.

  문서용 이름의 원문 일치와 공백·영문 대소문자를 정리한 일치를 비교한다.
  이전 ID 목록·본문 의미·ID 철자·같은 도메인만으로 후보를 만들지 않으며 자기 자신은 제외한다.
  코드와 현재·이전 ID를 비교하는 [[코드 식별자 매칭]]의 결과를 이 비교에 대신 사용하지 않는다.

  문서 이름에 영어 단수화를 적용할지는 확정되지 않았다.
  코드 ID 매칭의 단수화 규칙을 문서 이름 비교에 자동 적용하지 않는다.

  ## 후보 정렬과 응답

  원문 일치 → 정규화 일치 순으로, 같은 수준에서는 같은 도메인 → ID 순으로 정렬한다.
  공통 도메인이 하나 이상이면 같은 도메인 순위로 본다.
  한 문서에서 여러 값이 일치해도 후보 문서 하나로 센다.

  | 검사 결과 | 반환 필드 |
  | --- | --- |
  | 완료 | similarityChecked:true, 전체 후보 수 similarCount, 최대 3개의 similarDocuments |
  | 완료했지만 후보 없음 | similarityChecked:true, similarCount:0, 빈 similarDocuments |
  | 검사 생략 | similarityChecked:false, 후보 수와 목록 필드 생략 |
  | 검사 실패 | similarityChecked:false, 후보 수와 목록 필드 생략, warnings에 similarity_check_failed·severity:warning·실패 설명 |

  후보에는 ID·문서용 이름·소속과 어떤 속성의 어떤 값이 일치했는지 포함한다.
  본문은 반환하지 않으며 필요한 원문은 [[조회]]로 추가 확인한다.
  후보 없음은 의미 중복이 없다는 보장이 아니다.

  ## 저장과의 관계

  후보나 검사 실패 때문에 저장을 차단하거나 재확인을 강제하지 않는다.
  이미 저장한 파일을 되돌리거나 같은 write 반복을 요구하지 않는다.
  검사만 자동 재시도하지 않는다. 실제 파일 반영 결과는 [[저장]]에서 정의한다.
