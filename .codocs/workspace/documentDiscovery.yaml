id: document-discovery
name: '문서 탐색'
domains:
  - '작업 공간'
definition: |
  선택한 프로젝트에서 읽을 문서 경로와 원문을 확인하는 영역이다.
  접근 실패와 실제 삭제를 구별하고 관측한 범위를 전달한다.

  ## 프로젝트 선택

  명시한 프로젝트 또는 시작 디렉터리를 루트로 사용한다.
  상위 Git·.codocs를 찾아 작업 대상을 바꾸지 않는다.

  유효한 루트에 .codocs가 없으면 정상 빈 프로젝트다.
  루트나 .codocs 자체에 접근할 수 없으면 탐색 실패다.

  ## 공유 지식의 접근 범위

  사용자가 .codocs에 파일·폴더 링크나 정션을 두면 연결 대상을 읽기·쓰기 범위에 편입한다.
  프로젝트 밖이라는 이유로 제외하지 않는다.

  파일 링크는 그 파일만, 폴더 링크는 그 하위만 허용한다.
  링크 하나가 외부 부모·형제 파일의 권한까지 부여하지 않는다.

  임의 외부 경로와 연결 루트를 벗어나는 이동은 거부한다.

  연결 범위의 쓰기 허용은 OS 권한이나 저장 성공을 보장하지 않는다.
  링크 경유 저장은 실제 대상에 반영하고 링크를 유지해야 한다.

  ## 탐색과 순환

  하위 .yaml·.yml을 [[발견 경로]]별로 읽는다.
  다른 가지에서 같은 공유 폴더를 방문해도 각각 탐색한다.

  현재 탐색 가지의 조상으로 되돌아가는 링크만 건너뛰어 무한 순환을 막는다.
  의도적인 순환 건너뜀은 접근 실패와 구분한다.

  일부 경로의 접근·읽기 실패는 [[불완전한 탐색]]의 발생 조건으로 분류하고 경로와 실제 원인을 남긴다.
  읽지 못한 원문·ID·실경로를 추측하지 않는다.

  탐색하지 못한 범위의 이전 기록 처리는 [[불완전한 탐색에서 색인과 연결을 유지하는 절차]]에서 설명한다.

  ## 구현 경계

  프로젝트 선택·문서 탐색·접근 범위 판정은 구현되어 있다.
  CLI의 --project 연결과 실제 쓰기·watcher는 후속 계약이다.

  ## 루트와 발견 경로

  예정된 CLI는 --project 생략 시 실행 시점 cwd를 사용하고 상대 인자는 그 cwd 기준으로 해석한다.
  시작 후 루트를 고정하며 도구마다 project를 바꾸거나 한 프로세스에 여러 프로젝트 색인을 두지 않는다.

  외부 링크 대상의 source.path도 .codocs 아래에서 발견한 접근 경로에 대응한다.
  여러 프로젝트가 원본 하나를 공유하는 것 자체는 프로젝트 내부 중복이 아니다.

  복사본과 링크 별칭을 별도 중복 유형으로 나누지 않는다.
  경로 동일성은 OS 이름만으로 소문자화하거나 파일 시스템 규칙을 추정하지 않고 실제 동작으로 검증한다.
