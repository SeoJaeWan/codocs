id: code-reference-index
name: '코드 참조 색인'
domains:
  - '작업 공간'
kind: policy
status: confirmed
definition: |
  현재 프로젝트의 검색 대상 텍스트에서 [[명시적 코드 참조]]를 수집하고 문서에서 코드로 돌아갈 연결과 그 최신성을 유지하는 책임이다.
  .codocs 문서 사이의 [[문서 색인]] 연결과 별도로 관리하며 코드 식별자 자동 매칭 결과를 역참조로 합치지 않는다.
  IDE와 MCP는 같은 검색 범위와 표기 해석을 사용하되 각 프로세스가 실제 관측한 원문을 구분한다.

  ## 검색 대상과 경계

  선택한 [[프로젝트 루트]]의 텍스트만 수집한다. 열지 않은 파일도 포함하며 언어·확장자 허용 목록으로 제한하지 않는다.
  Git 추적 텍스트 파일은 .gitignore와 일치하더라도 포함한다. 미추적 파일은 해당 프로젝트의 .gitignore에서 제외하지 않은 텍스트만 포함한다.
  하위 디렉터리의 .gitignore와 재포함 규칙을 적용한다. node_modules·dist 같은 이름만으로 별도 고정 제외 규칙을 만들지 않는다.
  .git 내부와 바이너리는 제외하며 확장자를 판별 근거로 사용하지 않는다.
  Git 저장소가 아닌 프로젝트에서는 모든 파일을 미추적 파일로 보고 선택한 프로젝트의 .gitignore와 하위 .gitignore·재포함 규칙을 적용한다.

  ## 파일 원문과 인코딩

  디스크의 코드 원문은 [[원문 버전]]에서 사용하는 기존 .codocs 읽기와 동일하게 UTF-8로 해석한다. 이 검색을 위해 UTF-16 파일 해석이나 별도 인코딩 자동 판별을 추가하지 않는다.
  열린 코드 파일의 편집 관측은 VS Code가 제공하는 텍스트를 사용하며 Codocs가 그 버퍼의 파일 인코딩을 다시 판별하지 않는다.
  [[문서 동기화]]의 UTF-16 위치 계산은 해석된 문자열의 좌표 기준이다. 디스크 파일의 UTF-16 인코딩 지원과 구분하며 기존 좌표 기준을 유지한다.
  원본 바이트에 NUL이 있거나 UTF-8로 손실 없이 해석할 수 없으면 바이너리로 제외한다. BOM이 있는 UTF-8은 같은 원문으로 유지하며 인코딩을 추측하지 않는다.

  이 검색은 .codocs YAML을 찾는 [[문서 탐색]]과 다른 범위다. 지식 문서의 읽기·쓰기 경계를 일반 코드 읽기의 .codocs 제한으로 재사용하지 않는다.
  기존 프로젝트 소유권과 심볼릭 링크·정션을 따라가지 않는 접근 기준은 유지하며 프로젝트 밖 파일을 대신 읽지 않는다.
  정책상 제외한 파일은 읽기 실패가 아니며, IDE에서 제외 파일을 열었다는 이유로 역참조에 포함하지 않는다.

  ## 출현과 관측

  확인한 대상 문서, 문서 전체 또는 행·범위, 코드 경로와 표기 출현 좌표, 원문·편집 버전과 관측 최신성을 보관한다.
  동일 출현의 중복 수집만 제거한다. 구현·테스트의 같은 구간 연결과 같은 파일의 다른 출현은 정상 복수 연결이다.
  동일한 코드 파일의 저장 관측과 열린 버퍼 관측을 두 출현으로 세지 않는다.

  IDE는 검색 대상 코드의 현재 미저장 버퍼로 저장 관측을 대체한다. 표기와 출현 위치의 변경을 반영하고 닫기·변경 취소 뒤 실제 원문 관측으로 돌아간다. 닫기는 원문을 다시 수집하지 않고 보유한 저장 관측으로 돌아가며, 표시 결과가 달라질 때만 새 관측으로 게시한다.
  MCP는 저장 파일만 관측하며 별도 IDE 프로세스의 미저장 버퍼를 읽었다고 간주하지 않는다.
  .codocs 대상 검색에는 마지막 저장 색인을 사용하며 대상의 미저장 변경을 운영 문서 색인에 합치지 않는다.

  ## 갱신과 클릭 검증

  초기 수집과 코드 파일의 추가·수정·이동·삭제, 문서 대상의 이동·삭제·이름·도메인·원문 변경으로 연결을 갱신한다.
  .gitignore가 바뀌면 그 폴더 아래의 대상 파일 집합과 출현을 다시 확인한다. Git index가 바뀌면 추적 목록을 이전 목록과 비교하고, 추적 여부가 달라진 경로 중 ignore 대상인 것만 다시 확인한다. 추적 목록은 ignore 대상인데 추적 중인 파일을 판정할 때만 쓰이기 때문이다.
  변경 경로의 자료만 갱신하고 같은 관측을 재사용한다. 파일 하나의 내용 변경이나 폴더 생성·삭제로 프로젝트 전체를 다시 탐색하지 않으며, 전체 탐색은 초기 수집과 명시 refresh, 코드 감시 오류 뒤 복구에서만 한다. 수집 중에 들어온 변경은 쌓인 경로만 이어서 확인한다. 호버마다 프로젝트 전체를 다시 스캔하지 않는다.
  현재 편집 버전과 맞지 않는 좌표나 오래된 비동기 결과를 최신 연결로 게시하지 않는다.

  표시 후 클릭하면 진행 중이거나 예약된 수집을 기다리지 않고 선택이 보관한 출현 위치로 바로 이동한다. 그 사이 코드가 바뀌어 위치가 어긋날 수 있지만, 클릭마다 수집을 기다리는 비용 대신 사용자가 이전 위치로 돌아가는 방식을 택한다.
  현재 서버가 발급하지 않았거나 무효가 된 선택, 열 수 없는 파일로는 이동하지 않는다. 실제 열린 버퍼 보존과 선택 위치는 [[원문 열기]]에서 정의한다.
  연결 수나 수집 상태가 달라지면 [[IDE 지원]]의 직접 이동·호버 링크·상단 표시를 함께 갱신한다.

  ## 수집 상태

  수집 중·완료·불완전 상태와 현재 확인한 출현 수를 구분한다. 확인한 개수만으로 전체 연결 수·유일성·연결 없음을 확정하지 않는다.
  수집 중에는 확인한 개수와 수집 중 상태를 제공한다. 일부 파일 읽기에 실패하면 실패 상태와 확인한 출현을 보존하고 계속 수집 중인 것처럼 안내하지 않는다.
  완료 후에만 연결 수에 따라 단일 직접 이동 또는 복수 호버 선택으로 전환한다. 불완전한 상태에서 확인한 개별 출현의 이동 링크는 제공할 수 있다.
  전체 수집 실패나 일부 실패를 빈 목록의 수집 완료로 반환하지 않는다.

  코드 감시 연결이 끊겨 다시 연결하는 동안에는 별도 상태 값을 만들지 않고 불완전 상태와 감시 실패 이유를 함께 제공한다. 감시 실패 이유는 자동 재연결이 진행 중이라는 뜻이며, 재연결과 원문 재확인이 끝나면 다른 실패가 없는 한 완료 상태로 돌아간다.
  재연결의 시점·간격과 명시 refresh의 처리는 [[작업 공간 파일 감시]]에서 정의한다.

  이 상태는 .codocs의 [[탐색 상태]]와 별개다. 코드 수집 실패만으로 이미 조건을 충족한 [[저장]]을 추가 차단하거나 완료된 저장을 실패로 바꾸지 않는다.

  ## 관측과 안전한 확인

  IDE 편집 관측은 별도의 버전으로 유지하며 같은 파일의 디스크 출현을 대체한다.
  코드 세대와 저장 문서 색인 세대는 별도로 제공한다. 문서 대상만 바뀌면 코드 바이트를 재수집하지 않고 보유한 표기를 다시 해석한다. 코드 세대는 확인한 표기·출현 위치·수집 상태·실패가 실제로 바뀔 때만 올리며, 결과가 같은 수집이나 같은 내용의 편집 관측 등록은 새 관측으로 게시하지 않는다. 변경 확인이 짧은 기준 시간 안에 끝나면 수집 중 상태를 게시하지 않고 결과가 달라졌을 때만 한 번 게시하며, 그 시간을 넘기면 수집 중 상태를 한 번 게시한다. 확인하는 동안에는 보유한 관측을 그대로 제공한다.
  파일 변경은 해당 경로의 원문 캐시를 무효화하고, 추적 상태·ignore 변경은 영향을 받는 경로의 적격 여부만 다시 확인한다. 원문과 정체·크기·mtime·ctime 관측이 같은 파일은 재사용한다.
  프로젝트 ignore 규칙을 읽지 못하면 그 범위의 미추적 출현을 확인된 연결로 게시하지 않는다. 확인한 Git 추적 파일은 프로젝트 ignore와 관계없이 포함한다.
  클릭 선택은 source 소유 문서와 편집 버전, 정확한 표기 위치, 저장 원문 revision과 양쪽 파일 정체를 보존한다.
  코드·문서 세대가 바뀌었다는 사실만으로 클릭을 거부하지 않는다. 클릭은 수집 완료를 기다리거나 최신 관측으로 다시 확인하지 않으며, 선택이 보관한 출현 위치로 이동한다.
  선택은 출처 문서가 편집·닫혔거나 서버가 다시 시작되면 무효가 되며 무효 선택으로는 이동하지 않는다. 대상 코드가 선택 뒤에 바뀌었는지는 클릭 시점에 다시 확인하지 않는다.
  저장 대상 바이트가 보유 문서 색인과 다른 경우에는 새 클릭 선택을 만들지 않는다. 파일 정체는 장치·inode·생성 시점으로 비교하며 같은 경로와 같은 본문만으로 정체를 대신하지 않는다.

  ## 코드와 검증 위치

  저장·편집 출현과 역참조·확인은 [담당 구현](../../../packages/workspace/src/code-reference/index.ts)에서 확인한다.
  실제 IO·overlay·불완전 상태·감시·클릭의 계약은 [인접 테스트](../../../packages/workspace/src/code-reference/code-reference.test.ts)에서 확인한다.
  프로젝트 전용 적격성은 [코드 파일 읽기](../../../packages/workspace/src/paths/code-file-access.ts)와 [인접 테스트](../../../packages/workspace/src/paths/code-file-access.test.ts)에서 확인한다.
  감시 범위와 규칙 기반 재구성, 감시 오류의 자동 복구 상태는 [인접 테스트](../../../packages/workspace/src/code-reference/code-reference.test.ts)에서 확인한다. 감시 대상 판단과 추적 폴더 집합은 [정책 테스트](../../../packages/workspace/src/paths/code-file-access.test.ts)에서 확인한다.
