id: workspace-change-plan
name: '작업 공간 변경 계획'
domains:
  - '작업 공간'
definition: |
  작업 공간에서 읽은 자료를 [[문서 변경 계획]]에 연결하고, 검증된 후보의 바이트 버전을 계산하는 책임이다.
  생성·수정 요청과 스캔 결과를 바탕으로 후보 계산에 필요한 관측을 준비한다.
  문서 편집·검증 규칙은 [[문서 변경 계획]]에서 정의하고, 여기서는 실제로 읽은 원문과 버전의 대응을 다룬다.

  ## 같은 관측의 자료 연결

  [[문서 탐색]]의 스캔 결과에서 원문·발견 경로·revision·UTF-8 해석 손실 여부를 함께 전달한다.
  후보 계산에 사용하는 색인과 원문은 같은 스캔 관측에 대응해야 한다.
  update의 현재 ID가 색인에서 유일한 경로를 가리키면 스캔 결과의 해당 원문을 선택한다.
  대상을 선택할 수 없을 때 다른 문서를 임의로 고르지 않으며 요청과 대상의 최종 유효성 판단은 [[문서 변경 계획]]에 맡긴다.

  이 단계는 디스크를 다시 읽거나 쓰지 않는다.
  읽기 이후 파일이 바뀌었는지 확인하는 절차는 [[저장]]의 책임이며, 스캔의 원문 버전만으로 저장을 허가하지 않는다.

  ## 후보 버전과 결과

  [[문서 변경 계획]]의 실패·검증된 무변경 결과는 그대로 전달한다.
  변경 후보에는 후보 원문을 UTF-8로 인코딩한 바이트의 revision을 추가한다. 계산 기준은 [[원문 버전]]에서 정의한다.
  수정 후보의 baseRevision은 읽었던 원문의 버전이고, 추가한 revision은 앞으로 반영할 후보 바이트의 버전이다.
  후보 revision이 있다는 사실은 파일 저장 완료를 의미하지 않는다.

  작업 공간 변경 계획의 결과는 저장 여부를 확정하지 않으며 파일과 운영 색인을 변경하지 않는다.
  [[저장]]은 이 결과를 받아 실제 접근 범위·최신 원문과 파일 반영 결과를 확인한다.

  ## 코드와 검증 위치

  대표 함수 planWorkspaceChange와 결과 타입은 [작업 공간 변경 계획 구현](../../../packages/workspace/src/change-plan/index.ts)에서 확인한다.
  스캔 연결·변경 후보·무변경·파일 보존 사례는 [인접 테스트](../../../packages/workspace/src/change-plan/change-plan.test.ts)에서 확인한다.
