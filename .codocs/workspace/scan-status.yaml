id: scan-status
name: '탐색 상태'
domains:
  - '작업 공간'
definition: |
  대상 문서 파일의 범위를 얼마나 확인했는지 나타내는 탐색 결과다.
  문서 내용의 status나 개별 YAML 검증 결과와 구분한다.

  | 값 | 판단 조건 |
  | --- | --- |
  | complete | 확인 대상 범위의 탐색을 완료했다. |
  | partial | 일부 하위 파일·폴더·링크를 확인하지 못했지만 나머지 범위를 탐색했다. |
  | failed | 프로젝트 루트 또는 .codocs 자체를 확인·탐색할 수 없다. |

  유효한 프로젝트에 .codocs가 없는 경우는 빈 프로젝트로 complete다.
  읽은 파일의 YAML 오류와 의도적인 순환 건너뜀만으로 partial이 되지는 않는다.

  partial의 접근 실패 원인과 조치는 [[불완전한 탐색]]에서 확인한다.
  관측 범위에 따른 이전 색인과 후보의 처리는 [[불완전한 탐색에서 색인과 연결을 유지하는 절차]], 외부 요청 결과의 표현은 [[도구 결과]]에서 확인한다.
