id: query-cursor
name: '조회 커서'
domains:
  - '작업 공간'
definition: |
  동일한 필터와 목록 결과에서 다음 페이지를 이어 읽기 위한 불투명 토큰이다.
  파일 내용의 동일성을 나타내는 [[원문 버전]]과 달리 목록 조회의 연속성을 나타낸다.

  ## 담고 있는 정보

  domain·kind·status 필터, 목록 투영의 fingerprint와 refresh 세대에 연결된다.
  프로세스 비밀키로 서명한 자체 포함 토큰이며 발급된 커서를 서버 메모리에 계속 쌓는 방식이 아니다.
  사용자는 내부 값을 해석하거나 수정하지 않고 반환된 토큰을 다음 목록 요청에 전달한다.

  목록 요청에서 토큰을 확인하고 다음 페이지를 반환하는 과정은 [[목록 페이지 조회]]에서 설명한다.
