id: unconfirmed-document
name: '미확인 문서'
domains:
  - '작업 공간'
definition: |
  이번 탐색에서 확인하지 못했지만 이전 관측으로 색인에 남아 있는 문서다.
  confirmation의 unconfirmed는 현재 존재 여부와 최신성을 보장하지 않는다는 뜻이다.
  이번 탐색에서 확인한 문서는 confirmed로 표현하며 문서 내용의 합의 상태인 status와 구분한다.

  ## 보관 정보와 사용

  마지막으로 읽은 원문과 당시 revision을 함께 유지한다. 새 원문이나 버전을 추측하지 않는다.
  소비자는 이 자료를 최신 확인값처럼 사용하지 않고 미확인 진단과 함께 해석한다.
  보존·제거 시점은 [[불완전한 탐색에서 색인과 연결을 유지하는 절차]], 요청 응답에 노출할 조건은 [[도구 결과]]에서 정의한다.
