id: workspace
name: '작업 공간'
domains:
  - '작업 공간'
kind: procedure
status: confirmed
definition: |
  작업 공간은 선택한 프로젝트에서 문서를 읽고 변경을 반영하며 조회 가능한 상태를 유지하는 영역이다.
  문서 탐색부터 안전한 저장과 색인 복구까지 아래 문서를 순서대로 연결한다.

  ## 탐색과 관측

  - [[문서 탐색]]: 프로젝트와 읽을 문서의 범위를 정한다.
  - [[발견 경로]]: 실제 파일에 접근한 경로를 구분한다.
  - [[불완전한 탐색]]: 일부 범위를 확인하지 못한 원인과 상태를 이해한다.
  - [[불완전한 탐색에서 색인과 연결을 유지하는 절차]]: 관측 범위에 따라 기존 기록과 연결을 처리한다.

  ## 수정과 반영

  - [[저장]]: 생성·수정 요청과 원문 보존·반영 결과를 확인한다.
  - [[원문 버전]]: 읽은 시점과 저장 직전의 변경 여부를 비교한다.
  - [[쓰기 조정]]: 여러 프로세스의 반영 순서·대기·잠금·취소를 확인한다.

  ## 갱신과 복구

  - [[색인 갱신]]: 파일 변화 감지와 조회 정보의 재구성을 확인한다.
  - [[저장 후 색인 갱신 실패를 복구하는 절차]]: 파일 반영 후 조회 정보가 갱신되지 않았을 때 복구한다.
