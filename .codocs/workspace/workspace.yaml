id: workspace
name: '작업 공간'
domains:
  - '작업 공간'
kind: procedure
status: confirmed
definition: |
  선택한 프로젝트의 파일·경로·관측·조회·저장을 담당하는 책임 영역이다. 문서 데이터의 해석과 계산은 [[Core]]에 연결한다.

  ## 프로젝트와 접근 경로

  - [[프로젝트 루트]]: 탐색 기준 디렉터리와 상대 경로의 기준을 확인한다.
  - [[작업 공간 경로 확인]]: 접근할 경로의 실제 대상과 확인 결과를 판단한다.
  - [[파일 접근 범위]]: 문서 읽기·쓰기의 허용 경계와 실제 권한을 구분한다.
  - [[발견 경로]]: 문서를 찾은 프로젝트 상대 위치를 확인한다.

  ## 탐색과 색인

  - [[문서 탐색]]: 파일 열거·원문 읽기와 관측 결과를 확인한다.
  - [[탐색 상태]]: complete·partial·failed의 분류 조건을 확인한다.
  - [[불완전한 탐색]]: 접근 실패의 원인과 재탐색 전 조치를 확인한다.
  - [[작업 공간 진단]]: 파일 접근의 원인과 확인한 시스템 오류 정보를 전달한다.
  - [[작업 공간 색인 구성]]: 스캔의 관측·실패 범위를 이전 색인과 연결한다.
  - [[불완전한 탐색에서 색인과 연결을 유지하는 절차]]: 확인 범위에 따라 이전 경로를 보존·제거하고 연결을 판단한다.
  - [[미확인 문서]]: 이전 관측값의 의미와 최신성의 한계를 확인한다.
  - [[작업 공간 파일 감시]]: 변경 경로 신호와 디렉터리 교체·감시 오류 복구의 경계를 확인한다.
  - [[색인 갱신]]: 파일 변화·재구성·준비 상태와 refresh 집계를 확인한다.
  - [[코드 참조 색인]]: 프로젝트 텍스트의 검색 범위·미저장 출현·역참조와 수집 상태를 확인한다.

  ## 조회와 버전

  - [[작업 공간 조회 세션]]: 프로젝트의 색인·원문 버전·페이지 연속성을 함께 유지한다.
  - [[조회 커서]]: 다음 페이지를 이어 읽는 토큰의 의미를 확인한다.
  - [[목록 페이지 조회]]: 필터와 커서로 이어 읽을 페이지 또는 만료를 판단한다.
  - [[원문 버전]]: 읽은 바이트와 저장 직전 원문의 비교 기준을 확인한다.

  ## 본문 검토

  - [[작업 공간 중복 검사]]: 전체·미저장 본문의 비교 관측과 검사 상태를 관리하는 계약 제안을 확인한다.

  ## 변경 계획과 반영

  - [[작업 공간 변경 계획]]: 같은 스캔의 원문·버전을 후보 계산에 연결한다.
  - [[저장]]: 최신 파일 상태를 확인하고 검증된 후보를 반영한다.
  - [[쓰기 조정]]: 안전한 파일 반영 연산과 동시 수정의 보장 범위·한계를 확인한다.
  - [[이름 변경 반영]]: 참조 수정안의 저장 전 확인과 중간 실패 복구를 확인한다.
  - [[저장 후 색인 갱신 실패를 복구하는 절차]]: 파일 반영 뒤 색인 실패를 복구하고 실제 저장 상태를 안내한다.
