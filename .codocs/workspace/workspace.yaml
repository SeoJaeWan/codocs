id: workspace
name: '작업 공간'
domains:
  - '작업 공간'
kind: procedure
status: confirmed
definition: |
  선택한 프로젝트의 실제 파일을 읽고 변경을 반영하며 조회 상태를 유지하는 패키지의 용어와 계약이다. 파싱·검증·참조 계산은 Core에 연결한다.

  ## 용어와 계약

  - [[발견 경로]]: 접근한 경로와 실제 파일 위치의 차이를 확인한다.
  - [[문서 탐색]]: 파일 열거·원문 읽기·순환 처리와 관측 전달 순서를 확인한다.
  - [[파일 접근 범위]]: 외부 링크의 허용 경계와 실제 권한 확인을 구분한다.
  - [[불완전한 탐색]]: 접근 실패의 원인을 찾고 재탐색 전에 필요한 조치를 확인한다.
  - [[색인 갱신]]: 파일 변화·재구성·준비 상태와 refresh의 집계를 확인한다.
  - [[프로젝트 루트]]: 탐색 기준 디렉터리의 선택과 상대 경로 해석을 확인한다.
  - [[조회 커서]]: 다음 페이지를 가리키는 토큰의 의미와 정보를 확인한다.
  - [[목록 페이지 조회]]: 커서와 목록 변화를 확인해 다음 페이지나 만료 결과를 결정한다.
  - [[이름 변경 반영]]: 계산한 변경안을 저장하기 전의 확인과 중간 실패 복구를 확인한다.
  - [[원문 버전]]: 읽은 바이트와 저장 직전 원문의 비교 방법을 확인한다.
  - [[저장 후 색인 갱신 실패를 복구하는 절차]]: 파일 반영 뒤 색인 실패를 복구하고 실제 저장 상태를 안내한다.
  - [[불완전한 탐색에서 색인과 연결을 유지하는 절차]]: 관측 범위에 따라 이전 경로를 보존·제거하고 후보를 판단한다.
  - [[탐색 상태]]: complete·partial·failed의 분류 조건을 확인한다.
  - [[작업 공간 변경 계획]]: 같은 스캔의 원문·버전을 후보 계산에 연결하고 후보 바이트의 버전을 구한다.
  - [[저장]]: 후보를 최신 파일 상태와 대조하고 파일 반영·색인 갱신 결과를 확인한다.
  - [[미확인 문서]]: 이전 관측값의 의미와 최신성의 한계를 확인한다.
  - [[쓰기 조정]]: 파일 반영 연산·잠금·대기·취소와 실패 처리를 확인한다.
