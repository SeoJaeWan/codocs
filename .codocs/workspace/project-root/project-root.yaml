id: project-root
name: '프로젝트 루트'
domains:
  - '작업 공간'
definition: |
  문서를 탐색할 프로젝트의 기준 디렉터리다. 그 아래 .codocs를 지식 폴더로 사용한다.
  문서가 설명하는 주제 분류인 [[도메인]]과는 구분한다.

  ## 선택과 경로 해석

  명시한 프로젝트 또는 시작 디렉터리를 기준으로 선택한다.
  상위 Git·.codocs를 찾아 작업 대상을 바꾸지 않는다.
  상대 프로젝트 경로는 호출 시 기준 작업 디렉터리에서 해석한다.
  선택한 프로젝트 루트 자체가 심볼릭 링크·정션이면 지원하지 않는다. 그 대상을 실제 프로젝트로 자동 선택하지 않는다.
  서버 실행의 --project를 생략하면 실행 시점 cwd를 사용하며 시작 후 선택한 루트를 고정한다.
  한 프로세스에서 요청마다 프로젝트를 바꾸거나 여러 프로젝트 색인을 혼합하지 않는다.

  선택한 루트와 지식 폴더의 존재·접근 결과는 [[탐색 상태]]에서 분류한다.
  루트 아래 문서에 접근할 수 있는 범위와 연결 경로의 미지원 기준은 [[파일 접근 범위]]에서 확인한다.

  ## 코드와 검증 위치

  대표 함수 resolveProjectRoot와 선택 결과는 [담당 구현](../../../packages/workspace/src/project-root/index.ts)에서 확인한다.
  관련 계약의 사례는 [인접 테스트](../../../packages/workspace/src/project-root/project-root.test.ts)에서 확인한다.
