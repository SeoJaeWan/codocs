id: file-access
name: '파일 접근 범위'
domains:
  - '작업 공간'
definition: |
  프로젝트에서 지식 문서를 읽거나 쓸 수 있도록 제품이 허용한 경계다.
  선택한 [[프로젝트 루트]]의 실제 .codocs 디렉터리와 그 아래 일반 파일·폴더만 포함한다.
  프로젝트 안팎을 가리지 않고 심볼릭 링크와 Windows 정션으로 연결한 대상은 지원하지 않는다.
  접근한 프로젝트 상대 위치는 [[발견 경로]]에서 확인한다.
  일반 코드 텍스트의 읽기 범위는 [[코드 참조 색인]]에서 정의하며 이 문서의 .codocs 제한을 그 검색 범위로 확장하지 않는다. 지식 문서의 쓰기 경계는 그대로 유지한다.

  ## 미지원 연결과 권한

  .codocs 자체나 접근 경로의 중간·마지막 항목이 심볼릭 링크 또는 정션이면 대상을 따라 읽거나 쓰지 않는다.
  링크의 실제 대상이 허용된 폴더 안에 있어도 같은 기준을 적용한다.
  링크를 거치지 않은 프로젝트 밖 경로와 .codocs를 벗어나는 이동도 거부한다.

  access.read와 access.write는 제품의 허용 여부이며 OS 권한이나 저장 성공의 보장이 아니다.
  [[작업 공간 경로 확인]]으로 접근할 대상을 확인하며, 실제 읽기·저장 시 경로와 권한을 다시 확인하고 실패 원인을 보존한다.
  발견한 링크를 색인에서 제외하는 처리는 [[문서 탐색]], 파일 반영의 경계는 [[쓰기 조정]]에서 확인한다.

  경로별 재확인도 같은 .codocs 경계에서 시작하며 외부 실경로를 직접 읽기 요청으로 받지 않는다.
  하위 경로의 lstat가 ENOENT이면 부재로 분류하되, 존재하는 링크·정션은 대상의 존재 여부와 관계없이 미지원으로 구분한다.

  ## 코드와 검증 위치

  접근 범위와 허용 여부는 [담당 구현](../../../packages/workspace/src/paths/index.ts)에서 확인한다.
  관련 계약의 사례는 [인접 테스트](../../../packages/workspace/src/paths/paths.test.ts)에서 확인한다.
