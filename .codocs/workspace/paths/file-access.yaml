id: file-access
name: '파일 접근 범위'
domains:
  - '작업 공간'
definition: |
  프로젝트에서 문서를 읽거나 쓸 수 있도록 제품이 허용한 경계다.
  선택한 루트의 .codocs와 그 안의 파일·폴더 링크 및 정션으로 연결한 대상을 포함한다.
  연결 대상이 프로젝트 밖이라는 이유만으로 제외하지 않는다.
  접근한 위치와 실제 대상의 차이는 [[발견 경로]]에서 확인한다.

  ## 링크와 권한

  파일 링크는 해당 파일만, 폴더 링크는 그 하위만 범위에 포함한다.
  링크 하나가 외부 부모·형제 파일의 접근 권한까지 부여하지 않는다.
  임의 외부 경로와 연결 범위를 벗어나는 이동은 거부한다.

  access.read와 access.write는 제품의 허용 여부이며 OS 권한이나 저장 성공의 보장이 아니다.
  [[작업 공간 경로 확인]]으로 접근할 대상을 확인하며, 실제 읽기·저장 시 권한과 링크 대상을 다시 확인하고 실패한 경로와 원인을 보존한다.
  링크를 통해 저장할 때는 링크를 유지하면서 실제 대상에 반영한다.
  탐색 순환 처리는 [[문서 탐색]], 파일을 반영하는 연산과 실패 처리는 [[쓰기 조정]]에서 확인한다.

  경로별 재확인도 같은 논리 .codocs 경계에서 시작하며 외부 실경로를 직접 읽기 요청으로 받지 않는다.
  감시를 위한 링크 대상 위치는 읽기 권한과 별개다. 깨진 연결의 대상 위치를 알아도 확인하지 못한 실경로나 접근 허용 범위를 추측하지 않는다.
  하위 경로의 lstat가 ENOENT이면 부재로 분류하되, 존재하는 링크의 대상 확인이 실패한 경우는 unavailable로 남긴다.

  ## 코드와 검증 위치

  접근 범위와 허용 여부는 [담당 구현](../../../packages/workspace/src/paths/index.ts)에서 확인한다.
  관련 계약의 사례는 [인접 테스트](../../../packages/workspace/src/paths/paths.test.ts)에서 확인한다.
