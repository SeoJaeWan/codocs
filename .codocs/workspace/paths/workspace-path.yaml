id: resolve-workspace-path
name: '작업 공간 경로 확인'
domains:
  - '작업 공간'
definition: |
  선택한 [[프로젝트 루트]]와 접근할 경로를 받아, 허용된 범위 안의 실제 대상을 확인하는 처리다.
  [[발견 경로]]와 실제 대상·종류·접근 범위를 함께 제공하거나 거부·부재·접근 실패를 구분한다.

  ## 경로와 접근 범위

  경로의 각 항목을 확인하며 [[파일 접근 범위]]의 .codocs 경계를 유지한다.
  심볼릭 링크·정션을 발견하면 대상 경로를 따라가지 않고 미지원 연결로 구분한다.
  상위 경로 이동을 단순한 문자열 정규화로 지워 .codocs 밖의 접근을 허용하지 않는다.
  실제 경로를 확인했다는 사실만으로 읽기·쓰기 성공이 보장되지는 않는다. 실제 파일 작업에서 대상과 권한을 다시 확인한다.

  ## 확인 결과의 사용

  [[문서 탐색]]은 확인한 일반 파일·폴더만 읽는다.
  접근할 수 없는 경로는 [[작업 공간 진단]]으로 확인한 원인을 전달한다. 경로를 확인하지 못한 상황을 빈 문서로 바꾸지 않는다.
  [[문서 변경 계획]]의 생성 경로 표기 검사는 별도 요청 계약이며, 이 경로 확인 절차가 그 입력 형식을 완화하지 않는다.

  ## 코드와 검증 위치

  대표 함수 resolveWorkspacePath와 경로 확인 결과는 [담당 구현](../../../packages/workspace/src/paths/index.ts)에서 확인한다.
  관련 계약의 사례는 [인접 테스트](../../../packages/workspace/src/paths/paths.test.ts)에서 확인한다.
  저장 후보의 누락된 부모를 한 단계씩 생성하고 매 단계 연결·종류를 확인하는 ensureWorkspaceParent도 같은 구현에서 제공한다. update에서는 부모를 생성하지 않는다.
