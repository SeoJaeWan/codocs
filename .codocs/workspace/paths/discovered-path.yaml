id: discovered-path
name: '발견 경로'
domains:
  - '작업 공간'
definition: |
  [[문서 탐색]] 과정에서 접근한 프로젝트 상대 경로다.
  문서 파일은 .codocs 안에서 발견한 접근 경로로 표현한다.

  ## 다른 식별 정보와의 구분

  실제 대상 경로는 파일시스템에서 확인한 위치이고, 발견 경로는 그 대상에 접근한 위치다.

  문서 ID와 실제 경로를 대신하는 값이 아니라 관측한 접근 위치를 나타낸다.

  발견 경로는 실행 OS의 상대 경로 구분자를 유지한다. Windows 조회 입력은 /와 \\를 같은 구분자로 비교하지만 대소문자·Unicode를 임의로 정규화하지 않는다.
  후보 선택·출처 닫기·live 참조의 경로 비교에도 같은 발견 경로 표기를 사용한다.

  전체 탐색과 경로별 재확인의 관측 캐시·읽기 세대도 발견 경로를 기준으로 구분한다.

  ## 코드와 검증 위치

  발견 경로와 실제 경로의 확인은 [담당 구현](../../../packages/workspace/src/paths/index.ts)에서 확인한다.
  관련 계약의 사례는 [인접 테스트](../../../packages/workspace/src/paths/paths.test.ts)에서 확인한다.
