id: discovered-path
name: '발견 경로'
domains:
  - '작업 공간'
definition: |
  [[문서 탐색]] 과정에서 접근한 프로젝트 상대 경로다.
  외부 링크를 통해 읽은 파일도 프로젝트 안에서 발견한 접근 경로로 표현한다.

  ## 다른 식별 정보와의 구분

  실제 대상 경로는 링크 해석 후 도달한 위치이고, 발견 경로는 그 대상에 접근한 경로다.
  하나의 실제 대상에 여러 발견 경로로 접근할 수 있다.

  문서 ID와 실제 경로를 대신하는 값이 아니라 관측한 접근 위치를 나타낸다.

  전체 탐색과 경로별 재확인의 관측 캐시·읽기 세대도 발견 논리 경로를 기준으로 구분한다.
  같은 외부 대상의 신호는 그 대상에 연결된 모든 발견 경로로 대응시킬 수 있지만 관측을 실경로 하나로 합치지 않는다.
  연결 정보의 targetPath는 링크가 지정한 위치이며 realPath는 대상 확인에 성공한 경우에만 제공한다.

  ## 코드와 검증 위치

  발견 경로와 실제 경로의 확인은 [담당 구현](../../../packages/workspace/src/paths/index.ts)에서 확인한다.
  관련 계약의 사례는 [인접 테스트](../../../packages/workspace/src/paths/paths.test.ts)에서 확인한다.
