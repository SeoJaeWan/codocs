id: storage
name: '저장'
domains:
  - '작업 공간'
definition: |
  생성할 문서 또는 수정 대상·원문 버전·변경 요청을 받아 검증한 후보를 파일에 반영한다.
  파일 반영 여부·변경 여부·새 원문 버전과 진단을 반환하며 저장 뒤의 색인 결과를 함께 안내한다.

  ## 발생 상황

  AI가 문서를 읽은 뒤 사람이 주석이나 내용을 바꿀 수 있다.
  오래된 원문 기준으로 저장하면 다른 변경을 덮어쓸 수 있으므로 [[원문 버전]]을 확인한다.

  ## 요청과 판단 순서

  create는 아래 입력 계약으로 받은 경로와 문서를 사용해 생성 가능 여부를 검사한다.
  update는 현재 ID·revision과 최상위 set/unset을 받으며 위치를 유지한다.
  요청 대상은 현재 ID로 찾고 set.id로 새 ID를 지정할 수 있다.
  새 ID에 [[문서]]의 식별자 규칙을 적용한 뒤 반영한다.

  객체·배열은 전체 교체하고 점이 있는 속성명을 중첩 수정 명령으로 해석하지 않는다.
  필수 필드 삭제·set/unset 중복 지정·빈 변경 요청은 거부한다.
  이미 없는 선택 속성의 unset은 허용한다.

  요청·대상·revision을 확인하고 변경 후 전체 문서에 [[문서 검증]]을 적용한다.
  검증은 변경 후보의 오류와 이번 변경에 관련된 충돌·참조를 대상으로 한다. 다른 문서가 새 ID를 사용하면 오류를 반환하지만, 수정과 무관한 다른 문서의 오류는 이번 결과에 포함하거나 실패 사유로 사용하지 않는다.
  수정 후보는 기존 대상 문서를 대체한 상태로 검사하여 자기 자신을 중복 대상으로 세지 않는다.
  오류가 남으면 같은 값을 보낸 무변경 요청도 실패한다.
  검증된 무변경은 파일·색인을 갱신하지 않으며 응답은 아래 결과 계약을 적용한다.

  저장 직전 실제 디스크 바이트에서 [[원문 버전]]을 다시 계산해 요청의 revision과 비교한다. 오래된 색인 값만으로 판단하지 않는다.
  불일치하면 최신 문서를 다시 읽어 수정안을 검토하게 한다.
  비교와 반영 사이에도 외부 편집이 발생할 수 있으므로 파일 반영의 조정은 [[쓰기 조정]]을 적용한다.

  ## ID 변경과 이전 ID 목록

  명시적인 ID 변경 기능(MCP update의 set.id 포함)으로 유효한 현재 ID가 바뀌면 직전 ID를 deprecatedAliases에 자동 추가한다. 항목 형식은 [[문서]]에서 확인한다.
  직전 ID가 이미 등록되어 있으면 중복 추가하지 않고 기존 항목과 작성된 message를 유지한다.
  새 현재 ID가 이전 ID 목록에 있으면 그 항목을 제거한다. zone → return-zone → zone으로 변경하면 현재 ID는 zone이고 이전 목록에는 return-zone을 남긴다.
  현재 ID와 이전 목록을 하나의 변경 후보로 계산·검증·저장한다. ID만 또는 목록만 부분 반영하지 않는다. 같은 ID를 다시 지정하는 것을 새 ID 변경으로 취급하지 않는다.
  사용자가 YAML을 직접 편집하면 필요한 이전 ID를 직접 관리한다. watcher는 이전 값을 추측해 목록에 추가하거나 원문을 자동 정리하지 않는다.
  ID 변경만으로 name 기반 본문 참조를 수정하거나 사용자의 코드를 자동 변경하지 않는다. 이전 ID와 코드를 연결하는 기준은 [[코드 식별자 매칭]]에서 확인한다.
  update API에서는 deprecatedAliases를 직접 수정할 수 없다. set.deprecatedAliases와 unset의 deprecatedAliases 지정을 모두 거부하며 빈 배열로 초기화하는 요청도 포함한다.
  이 제한은 ID 변경의 동시 지정 여부나 같은 ID의 재지정 여부와 무관하다. update API의 목록 변경은 실제 ID 변경에 따른 자동 관리로만 수행한다.
  YAML 직접 편집과 문서 스키마의 이전 ID 목록 허용 규칙은 유지한다.

  ## 변경 후보와 파일 반영

  변경 계획은 요청에 따른 YAML 후보를 만들고 재파싱·기대 데이터 비교·문서 및 관련 충돌·참조 검증까지 수행한다.
  오류가 있으면 진단을 반환하고, 오류가 없으면 후속 저장 단계가 사용할 검증된 후보와 원문 버전 정보를 제공한다. 검증된 무변경도 별도로 구분한다.
  변경 후보의 준비 완료는 파일 저장 완료를 의미하지 않는다. 계획 단계는 파일을 쓰거나 운영 색인을 갱신하지 않는다.
  실제 저장 단계가 최신 디스크 원문을 다시 확인하고 파일 반영 결과를 결정한다.

  [[탐색 상태]]가 complete가 아니면 프로젝트 전체의 충돌·참조 검증을 완료할 수 없으므로 생성·수정 후보와 검증된 무변경 결과를 확정하지 않는다.
  수정 대상 자체가 확인됐거나 설명만 바꾸는 요청이어도 동일하게 차단한다. 탐색 실패 원인을 해결하고 전체 탐색을 완료한 뒤 다시 요청한다.

  ## 원문 보존

  바꾸지 않은 공백·주석·따옴표·줄바꿈·순서를 유지한다.
  수정된 배열 내부의 이전 표기는 보존 대상이 아니다.
  부분 교체 후보를 다시 파싱해 기대 데이터와 같음을 확인하고 검증한다.

  원본 바이트를 UTF-8 문자열로 읽는 과정에서 정보가 손실된 파일은 수정 요청을 거부하며 무변경 요청도 예외로 두지 않는다.
  해석할 수 없는 바이트가 대체 문자로 바뀐 상태에서 저장하면 수정하지 않은 영역까지 손상될 수 있기 때문이다.
  한글·이모지 등 유효한 UTF-8 문자는 이 차단 대상이 아니다. 바이트 기반 버전 계산은 [[원문 버전]]에서 확인한다.

  create 실패를 update로 바꾸거나 없는 update를 자동 생성하지 않는다.
  단일 요청은 문서 하나다.

  파일 반영 연산은 [[쓰기 조정]], 저장 뒤의 색인 반영과 실패 복구는 [[저장 후 색인 갱신 실패를 복구하는 절차]]에서 확인한다.

  ## 요청과 결과의 세부 계약

  create는 mode·상대 path·전체 document를 받으며 revision은 요구하지 않는다.
  생성 경로는 `/`로 구분하고 `.yaml` 또는 `.yml`로 끝나야 한다.
  경로 구간의 `.`·`..`, 중복 `/`처럼 빈 구간을 만드는 표기와 역슬래시는 자동 보정하지 않고 거부한다.
  예를 들어 `.codocs/team/order.yaml`을 사용하고 `.codocs/./order.yaml`이나 `.codocs//order.yaml`은 거부한다.
  이 표기 검사는 실제 파일 접근 허가를 대신하지 않는다. 연결 대상과 허용 범위는 workspace에서 [[파일 접근 범위]]에 따라 별도로 확인한다.
  허용 범위 안에서 .codocs와 필요한 부모 폴더가 없으면 생성한다.

  create 대상 파일이 이미 있으면 생성을 차단한다. 새 ID와 모든 소속 도메인의 이름 충돌도 검사한다. 자기 문서는 중복 대상으로 세지 않는다.
  생성·수정 모두 ID는 프로젝트 전체에서 유일해야 하며, 이름이 완전히 같고 공통 도메인이 하나 이상인 다른 문서가 있으면 차단한다.
  이름은 공백·영문 대소문자·단복수를 정규화하지 않고 해석된 문자열 그대로 비교한다.
  도메인이 겹치지 않는 동명 문서는 허용하며 저장 후 별도 동명 문서 안내나 검사를 수행하지 않는다.

  사용자 속성도 set/unset과 보존·경고 규칙을 적용한다.
  경고만 있으면 저장 성공을 막지 않으며 무관한 다른 문서 오류 때문에 정상 쓰기를 전부 차단하지 않는다.

  실패는 success:false·saved:false와 진단을 제공한다.
  검증된 무변경은 success:true·saved:false·changed:false·현재 revision을 반환하고 indexUpdated를 생략한다.

  변경 저장 성공은 success·saved·changed와 id·source.path·revision·warnings, 색인 갱신 결과를 제공한다.
  반환할 revision은 반영한 새 파일 바이트에서 계산한다.
  문서 본문을 다시 반환하지 않는다.

  ## 속성별 부분 수정

  기존 속성은 값 범위를 바꾸고 새 속성은 마지막 뒤에 주변 들여쓰기·줄바꿈에 맞춰 추가한다.
  삭제는 [[YAML 파싱]]이 반환한 속성 전체 범위를 사용한다. 그 범위에 속한 원문만 제거하고 바깥 원문은 유지한다.

  변경한 값의 따옴표·여러 줄 표기는 바꿀 수 있으나 실제 문자열의 줄바꿈·끝 개행을 정확히 보존한다.
  새 파일은 보존할 원문이 없으므로 별도 출력 규칙을 적용한다.
  개발용 Prettier로 사용자 문서 전체를 재포맷하지 않는다.
