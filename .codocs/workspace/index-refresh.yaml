id: index-refresh
name: '색인 갱신'
domains:
  - '작업 공간'
definition: |
  파일 변화를 감지해 [[문서 색인]]을 최신 관측으로 재구성하는 처리다.

  ## 발생 상황

  사용자·다른 프로세스가 파일을 변경하거나, 파일 저장은 끝났지만 메모리 색인 갱신이 실패할 수 있다.
  파일 저장 여부와 조회 가능한 최신 상태를 구분해야 중복 저장을 피할 수 있다.

  ## 감지와 재구성 계약

  각 IDE·MCP 프로세스는 자기 색인을 유지한다.
  파일 알림은 상태 재확인의 신호이며 파싱·검증을 대신하지 않는다.

  연결된 외부 대상과 .codocs의 생성·삭제·재생성도 감지한다.

  동일 경로 알림을 묶고 최신 상태로 재계산한다.
  Chokidar 사용은 설계 선택이며 정확한 버전·병합 지연은 런타임과 성능 검증으로 정한다.

  전체 재구성 중 list/get/write/validate는 준비 중임을 알리고 write는 저장하지 않는다.
  guide와 복구용 refresh는 유지한다.
  중복 refresh를 동시에 시작하지 않는다.

  완료하면 모든 목록 커서를 만료한다.
  파일 수·목록 항목 수·진단 수는 구분한다.
  [[불완전한 탐색]]을 성공한 전체 재구성으로 승격하지 않는다.

  ## 감지와 준비 상태의 세부 경계

  각 프로세스의 색인이 완전히 동시에 갱신되는 것은 아니다.
  OS 알림을 기본으로 하고 [[원문 버전]] 등으로 중복 처리를 줄인다.

  Chokidar 5.0.0은 검토 후보이며 실제 버전은 런타임·번들 호환성 확인 후 고정한다.
  awaitWriteFinish의 기본 2초를 그대로 적용하지 않고 성능 목표와 함께 검토한다.

  초기 구성 중 변경·교체 저장·폴더 이동·재생성과 감지 오류 복구를 시험한다.
  실패를 계속 준비 중으로 표시하거나 오래된 색인을 최신 결과·빈 목록으로 반환하지 않는다.

  ## refresh 응답

  codocs_refresh는 입력 속성 없이 전체 대상 범위를 다시 읽으며 원문을 수정하지 않는다.
  완료 시 fileCount·itemCount·errorCount·warningCount와 진단을 반환한다.

  fileCount에는 읽기·파싱 오류 파일도 포함한다.
  itemCount는 필터 없는 list.totalCount이며 충돌 ID는 하나로 세고 목록 식별 불가 파일은 제외한다.

  errorCount와 warningCount는 파일 수가 아닌 진단 개수다.
  부분 집계를 정상 완료로 반환하지 않는다. 부분 완료의 응답·준비 상태 세부 매핑은 이 계약에서 확정하지 않는다.
