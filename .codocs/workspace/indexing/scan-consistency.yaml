id: scan-consistency
name: '불완전한 탐색에서 색인과 연결을 유지하는 절차'
domains:
  - '작업 공간'
kind: procedure
status: confirmed
definition: |
  [[불완전한 탐색]]의 관측 결과를 [[문서 색인]]에 반영하고 [[참조 후보]]의 확정 가능 여부를 판단하는 절차다.

  ## 보존과 연결 판단

  확인한 문서는 갱신하고 누락된 이전 문서는 [[미확인 문서]]로 남긴다.
  확인하지 못한 범위에 동명 문서가 있을 수 있으므로 후보가 0개·1개여도 부재나 단일 연결로 확정하지 않는다.

  확정 직접·역참조 목록과 후보 정보는 구분한다.

  완전한 탐색에서만 미관측 이전 경로를 제거하고 충돌·연결을 다시 확정한다.
  전체 실패에서는 새 관측을 채택하지 않고 이전 기록을 미확인 상태로 보존한다.

  ## 미관측 경로의 보존 범위

  partial에서는 모든 미관측 이전 경로를 보수적으로 보존한다.
  실패 범위 밖이라는 이유만으로 삭제됐다고 판단하지 않는다.

  ## 코드와 검증 위치

  스캔과 이전 관측의 연결는 [담당 구현](../../../packages/workspace/src/indexing/index.ts)에서 확인한다.
  관련 계약의 사례는 [인접 테스트](../../../packages/workspace/src/indexing/indexing.test.ts)에서 확인한다.
