id: index-refresh
name: '색인 갱신'
domains:
  - '작업 공간'
definition: |
  파일 변화 알림이나 refresh 요청을 받아 대상 파일을 다시 관측하고 [[문서 색인]]을 갱신한다.
  재구성의 준비·완료·실패 상태와 관측 집계를 전달한다.
  관측을 색인에 연결하는 계산은 [[작업 공간 색인 구성]], 그 결과를 사용하는 조회의 책임은 [[작업 공간 조회 세션]]에서 확인한다.

  ## 발생 상황

  사용자·다른 프로세스가 파일을 변경하거나, 파일 저장은 끝났지만 메모리 색인 갱신이 실패할 수 있다.
  파일 저장 여부와 조회 가능한 최신 상태를 구분해야 중복 저장을 피할 수 있다.

  ## 감지와 재구성 계약

  각 IDE·MCP 프로세스는 자기 색인을 유지한다.
  조회는 유지한 색인을 재사용하며 요청마다 모든 YAML을 다시 해석하지 않는다.
  [[작업 공간 파일 감시]]의 변경 경로 신호를 받아 현재 파일을 다시 관측하고 최신 상태로 재계산한다.
  감시 대상·알림 병합·디렉터리 교체 시 재연결의 기준은 그 담당 문서에서 정의한다.

  초기 구성과 전체 재구성 중 list/get/write/validate는 준비 중임을 알리고 write는 저장하지 않는다.
  guide와 복구용 refresh는 유지한다.
  진행 중인 refresh에 다시 요청이 들어오면 같은 작업을 공유하고 같은 완료 결과를 반환한다.
  전체 스캔 종료 시점까지 감지한 변경을 재확인·반영한 뒤 refresh를 완료한다. 그 이후의 변경은 감시가 이어서 처리한다.

  전체 재구성이 complete 또는 partial로 끝나 반영되면 refresh 세대를 바꿔 모든 [[조회 커서]]를 만료한다.
  파일 수·목록 항목 수·진단 수는 구분한다.
  [[불완전한 탐색]]을 완전한 재구성으로 승격하지 않는다. partial이면 확인한 문서와 이전 미확인 문서를 조회할 수 있지만 write·validate는 전체 탐색이 complete로 끝날 때까지 차단한다.

  ## 감지와 준비 상태의 세부 경계

  각 프로세스의 색인이 완전히 동시에 갱신되는 것은 아니다.
  [[원문 버전]]으로 같은 원문에 대한 중복 재계산을 줄인다. 감시 방식과 알림 지연은 [[배포]]의 반영 시간 목표와 함께 검증한다.

  일반 파일 변경을 다시 처리하는 동안 list/get은 마지막 완료 색인으로 조회한다. 처리가 끝나면 문서·참조·진단을 함께 반영한다.
  [[작업 공간 파일 감시]]의 복구 상태와 재관측 신호를 받아 전체 재스캔을 연결한다.
  감시가 failed이면 감지가 끊긴 원인과 수동 복구 안내를 응답에 전달한다. 이때 마지막 완료 색인으로 list/get을 허용하되 최신성을 보장하지 않는 상태와 미확인 진단을 표시한다. 보유 문서와 색인 밖 ID의 현재 상태를 확정하지 않으며 write·validate는 차단한다.
  수동 codocs_refresh는 전체 재스캔과 감시 재연결을 시도한다. 복구 중에는 전체 재구성의 준비 상태를 적용하고, 정상 복구 뒤 write·validate를 다시 허용한다.

  초기 구성 중 변경·교체 저장·폴더 이동·재생성과 감지 오류 복구를 시험한다.
  실패를 계속 준비 중으로 표시하거나 오래된 색인을 최신 결과·빈 목록으로 반환하지 않는다. 이전 완료 색인이 없다면 감시 실패 후 조회할 자료가 없으므로 실패 원인을 반환한다.

  ## refresh 응답

  codocs_refresh는 입력 속성 없이 전체 대상 범위를 다시 읽으며 원문을 수정하지 않는다.
  완료 시 fileCount·itemCount·errorCount·warningCount와 진단을 반환한다.

  fileCount에는 읽기·파싱 오류 파일도 포함한다.
  itemCount는 필터 없는 list.totalCount이며 충돌 ID는 하나로 세고 목록 식별 불가 파일은 제외한다.

  errorCount와 warningCount는 파일 수가 아닌 진단 개수다.
  partial이면 부분 완료와 실패 원인을 반환하고 집계가 불완전함을 명시한다. 부분 집계를 complete의 정상 완료 집계처럼 반환하지 않는다.
