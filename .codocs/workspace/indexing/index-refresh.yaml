id: index-refresh
name: '색인 갱신'
domains:
  - '작업 공간'
definition: |
  파일 변화 알림이나 refresh 요청을 받아 대상 파일을 다시 관측하고 [[문서 색인]]을 갱신한다.
  재구성의 준비·완료·실패 상태와 관측 집계를 전달한다.
  관측을 색인에 연결하는 계산은 [[작업 공간 색인 구성]], 그 결과를 사용하는 조회의 책임은 [[작업 공간 조회 세션]]에서 확인한다.

  ## 발생 상황

  사용자·다른 프로세스가 파일을 변경하거나, 파일 저장은 끝났지만 메모리 색인 갱신이 실패할 수 있다.
  파일 저장 여부와 조회 가능한 최신 상태를 구분해야 중복 저장을 피할 수 있다.

  ## 감지와 재구성 계약

  각 IDE·MCP 프로세스는 자기 색인을 유지한다.
  조회는 유지한 색인을 재사용하며 요청마다 모든 YAML을 다시 해석하지 않는다.
  [[작업 공간 파일 감시]]의 변경 경로 신호를 받아 현재 파일을 다시 관측하고 최신 상태로 재계산한다.
  감시 대상·알림 병합·디렉터리 교체 시 재연결의 기준은 그 담당 문서에서 정의한다.

  상세 get은 요청된 ID의 결과를 현재 색인에서 읽는 요청·응답 API이며, 이전 get 응답을 변경 알림과 함께 자동 전송하지 않는다.
  .codocs 안의 지원 대상 파일이 바뀌면 watcher가 색인 갱신을 시작하고, 갱신 완료 뒤 다음 get 요청이 새 본문·revision·참조 진단을 반환한다.
  본문 변경으로 목록 투영이 달라지지 않으면 [[조회 커서]]의 세대는 유지할 수 있지만, 해당 문서와 영향을 받은 참조·역참조 색인은 갱신해야 한다.
  파일을 다시 읽는 범위와 참조·진단을 다시 계산하는 범위는 다를 수 있다. cursor 만료 여부도 파일 재탐색 범위와 구분한다.
  같은 서버의 write 저장 뒤에는 watcher 신호만 기다리지 않고 저장 경로를 직접 재관측하고 게시된 revision을 확인한다. 실제 실패면 해당 경로만 추가 한 번 재관측하며 전체 refresh로 대체하지 않는다.

  초기 구성과 전체 재구성 중 list/get/write/validate는 준비 중임을 알리고 write는 저장하지 않는다.
  guide와 복구용 refresh는 유지한다.
  진행 중인 refresh에 다시 요청이 들어오면 같은 작업을 공유하고 같은 완료 결과를 반환한다.
  최초 조회가 동시에 들어오면 같은 초기화 작업을 기다리며, 재확인 중인 중간 결과를 최초 완료 결과로 반환하지 않는다.

  전체 재구성이 complete 또는 partial로 끝나 반영되면 refresh 세대를 바꿔 모든 [[조회 커서]]를 만료한다.
  파일 수·목록 항목 수·진단 수는 구분한다.
  [[불완전한 탐색]]을 완전한 재구성으로 승격하지 않는다. partial이면 확인한 문서와 이전 미확인 문서를 조회할 수 있지만 write·validate는 전체 탐색이 complete로 끝날 때까지 차단한다.

  ## 초기 탐색과 진행 중 변경 반영

  프로젝트 위치를 확인한 뒤 첫 문서 열거·읽기 전에 감시와 변경 수집을 준비한다.
  감시 시작·구독·하위 폴더 등록과 스캔 완료·결과 게시 사이에 변경 수집이 끊기지 않게 한다.
  .codocs가 처음에 없는 경우와 탐색 중 발견한 새 일반 하위 폴더도 같은 기준을 적용한다. 새 폴더의 감시가 준비되기 전 관측은 등록 뒤 재확인한다.

  최초 초기화와 수동 refresh는 전체 문서 범위를 확인한다.
  초기화·갱신 도중 변경 신호가 오면 나머지 탐색을 계속하면서 영향을 받은 경로를 다시 읽는다. 변경이 없는 문서의 읽기·파싱 결과는 재사용하며 전체 탐색을 처음부터 반복하지 않는다.
  파일 추가·수정·삭제와 교체 저장, 폴더 이동·교체·재생성에 따라 해당 경로나 영향을 받은 하위 범위를 다시 확인한다.
  지원하는 파일의 관측은 [[발견 경로]]별로 유지한다.
  삭제 알림이나 읽기 실패만으로 부재를 확정하지 않는다. 실제 재확인 결과의 보존·제거는 [[불완전한 탐색에서 색인과 연결을 유지하는 절차]]를 따른다.

  같은 경로의 중복 신호는 재확인 대상으로 병합한다. 재읽기 도중 추가 변경이 생기면 다시 확인할 대상으로 남기고, 늦게 끝난 이전 읽기가 최신 관측을 덮어쓰지 않게 한다.
  저장 요청의 `.codocs-write-*.tmp` 파일 신호는 문서 재관측 대상에서 제외한다. 삭제된 임시 파일을 읽으려다 partial 관측을 만들지 않으며, 실제 YAML 파일의 생성·삭제 신호는 계속 재관측한다.
  전체 순회의 작업 관측은 마지막 게시 snapshot과 분리한다.
  변경 신호를 발견 경로로 대응한 뒤 캐시 세대를 무효화하며, 경로별 결과의 확인 범위와 읽기 세대를 검증해 오래된 관측을 버린다.
  파일의 현재 원문·파싱·revision은 함께 재사용하고, 실패한 범위는 기존 관측을 미확인으로 보존한다.
  수동 refresh는 진행 중인 일반 보정이 끝난 뒤 감시 복구와 새 전체 읽기를 수행한다.

  모인 관측으로 문서·참조·역참조·진단을 계산하고 원문 버전과 같은 결과로 함께 게시한다. 원문을 다시 읽지 않은 문서도 참조 대상의 변경에 따라 연결과 진단은 달라질 수 있다.
  완료 판정 전에 감지한 변경과 감시 등록에 따른 재확인을 반영한다. 감시가 수집했지만 배치 전달을 기다리는 변경도 완료 판정에서 누락하지 않는다.
  게시 이후의 변경은 계속 연결된 감시가 후속 갱신으로 처리한다. 공유 promise를 해제할 때도 배치를 drain하고 남은 경로의 후속 갱신을 시작한다. 이 경계가 계속 변하는 디스크 전체를 한 시점에 고정한다는 의미는 아니다.

  처리할 변경이 남으면 준비 중 상태를 유지한다. 실제 변경이 계속되면 완료가 늦어질 수 있으며, 초기화 시간이나 재시도 횟수만으로 완료 또는 실패를 선언하지 않는다.
  중복 신호와 감시 등록 자체가 불필요한 재확인을 무한 반복시키지 않게 한다. 실제 IO·감시 오류와 세션 종료는 지속 변경에 따른 대기와 구분한다.

  ## 감지와 준비 상태의 세부 경계

  각 프로세스의 색인이 완전히 동시에 갱신되는 것은 아니다.
  [[원문 버전]]으로 같은 원문에 대한 중복 재계산을 줄인다. 감시 방식과 알림 지연은 [[배포]]의 반영 시간 목표와 함께 검증한다.

  일반 파일 변경을 다시 처리하는 동안 list/get은 마지막 완료 색인으로 조회한다. 처리가 끝나면 문서·참조·진단을 함께 반영한다.
  [[작업 공간 파일 감시]]의 복구 상태와 재관측 신호를 받아 전체 재스캔을 연결한다.
  감시가 failed이면 감지가 끊긴 원인과 수동 복구 안내를 응답에 전달한다. 이때 마지막 완료 색인으로 list/get을 허용하되 최신성을 보장하지 않는 상태와 미확인 진단을 표시한다. 보유 문서와 색인 밖 ID의 현재 상태를 확정하지 않으며 write·validate는 차단한다.
  수동 codocs_refresh는 전체 재스캔과 감시 재연결을 시도한다. 복구 중에는 전체 재구성의 준비 상태를 적용하고, 정상 복구 뒤 write·validate를 다시 허용한다.

  초기 구성 중 변경·교체 저장·폴더 이동·재생성과 감지 오류 복구를 시험한다.
  실패를 계속 준비 중으로 표시하거나 오래된 색인을 최신 결과·빈 목록으로 반환하지 않는다. 이전 완료 색인이 없다면 감시 실패 후 조회할 자료가 없으므로 실패 원인을 반환한다.
  세션 종료 시 감시·대기 변경·구독을 정리한다. 진행 중인 읽기가 뒤늦게 끝나도 후속 감시 자원을 만들거나 새 결과·완료 알림을 게시하지 않는다.

  ## refresh 응답

  codocs_refresh는 입력 속성 없이 전체 대상 범위를 다시 읽으며 원문을 수정하지 않는다.
  완료 시 fileCount·itemCount·errorCount·warningCount와 진단을 반환한다.

  fileCount에는 읽기·파싱 오류 파일도 포함한다.
  itemCount는 필터 없는 list.totalCount이며 충돌 ID는 하나로 세고 목록 식별 불가 파일은 제외한다.

  errorCount와 warningCount는 파일 수가 아닌 진단 개수다.
  countsComplete는 전체 범위 집계 여부이며 complete일 때 true, partial일 때 false다.
  partial이면 부분 완료와 실패 원인을 반환하고 집계가 불완전함을 명시한다. 부분 집계를 complete의 정상 완료 집계처럼 반환하지 않는다.
