id: workspace-catalog
name: '작업 공간 색인 구성'
domains:
  - '작업 공간'
definition: |
  [[문서 탐색]]의 관측과 실패 범위를 [[문서 색인]]에 연결하고 같은 프로젝트의 이전 관측을 함께 반영하는 처리다.
  파일 접근의 결과를 색인 계산에 전달하며, 파일을 다시 읽거나 문서를 저장하지 않는다.

  ## 관측의 전달

  [[발견 경로]]별로 읽은 원문·실제 경로·파싱 결과와 [[탐색 상태]]를 유지한다.
  문서 형식 검증에 실패해도 성공한 YAML 해석 결과와 문자열 위치 대응은 유지한다.
  파싱 실패에서는 원문과 진단을 전달하고 ID·이름·참조를 추측하지 않는다.
  같은 ID나 실제 경로라는 이유로 서로 다른 발견 경로를 합치지 않는다.

  ## 실패 범위와 이전 관측

  확인한 파일·폴더의 실패 범위와 실제 IO 진단을 전달하며, 범위를 확인하지 못하면 미확인으로 구분한다.
  이전 관측의 보존·제거와 연결 확정은 [[불완전한 탐색에서 색인과 연결을 유지하는 절차]]를 적용한다.
  다른 프로젝트의 이전 색인을 섞지 않으며 전달받은 스캔과 이전 색인을 변경하지 않는다.

  ## 후속 사용

  [[작업 공간 조회 세션]]은 구성한 색인과 읽기 시점의 버전을 조회에 사용한다.
  [[작업 공간 변경 계획]]은 같은 관측을 후보 계산에 연결한다.
  파일 변화 감지와 재구성 시점은 [[색인 갱신]]에서 정의한다.

  ## 코드와 검증 위치

  대표 함수 buildWorkspaceCatalog·toCatalogScan은 [담당 구현](../../../packages/workspace/src/indexing/index.ts)에서 확인한다.
  관련 계약의 사례는 [인접 테스트](../../../packages/workspace/src/indexing/indexing.test.ts)에서 확인한다.
