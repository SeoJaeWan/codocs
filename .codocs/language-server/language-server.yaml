id: language-server
name: 'Language Server'
domains:
  - 'Language Server'
kind: procedure
definition: |
  편집 중 코드의 내용·버전·위치를 유지하고 문서 설명과 진단을 LSP로 전달하는 책임 영역이다. 코드 후보의 계산은 [[코드 식별자 매칭]], 호스트에서 원문을 여는 동작은 [[VS Code]]에서 담당한다.

  ## 편집 관측과 표현

  - [[문서 동기화]]: 최신 내용과 식별자 위치를 함께 유지한다.
  - [[IDE 지원]]: 후보·진단·원문 위치를 편집기에 표현하는 경계를 확인한다.
  - [[코드 호버]]: 커서 위치의 설명·보조 링크·이전 ID와 오류 안내를 확인한다.
  - [[코드 자동완성]]: 입력 후보 추천·삽입을 제공 범위에서 제외한 판단을 확인한다.

  서버 연결만으로 색인 완료를 뜻하지 않는다. 색인 게시와 감시 준비의 의미는 [[작업 공간 조회 세션]]과 [[작업 공간 파일 감시]]에서 확인한다.

  [[명시적 코드 참조]]와 [[코드 참조 색인]]은 공개 Workspace 세션으로 조회한다. 서버는 코드 수집 세대·source 버전·저장 target 확인을 유지하고 [[IDE 지원]]의 DocumentLink·Hover·InlayHint로 표현한다.
