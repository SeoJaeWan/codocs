id: language-server
name: 'Language Server'
domains:
  - 'Language Server'
kind: procedure
definition: |
  편집 중 코드의 내용·버전·위치를 유지하고 문서 설명과 진단을 LSP로 전달하는 책임 영역이다. 코드 후보의 계산은 [[코드 식별자 매칭]], 호스트에서 원문을 여는 동작은 [[VS Code]]에서 담당한다.

  ## 편집 관측과 표현

  - [[문서 동기화]]: 최신 내용과 식별자 위치를 함께 유지한다.
  - [[IDE 지원]]: 후보·진단·원문 위치를 편집기에 표현하는 경계를 확인한다.
  - [[코드 호버]]: 커서 위치의 설명·보조 링크·이전 ID와 오류 안내를 확인한다.
  - [[코드 자동완성]]: 현재 ID의 후보와 삽입 표기를 결정한다.
