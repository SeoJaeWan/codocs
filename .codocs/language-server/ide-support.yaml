id: ide-support
name: 'IDE 지원'
domains:
  - 'Language Server'
definition: |
  편집 중 코드에서 문서 설명·진단·자동완성·원문 링크를 제공하는 언어 서버의 계약이다.
  [[문서 동기화]]로 확인한 최신 식별자에 [[코드 식별자 매칭]]을 적용하고 결과의 후보와 근거를 표시한다.
  현재·이전 ID의 비교와 순위는 매칭 계약에서 정의하며 표현 때문에 후보나 원본 위치를 버리지 않는다.

  ## Hover 내용과 보조 링크

  커서 위치의 최상위 후보는 문서 이름·정의를 표시하고, 최상위 동률 후보는 각각 내용을 표시한다.
  겹치는 후순위 후보와 동일 식별자의 다른 위치에서 매칭된 용어는 내용 없이 문서 이름의 링크만 제공한다. 같은 문서의 보조 링크는 중복 제거한다.
  reservationReturnZones의 reservation에 Hover하면 예약 내용과 return-zone 링크를, ReturnZones에 Hover하면 반납 구역 내용과 reservation 링크를 제공한다.
  현재/이전 ID 충돌에서는 후보별 근거를 표시하고 코드 전체를 이전 ID로 단정하지 않는다. 이전 ID 후보에는 확인한 현재 ID를 항상 안내하고 유효한 message가 있으면 함께 표시한다. message가 없으면 “이전 ID입니다. 현재 ID: return-zone” 같은 기본 안내를 제공한다. 이전 ID 보조 링크에도 이전 ID임을 표시한다.
  같은 문서·같은 범위에 현재 매칭도 있으면 내용을 한 번만 보여주며 이전 ID 경고는 하지 않는다.
  필수 필드 누락 등 문서 오류는 Hover에도 표시하고 확인 가능한 내용·원문 링크를 유지한다. 예: “필수 필드 definition이 누락되었습니다.” 잘못된 message에는 기본 변경 안내와 필드 오류를 표시한다. 현재 ID를 확인할 수 없으면 해당 오류를 안내한다.
  현재 ID 중복은 중복 오류와 모든 충돌 문서의 링크를 제공하며 정상 대표 내용을 선택하지 않는다.
  읽지 못한 문서가 있으면 “일부 문서를 읽지 못해 후보가 누락될 수 있습니다”라고 안내한다.
  도메인 소개·관련 업무 지식 링크를 제공하되 참조한 정의의 본문을 재귀 확장하지 않는다.

  ## 원문 이동

  보조 링크에는 해당 문서의 YAML 원문 위치를 제공한다. VS Code의 탭 재사용과 이동은 [[원문 열기]]에서 정의한다.
  문서 간 YAML 참조 링크는 이름 기반 참조 계약을 유지한다. 진단은 확인된 파일·위치에 표시하고 사용자는 원문을 편집한다.

  ## 자동완성
  현재 id를 후보로 사용하고 문서용 이름·도메인·설명으로 구분한다. 문서용 이름과 이전 명칭은 코드 자동완성에 사용하지 않는다.
  삽입은 현재 식별자의 대소문자·구분자를 따르고 단서가 없으면 camelCase다. 프로젝트 전체에서 표기를 추측하지 않는다.
  Return Zone의 예: returnZ → returnZone, ReturnZ → ReturnZone, return_z → return_zone, RETURN_Z → RETURN_ZONE.
  changeReturnZ → changeReturnZone처럼 기존 앞 단어를 유지하고 해당 완성 범위만 교체한다.
  등록 ID의 단수·복수 형태를 사용하며 문맥에 따라 임의 변환하지 않는다. 약어는 HTTP Server → HTTPServer(PascalCase), httpServer(camelCase)처럼 살린다. 구체 교체 범위는 테스트한다.
