id: ide-support
name: 'IDE 지원'
domains:
  - 'Language Server'
definition: |
  편집 중 코드를 이해할 수 있도록 문서 설명·진단·원문 링크를 제공하는 언어 서버의 계약이다.
  [[문서 동기화]]로 확인한 최신 매칭 문자열에 [[코드 식별자 매칭]]을 적용하고 결과의 후보와 근거를 표시한다.
  현재·이전 ID의 비교와 순위는 매칭 계약에서 정의하며 표현 때문에 후보나 원본 위치를 버리지 않는다.

  ## 표현별 담당 계약

  [[코드 호버]]는 커서 위치의 후보 설명·보조 링크·오류 안내를 정의한다.
  입력 후보 추천·삽입의 제공 범위는 [[코드 자동완성]]의 결정을 따른다.
  오류·경고의 공통 필드와 좌표는 [[진단]]을 적용한다.

  ## 명시적 코드 참조의 이동과 오류

  [[명시적 코드 참조]]의 정상 표기는 문서 설명 호버 없이 지정한 문서·행·범위로 이동하는 링크를 제공한다.
  @codocs부터 이름과 선택 행 지정까지의 전체 범위에는 기존 ID 매칭 호버를 표시하지 않는다. 표기 밖의 기존 매칭은 유지한다.
  대상이나 행 범위가 잘못되어도 같은 텍스트의 ID 매칭 결과로 대신 연결하지 않는다.
  잘못된 표기에는 밑줄과 오류 원인 호버를 제공한다. 대상 없음·모호한 이름·잘못된 형식·역전·범위 초과를 구분하며 별도 팝업이나 자동 수정을 제공하지 않는다.
  표기 수정 또는 대상의 저장·색인 갱신으로 해결되면 오류 안내를 제거한다. 미확인 탐색을 확정된 대상 없음으로 안내하지 않는다.
  위치는 [[문서 동기화]]의 현재 버전과 일치해야 하며 실제 탭과 선택·미저장 보존은 [[원문 열기]]를 적용한다.

  ## 문서에서 코드로 돌아가는 연결

  [[코드 참조 색인]]이 확인한 행·범위 연결은 해당 YAML 본문에 이동·호버 영역을 제공한다. 문서에 코드 경로나 별도의 역방향 표기를 작성하게 하지 않는다.
  이동 대상은 파일 상단이나 추측한 함수 정의가 아니라 @codocs의 실제 출현 위치다.
  수집 완료 후 연결이 1곳이면 해당 영역에서 IDE 이동 제스처로 직접 열고, 2곳 이상이면 `연결된 코드 · N곳` 호버에 위치별 링크를 제공한다.
  복수 연결의 본문에는 단일 이동 대상을 지정하지 않는다. 본문 이동 클릭으로 파일이나 별도 선택 창을 열지 않으며 호버의 개별 링크를 선택했을 때만 이동한다.
  링크는 프로젝트 상대 경로와 1부터 시작하는 행 번호로 구분한다. 같은 행의 여러 출현에는 열 번호도 표시한다.
  구현·테스트의 동시 연결은 정상 복수 연결이며 중복·모호함 경고나 파일명으로 추측한 역할을 붙이지 않는다.

  범위가 겹치는 위치에서는 해당 위치를 포함하는 출현을 합친다. 동일 출현만 중복 제거하고 다른 행·범위의 연결이나 문서 전체 참조를 섞지 않는다.
  기존 YAML 이름 참조 링크와 겹치면 기존 문서 이동을 유지하고 코드 연결은 1곳이어도 호버의 별도 링크로 제공한다.
  같은 행에서 기존 이름 참조와 겹치지 않는 영역에는 일반 단일·복수 규칙을 적용한다. 같은 범위에 서로 다른 이동 링크를 겹쳐 지정하지 않는다.

  ## 문서 전체 참조의 상단 표시

  행 지정이 없는 연결은 문서 상단에 `문서 전체에 연결된 코드 · N곳`으로 표시한다. 모든 본문 문자열에 연결을 반복하지 않는다.
  표시는 편집기 화면에서만 제공하며 YAML 원문·미저장 편집 내용·행 번호를 변경하지 않는다.
  N은 문서 전체 참조의 출현 수만 집계하며 행·범위의 연결 수를 합산하지 않는다.
  수집 완료 후 1곳이면 표시에서 직접 이동하고 2곳 이상이면 표시의 호버에서 개별 링크를 선택한다. 복수 표시 클릭으로 임의 대상이나 선택 창을 열지 않는다.
  연결 수가 바뀌면 표시·호버·직접 이동을 갱신하며 완료된 0곳에는 표시를 제거한다.
  상단 표시는 VS Code의 Inlay Hint로 제공하며 원문 첫 행 앞에 붙인다. 별도의 원문 행을 삽입하지 않으며 첫 행이 화면 밖으로 이동하면 표시도 함께 보이지 않는다.
  단일 연결의 이동은 IDE 이동 제스처를 사용한다. 일반 클릭만으로 이동하는 동작을 요구하지 않으며 복수 연결은 호버의 개별 링크로 선택한다.
  사용자가 editor.inlayHints.enabled를 끄면 표시도 숨겨진다. 표시를 유지하려고 사용자 설정을 강제로 변경하지 않는다.

  ## 코드 연결의 수집 상태 표시

  수집 중에는 `확인된 코드 N곳 · 수집 중`, 일부 읽기에 실패하면 `확인된 코드 N곳 · 수집 불완전`과 실패 상태를 안내한다.
  N은 현재 확인한 출현 수이며 전체 연결 수가 아니다. 확인한 출현의 개별 호버 링크만 제공하고 1곳이어도 직접 이동을 제공하지 않는다.
  수집 중 0곳을 연결 없음으로 확정하거나 읽기 실패를 계속 수집 중으로 표시하지 않는다.
  수집을 완료한 뒤에만 일반 단일·복수 이동으로 전환하며 상단 표시도 같은 상태 구분을 적용한다.

  ## 지식 문서 전체의 진단

  진단은 열린 파일에 한정하지 않고 색인에 포함된 모든 지식 문서에 제공한다. 닫힌 문서는 저장된 관측, 열린 문서는 [[문서 동기화]]의 현재 편집 관측을 우선한다.
  YAML 문법·필수 속성·ID 및 같은 도메인 안의 이름 중복·참조 오류와 경고를 담당 계약에 따라 계산한다. 저장 전 ID·이름·도메인 편집에도 [[문서 색인]]의 임시 출처 중복 검사를 적용한다. 파일을 열었다는 이유로 기존 중복 진단이 사라지지 않는다.
  오류가 해소되거나 문서 삭제가 확인되면 해당 진단을 제거한다. [[색인 갱신]]의 부분·실패 관측에서 보이지 않는 문서를 삭제된 것으로 처리하지 않는다.

  재검사 실패는 오류가 없다는 성공 결과와 구분한다. 이전 진단을 유지할 수 있는 경우에도 이전 관측의 결과임과 현재 상태를 확인하지 못했음을 함께 알린다.
  이전 결과의 문서 버전과 위치가 현재 원문에 적용 가능한 경우에만 해당 밑줄을 유지한다. 편집으로 위치가 무효해졌으면 낡은 밑줄을 제거하고 이전 결과는 과거 관측으로 구분해 안내한다.
  재검사 성공 시 최신 결과로 교체하고 실패 안내를 해제한다. 정상적인 빈 결과, 현재 확인된 오류, 재검사 실패를 서로 혼동하지 않는다.
  저장 원문을 다시 확인하지 못한 파일은 이전 위치의 적용 가능성을 입증할 수 없으므로 밑줄을 제거하고 과거 결과를 실패 안내에 남긴다. 열린 문서는 이전 진단의 원문과 현재 편집 원문이 같을 때만 그 위치를 유지할 수 있다.
  전체 진단은 저장 색인의 기존 파싱 결과를 사용하고 열린 원문만 편집 관측으로 교체한다. 지식 폴더 밖의 일반 YAML은 지식 문서 진단 대상으로 확장하지 않는다.
  VS Code에서 재검사 상태를 안내하는 방법은 [[언어 서버 연결]]에서 정한다.

  ## YAML 이름 참조 링크

  YAML 본문 링크는 [[참조]]의 대상 필드와 이름·도메인 해석을 적용하고 LSP DocumentLink로 제공한다. 메타데이터의 같은 표기를 링크로 확장하지 않는다.
  [[문서 동기화]]의 현재 편집 관측에서 출현별 범위를 유지하고 [[참조 후보를 문서 연결로 확정하는 절차]]의 결과를 사용한다.
  단일 확정 대상은 본문의 링크를 누르면 해당 문서를 연다.
  복수 후보이면 참조 위의 호버에 후보별 원문 링크를 표시한다. 본문 참조 자체에는 이동 대상을 지정하지 않으므로 본문에서 이동 클릭을 해도 파일을 열거나 후보 선택 창을 띄우지 않는다.
  사용자가 호버의 개별 후보 링크를 선택하면 그 후보의 원문을 연다. 코드 ID 매칭 설명과 YAML 이름 참조 후보를 섞지 않는다.
  임의 대표를 선택하거나 같은 본문 범위에 여러 이동 대상을 겹쳐 지정하지 않는다. 후보 링크를 제공하는 것과 단일 연결을 확정하는 것은 구분한다.
  링크 대상의 본문이나 전이 참조는 자동으로 확장하지 않는다.

  [[문서 색인]]이 제공하는 폐기 상태 참조 경고는 참조를 작성한 YAML의 확인된 위치에 표시한다. 경고가 있어도 링크와 원문 열기는 유지한다.
  진단은 확인된 파일·위치에 표시하고 사용자는 원문을 편집한다. 대상의 부재와 미확정 상태를 구분하며, 참조 텍스트 자체를 자동 삭제하지 않는다.

  ## 후보의 표시 이름

  코드 Hover와 YAML 참조 후보에서 표시 이름이 겹치면 도메인과 .codocs 기준 상대 경로를 함께 표시한다. 도메인이 없으면 경로만 덧붙이고 같은 도메인의 후보도 경로로 구분한다.
  예를 들어 `예약 — 결제 · payment/reservation.yaml`과 `예약 — 배송 · shipping/reservation.yaml`로 표시한다.
  이름이 겹치지 않는 후보는 이름만 표시한다. 표시를 구분하기 위한 경로·도메인을 후보의 우선순위로 사용하지 않는다.

  ## 변경 반영과 원문 이동

  [[색인 갱신]]의 결과가 반영되면 다음 Hover·링크 조회는 최신 매칭·참조 해석을 사용한다. 이미 표시 중인 Hover의 즉시 제자리 갱신은 보장하지 않으며 강제로 닫거나 다시 열지 않는다. 단순 본문 변경이나 원문 버전 변경만으로 사용자의 링크 재선택을 요구하지 않는다.
  이동한 대상이 새 위치에서 확인되면 설명과 링크를 유지하고 경로를 갱신한다. 삭제로 대상의 부재가 확인되면 해당 설명·링크를 제거하고, 완전한 관측에서 다른 매칭도 없으면 Codocs Hover를 표시하지 않는다.
  부분 읽기나 준비 중 상태를 삭제로 단정하지 않는다. YAML의 끊어진 참조 등 필요한 진단은 유지하며 이동·삭제 자체의 팝업은 표시하지 않는다.

  이미 표시된 링크를 클릭할 때도 최신 대상 확인을 거친다. 예전 경로의 존재만으로 같은 대상이라고 판단하거나 새로 생긴 다른 문서를 대신 열지 않는다. 대상이나 선택한 후보를 확인할 수 없으면 열지 않는다.
  단일 DocumentLink도 직접 file 이동 대신 검증 명령을 사용한다. 복수 후보의 개별 선택을 단일 이름 연결로 해석하거나 코드 ID 조회로 바꾸지 않는다.
  원문 열기 명령에는 출처 URI와 서버가 확인한 후보의 불투명 선택 토큰만 전달한다. 확인 근거가 없으면 실행 명령을 만들지 않는다. 탭 재사용·편집 내용 보존·기본 이동 위치는 [[원문 열기]]에서 정의한다.

  ## 명시 코드 참조의 LSP 표현

  표준 DocumentLink는 유효한 전체 @codocs span과 완료 단일 역참조 영역을 제공한다. 기존 이름 링크의 정확한 범위를 제외한 같은 행의 나머지 영역에는 단일 코드 이동을 유지한다.
  무효 span에는 구별 가능한 진단 코드와 이유만 표시하며 기존 ID 설명을 섞지 않는다. 정상 명시 링크에는 설명 Hover를 추가하지 않는다.
  문서 전체 표시는 표준 InlayHint의 첫 행 위치·label command·Markdown tooltip을 사용한다. textEdits나 임의 대표 이동을 만들지 않는다. 코드 수집과 저장 문서 탐색의 완전성은 따로 확인하며 미확인을 완료된 0곳으로 표현하지 않는다.
