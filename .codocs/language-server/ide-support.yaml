id: ide-support
name: 'IDE 지원'
domains:
  - 'Language Server'
definition: |
  편집 중 코드를 이해할 수 있도록 문서 설명·진단·원문 링크를 제공하는 언어 서버의 계약이다.
  [[문서 동기화]]로 확인한 최신 매칭 문자열에 [[코드 식별자 매칭]]을 적용하고 결과의 후보와 근거를 표시한다.
  현재·이전 ID의 비교와 순위는 매칭 계약에서 정의하며 표현 때문에 후보나 원본 위치를 버리지 않는다.

  ## 표현별 담당 계약

  [[코드 호버]]는 커서 위치의 후보 설명·보조 링크·오류 안내를 정의한다.
  입력 후보 추천·삽입의 제공 범위는 [[코드 자동완성]]의 결정을 따른다.
  오류·경고의 공통 필드와 좌표는 [[진단]]을 적용한다.

  ## 원문 이동

  보조 링크에는 해당 문서의 YAML 원문 위치를 제공한다. VS Code의 탭 재사용과 이동은 [[원문 열기]]에서 정의한다.
  문서 간 YAML 참조 링크는 이름 기반 참조 계약을 유지한다. 진단은 확인된 파일·위치에 표시하고 사용자는 원문을 편집한다.
