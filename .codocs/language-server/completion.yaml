id: completion
name: '코드 자동완성'
domains:
  - 'Language Server'
kind: decision
status: confirmed
definition: |
  코드 자동완성은 입력 중인 식별자에 문서 ID 기반 후보를 추천하고, 선택한 표기를 코드에 삽입하는 작성 편의 기능이다.
  현재 제품의 제공 범위에서 제외하며, 도입을 다시 판단할 때의 근거를 관리한다.

  ## 제공 범위의 판단

  [[제품]]은 코드 이해와 지식 연결을 핵심 가치로 삼는다.
  개발자가 코드의 의미와 계약을 확인하는 [[코드 호버]]·원문 이동, AI가 필요한 지식을 읽는 [[조회]]를 우선한다.
  입력 후보의 표기 변환·교체 범위·편집 버전·편집기 연동을 별도로 유지하는 비용에 비해 코드 이해에 더하는 효용이 충분한지 확인되지 않았으므로 자동완성 제공은 보류한다.
  이는 자동완성이 모든 개발 흐름에서 불필요하다거나 AI가 항상 정확한 ID를 사용한다는 판단은 아니다.

  코드 식별자를 문서와 연결하고 현재·이전 ID의 의미와 진단을 확인하는 [[코드 식별자 매칭]]과 [[IDE 지원]]은 유지한다.
  자동완성 전용 후보 추천·삽입·교체와 그 기능·성능 검증은 현재 제공 범위의 완료 조건으로 삼지 않는다.

  ## 재검토 기준

  실제 사용에서 코드 이해를 위한 용어 탐색을 기존 호버·원문 이동·조회로 해결하기 어려운 사례가 반복되면 자동완성의 필요성과 비용을 다시 검토한다.
  도입을 결정할 때 후보·표기·교체 범위·최신성·검증 기준을 새로 확정하며, 과거의 삽입 예시를 현재 동작 보장으로 사용하지 않는다.
