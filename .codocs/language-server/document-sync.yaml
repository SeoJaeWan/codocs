id: document-sync
name: '문서 동기화'
domains:
  - 'Language Server'
definition: |
  편집 중인 코드의 내용·버전·위치를 언어 서버에서 함께 유지하는 계약이다.
  디스크에 저장된 .codocs 지식 파일의 [[색인 갱신]]과 구분한다.

  ## 버전과 좌표

  LSP 문서 동기화와 vscode-languageserver-textdocument로 최신 편집 내용을 관리한다.
  언어별 어댑터는 코드에서 식별자와 원본 위치를 추출하고 [[코드 식별자 매칭]]에 식별자 문자열을 전달한다.
  식별자 내부 상대 범위를 원본 시작 위치에 대응시켜 파일 좌표로 변환한다.
  이전 버전에서 계산한 위치를 새 코드에 적용하지 않는다.

  지원 언어·추출 방식·주석과 문자열의 범위·미지원 언어 동작은 어댑터별로 명시한다.
  책임 분리 자체가 특정 언어 지원을 보장하지 않는다.
  후보와 오류를 사용자에게 표현하는 기준은 [[IDE 지원]]에서 확인한다.
