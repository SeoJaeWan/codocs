id: document-sync
name: '문서 동기화'
domains:
  - 'Language Server'
definition: |
  편집 중인 텍스트 문서의 내용·버전·위치를 언어 서버에서 함께 유지하는 계약이다.
  디스크에 저장된 .codocs 지식 파일의 [[색인 갱신]]과 구분한다.

  ## 버전과 좌표

  LSP 문서 동기화와 vscode-languageserver-textdocument로 최신 편집 내용을 관리한다.
  언어 공통 추출은 편집 중 텍스트에서 매칭할 문자열과 원본 위치를 추출하고 [[코드 식별자 매칭]]에 전달한다.
  매칭 문자열 내부 상대 범위를 원본 시작 위치에 대응시켜 파일 좌표로 변환한다.
  이전 버전에서 계산한 위치를 새 코드에 적용하지 않는다.

  ## 언어 공통 텍스트 매칭

  프로젝트에 연결된 텍스트 문서는 프로그래밍 언어나 확장자로 매칭 지원을 제한하지 않는다.
  TS·TSX·JS·JSX뿐 아니라 Java 등에도 같은 텍스트 추출·매칭 규칙을 적용한다.
  주석·문자열·JSX 화면 텍스트도 매칭 대상에 포함한다. 언어별 파서로 코드 구문을 구분하지 않는다.
  코드 문법 오류 여부로 매칭을 차단하지 않으며, 문법 검사·진단 기능을 추가하지 않는다.
  문자·단어 경계와 비교 규칙은 [[코드 식별자 매칭]]을 따른다. 언어 공통 처리가 모든 문자 체계의 매칭 지원을 뜻하지는 않는다.
  이 범위는 구현·검증할 계약이며 지원 완료를 뜻하지 않는다.

  ## 매칭과 색인 연결

  같은 열린 문서에서 추출한 매칭 문자열은 작업 공간이 관리하는 같은 시점의 색인으로 매칭한다.
  공통 코어에는 열린 문서의 전체 텍스트를 전달하고, 코어가 계산한 모든 후보·근거·UTF-16 범위를 색인의 상태·버전과 함께 관리한다.
  코드 버전이 바뀌면 이전 결과를 적용하지 않으며, 저장된 .codocs가 바뀌어도 매칭 결과를 갱신한다.
  목록 커서의 연속성에 사용하는 세대와 매칭 결과의 최신성 기준을 구분한다.

  Hover는 코드 매칭이 반환한 경로를 그 매칭의 catalogVersion과 함께 상세 조회한다. 상세 조회 전에 코드 원문·버전이 바뀌거나 같은 catalogVersion을 확인할 수 없으면 이전 관측의 내용과 좌표를 새 코드에 적용하지 않는다.

  ## 명시적 참조의 편집 관측

  [[명시적 코드 참조]]의 추가·수정·삭제와 출현 좌표는 열린 출처의 현재 텍스트·버전으로 갱신한다.
  [[코드 참조 색인]]의 검색 대상인 파일만 저장 관측을 미저장 버퍼로 대체하며, 파일을 열었다는 이유로 검색 제외를 해제하지 않는다.
  닫기·변경 취소·프로젝트 소유권 변경 뒤에는 그 출처의 편집 관측과 선택 근거를 해제하고 실제 원문 관측을 사용한다.
  대상 YAML의 이름·도메인과 지정 범위 해석은 저장된 문서 관측을 사용한다. 대상의 미저장 내용을 운영 후보 색인에 합치지 않는다.
  오래된 편집 좌표·비동기 응답을 새 버전에 적용하지 않으며 표시·클릭 검증은 [[IDE 지원]], 실제 버퍼 선택과 보존은 [[원문 열기]]에서 담당한다.

  ## YAML 본문 편집과 이름 참조

  YAML 본문의 참조와 원문 범위는 저장 전이라도 현재 편집 내용·버전을 기준으로 계산한다. 참조 문자열을 수정·삽입·삭제하면 이전 문자열이나 이전 위치에 링크를 남기지 않는다.
  연결할 대상 문서 검색은 작업 공간의 기존 색인을 사용한다. 열린 대상 문서들의 미저장 변경을 운영 색인에 일괄 반영하지 않는다.
  편집 버전이나 대상 색인이 달라진 뒤 도착한 응답은 새 내용에 적용하지 않는다. 닫힌 문서에 편집 중 관측을 계속 적용하지 않는다.
  같은 열린 문서와 완료 색인 관측의 이름 참조 계산은 링크·Hover·진단 요청에서 공유한다. 편집·닫기·workspace 소유권 변경은 캐시와 해당 출처의 선택 근거를 해제한다.
  완료 snapshot 게시 알림으로 진단을 다시 계산하고 클라이언트의 Hover·DocumentLink provider를 갱신한다. 알림을 받았다는 사실만으로 준비·실패 관측을 완료된 부재로 바꾸지 않는다.
  표시 관측과 출처·서버 세션의 유효성은 분리한다. 응답 중 완료 관측이 바뀌면 낡은 표시 결과를 적용하지 않고 제한된 재조회로 최신 결과를 얻는다. 편집 버전·닫기·취소·소유권·서버 교체는 계속 결과를 무효화한다. provider 재등록 자체는 이미 보이는 Hover의 갱신 증거가 아니다.

  [[코드 호버]]는 이 관측을 사용하며, 후보와 오류의 공통 표현 기준은 [[IDE 지원]]에서 확인한다.

  ## 편집 중 ID 중복 검사

  열린 지식 문서의 ID는 저장을 기다리지 않고 현재 편집 내용으로 검사한다. 현재 문서의 저장된 항목을 제외한 다른 문서들의 저장된 ID와 비교한다.
  현재 문서의 파싱 결과와 기존 ID 색인을 재사용하며 키 입력마다 작업 공간 전체를 다시 읽거나 색인을 재구축하지 않는다.
  여러 문서의 미저장 ID를 하나의 운영 색인으로 합치지 않는다. 다른 문서에 대한 중복 진단의 변경은 저장 후 색인 갱신에 따라 반영한다.
  현재 편집 버전·색인 관측과 진단 위치를 함께 관리하며 오래된 비동기 응답을 최신 편집에 게시하지 않는다. 문서를 닫으면 저장된 관측으로 돌아간다.
  재검사 실패 시 이전 결과와 현재 상태의 구분은 [[IDE 지원]]을 따른다.

  코드 관측을 요청하기 전에 같은 프로젝트의 열린 source들을 공개 코드 buffer API에 현재 버전으로 등록한다. 같은 버전의 동기화는 공유하고 편집·닫기·소유권 변경에서 이전 선택을 즉시 해제한다.
  코드 수집 알림은 기존 YAML 진단의 원문·catalog 세대와 별도로 처리한다. source 편집과 완료 catalog 관측은 계속 기존 진단 최신성 검사를 유지한다.
