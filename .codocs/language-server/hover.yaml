id: hover
name: '코드 호버'
domains:
  - 'Language Server'
definition: |
  코드의 커서 위치에서 연결된 문서의 설명과 보조 링크를 보여주는 계약이다.
  [[문서 동기화]]로 확인한 위치와 [[코드 식별자 매칭]]의 후보·순위를 사용한다.

  ## 내용과 기본 정보

  커서 위치의 최상위 후보는 문서 이름과 정의를 먼저 표시하고, 확인한 현재 ID·도메인·원문 열기 링크를 이어서 제공한다. 최상위 동률 후보는 각각 내용을 표시하며 후보를 임의로 생략하지 않는다.
  후보의 표시 이름은 [[IDE 지원]]의 공통 구분 규칙을 적용한다.

  ## 연결 관계별 링크

  겹치는 후순위 후보와 동일 식별자의 다른 위치에서 매칭된 용어는 내용 없이 문서 이름의 링크만 제공한다. 보조 후보의 범위는 커서가 속한 식별자 안으로 한정하며, 식별자 묶음의 경계는 [[코드 식별자 매칭]]에서 정의한다. 같은 파일의 다른 식별자에서만 매칭된 후보는 보조 링크에 포함하지 않는다. 같은 문서의 보조 링크는 중복 제거한다.
  reservationReturnZones의 reservation에 Hover하면 예약 내용과 return-zone 링크를, ReturnZones에 Hover하면 반납 구역 내용과 reservation 링크를 제공한다.
  최상위 후보가 모두 현재 ID 중복 상태여도 정상적인 보조 후보를 숨기지 않는다. reservation 후보가 둘이면 두 충돌 문서의 링크와 함께 return-zone 보조 링크를 유지하며, 예약 설명 하나를 임의 대표로 선택하지 않는다.

  기본 정보 아래의 링크는 연결된 이유에 따라 구분한다.

  - 함께 매칭된 용어: 동일 식별자 안의 보조 후보를 연결한다.
  - 이 문서가 참조: 표시 중인 문서의 직접 참조 대상을 연결한다.
  - 이 문서를 참조: 표시 중인 문서를 직접 참조하는 문서를 연결한다.

  해당하는 링크가 없는 항목은 생략한다. 도메인 소개·관련 업무 지식도 직접 참조와 역참조를 통해 연결하며, 대상 문서의 본문이나 전이 연결을 자동으로 펼치지 않는다.
  링크가 가리키는 YAML의 경로·위치는 [[IDE 지원]]에서 전달하고, 클릭하면 [[원문 열기]]로 해당 문서를 열거나 기존 탭으로 이동한다.

  ## 이전 ID와 오류 안내

  현재/이전 ID 충돌에서는 후보별 근거를 표시하고 코드 전체를 이전 ID로 단정하지 않는다. 이전 ID 후보에는 확인한 현재 ID를 항상 안내하고 유효한 message가 있으면 함께 표시한다. message가 없으면 “이전 ID입니다. 현재 ID: return-zone” 같은 기본 안내를 제공한다. 이전 ID 보조 링크에도 이전 ID임을 표시한다.
  같은 문서·같은 범위에 현재 매칭도 있으면 내용을 한 번만 보여주며 이전 ID 경고는 하지 않는다. 보조 링크에도 같은 규칙을 적용하되 다른 출현 위치의 이전 ID 근거까지 제거하지 않는다.
  현재 ID를 이전 ID 목록에도 등록한 문제는 [[문서 검증]]의 YAML 진단으로 유지한다. 이 중복 등록 경고는 코드 Hover에 추가 표시하지 않는다.
  필수 필드 누락 등 문서 오류는 Hover에도 표시하고 확인 가능한 내용·원문 링크를 유지한다. 예: “필수 필드 definition이 누락되었습니다.” 잘못된 message에는 기본 변경 안내와 필드 오류를 표시한다. 현재 ID를 확인할 수 없으면 해당 오류를 안내한다.
  현재 ID 중복은 중복 오류와 모든 충돌 문서의 링크를 제공하며 정상 대표 내용을 선택하지 않는다.
  읽지 못한 문서가 있으면 “일부 문서를 읽지 못해 후보가 누락될 수 있습니다”라고 안내한다.

  ## 프로토콜과 원문 명령

  Language Server는 initialize에서 표준 hoverProvider를 알리고 textDocument/hover에 표준 Markdown Hover를 반환한다. 매칭이 없는 완전한 관측은 null이며, 부분 관측·색인 준비·조회 실패는 서로 다른 안내를 제공한다.
  매칭에 사용한 코드 버전이 상세 조회 중 바뀌거나 상세 조회의 catalogVersion이 매칭 관측과 다르면 늦은 결과를 폐기한다. 취소된 요청도 본문이나 범위를 반환하지 않는다.

  원문 링크는 Language Server가 생성한 codocs.openSource command만 사용한다. 링크 인자는 file URI와 같은 관측의 catalogVersion·확인된 원문 revision 등 검증에 필요한 정보를 포함한다. YAML 최상위 범위를 기본 이동 대상으로 사용하지 않으며 이동 위치는 [[원문 열기]]를 적용한다.
  링크의 변경 반영과 클릭 시 최신 대상 확인은 [[IDE 지원]]에서 정의한다. 이름·정의·message·진단 같은 문서 입력은 command 링크나 임의 Markdown 실행 구문이 되지 않도록 표시용으로 이스케이프한다.
