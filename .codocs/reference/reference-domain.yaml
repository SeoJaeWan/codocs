id: reference-domain
name: '참조 도메인'
domains:
  - '참조'
kind: procedure
status: confirmed
definition: |
  참조 도메인은 이름으로 표현한 문서 관계를 검색하고 연결을 유지하는 영역이다.
  표기와 후보 정보를 이해한 뒤 연결 판단과 이름 변경에 적용한다.

  ## 표기와 검색 정보

  - [[참조]]: 이름·도메인 표기와 본문 추출 규칙을 확인한다.
  - [[참조 후보]]: 검색된 문서의 정보와 아직 연결이 확정되지 않은 상태를 이해한다.
  - [[문서 색인]]: 문서별 검색 정보와 직접·역참조 기록을 확인한다.

  ## 연결 확정과 변경

  - [[참조 후보를 문서 연결로 확정하는 절차]]: 후보를 집계하고 실제 연결 대상을 판단한다.
  - [[이름 변경 시 기존 참조의 의미 보존]]: 변경 전후의 대상과 수정 영향을 확인한다.

  탐색이 완전하지 않아 판단 근거가 부족하면 [[불완전한 탐색에서 색인과 연결을 유지하는 절차]]에서 기록 보존과 연결 확정 조건을 확인한다.
