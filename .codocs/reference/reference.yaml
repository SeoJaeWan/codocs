id: reference
name: '참조'
domains:
  - '참조'
definition: |
  문서 본문에서 다른 문서를 이름으로 가리키는 표기다.
  이름만 쓰는 표기와 도메인을 명시한 표기를 지원한다.

  ## 이름과 표기

  이름·도메인은 공백과 대소문자를 포함해 정확히 해석하며 자동 보정하지 않는다.
  첫 번째 이스케이프되지 않은 콜론은 도메인과 이름의 구분자다.
  이름·도메인 안의 콜론은 escape한다.

  참조 시작 앞의 연속 백슬래시가 홀수이면 일반 글자로 취급한다.
  문법은 YAML 해석 후의 본문 문자열에 적용한다.

  빈 이름·잘못된 괄호·추가 구분자·미완성은 문법 오류다.
  잘못된 참조 뒤의 독립된 정상 참조는 계속 찾는다.

  ## 본문에서의 추출

  definition과 문자열 examples 원소에서 추출하며 문서 이름·이전 명칭·사용자 필드에서는 추출하지 않는다.
  저장 속성의 의미는 [[문서]]에서 확인한다.

  종류 판별이나 전체 검증 성공을 요구하지 않고 확인된 문자열에서 추출한다.
  다른 필드가 틀려도 정상 문자열은 유지하며 examples의 잘못된 자료형 원소만 제외한다.
  값을 문자열로 강제 변환하지 않는다.

  YAML 파싱 실패에서는 원문 검색으로 참조를 추측하지 않는다.
  반복해서 나타나는 참조의 각 원문 위치를 보존한다.

  ## 원문 위치

  해석 문자열의 offset을 YAML 원문에 단순히 더하지 않는다.
  [[YAML 파싱]]이 보존한 해석값과 원문 위치의 대응으로 따옴표·escape·접힌 문자열의 실제 등장 위치를 찾는다.
