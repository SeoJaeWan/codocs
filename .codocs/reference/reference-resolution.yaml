id: reference-resolution
name: '참조 후보를 문서 연결로 확정하는 절차'
domains:
  - '참조'
  - '작업 공간'
kind: procedure
status: confirmed
definition: |
  ## 목적

  [[참조]]가 가리키는 문서를 [[문서 색인]]에서 찾고 [[참조 후보]]를 확정 연결로 바꾸는 절차다.
  후보 수를 판단할 때는 [[발견 경로]]와 탐색의 확인 상태를 함께 사용한다.

  ## 후보 찾기와 집계

  이름만 지정했으면 전체 이름 공간에서, 도메인도 지정했으면 그 도메인에서 정확 비교한다.
  작성 문서의 도메인에 우선순위를 두지 않는다.

  같은 발견 경로가 여러 소속 도메인을 통해 검색돼도 후보 하나로 센다.
  같은 실제 파일이라도 발견 경로가 다르면 별도 문서로 센다.
  같은 ID라는 이유로 후보 경로를 합치지 않는다.

  ## 확인 상태와 대상 선택

  탐색이 완전하게 확인되지 않았다면 [[불완전한 탐색에서 색인과 연결을 유지하는 절차]]로 판단한다.
  확인된 검색에서 후보가 없으면 부재, 여러 개면 모호함을 안내한다.

  후보 하나의 이름으로 대상을 특정할 수 있으면 ID 오류가 있어도 연결하고 대상 오류를 함께 안내한다.
  자기 발견 문서는 연결에서 제외한다. 같은 문서의 다른 소속 도메인으로 표기해도 같다.
  서로 다른 문서 사이의 상호 참조는 허용한다.

  ## 색인에 반영

  확정된 직접 대상과 역참조만 문서 색인의 연결 목록에 넣는다.
  목록은 발견 경로로 중복 제거하고 경로 오름차순으로 정렬하며 반복 등장 위치는 모두 보관한다.

  부재·모호함·문법 오류·미확인·자기 참조는 등장 기록과 진단만 남긴다.
  모호한 후보 문서의 역참조에 작성 문서를 임의 등록하지 않는다.
  연결된 본문이나 전이 관계는 자동 펼치지 않는다.
