_codocs:
  id: document
  name: '문서'
definition: |
  문서는 이름을 붙여 찾아보고 참조할 수 있는 설명의 단위다.
  개념의 정의뿐 아니라 규칙·조건·예외·판단 근거·작업 흐름을 담을 수 있다.

  ## 설명의 범위

  이름이 가리키는 주제와 독자가 이 문서에서 해결할 질문을 중심으로 작성한다.
  한 주제를 설명하는 데 여러 개념이 필요하다는 이유만으로 다른 종류의 문서로 나누지 않는다.

  다른 문서의 설명이 필요하면 [[참조]]로 연결하고, 이 문서에서는 그 설명이 필요한 상황과 관계를 적는다.
  독자가 현재 주제를 이해할 수 있는 맥락은 남기되 대상 문서의 규칙 전체를 복제하지 않는다.

  길이나 참조 개수로 문서의 종류를 판정하지 않는다.
  별도 이름으로 관리할 부분이 있는지는 [[설명 분리]]의 권장 기준으로 검토한다.

  ## 내용 작성과 갱신

  용어의 의미·동작·정책·조건·예외·판단 근거와 책임을 설명한다.
  구현 예정·진행·완료 여부, 담당 작업과 PR·이슈 배정 등 개발 진행 상황은 본문에 기록하지 않는다.
  개발 진행만 바뀌면 문서를 수정하지 않고 설명하는 의미·동작·정책이 바뀌면 수정한다.
  개발 진행 상황을 담는 별도 문서도 만들지 않으며 진행 기록은 이슈·PR 등 작업 관리 도구에서 관리한다.
  구현이 계약과 다르면 수정할 작업을 이슈·PR에 기록한다.
  미합의 정책을 확정된 동작처럼 쓰거나 단순히 기록을 지워 확정된 것으로 만들지 않는다.

  이 원칙은 프로젝트에 맞게 조정할 수 있는 기본 권장 지침이다.
  따르지 않았다는 이유로 제품이 검증 오류·경고를 만들거나 저장을 차단하지 않는다.
  지침 적용 여부와 필수 필드·허용 값 검증은 별개다.

  ## 표현과 소속

  어떤 책임 영역에 속하는지는 [[도메인]]으로 나타낸다.
  개념 설명과 작업 흐름에 같은 문서 형식을 사용한다.

  ## 저장 속성

  YAML 파일 하나에 문서 하나를 저장하며 별도 type 필드는 사용하지 않는다.
  개념·규칙·작업 흐름 모두 아래 형식을 사용한다.

  | 속성 | 필수 | 역할 |
  | --- | --- | --- |
  | id | 예 | 변경 가능한 영어 식별자이자 코드 매칭 기준 |
  | name | 예 | 원하는 언어의 문서 이름이자 문서 간 참조 기준 |
  | definition | 예 | 정의·규칙·조건·예외·판단 근거·작업 흐름 |
  | domains | 예 | 하나 이상의 소속 도메인 문자열 배열 |
  | examples | 아니오 | 예문 문자열 배열 |
  | deprecatedAliases | 아니오 | 코드 매칭을 유지할 이전 ID 객체 배열 |
  | kind | 아니오 | 내용의 성격 |
  | status | 아니오 | 내용의 합의·적용 상태 |

  선택 속성은 모든 문서에서 함께 사용할 수 있으며 생략한 값은 자동 보충하지 않는다.
  공개 문서 타입은 Document이며 설명의 종류에 따라 별도 형식을 요구하지 않는다.

  ## 이전 형식의 전환

  기존 type은 제거하고 title은 name, body는 definition, domain 문자열은 domains 배열로 옮긴다.
  이름·본문·ID와 기존 복수 도메인의 값은 그대로 유지한다.
  같은 이름으로 유지한 문서의 참조는 폴더를 옮겨도 바뀌지 않는다.

  이전 문서를 자동 변환하거나 두 형식을 함께 해석하는 호환 계층은 제공하지 않는다.
  type·title·body·domain은 일반 사용자 속성으로 보존·경고되며 필수 속성을 대신하지 않는다.
  이전 속성이 남아 있어도 새 필수 속성이 모두 유효하면 경고와 함께 성공한다.

  ## 식별자와 이름

  ID는 프로젝트 전체에서 유일하며 소문자·숫자를 하이픈으로 연결한다.
  형식은 `^[a-z0-9]+(?:-[a-z0-9]+)*$`이며 시작·끝·연속 하이픈, 공백과 밑줄을 허용하지 않는다.
  문서용 이름·도메인·위치 변경만으로 ID를 바꿀 필요는 없지만 코드 용어를 바꾸면 ID도 바꿀 수 있다.

  ID 중복은 오류이며 중복 검사로 변경 이력을 추적하지는 않는다.
  ID 기반 조회·수정은 현재 ID를 사용하고 이전 ID로 자동 연결하지 않는다.
  코드 표기와 현재·이전 ID를 연결하는 방법은 [[IDE 지원]]에서 설명한다.
  ID 변경 기능과 직접 편집의 이전 ID 목록 관리 방식은 [[저장]]에서 설명한다.

  문서용 이름은 하나의 이름 공간을 사용한다.
  다른 도메인의 동명은 허용하지만 같은 도메인에 같은 이름이 있으면 충돌이다.
  여러 소속을 선언한 문서는 각 도메인에 등록한다.
  이름과 도메인은 공백·대소문자까지 정확히 비교한다.

  본문의 [[참조]]는 문서용 이름을 사용한다.
  ID만 바뀌고 문서용 이름이 같으면 본문 참조는 유지된다.

  ## 값과 선택 속성

  필수 문자열과 작성한 선택 문자열은 비거나 공백뿐일 수 없다.
  알려진 속성의 자료형에 맞지 않는 null과 빈 배열 원소 문자열은 오류다.
  examples·deprecatedAliases는 빈 배열을 허용한다.

  deprecatedAliases는 현재도 코드 매칭을 허용하는 이전 ID의 객체 배열이다.
  항목의 id는 필수이며 현재 ID와 동일한 형식 규칙을 적용한다. message는 선택 변경 안내 문자열이다.
  모든 과거 변경 사건을 기록하는 이력 저장소로 사용하지 않는다.
  aliases는 일반 사용자 필드이며 이름 참조·코드 매칭 기능을 부여하지 않는다.
  현재 사용하는 다른 이름을 별도 문서로 설명할 때는 원래 뜻을 참조한다.

  kind는 policy·procedure·decision·discussion이며 규칙·순서·선택과 이유·쟁점과 대안을 뜻한다.
  status는 문서 내용의 합의·적용 상태를 나타낸다.

  | 값 | 의미 |
  | --- | --- |
  | proposed | 제안되어 검토 중인 내용 |
  | confirmed | 합의된 내용 |
  | deprecated | 적용이 종료되어 참고용으로 보존하는 내용 |

  개발 작업의 대기·진행·완료를 나타내지 않으며 confirmed도 구현 완료를 뜻하지 않는다.
  생략은 확정 여부 미명시이며 자동 확정이나 경고를 만들지 않는다.
  kind와 status의 조합을 강제하지 않는다.

  ## 사용자 속성과 저장 위치

  사용자 속성은 내부까지 재귀적으로 JSON 표현 가능 여부를 검사하고 보존하며 unknown_field 경고를 남긴다.
  비유한 숫자 등 JSON으로 표현할 수 없는 값은 오류다.

  제품은 고정 폴더 계층·config.yaml·문서별 버전 선언을 요구하지 않는다.
  파일·폴더 이름에서 식별자나 소속을 추론하지 않는다.
  속성별 최대 글자 수 제한은 두지 않으며 파일 크기와 중첩 한계는 성능 검증으로 정한다.

  잘못된 필드가 있어도 확인 가능한 이름·소속·본문은 버리지 않는다.
  개별 형식 검사와 프로젝트 충돌 검사의 경계는 [[문서 검증]], 오류 문서의 접근은 [[검증 오류가 있는 문서를 조회하고 수정하는 절차]]에서 설명한다.
