id: explanation-separation
name: '설명 분리'
domains:
  - '문서 모델'
definition: |
  설명 분리는 한 문서의 일부를 독립적으로 찾고 유지할 수 있는 문서로 나눌지 판단하는 작업이다.
  [[문서]]의 설명 범위를 정할 때 사용하는 기본 권장 사항이며 필수 작성 규칙은 아니다.

  ## 기본 권장 기준

  | 판단 기준 | 권장 처리 |
  | --- | --- |
  | 다른 곳에서도 같은 설명이 필요하다 | 별도 문서로 분리하고 참조한다. |
  | 이름을 붙여 따로 찾아볼 만한 주제다 | 별도 문서로 분리한다. |
  | 다른 내용과 독립적으로 변경되는 규칙이다 | 별도 문서로 분리한다. |
  | 현재 주제 안에서만 의미 있는 조건·예외다 | 현재 문서에 유지한다. |
  | 길지만 계속 같은 질문에 답하고 있다 | 우선 제목·문단으로 정리한다. |

  프로젝트의 독자와 유지 방식에 맞춰 기준을 조정하거나 다른 구성을 선택할 수 있다.
  이 권장 사항을 따르지 않았다는 이유로 검증 오류·경고를 만들거나 저장을 차단하지 않는다.

  ## 분리한 뒤의 연결

  기존 문서가 같은 설명을 소유하고 있으면 새 문서를 만들기 전에 그 내용을 보완한다.
  분리한 문서는 다른 곳에서 찾아 읽어도 주제와 적용 조건을 이해할 수 있게 작성한다.

  원래 문서에는 [[참조]]와 함께 해당 설명이 필요한 시점·이유를 남긴다.
  단순 참조 목록만 남겨 원래 질문에 대한 답을 잃거나, 분리한 규칙을 양쪽에 그대로 유지하지 않는다.

  참조 횟수나 문장 길이만으로 자동 분리하지 않는다.
  다른 이름을 언급하거나 여러 도메인에 속한다는 사실만으로 분리할 필요도 없다.
