id: parse-yaml
name: 'YAML 파싱'
domains:
  - 'Core'
definition: |
  YAML 원문을 데이터로 해석하고 해석값과 원문 위치의 대응을 보존하는 처리다.
  [[문서]]의 속성을 검사하기 전에 원문의 구조와 값을 확인한다. 해석한 데이터가 문서 형식에 맞는지는 [[문서 검증]]에서 판단한다.

  ## 원문 해석과 문서 검증의 경계

  원문이 [[문서]]의 YAML 저장 형식에 맞는지 확인하고 데이터로 해석한다.
  허용하는 구문과 제한 기준은 해당 문서에서 정의한다.

  파싱 성공은 문서 형식의 유효성을 뜻하지 않는다.
  예를 들어 id가 숫자이거나 필수 속성이 누락되어 있어도 YAML로 해석할 수 있으면 값을 그대로 전달하고 [[문서 검증]]에서 오류를 판단한다.
  누락된 속성을 보충하거나 원문을 정규화하지 않는다.

  ## 원문 위치의 보존

  원문에는 따옴표·주석·CRLF·여러 줄 문자열과 Unicode escape가 있다.
  해석한 문자열의 길이만으로 원문 위치를 계산하면 다른 글자를 가리키거나 수정할 수 있다.
  YAML을 해석한 뒤 전체 문서를 다시 직렬화하면 데이터의 의미는 같더라도 따옴표·공백·주석·줄바꿈 등 사용자가 작성한 원문 표현이 달라질 수 있다.
  따라서 원문과 확인한 필드 위치를 함께 유지하며 키·값·속성 전체의 위치를 구분한다.

  YAML 매핑은 서로 다른 원문 표기로 작성될 수 있다.
  [[YAML 매핑 표기]]에 따라 속성의 원문 경계를 구분한다.
  값의 범위는 따옴표를 포함하고, 속성 전체 범위는 같은 줄·값 내부 주석을 포함하되 앞의 독립 주석을 제외한다.
  block 매핑의 속성 전체 범위는 해당 줄바꿈까지 포함한다.
  flow 매핑의 속성 전체 범위는 주변 쉼표를 제외하되, 뒤의 쉼표 다음에 같은 줄 주석이 있으면 그 쉼표와 주석·줄바꿈까지 포함한다.

  ## 해석 문자열과 원문의 대응

  문자열을 해석할 때 [[문자열 위치 대응]]으로 해석값과 원문 구간을 연결한다.
  escape·줄 접기로 길이가 달라지는 경우의 대응과 문자열 내부 범위 조회는 해당 문서에서 확인한다.

  ## 위치 조회의 기준

  키·값·속성의 원문 위치는 문서 안의 [[필드 경로]]에 연결한다.
  원문 offset은 전체 문자열 시작 기준이며 0 기반 UTF-16 코드 단위로 시작 포함·끝 제외 범위를 나타낸다.
  줄·문자 기준의 range와 원문 offset은 서로 다른 표현이므로 구분한다. 진단 좌표의 기준은 [[진단]]에서 확인한다.
  확인되지 않은 위치는 추측하지 않고 범위를 생략한다.

  ## 실패와 예외

  문법 오류가 있거나 [[문서]]의 YAML 저장 형식에서 허용하지 않는 원문은 파싱 실패로 반환한다.
  중복 키는 뒤의 키를 진단하고 어느 값도 임의 선택하지 않는다.

  YAML 라이브러리가 오류가 있는 원문에서 일부 구조를 읽어냈더라도 오류가 하나라도 확인되면 파싱 실패로 반환한다.
  실패 결과에는 원문과 [[진단]]을 보존하지만 후속 검증·색인에 사용할 정상 데이터와 필드·문자열 위치 정보는 제공하지 않는다.
  진단에는 확인된 오류의 원문 위치를 포함할 수 있다.

  파싱에 실패한 원문을 문자열 검색으로 다시 뒤져 ID나 참조를 임의로 추출하지 않는다.

  ## 코드와 검증 위치

  대표 함수 parseYaml과 원문 범위 조회는 [파싱 구현](../../../packages/core/src/parser/index.ts)에서 확인한다.
  원문 해석·허용 범위·실패·필드 위치 사례는 [파싱 테스트](../../../packages/core/src/parser/parser.test.ts)에서 확인한다.
