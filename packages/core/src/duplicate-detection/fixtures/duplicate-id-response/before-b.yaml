_codocs:
  id: query
  name: '조회'
definition: |
  ## 도구 표면

  정식 이름은 codocs_list, codocs_get, codocs_validate, codocs_guide, codocs_write, codocs_refresh다. 이 문서의 짧은 이름은 그 도구를 뜻한다.
  도구 요청의 알 수 없는 속성은 invalid_input이다. write의 document/set 안에 있는 사용자 정의 문서 속성은 [[문서]]의 보존·경고 규칙을 따른다.
  guide의 주제는 [[작성 가이드]], write의 변경 입력은 [[저장]], refresh의 재구성 요청은 [[색인 갱신]]에서 설명한다.

  ## 공통 결과

  Codocs 결과의 최상위에 success를 제공하며 SDK의 MCP 메시지 래퍼와 구분한다. 전체 요청 처리가 불가능하면 success: false와 공통 진단 객체 error를 반환한다.
  list/get은 scanStatus: complete | partial | failed로 탐색 완료 상태를 문서의 업무 status와 구분한다.
  complete는 전체 대상을 확인한 조회다. partial은 일부 파일·폴더를 확인하지 못했지만 현재 보유한 색인으로 조회하며 success:true다. failed는 프로젝트나 .codocs 자체를 탐색하지 못한 상태로 조회 요청을 실패 처리하고 원인을 반환한다.

  partial의 문서에는 confirmation: confirmed | unconfirmed를 제공한다. 이번 탐색에서 읽은 문서는 confirmed, 이전 색인에서 보존한 문서는 unconfirmed다. unconfirmed 문서는 마지막으로 읽은 내용과 당시 revision을 반환하며 현재 존재 여부와 최신성을 보장하지 않는다는 진단을 함께 제공한다.
  partial에서 색인에 없는 ID는 부재로 확정하지 않고 not_found와 구분한 확인 불가 결과를 반환한다. totalCount는 현재 보유한 색인의 필터 결과 수이며 실제 전체 문서 수를 보장하지 않는다.
  failed의 이전 색인은 내부에서 보존하지만 최신 조회 결과로 반환하지 않는다.

  빈 목록은 성공이다. 유효한 get 요청에서 일부 ID가 없거나 문서 오류가 있어도 요청은 success: true이며 해당 results 항목에 문제를 표시한다.
  complete에서 없는 ID는 found:false와 not_found 진단으로 안내한다. 오류가 있는 문서의 반환 방식은 [[검증 오류가 있는 문서를 조회하고 수정하는 절차]]에서 구분한다.
  validate가 문서 오류를 정상 보고하거나 refresh가 오류 문서를 포함해 재구성을 완료하면 success: true다. 작업 자체를 수행하지 못한 실패와 구분한다.
  write의 success·saved·changed는 [[저장]], 저장 후 indexUpdated는 [[색인 갱신]]의 실제 결과를 따른다. 진단 존재만으로 실패·저장 여부를 추측하지 않는다.

  ## list 입력과 필터

  선택 입력은 cursor, domain, kind, status다. type 필터는 받지 않는다. limit은 받지 않으며 페이지는 50개 고정, 마지막은 남은 수다.
  필터는 AND이고 생략하면 모든 상태를 대상으로 한다. domain은 단일 문자열로 문서의 소속 도메인 중 하나와 같으면 일치한다. 문서는 한 번만 집계한다.
  kind/status 조건이 있으면 해당 속성이 없는 문서는 제외한다. 틀린 열거 값은 입력 오류다. 유효한 조건의 결과가 없거나 미등록 domain이면 빈 목록이다.

  ## list 결과와 커서

  ID 오름차순으로 반환한다. items에는 id·문서용 이름·소속 도메인과 작성된 kind/status를 제공하고 본문은 넣지 않는다.
  totalCount는 필터 후 전체 수, returnedCount는 페이지 반환 수, nextCursor는 다음 페이지 토큰이며 마지막에는 null이다.
  cursor만 주면 기존 필터를 유지한다. 필터를 함께 주면 기존과 같아야 하며 다르면 입력 오류와 새 조회 안내다. cursor 없이 필터를 주면 첫 페이지다.
  그 조회 조건의 목록 결과가 변하면 커서를 만료한다. 추가·삭제·ID 순서·표시 값·필터 포함 여부·hasErrors·충돌 표시 변경이 해당한다.
  본문만 변하고 목록 정보가 같거나 조건과 무관한 변경이면 유지한다. 본문 변경으로 참조 오류/hasErrors가 변하면 만료한다. refresh 완료는 모든 커서를 만료한다.
  커서는 별도 시간 제한 없이 현재 서버 프로세스가 살아 있는 동안 유지하고 서버 재시작 후에는 복구하지 않는다. 발급한 커서를 서버 메모리에 계속 쌓지 않는 내부 표현을 사용한다.
  cursor_expired이면 커서 없이 재조회하도록 안내하며 첫 페이지를 자동 대체 반환하지 않는다.

  ## get

  필수 입력 ids 배열을 받아 처음 등장한 순서로 중복 제거한 뒤 최대 20개를 조회한다. 빈 배열과 중복 제거 후 초과는 요청 오류이며 일부만 임의 반환하지 않는다.
  results의 정상 항목에는 id·found, document(원래 속성과 본문), source.path, revision, references, referencedBy를 제공한다. source.path는 서버가 계산한 프로젝트 상대 경로이며 YAML 속성이 아니다.
  revision은 반환 원문과 같은 시점의 값이다. 계산·비교 방식은 [[원문 버전]]에서 정의한다.
  references는 이 문서가 직접 참조하는 문서 ID, referencedBy는 이 문서를 직접 참조하는 문서 ID다. 두 목록에는 정상적이고 유일한 ID만 넣으며 연결 본문과 전이 연결은 확장하지 않는다.
  참조 대상이 없으면 연결 목록에서 제외하고 대상 없음 진단을 제공한다. 이름 후보가 여러 개면 제외하고 모든 후보 경로를 진단에 제공한다. 이름으로 대상 경로 하나를 확정했지만 대상 ID가 없거나 중복이면 내부 경로 연결은 유지하고 외부 ID 목록에서 제외하며 대상 경로와 이유를 진단한다. 대상 자체가 없으면 대상 경로를 만들지 않는다. references와 referencedBy에 같은 원칙을 적용한다.

  중복 ID의 get 결과는 found:true·conflict:true, duplicate_id 진단과 모든 충돌 paths만 반환한다. 대표 문서를 고르지 않으며 document·rawYaml·revision은 반환하지 않는다. 같은 요청의 다른 정상 ID 결과는 계속 반환한다.
  get은 중복 제거 후 최대 20개라는 입력 개수 제한만 적용한다. 응답 바이트 크기에 따른 자체 제한이나 response_too_large 오류를 두지 않으며 요청 본문·참조 목록을 임의 요약하거나 자르지 않는다.

  ## validate

  선택 입력 path를 생략하면 전체 .codocs를 검증한다. 지정하면 프로젝트 루트 기준 상대 경로의 YAML 파일 하나를 중심으로 진단하고 get의 source.path를 사용할 수 있다.
  .codocs 밖·절대 경로·폴더·와일드카드·복수 경로는 허용하지 않는다. 절대 경로는 상대 경로로 고치도록 안내한다. 없는 파일·읽기 실패는 경로와 원인을 안내한다.
  파일 검증도 전체 색인으로 ID 중복·참조 존재를 확인한다. ID 누락·YAML 파싱 실패 파일도 경로로 검증한다. 해당 파일 진단을 중심으로 반환하고 충돌한 다른 파일은 관련 정보로 제공한다.

  ## ID 변경과 조회 대상

  ID가 바뀌면 최신 목록에서 새 ID를 확인한다. 조회·수정 요청의 대상 키는 현재 ID다.
  이전 ID의 코드 연결은 [[IDE 지원]], ID 변경 시 이전 목록 관리는 [[저장]]에서 설명한다.
  내부 색인의 발견 경로와 외부 조회의 ID를 구분한다.
