id: error-document-access
name: '검증 오류가 있는 문서를 조회하고 수정하는 절차'
domains:
  - 'MCP'
kind: procedure
status: confirmed
definition: |
  조회한 오류 문서의 원문과 진단을 바탕으로 수정할 파일을 찾고 유효한 변경을 만드는 절차다.
  응답 필드는 [[조회]], 오류 원문과 충돌 데이터의 계산은 [[조회 투영]]에서 확인한다.

  ## 오류 문서 찾기

  목록에서 오류·충돌 표시를 확인하고 대상 ID를 상세 조회한다.
  ID를 확인할 수 없는 파싱 오류나 누락은 경로 또는 전체 validate로 찾는다.
  반환된 document 또는 rawYaml과 진단을 읽어 실제 수정할 속성·원문 위치를 확인한다.

  여러 경로가 같은 ID로 충돌하면 paths로 원문을 찾는다.
  이 경우 ID 기반 update를 진행하지 않고 파일을 직접 수정해 충돌을 해소한다.

  ## 수정과 재확인

  전체 변경 후보를 만들고 [[문서 검증]]으로 오류가 해소됐는지 확인한다.
  [[저장]]의 최신 원문 확인과 검증 절차로 반영하며, 반영 후 다시 조회해 수정 결과를 확인한다.
  진단·위치 정보는 [[진단]]의 확인 범위 안에서 사용한다.

  [[도구 결과]]가 요청 실패나 미확인을 나타내면 파일 부재로 단정하지 말고 해당 원인을 먼저 해결한다.
  저장 후 색인 반영이 실패했다면 [[저장 후 색인 갱신 실패를 복구하는 절차]]로 조회 상태를 복구한다.
